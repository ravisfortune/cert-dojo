unctional requirement.","This defines a performance constraint rather than a specific business function. Latency, throughput, scalability, reliability, and similar characteristics are typically non-functional requirements."],"e":"This defines a performance constraint rather than a specific business function. Latency, throughput, scalability, reliability, and similar characteristics are typically non-functional requirements.","t":"HOW WELL (latency, uptime) = non-functional. WHAT it does = functional.","k":["non-functional requirement","p95 latency"]},{"id":"ccar-p-42","d":"general","x":"You are integrating Claude Code into the team's pull-request workflow. The team wants Al-assisted review without removing human approval.\nWhich integration design best fits this requirement?","o":["Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer etains the approval decision under the existing branch-protection rules","Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules.","Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate.","Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."],"a":[0],"w":["This design keeps Claude Code in an assistive role while preserving human accountability. Claude can analyze the pull request and provide useful feedback, but the human reviewer remains responsible for the final approval decision. Existing branch-protection rules also maintain an important safety and governance control.","Automatic merging removes the required human approval gate and bypasses established branch protections. This does not meet the team's requirement for AI assistance while retaining human oversight.","Disabling branch protection weakens the team's existing security and governance controls. It also directly conflicts with the requirement to retain human approval.","Deleting pull requests without human review or notification creates an unaccountable and potentially destructive workflow. Claude should assist reviewers rather than independently take irreversible actions."],"e":"This design keeps Claude Code in an assistive role while preserving human accountability. Claude can analyze the pull request and provide useful feedback, but the human reviewer remains responsible for the final approval decision. Existing branch-protection rules also maintain an important safety and governance control.","t":"Claude COMMENTS, human APPROVES.","k":["PR review","human approval","branch protection"]},{"id":"ccar-p-43","d":"general","x":"A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent).\nStakeholders require that projection accuracy remain unchanged.\nWhich two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.)\nEach correct answer presents part of the solution.","o":["Reduce the number of historical sales chunks retrieved across each query run.","Truncate the policy preamble to remove non-essential clauses from the prompt.","Enable prompt caching on the static policy preamble across the recurring calls.","Switch the workload to a smaller, faster Claude model tier across all queries.","Cache common retrieved sales chunks accessed across many of the daily queries."],"a":[2,4],"w":["Reducing the number of retrieved chunks could lower token usage, but it may remove relevant historical information and therefore affect projection accuracy. Since accuracy must remain unchanged, this is not the safest first optimization.","Although removing unnecessary content could reduce token usage, changing the policy preamble may remove information that affects model behavior or compliance. It is therefore less reliable than caching the unchanged content.","The policy preamble accounts for 45% of the total cost and is repeated unchanged on every call. Prompt caching directly targets this dominant cost driver while preserving the full policy content, so it can reduce cost without changing the information provided to the model.","A smaller model could reduce inference costs, but it could also change the quality and accuracy of revenue projections. Since stakeholders explicitly require unchanged accuracy, changing the model is not the best first optimization.","Frequently reused historical sales content can benefit from caching. This reduces repeated processing of the same context while preserving the underlying sales information, making it a safer cost optimization than reducing retrieval depth."],"e":"The policy preamble accounts for 45% of the total cost and is repeated unchanged on every call. Prompt caching directly targets this dominant cost driver while preserving the full policy content, so it can reduce cost without changing the information provided to the model. Frequently reused historical sales content can benefit from caching. This reduces repeated processing of the same context while preserving the underlying sales information, making it a safer cost optimization than reducing retrieval depth.","t":"Cut cost without touching content = CACHE (preamble + common chunks).","k":["prompt caching","cost optimization","accuracy"]},{"id":"ccar-p-44","d":"general","x":"You are building an ethics-review checklist for deployments supported by artificial intelligence.\nWhich two checks belong on the list? (Select two.)\nEach correct answer presents a complete solution.","o":["Confirm that vendor licensing terms permit the planned production use of the model.","Verify that outputs do not rely on generalizations about people that the underlying data does not support.","Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","Restrict ethics review to outputs that exceed a defined model-confidence threshold.","Confirm that latency and throughput targets are met across supported user populations."],"a":[1,2],"w":["Licensing is an important legal and procurement consideration, but it is not primarily an ethics-review check concerning fairness, accountability, or potential harm to people.","This is an important ethical and fairness check. AI-generated outputs should not make unsupported generalizations about individuals or groups, particularly when those generalizations could lead to unfair treatment or harmful outcomes.","High-impact decisions should maintain human accountability and oversight. The model should support decision-making rather than become an unaccountable authority for consequential decisions.","Model confidence is not a sufficient basis for determining whether an output requires ethical review. A model can be highly confident while still producing biased, harmful, or unsupported content.","Latency and throughput are primarily performance and operational requirements. They are important deployment considerations but are not the core focus of an ethics review."],"e":"This is an important ethical and fairness check. AI-generated outputs should not make unsupported generalizations about individuals or groups, particularly when those generalizations could lead to unfair treatment or harmful outcomes. High-impact decisions should maintain human accountability and oversight. The model should support decision-making rather than become an unaccountable authority for consequential decisions.","t":"Ethics = no unsupported stereotypes + HUMAN accountable.","k":["ethics review","generalizations","human accountability"]},{"id":"ccar-p-45","d":"general","x":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles.\nWhich two metrics directly address these requirements? (Select two.)","o":["BLEU score computed against a human-annotated reference summary set","Role-based access-control enforcement rate measured on a red-team dataset","Throughput measured as successful requests processed per minute","Per-query token cost measured against the defined cost ceiling","Response latency at the 95th percentile across a one-week sample window"],"a":[1,3],"w":["BLEU measures text similarity between generated summaries and reference summaries. It can be useful for evaluating output quality, but it does not directly measure access-control enforcement or whether the pipeline stays within its cost ceiling.","This directly addresses the requirement that unauthorized roles must not receive patient data. Testing role-based access controls with adversarial or red-team cases can measure whether the system consistently prevents unauthorized data exposure.","Throughput measures system capacity and performance. It does not directly indicate whether patient data is protected from unauthorized users or whether individual requests remain within the specified cost ceiling.","This directly measures whether each query remains within the required cost constraint. Comparing actual token cost against the defined ceiling provides a clear operational metric for cost compliance.","p95 latency is a useful performance metric, but the stated requirements concern cost control and authorization, not response speed."],"e":"This directly addresses the requirement that unauthorized roles must not receive patient data. Testing role-based access controls with adversarial or red-team cases can measure whether the system consistently prevents unauthorized data exposure. This directly measures whether each query remains within the required cost constraint. Comparing actual token cost against the defined ceiling provides a clear operational metric for cost compliance.","t":"Requirement = metric: privacy -> RBAC rate, budget -> token cost.","k":["RBAC enforcement","per-query cost","metrics"]},{"id":"ccar-p-46","d":"general","x":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year. You are designing how the procedure will be packaged for use by Claude across all three workflows.\nWhich two design decisions should you include? (Select two.)\nEach correct answer presents part of the solution.","o":["Package the procedure as a Claude Skill owned directly by the compliance team.","Embed the procedure text into each workflow's system prompt at integration time.","Store the procedure in a shared retrieval corpus accessed by all three workflows.","Have each workflow team rewrite the procedure for its own context.","Reference the same Claude Skill from all three workflow integrations."],"a":[0,4],"w":["A Claude Skill is well suited for reusable, procedural knowledge that needs to be applied consistently across multiple workflows. Having the compliance team own the Skill also creates a clear governance and maintenance owner, which is especially important because the procedure changes several times per year.","Embedding the procedure separately into every workflow creates duplication and maintenance overhead. Each update would need to be propagated across multiple integrations, increasing the risk that one workflow uses an outdated version.","A shared retrieval corpus can be useful for retrieving reference information, but this scenario involves a specific, repeatable procedure that must be consistently applied. Packaging it as a reusable Skill provides a more appropriate mechanism for procedural guidance.","Rewriting the procedure independently introduces inconsistency and governance risk. The requirement is that the same regulatory procedure be applied identically across all three workflows.","Referencing the same Skill across all three workflows ensures that they use a common, centrally maintained procedure. When compliance updates the Skill, the change can be managed in one place rather than manually updating three separate system prompts."],"e":"A Claude Skill is well suited for reusable, procedural knowledge that needs to be applied consistently across multiple workflows. Having the compliance team own the Skill also creates a clear governance and maintenance owner, which is especially important because the procedure changes several times per year. Referencing the same Skill across all three workflows ensures that they use a common, centrally maintained procedure. When compliance updates the Skill, the change can be managed in one place rather than manually updating three separate system prompts.","t":"One owned SKILL, referenced everywhere.","k":["Claude Skill","single source","compliance ownership"]},{"id":"ccar-p-47","d":"general","x":"You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities.\nWhich scenario most directly justifies a dedicated subagent?","o":["The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions.","The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection.","The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope.","The team wants every Claude Code interaction to use the same generic system prompt with no task- specific specialization, narrow tool permissions, or dedicated model selection."],"a":[0],"w":["A dedicated subagent is appropriate when a task is recurring, specialized, and requires consistent configuration. A focused system prompt, restricted tool permissions, and task-appropriate model selection allow the subagent to operate within a clearly defined scope while reducing unnecessary access.","A one-time, general-purpose task does not justify the additional configuration and maintenance overhead of a dedicated subagent. Claude Code's general capabilities are sufficient.","Without a recurring specialized workload, there is little reason to create a dedicated subagent. The general Claude Code environment is more appropriate.","A generic configuration without task specialization does not provide the main benefits of a subagent. Dedicated subagents are valuable precisely when they can provide focused instructions, scoped permissions, and task-specific behavior."],"e":"A dedicated subagent is appropriate when a task is recurring, specialized, and requires consistent configuration. A focused system prompt, restricted tool permissions, and task-appropriate model selection allow the subagent to operate within a clearly defined scope while reducing unnecessary access.","t":"Recurring + specialized + scoped = SUBAGENT.","k":["subagent","specialized task","tool scoping"]},{"id":"ccar-p-48","d":"general","x":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band.\nWhich response is most appropriate?","o":["Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population.","Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.","Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population.","Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."],"a":[1],"w":["Replacing quantitative evaluation with a small convenience sample would reduce the reliability and representativeness of the evaluation. The goal should be to improve coverage, not eliminate structured measurement.","The evaluation set should represent the intended user population. Expanding coverage across relevant geographic regions and tenure bands helps identify potential performance or fairness issues that may be hidden by the narrow original dataset. The system should then be rescored before broader deployment.","Narrowing the evaluation set further makes the evaluation less representative and can hide problems affecting other groups. Simplifying evaluation should not come at the expense of meaningful population coverage.","High scores on a narrow subset do not demonstrate that the system will perform reliably across the full intended population. Broader evaluation is necessary before making a wider release decision."],"e":"The evaluation set should represent the intended user population. Expanding coverage across relevant geographic regions and tenure bands helps identify potential performance or fairness issues that may be hidden by the narrow original dataset. The system should then be rescored before broader deployment.","t":"Narrow eval set? EXPAND to match real users, then rescore.","k":["evaluation coverage","representative data","fairness"]},{"id":"ccar-p-49","d":"general","x":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior.\nWhich mitigation most directly addresses this threat?","o":["Treat all retrieved content as untrusted input and apply input classifiers with output validation.","Require citations for each claim and constrain responses to source-supported content.","Restrict outbound tool calls to an approved destination allow-list.","Score outputs against a stable adversarial evaluation set on each model-version change."],"a":[0],"w":["Retrieved documents should be treated as untrusted data, because they may contain malicious instructions designed to manipulate the model. Input classification can help identify suspicious content, while output validation provides an additional layer of protection before the model's response is used downstream.","These controls are primarily aimed at grounding and hallucination risks. They can improve traceability and factual support, but they do not directly prevent adversarial instructions inside retrieved content from influencing the model.","An allow-list is an effective control against unauthorized outbound communication and data exfiltration, but it does not directly address the initial prompt-injection threat within retrieved documents.","Adversarial evaluation is useful for detecting regressions and measuring security behavior, especially after model changes. However, it is an evaluation mechanism rather than the most direct runtime mitigation for malicious content in retrieved documents."],"e":"Retrieved documents should be treated as untrusted data, because they may contain malicious instructions designed to manipulate the model. Input classification can help identify suspicious content, while output validation provides an additional layer of protection before the model's response is used downstream.","t":"Retrieved text = UNTRUSTED. Classify in, validate out.","k":["untrusted content","input classifier","output validation"]},{"id":"ccar-p-50","d":"general","x":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight.\nWhich response best aligns expectations while respecting the stakeholder's underlying need?","o":["Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.","Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension.","Acknowledge the request, describe the scope and timeline implications transparently, and propose options-defer it, descope something else, or extend the timeline-for the stakeholder to choose.","Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."],"a":[2],"w":["Hiding scope changes creates a transparency and planning problem. The delivery team needs visibility into changes that could affect timelines, resources, and commitments.","Simply rejecting the request does not address the stakeholder's underlying business need. Effective stakeholder management should acknowledge the need and explore practical alternatives.","This approach combines transparency, expectation management, and stakeholder alignment. It makes the trade-offs explicit while allowing the stakeholder to choose how the underlying need should be addressed.","Accepting additional scope without discussing its impact creates unmanaged scope creep and can lead to missed deadlines and unrealistic stakeholder expectations."],"e":"This approach combines transparency, expectation management, and stakeholder alignment. It makes the trade-offs explicit while allowing the stakeholder to choose how the underlying need should be addressed.","t":"Acknowledge + show trade-offs + offer OPTIONS.","k":["scope change","trade-offs","options"]},{"id":"ccar-p-51","d":"general","x":"The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries.\nThe Skill includes the firm's required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient.\nWhich two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each correct answer presents part of the solution.","o":["Log every generated summary to the firm's compliance audit trail for retention.","Verify the requesting user is authorized to generate investment summaries at all.","Format output sections according to the firm's standardized house style guidelines.","Apply the disclaimer template that the compliance team has standardized firm-wide.","Apply the prohibited-language list that the compliance team maintains and updates."],"a":[0,1],"w":["Audit logging is an application-level responsibility because it concerns system-wide observability, compliance records, retention, and traceability. A Skill can provide procedural guidance, but the application should enforce and record the actual audit trail.","Authorization is an access-control responsibility. The application must independently verify the user's identity and permissions before allowing the operation. A Skill should not be relied upon to enforce whether a user is authorized to perform the task.","Formatting and presentation instructions are well suited to the Skill, particularly when they are part of the standardized procedure for producing investment summaries.","The disclaimer is explicitly part of the approved Skill's compliance procedure. Therefore, it is appropriate for the Skill to provide this instruction.","The prohibited-language list is already part of the compliance-owned Skill. Maintaining and applying this procedural guidance is an appropriate responsibility for the Skill."],"e":"Audit logging is an application-level responsibility because it concerns system-wide observability, compliance records, retention, and traceability. A Skill can provide procedural guidance, but the application should enforce and record the actual audit trail. Authorization is an access-control responsibility. The application must independently verify the user's identity and permissions before allowing the operation. A Skill should not be relied upon to enforce whether a user is authorized to perform the task.","t":"App layer keeps AUDIT + AUTHZ. Skill keeps content rules.","k":["application layer","audit trail","authorization"]},{"id":"ccar-p-52","d":"general","x":"You are defining an SLA for a Claude-based assistant.\nWhich SLA definition is most operationally meaningful?","o":["A target tied to a stakeholder sentiment measure such as \"the team feels satisfied,\" which cannot be measured objectively or used to trigger a documented breach response.","A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example,\"p95 per-request latency under 800 ms over a 28-day window.\"","A qualitative commitment such as \"the system will be fast and reliable,\" which names no metric, threshold, or evaluation window.","A target without a defined metric, threshold, evaluation window, or breach consequence."],"a":[1],"w":["An SLA should be objective and measurable. Stakeholder sentiment alone does not provide a precise metric, threshold, or defined method for determining whether the SLA has been breached.","This is a strong SLA because it clearly defines:\n\n• Metric: p95 per-request latency\n\n• Threshold: under 800 ms\n\n• Evaluation window: 28 days\n\n• Breach condition/consequence: a defined response when the target is not met\n\nThis makes the SLA objective, measurable, and operationally actionable.","“Fast and reliable” is too vague to function as an operational SLA. There is no measurable definition of how fast, how reliable, or over what period performance should be evaluated.","Without measurable criteria and a defined evaluation period, stakeholders cannot objectively determine whether the service has met or breached the SLA."],"e":"This is a strong SLA because it clearly defines:\n\n• Metric: p95 per-request latency\n\n• Threshold: under 800 ms\n\n• Evaluation window: 28 days\n\n• Breach condition/consequence: a defined response when the target is not met\n\nThis makes the SLA objective, measurable, and operationally actionable.","t":"SLA = METRIC + THRESHOLD + WINDOW + CONSEQUENCE.","k":["SLA","p95","measurable"]},{"id":"ccar-p-53","d":"general","x":"You are transitioning a Claude-based deployment from design into implementation.\nWhich handoff package most directly supports a clean transition?","o":["The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.","A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRS, omponent contracts, evaluation framework, runbooks, playbook, or known limitations.","Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations.","Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation amework, runbooks, on-call playbook, or known-limitations register to support the delivery team."],"a":[2],"w":["Presentation slides alone rarely provide enough implementation detail. The delivery team needs architecture details, contracts, evaluation criteria, operational procedures, and known limitations to implement and operate the system correctly.","A verbal walkthrough can supplement documentation, but it should not replace it. Without written artifacts, important decisions and operational knowledge can be lost or interpreted inconsistently.","This provides the implementation team with the technical, evaluation, and operational information required for a smooth transition.\nIt includes:\n\n• Architecture overview for understanding the overall system\n\n• ADRs for understanding important architectural decisions\n\n• Component contracts for integration boundaries\n\n• Evaluation framework and reference set for validating behavior\n\n• Runbooks and on-call playbook for operational support\n\n• Known limitations for understanding risks and constraints","Source code does not provide the complete architectural and operational context needed for a clean handoff. The implementation team also needs documentation explaining decisions, interfaces, evaluation, operations, and limitations."],"e":"This provides the implementation team with the technical, evaluation, and operational information required for a smooth transition.\nIt includes:\n\n• Architecture overview for understanding the overall system\n\n• ADRs for understanding important architectural decisions\n\n• Component contracts for integration boundaries\n\n• Evaluation framework and reference set for validating behavior\n\n• Runbooks and on-call playbook for operational support\n\n• Known limitations for understanding risks and constraints","t":"Handoff = docs + decisions + contracts + evals + runbooks + limits.","k":["handoff","ADRs","runbooks"]},{"id":"ccar-p-54","d":"general","x":"A security team is evaluating two proposed controls. Control A adds an outbound tool allow-list with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change.\nWhich two risk categories are correctly matched to these controls? (Select two.)","o":["Control A - prompt injection from adversarial content in retrieved data","Control A - silent quality drift after a model-version upgrade","Control A - data exfiltration via outbound tool calls","Control B - data exfiltration via outbound tool calls","Control B - silent quality drift after a model-version upgrade"],"a":[2,4],"w":["Control A primarily restricts outbound tool destinations and calls. Prompt injection from retrieved content is more directly addressed by treating retrieved content as untrusted input, input classification, and output validation.","An outbound allow-list does not detect quality or behavioral drift after a model update. This type of risk requires evaluation and comparison against a stable reference set.","An outbound destination allow-list and per-call review directly reduce the risk of sensitive data being transmitted to unauthorized external destinations through tools.","Control B is an evaluation control designed to identify changes in model behavior. It does not directly prevent outbound data exfiltration.","Comparing each new model version against a stable adversarial evaluation set can reveal unexpected changes in behavior and identify quality or safety regressions after an upgrade."],"e":"An outbound destination allow-list and per-call review directly reduce the risk of sensitive data being transmitted to unauthorized external destinations through tools. Comparing each new model version against a stable adversarial evaluation set can reveal unexpected changes in behavior and identify quality or safety regressions after an upgrade.","t":"Allow-list stops EXFILTRATION. Stable eval set catches DRIFT.","k":["exfiltration","quality drift","allow-list"]},{"id":"ccar-p-55","d":"general","x":"A Claude Architect is reviewing a post-deployment performance report for an Al-assisted legal-document summarization system. The report includes these observations:\n* Average summarization time decreased from 47 minutes to 6 minutes per document.\n* Associates spend less time on summaries, but overall billable output has not measurably changed.\n* Infrastructure costs increased by 22% because redundant retry logic generated additional API calls.\n* Some summaries require attorney correction, adding an average of 8 minutes of review per document.\nWhich analysis correctly attributes each observation to the appropriate business-value pillar?","o":["Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.","Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.","Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.","Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized;Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."],"a":[3],"w":["Observation 2 specifically states that overall billable output has not measurably changed, so it does not demonstrate a realized efficiency/productivity outcome. Observation 4 concerns additional attorney review time, not a performance SLA.","Observation 1 is primarily an efficiency gain, not necessarily a transformation outcome. Observation 3 explicitly concerns increased infrastructure/API costs, making it a solution-cost issue, not a performance-SLA issue.","Observation 1 measures time saved per document, while Observation 4 measures human correction/review effort. Neither directly establishes a performance-SLA improvement. Observation 3 is explicitly about increased infrastructure costs.","Each observation is correctly mapped:\n\n• Observation 1: 47 minutes → 6 minutes demonstrates a clear efficiency gain.\n\n• Observation 2: Less time spent on summaries has not translated into increased billable output, so the expected productivity benefit has not yet been realized.\n\n• Observation 3: A 22% increase in infrastructure/API costs is a solution-cost issue.\n\n• Observation 4: Attorney correction adds 8 minutes of work, creating an efficiency loss that partially offsets the initial time savings."],"e":"Each observation is correctly mapped:\n\n• Observation 1: 47 minutes → 6 minutes demonstrates a clear efficiency gain.\n\n• Observation 2: Less time spent on summaries has not translated into increased billable output, so the expected productivity benefit has not yet been realized.\n\n• Observation 3: A 22% increase in infrastructure/API costs is a solution-cost issue.\n\n• Observation 4: Attorney correction adds 8 minutes of work, creating an efficiency loss that partially offsets the initial time savings.","t":"Faster = efficiency. More output = productivity. Bills = cost. Rework = efficiency loss.","k":["efficiency","productivity","solution cost"]},{"id":"ccar-p-57","d":"general","x":"You are listing characteristics of robust guardrail design for an enterprise deployment.\nWhich two characteristics belong on the list? (Select two.)\nEach correct answer presents a complete solution.","o":["Centralized log retention for guardrail violations with quarterly review by the security team.","Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance.","User feedback channels that route reported guardrail failures into the product backlog for triage.","Periodic refresh of the system prompt wording to keep refusal language current and clear."],"a":[1,2],"w":["Centralized logging and periodic review are useful for monitoring and governance, but they are not as directly related to the core guardrail enforcement and evaluation mechanisms represented by the correct answers.","Enforcing per-role tool allow-lists at the orchestration layer applies least privilege before a tool can execute. This provides a strong preventive control because the model cannot simply decide to use a tool outside the permissions granted to its role.","Robust guardrails need continuous adversarial testing and regression tracking. Including attack-oriented cases in the evaluation set helps verify that guardrails continue to work as prompts, models, and system components change.","User feedback is valuable for identifying issues, but it is primarily a feedback and improvement mechanism, rather than a direct preventive or evaluation control for guardrail robustness.","Refreshing refusal wording can improve clarity, but changing prompt language alone is not sufficient to establish robust guardrail enforcement. Strong guardrails should include controls outside the model's instructions as well."],"e":"Enforcing per-role tool allow-lists at the orchestration layer applies least privilege before a tool can execute. This provides a strong preventive control because the model cannot simply decide to use a tool outside the permissions granted to its role. Robust guardrails need continuous adversarial testing and regression tracking. Including attack-oriented cases in the evaluation set helps verify that guardrails continue to work as prompts, models, and system components change.","t":"PREVENT (allow-lists) + TEST (adversarial regression).","k":["per-role allow-list","adversarial evaluation","regression"]},{"id":"ccar-p-58","d":"general","x":"A Claude architect is leading the discovery phase for a new Al-powered customer service solution.\nWhich two activities are characteristic of structured discovery and requirement gathering for a Claude-based\ndeployment? (Select two.)","o":["Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins.","Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected.","Generating an initial prototype and iterating based on user reaction rather than written requirements.","Documenting explicit success criteria and failure thresholds that will gate production deployment.","Deferring constraint documentation until the integration design phase to avoid scope creep."],"a":[0,3],"w":["Structured discovery begins by understanding the stakeholders, business needs, constraints, and expectations. Workshops can identify important requirements such as latency, accuracy, compliance, security, and operational constraints before architectural decisions are made.","Model selection should be driven by requirements and evidence, not simply by prior experience. Choosing a model before understanding stakeholder needs can result in an inappropriate architecture or unnecessary cost.","Prototyping can be valuable, but relying primarily on user reactions without documented requirements and success criteria does not represent structured discovery.","Clearly defined success criteria and failure thresholds turn stakeholder expectations into measurable requirements. They also provide objective criteria for determining whether the solution is ready for production.","Constraints should be identified and documented during discovery. Delaying them can cause major architectural changes later and increase delivery risk."],"e":"Structured discovery begins by understanding the stakeholders, business needs, constraints, and expectations. Workshops can identify important requirements such as latency, accuracy, compliance, security, and operational constraints before architectural decisions are made. Clearly defined success criteria and failure thresholds turn stakeholder expectations into measurable requirements. They also provide objective criteria for determining whether the solution is ready for production.","t":"Discovery = WORKSHOPS + written SUCCESS criteria.","k":["discovery","workshops","success criteria"]},{"id":"ccar-p-59","d":"general","x":"You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session.\nWhich adjustment most directly removes this inefficiency?","o":["Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all Al-assisted development productivity for this codebase.","Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically.","Tell each engineer to retype the project conventions and architecture context more quickly at the start of eachsession, reducing time lost without eliminating the repeated manual effort.","Remove all documented project conventions and architectural standards so engineers have nothing to re-explain at session start, accepting the loss of consistency and shared coding standards."],"a":[1],"w":["This eliminates the inefficiency by eliminating Claude Code itself, but it also removes the team's AI-assisted development capability. It is not an effective solution to the underlying context-management problem.","A project-scoped CLAUDE.md provides persistent project context that can be reused across sessions. This eliminates the need for engineers to repeatedly explain the same architecture, conventions, and project instructions, while keeping the information version-controlled and shared with the team.","This only makes the existing inefficient process faster. It does not eliminate the repeated manual work or provide consistent persistent context.","Removing project standards sacrifices consistency and governance rather than solving the context problem. The correct approach is to preserve the standards in persistent project context."],"e":"A project-scoped CLAUDE.md provides persistent project context that can be reused across sessions. This eliminates the need for engineers to repeatedly explain the same architecture, conventions, and project instructions, while keeping the information version-controlled and shared with the team.","t":"Repeating yourself every session = write CLAUDE.md.","k":["CLAUDE.md","project context","persistent"]},{"id":"ccar-p-60","d":"general","x":"You are integrating Al-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code.\nWhich integration approach best fits this requirement?","o":["Generate documentation from the model's training-data recall without reading any of the actual repository code, cepting that the output will not reflect the current implementation.","Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step.","Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.","Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that cumentation generation will be entirely disconnected from the actual implementation."],"a":[2],"w":["Training-data recall may be outdated or unrelated to the current repository. Without access to the actual code, the generated documentation cannot reliably reflect the current implementation.","Direct publication bypasses the team's review and approval process and could allow inaccurate or inappropriate documentation to reach users. AI-generated changes should follow the existing review workflow.","This approach grounds the documentation in the actual repository implementation. Filesystem and code-search tools allow the subagents to inspect current code, while the normal review workflow provides human oversight and quality control before publication.","Removing access to the repository prevents the system from grounding its documentation in the current codebase, which directly conflicts with the requirement."],"e":"This approach grounds the documentation in the actual repository implementation. Filesystem and code-search tools allow the subagents to inspect current code, while the normal review workflow provides human oversight and quality control before publication.","t":"Read the REAL code + go through REVIEW.","k":["grounded docs","subagents","review workflow"]},{"id":"ccar-p-61","d":"general","x":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user.\nWhich two mitigations directly address these specific findings? (Select two.)","o":["Validate structured outputs against a schema before downstream actions are executed.","Enforce RBAC at the retrieval layer before content enters the model context.","Move credentials out of the prompt context and resolve them from a server-side secret store.","Add actor attribution to tool-call logs so each call records the initiating user identity.","Replace the shared API key with per-user Auth tokens carrying scope-restricted permissions."],"a":[3,4],"w":["Schema validation helps prevent malformed or unexpected outputs from being passed to downstream systems. It does not address shared credentials or missing user attribution in tool-call logs.","RBAC at the retrieval layer is useful for preventing unauthorized access to retrieved information, but it does not directly resolve the two findings of shared API credentials and missing actor attribution.","A server-side secret store improves credential handling and secret protection, but by itself it does not replace the shared API key with per-user authorization or provide attribution for tool calls.","This directly addresses the second finding. Recording the initiating user's identity with each tool call provides accountability, traceability, and useful audit information.","This directly addresses the first finding. Per-user, scope-restricted authentication provides individual accountability and supports least-privilege access instead of giving every user the same shared credential."],"e":"This directly addresses the second finding. Recording the initiating user's identity with each tool call provides accountability, traceability, and useful audit information. This directly addresses the first finding. Per-user, scope-restricted authentication provides individual accountability and supports least-privilege access instead of giving every user the same shared credential.","t":"Shared key -> PER-USER tokens. Anonymous logs -> ACTOR attribution.","k":["per-user tokens","actor attribution","audit"]},{"id":"ccar-p-62","d":"general","x":"You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs\nafter a model-version upgrade.\nWhich assessment activity most directly addresses this risk?","o":["Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production.","Rotate adversarial inputs randomly so no two upgrades are scored on the same set.","Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic.","Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."],"a":[3],"w":["Disabling adversarial evaluation removes an important mechanism for detecting safety regressions before deployment. This increases the risk that a model-version change introduces undetected problems into production.","Changing the evaluation set every time makes it difficult to establish a consistent baseline between model versions. Stable test cases are important for accurately identifying behavioral drift.","Waiting for user complaints means the system is being evaluated after exposure to production users. Safety-relevant regressions should be detected before promotion whenever possible.","A stable adversarial evaluation set provides a consistent baseline for comparing model versions. Version-attributed scoring makes it possible to identify quality or safety drift and prevent a problematic version from being promoted."],"e":"A stable adversarial evaluation set provides a consistent baseline for comparing model versions. Version-attributed scoring makes it possible to identify quality or safety drift and prevent a problematic version from being promoted.","t":"Same adversarial set, every version, before promote.","k":["adversarial eval set","version scoring","drift"]},{"id":"ccar-p-63","d":"general","x":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role.\nWhere should role-based access control be enforced in the pipeline?","o":["Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.","At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.","Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.","After the response is generated, by post-filtering content that should not have been retrieved."],"a":[1],"w":["A system prompt is an instruction to the model, not an enforcement boundary. Relying on the model to follow access-control instructions could allow unauthorized content to enter the model context.","RBAC should be enforced before retrieval results are passed into the model context. The retrieval layer can verify the user's role and return only documents that the user is authorized to access.\nThis follows the principle of enforcing authorization at the data-access boundary, rather than relying on model behavior.","Model refusal behavior is not an access-control mechanism. Authorization must be explicitly enforced by the application or retrieval layer.","Post-filtering is too late. Unauthorized information may already have entered the model's context and influenced the generated response. Access control should occur before the content reaches the model."],"e":"RBAC should be enforced before retrieval results are passed into the model context. The retrieval layer can verify the user's role and return only documents that the user is authorized to access.\nThis follows the principle of enforcing authorization at the data-access boundary, rather than relying on model behavior.","t":"Block at RETRIEVAL, before the model sees it.","k":["RBAC","retrieval layer","authorization"]},{"id":"ccar-p-64","d":"general","x":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment.\nWhich two steps must be completed BEFORE running the experiment with random assignment? (Select two.)\nEach correct answer presents part of the solution.","o":["Determine the minimum detectable effect size and the sample size needed for power.","Decide whether to promote, reject, or iterate the candidate based on the analysis.","Define the hypothesis and the primary success metric for the comparison.","Analyze the results against the predefined success metric and significance threshold.","Document the recommendation, the trade-offs accepted, and the alternatives considered."],"a":[0,2],"w":["Before running the experiment, you should determine the minimum detectable effect (MDE) and the required sample size. This ensures the experiment has enough statistical power to detect a meaningful difference between the two prompts.","This is a post-experiment decision. You can only decide whether to promote, reject, or iterate after collecting and analyzing the experimental results.","The hypothesis and primary success metric must be defined before the experiment begins. Predefining them prevents changing the evaluation criteria after seeing the results and helps maintain an objective comparison.","Analysis occurs after the experiment has been executed and the required data has been collected.","This belongs to the decision and reporting stage after the experiment has been analyzed. It is not a prerequisite for running the experiment."],"e":"Before running the experiment, you should determine the minimum detectable effect (MDE) and the required sample size. This ensures the experiment has enough statistical power to detect a meaningful difference between the two prompts. The hypothesis and primary success metric must be defined before the experiment begins. Predefining them prevents changing the evaluation criteria after seeing the results and helps maintain an objective comparison.","t":"Before A/B: HYPOTHESIS + METRIC + SAMPLE SIZE.","k":["hypothesis","MDE","sample size"]}]},{"id":"ai-103","code":"AI-103","title":"Azure AI Apps and Agents Developer","vendor":"Microsoft","exam":{"count":54,"minutes":90,"passPercent":80},"domains":{"models":"Models","agents":"Agents","evaluation":"Evaluation","operations":"Operations","multimodal":"Multimodal","content-understanding":"Content Understanding","safety":"Safety","rag":"RAG","speech":"Speech","video":"Video","security":"Security","prompt-engineering":"Prompt Engineering","observability":"Observability","development":"Development","tools-data":"Tools Data"},"qs":[{"id":"ai-103-1","d":"models","x":"HOTSPOT - Case Study\n\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\n\nTo answer the case study questions, you need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\n\nTo start the case study, select the Next button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering questions. When you are ready to answer a question, select the Question button to return to the question.\n\nOverview - Company Information\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\n\nExisting Environment - Identity Environment\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services. Contoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions. The team collaborates with solution architects, DevOps engineers, and security engineers to design, implement, monitor, and secure AI applications. Contoso also has a team named Agent1Test Team that is responsible for validating AI solutions before solution deployments.\n\nGenerative Environment\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\n\nProject1\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests. Agent1 uses a base model deployment. A safety evaluation pipeline is NOT enabled. Tool invocation approval workflows are NOT enabled. Conversation memory constraints are NOT configured. Agent1 interacts with customers by using digital support channels and answers general questions about Contoso products. Project1 is deployed to an Azure region located in the European Union (EU). Agent1Dev Team will use Project1 to optimize and maintain Agent1.\n\nProject2\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution. Development of the solution is incomplete.\n\nData Environment\nContoso stores product-related information in Azure resources that support AI applications. The Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products. The product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\n\nProblem Statements\nAgent1 has only general knowledge of the Contoso products. A recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet. Agent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions. The finance department reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\n\nRequirements - Planned Changes\nContoso plans to implement a solution for Project1 that analyzes vendor invoices by evaluating both visual layout and textual content so invoice details can be verified against vendor contract terms. Contoso will update the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses. Agent1 must retrieve and use detailed product information from product sheets stored in storage1. An indexing solution must enable Agent1 to answer customer questions. The video creation solution must be completed.\n\nTechnical Requirements\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity. Product sheets must be processed by an indexing pipeline that enables semantic and vector search. Responses generated using product sheet information must be relevant, complete, and accurate. Agent1 must answer natural-language questions about product details. The model version used by Agent1 must remain consistent to ensure stable responses. Data processed by the model must remain within the EU.\n\nSecurity and Compliance Requirements\nAPI keys must NOT be used to access Foundry-deployed models. Access to Azure resources must follow least privilege. Developers must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication. Access to Project1 must be assigned to Agent1Dev Team by using security group SC_Agent1_Dev and to Agent1Test Team by using security group SC_Agent1_Test. Agent1 must never reveal customer information, even if a document containing customer data is added erroneously to the product-sheet repository. Product sheets might contain images with embedded text, and Agent1 must be protected from malicious instructions hidden within images.\n\nBusiness Requirements\nUsers interacting with Agent1 must have a personalized experience in future interactions, including retaining conversation context and recalling relevant information from previous interactions. Agent1 must answer questions only about products sold by Contoso.\n\nYou need to configure the model deployment for Agent1 to meet the technical requirements. What should you configure? To answer, select the appropriate options in the answer area. Each correct selection is worth one point.","o":["Deployment type: Standard; Version update policy: Upgrade once a new default version becomes available","Deployment type: Standard; Version update policy: Opt out of automatic model version upgrades","Deployment type: Global Standard; Version update policy: Once the current version expires","Deployment type: Global Provisioned; Version update policy: Opt out of automatic model version upgrades"],"a":[1],"e":"Standard deployment suits variable demand without reserved throughput. Opting out of automatic version upgrades keeps the model version stable.","t":"Variable load = Standard. Stability = OPT OUT of auto-upgrade.","k":["Standard deployment","version update policy","opt out"]},{"id":"ai-103-2","d":"models","x":"Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure Agent1 to meet the security and compliance requirements.\nWhat should you use?","o":["self-harm content filtering","Personally identifiable information (PII) Detection","violence content filtering","prompt shields"],"a":[1,3],"e":"Prompt shields block malicious instructions hidden in images or documents. PII Detection prevents customer data from leaking. Self-harm and violence filters only cover specific harm categories.","t":"Hidden attacks = Prompt SHIELDS. Personal data = PII detection.","k":["prompt shields","PII detection","security"]},{"id":"ai-103-3","d":"models","x":"You are planning a Microsoft Foundry project named Project1 that will contain multiple agents. Each agent will access the same Azure AI Search resource.\nYou need to recommend a solution to centrally manage the Azure AI Search credentials within Project1. The solution must be implemented across all the agents.\nWhat should you recommend?","o":["Enable role-based access control (RBAC) for the Azure AI Search resource","Add a connection to the Azure AI Search resource","Disable key-based access control on the Azure AI Search resource","Create a managed private endpoint that connects to the Azure AI Search resource"],"a":[1],"e":"Add a project-level connection to Azure AI Search to store and manage its credentials centrally. All agents in Project1 share that connection instead of configuring credentials separately.","t":"Shared credentials across agents = one project CONNECTION.","k":["project connection","Azure AI Search","credentials"]},{"id":"ai-103-4","d":"models","x":"HOTSPOT -\n\nYour company is piloting a customer support agent in a Microsoft Foundry project name Project1. Project1 is connected to an existing Application Insights resource, and the company’s support team reviews runs in the Traces tab.\nThe Foundry Agent Service is configured to perform the following actions:\nRetrieve the Application Insights connection string by calling project_client.telemetry.get_application_insights_connection_string().\nCall configure_azure_monitor(connection_string=...) to enable telemetry.\nA separate LangChain service is configured to use OpenTelemetry and has the following configurations:\nUses AzureAIOpenTelemetryTracer(connection_string=..., enable_content_recording=False)\nPasses the tracer by using config={“callbacks”:[azure_tracer]}\nCompany policy has the following requirements:\nTelemetry from LangChain and OpenTelemetry must be distinguishable within the same Application Insights resource.\nSecrets and credentials must NOT be stored in prompts, tool arguments, or span attributes.\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","o":["Yes; Yes; No","No; Yes; No","No; No; Yes","Yes; No; Yes"],"a":[1],"e":"Statement 1 is No: LangChain must be instrumented with a tracer passed through the callback config; turning on Azure Monitor alone does not trace LangChain. Statement 2 is Yes: OTEL_SERVICE_NAME sits in resource metadata, so different values separate services in one Application Insights resource. Statement 3 is No: enable_content_recording=False stops recording prompt and tool content, which keeps secrets out of spans.","t":"LangChain needs its own tracer. SERVICE_NAME separates. Content recording OFF hides secrets.","k":["OTEL_SERVICE_NAME","LangChain tracer","content recording"]},{"id":"ai-103-5","d":"models","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that processes procurement documents submitted by suppliers.\nYou need to implement two pipelines by using Azure Content Understanding in Foundry Tools. The solution must meet the following requirements:\nInclude a pipeline named Pipeline1 that supports cost-effective, high-volume processing of standalone PDF invoices.\nInclude a pipeline named Pipeline2 that supports cross-document validation by using multi-step reasoning and reference data.\nHow should you configure each pipeline? To answer, drag the appropriate configurations to the correct pipelines. Each configuration may be used once, more than once, of not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.","o":["Pipeline1: Single-file task in standard mode; Pipeline2: Multi-file task in pro mode","Pipeline1: Multi-file task in pro mode; Pipeline2: Single-file task in standard mode","Pipeline1: Single-file task in pro mode; Pipeline2: Multi-file task in standard mode","Pipeline1: Multi-file task in standard mode; Pipeline2: Single-file task in pro mode"],"a":[0],"e":"Pipeline1 processes independent invoices in high volume, so single-file standard mode is cheaper. Pipeline2 does cross-document validation with reference data and multi-step reasoning, so it needs a multi-file task in pro mode.","t":"One doc, many times = Standard. Many docs, deep reasoning = Pro.","k":["Content Understanding","standard mode","pro mode","multi-file"]},{"id":"ai-103-6","d":"models","x":"HOTSPOT -\n\nYou have a Python application named App1 that integrates with a Microsoft Foundry project named Project1.\nYou need to ensure that App1 meets the following requirements:\nAuthenticates by using a Microsoft Entra managed identity\nSends prompts to a deployed model by using the Azure OpenAI Responses API\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["configuration 1: AzureKeyCredential; configuration 2: create","configuration 1: DefaultAzureCredential; configuration 2: create","configuration 1: DefaultAzureCredential; configuration 2: compact","configuration 1: ClientSecretCredential; configuration 2: retrieve"],"a":[1],"e":"DefaultAzureCredential picks up the managed identity token when App1 runs in Azure, with no stored key or secret. The Responses API creates a new reply with responses.create(...). Retrieve fetches an existing response and compact does not send a prompt.","t":"Managed identity = DEFAULT credential. New answer = CREATE.","k":["DefaultAzureCredential","Responses API","create"]},{"id":"ai-103-7","d":"models","x":"HOTSPOT -\nYou have a Microsoft Foundry project that contains a workflow for a customer support triage process.\nYou have an Ask a question node that stores user responses in a local variable named Var01.\nYou need to create the following Power Fx expressions:\nAn if/else condition expression that ensures that Var01 contains a value\nA Send message expression that returns the stored user response in uppercase\nHow should you configure the expressions? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["If/else: IsEmpty(Local.Var01); Send message: {Local.Var01}","If/else: Not(IsBlank(Local.Var01)); Send message: {Upper(Var01)}","If/else: Not(IsBlank(Local.Var01)); Send message: {Upper(Local.Var01)}","If/else: IsBlank(Local.Var01); Send message: {Upper(Local.Var01)}"],"a":[2],"e":"Not(IsBlank(Local.Var01)) is true only when Var01 has a value. The message must reference the local scope and apply Upper, so {Upper(Local.Var01)} returns the stored answer in uppercase.","t":"Has value = NOT IsBlank. Always keep the Local. prefix.","k":["Power Fx","IsBlank","Upper","Local scope"]},{"id":"ai-103-8","d":"models","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains a customer support agent built by using the Foundry Agent Service.\nThe agent uploads user-provided screenshots to Azure Storage through a ticketing tool and receives a blob URL for additional reasoning.\nYou need to use image moderation during agent runs and prevent harmful content from being returned during runs. Azure AI Content Safety must access the images by using the blob URL. The solution must follow the principle of least privilege.\nWhat should you configure for Content Safety? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.\n\nGuardrails options:\nSelect Tool call and set Action to Block.\nSelect User input and Output and set Action to Annotate.\nSelect User input and Tool response and set Action to Annotate.\nSelect User input, Output, Tool response, and Tool call and set Action to Block.\n\nStorage access options:\nStorage account access keys\nA user-assigned identity that is assigned the Storage Queue Data Contributor role\nA system-assigned managed identity that is assigned the Storage Blob Data Reader role\nA system-assigned managed identity that is assigned the Storage Blob Data Contributor role\n\nSelect the correct Guardrails/Storage access configuration combination.","o":["Guardrails: Select Tool call and set Action to Block; Storage access: A user-assigned identity assigned the Storage Queue Data Contributor role","Guardrails: Select User input and Tool response and set Action to Annotate; Storage access: A system-assigned managed identity assigned the Storage Blob Data Contributor role","Guardrails: Select User input, Output, Tool response, and Tool call and set Action to Block; Storage access: A system-assigned managed identity assigned the Storage Blob Data Reader role","Guardrails: Select User input and Output and set Action to Annotate; Storage access: Storage account access keys"],"a":[2],"e":"To moderate harmful image content across the whole agent run and stop it from being returned, cover user input, output, tool response and tool call with the Block action. Content Safety only reads the blob, so a system-assigned managed identity with Storage Blob Data Reader follows least privilege.","t":"Block EVERYTHING, read ONLY (Blob Data Reader).","k":["guardrails","Block","Blob Data Reader","least privilege"]},{"id":"ai-103-9","d":"models","x":"You have a Microsoft Foundry project that contains three agents as shown in the following table.\n\nName | Description\nTriageAgent | Classifies incoming customer requests\nPolicyAgent | Answers policy questions by searching internal content\nActionAgent | Creates or updates tickets by calling an HTTP API\n\nYou need to orchestrate the agents to ensure that the customer requests meet the following requirements:\nSupport a deterministic, step-based process that uses conditional branching and shared state across the agents.\nOptionally trigger a ticket action based on the triage result.\nThe solution must minimize development effort.\nWhat should you include in the solution?","o":["threads and runs without a workflow","a workflow","a multi-agent group chat session","separate agent runs coordinated in the application code"],"a":[1],"e":"A workflow gives a deterministic step order, conditional branching and shared state across agent steps with little code. It can run triage first, call the policy agent when needed and trigger the ticket action based on the result. Group chat is not deterministic and app-code orchestration needs more effort.","t":"Deterministic steps + branching = WORKFLOW.","k":["workflow","deterministic","conditional branching","shared state"]},{"id":"ai-103-10","d":"models","x":"You have a Microsoft Foundry project that contains an agent. The agent uses Azure Speech in Foundry Tools.\nYou fine-tune a baseline speech to text model for the en-us locale and publish the model.\nThe agent calls the Speech to text REST API and returns an error message indicating that the project ID is invalid.\nYou need to set the project property to the correct ID.\nTo what should you set the project property?","o":["the custom speech project ID","the project ID","the custom speech endpoint URL","the project URL"],"a":[0],"e":"The project property in the Speech to text REST API must hold the Custom Speech project ID of the fine-tuned model. URLs are not IDs, and a generic project ID does not identify the Custom Speech project.","t":"Custom model? Use the CUSTOM SPEECH project ID.","k":["Custom Speech project ID","speech to text"]},{"id":"ai-103-11","d":"models","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an agent named PaymentAgent.\nPaymentAgent includes a function tool that issues customer refunds by using an external API.\nYou are cr
