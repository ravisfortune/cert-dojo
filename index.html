etection across both categories?","o":["Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds.","Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting.","Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic.","Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."],"a":[1],"w":["Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","The best approach is to Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Recall trade-off between concerns = SPLIT into focused prompts.","k":["focused prompts","recall trade-off","code review"]},{"id":"ccar-f-129","d":"claude-code","x":"Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR.\n\nWhich task decomposition pattern is most appropriate for this workflow?","o":["Prompt chaining—break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step.","Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category.","Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously.","Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."],"a":[0],"w":["The scenario explicitly states the review \"follows the same three-step workflow for every PR,\" which per Anthropic's \"Building Effective Agents\" guidance is the textbook case for the prompt chaining workflow: a fixed, predictable sequence of subtasks each handled by a focused prompt, then synthesized. Orchestrator-workers (D) is only warranted when the needed subtasks vary unpredictably per input, and routing (B) applies when inputs fall into distinct categories needing different handling—neither fits a fixed, identical workflow.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The scenario explicitly states the review \"follows the same three-step workflow for every PR,\" which per Anthropic's \"Building Effective Agents\" guidance is the textbook case for the prompt chaining workflow: a fixed, predictable sequence of subtasks each handled by a focused prompt, then synthesized. Orchestrator-workers (D) is only warranted when the needed subtasks vary unpredictably per input, and routing (B) applies when inputs fall into distinct categories needing different handling—neither fits a fixed, identical workflow.","t":"Same fixed steps every time = PROMPT CHAINING.","k":["prompt chaining","fixed workflow","building effective agents"]},{"id":"ccar-f-130","d":"architecture","x":"After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings.\n\nWhat is the correct approach for providing the synthesis subagent with the information it needs?","o":["Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator","Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results","Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks","Include the complete findings from both subagents directly in the synthesis subagent's prompt"],"a":[1],"w":["It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Anthropic's multi-agent best practice is for subagents to deposit their full outputs as artifacts in external/shared storage and pass lightweight references, so the synthesis subagent reads the prior results directly rather than receiving lossy or token-heavy copies through prompts. Callbacks between subagents (A) and automatic context inheritance (D) don't exist in this architecture, and inlining complete findings into the prompt (B) bloats context and risks information loss.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"Anthropic's multi-agent best practice is for subagents to deposit their full outputs as artifacts in external/shared storage and pass lightweight references, so the synthesis subagent reads the prior results directly rather than receiving lossy or token-heavy copies through prompts. Callbacks between subagents (A) and automatic context inheritance (D) don't exist in this architecture, and inlining complete findings into the prompt (B) bloats context and risks information loss.","t":"Big outputs = store as ARTIFACTS, pass REFERENCES.","k":["shared memory","references","artifacts"]},{"id":"ccar-f-131","d":"tools","x":"Developer Productivity An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services.\n\nWhich built-in tool is most appropriate for this task?","o":["Bash, to execute find . -type d -name \"*auth*\" and explore matching directories","Read, starting with package.json files to trace dependency declarations","Glob, to find files with \"auth\" in their filename or path","Grep, to search for the import statement pattern across file contents"],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The task is to find every file whose contents contain an import of @company/auth, which is a content- search problem — exactly what the built-in Grep tool (ripgrep-based) is designed for. Glob and find/Bash only match filenames or directory names, which would miss the many importing files that don't have \"auth\" in their path, and reading package.json files only shows declared dependencies, not actual usage sites."],"e":"The task is to find every file whose contents contain an import of @company/auth, which is a content- search problem — exactly what the built-in Grep tool (ripgrep-based) is designed for. Glob and find/Bash only match filenames or directory names, which would miss the many importing files that don't have \"auth\" in their path, and reading package.json files only shows declared dependencies, not actual usage sites.","t":"Inside file contents = GREP. File names = GLOB.","k":["Grep","Glob","content search"]},{"id":"ccar-f-132","d":"tools","x":"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to \"remove old backups,\" policy requires archiving backup files. Both tools currently have minimal descriptions: \"Archives a file\" and \"Deletes a file.\" \n\nWhich change most directly improves tool selection?","o":["Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file.","Add a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes.","Add few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\" should use archive_file.","Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file."],"a":[0],"w":["The best approach is to Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place."],"e":"The best approach is to Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","t":"Wrong tool chosen = clarify DESCRIPTIONS with when-not-to-use.","k":["tool descriptions","archive vs delete"]},{"id":"ccar-f-133","d":"context-reliability","x":"Your CRM agent's delete_contact tool handles requests like \"delete the duplicate entry for Acme Corp.\" The database contains similarly named records (e.g., \"Acme Corp,\" \"Acme Corporation,\" \"ACME Corp Inc.\"), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks.\n\nWhich approach most effectively reduces the error rate while maintaining workflow efficiency?","o":["Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow.","Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests.","Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion.","Require users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names."],"a":[2],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing.","The best approach is to Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"The best approach is to Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Look-alike records = SHOW differences + ONE-click confirm.","k":["disambiguation","confirmation","friction"]},{"id":"ccar-f-134","d":"prompt-output","x":"Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes before extraction succeeds.\n\nWhich batch processing strategy is the most cost-efficient while still meeting the deadline?","o":["Use the real-time API for all 50,000 documents since the batch API's 24-hour processing window creates unacceptable deadline risk.","Split documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between batches to improve extraction quality progressively.","Submit all 50,000 documents via batch API, then submit failed extractions in successive batches— refining prompts between each batch—until all documents pass validation.","Process 2,000 sample documents via real time API to identify ing conversations using the new prompt and replace the stored histories to align past context with current behavior.","Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations."],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","The best approach is to Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives."],"e":"The best approach is to Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Old chats keep OLD prompt version. Version your prompts.","k":["prompt versioning","consistency","multi-session"]},{"id":"ccar-f-136","d":"context-reliability","x":"Evaluation shows 94% extraction accuracy on short meeting transcripts (<30 minutes) but only 68% on longer transcripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model's context window.\n\nWhat pattern most effectively improves accuracy on complex, lengthy documents?","o":["Split lengthy transcripts Into chunks, extract from each chunk separately, then merge and deduplicate the results.","Add a pre-extraction step I/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. \n\nWhat is the best approach to reorganize so only relevant guidance loads when editing specific file types?","o":["Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance.","Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files.","Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents.","Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform Conventions\"), improving organization and readability."],"a":[1],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","The best approach is to Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem."],"e":"The best approach is to Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Load rules by FILE PATH = .claude/rules/ with paths frontmatter.","k":[".claude/rules","path scoping","CLAUDE.md size"]},{"id":"ccar-f-139","d":"context-reliability","x":"After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data.\n\nWhich approach structurally eliminates the semantic overlaps that are being logged as the error source?","o":["Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag.","Split the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit, and apply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator routing between them.","Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate.","Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."],"a":[0],"w":["The best approach is to Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place."],"e":"The best approach is to Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","t":"Overlapping tools = MERGE them.","k":["tool consolidation","semantic overlap"]},{"id":"ccar-f-140","d":"tools","x":"After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data.\n\nWhich approach structurally eliminates the semantic overlap identified in the error source?","o":["Split the tools across two sub-agents — a 'financial resolution' agent with issue_credit, process_refund, return_order, and apply_promo_code and a 'delivery operations' agent with the remaining delivery tools — with a coordinating routing between them.","Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag.","Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed.","Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."],"a":[1],"w":["It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","The best approach is to Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure."],"e":"The best approach is to Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","t":"Remove overlap = MERGE + optional flag.","k":["tool consolidation","action parameter","include_tracking"]},{"id":"ccar-f-141","d":"context-reliability","x":"Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has different additional requirements. You notice during testing that with your current frequently omits required parameters or includes irrelevant ones.\n\nWhat design change will most effectively improve parameter accuracy?","o":["Keep one unified tool with a nested operation object parameter whose internal structure varies by ope e their level-often defaulting to overly detailed responses regardless of contextual cues like technical terms.\n\nWhich change to the system prompt would most directly address this failure to pick up on implicit expertise signals?","o":["Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user's expertise isn't immediately clear from their first message.","Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional abou consultations.","Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep ranges or asks about periodization, treat as advanced.\"","Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses."],"a":[1],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","The best approach is to Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional abou consultations. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional abou consultations. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Many rigid IFs? Replace with one general PRINCIPLE (keep safety rule).","k":["general principle","implicit signals","system prompt"]},{"id":"ccar-f-143","d":"context-reliability","x":"You're building a security scanning workflow. \n\nWhen engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?","o":["Use Glob with a pattern like /*eval* to find files, then Read each matching file.","Use Bash to run ls -R | grep eval to recursively list files containing eval.","Read the project's main entry file and follow import statements to trace where eval might be used.","Use Grep to search for the pattern \"eval(\" across all files in the codebase."],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Grep is the purpose-built content-search tool (ripgrep-based) for finding patterns inside file contents across a large codebase, which is exactly what locating all eval( call sites requires. Glob only matches file names, reading entry files and tracing imports doesn't scale or guarantee coverage, and ls -R | grep only matches file names, not file contents."],"e":"Grep is the purpose-built content-search tool (ripgrep-based) for finding patterns inside file contents across a large codebase, which is exactly what locating all eval( call sites requires. Glob only matches file names, reading entry files and tracing imports doesn't scale or guarantee coverage, and ls -R | grep only matches file names, not file contents.","t":"Find code patterns inside files = GREP.","k":["Grep","security scan"]},{"id":"ccar-f-144","d":"claude-code","x":"Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don't throw exceptions, tests duplicating existing coverage, or tests ignoring your team's fixture conventions.\n\nHow do you reduce the rate of low-value tests being generated in the first place?","o":["Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions.","Add post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide.","Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.","Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."],"a":[0],"w":["The question explicitly asks how to reduce low-value tests \"being generated in the first place,\" which means fixing the upstream cause: Claude lacks context about what the team considers a valuable test. Documenting testing standards, fixture usage, and good-vs-trivial examples in CLAUDE.md gives Claude that context at generation time, whereas A and D only filter bad output after the fact and B avoids the problem rather than solving it.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The question explicitly asks how to reduce  to add a requires approval: true flag, which the tool checks before disbursing."],"a":[0],"w":["The best approach is to The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts <$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the tool to create a pending approval request and return a status indicating manager review is pending. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts <$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the tool to create a pending approval request and return a status indicating manager review is pending. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Tamper-proof rule = enforce INSIDE the tool.","k":["tool-level enforcement","approval threshold"]},{"id":"ccar-f-146","d":"prompt-output","x":"Your portfolio value tool returns the total value of a user's investment portfolio. You're deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string.\n\nWhat is the primary advantage of using structured output with defined fields?","o":["The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations.","JSON schemas automatically validate that the underlying API returned correct data before the agent processes it.","Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values.","Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."],"a":[0],"w":["The best approach is to The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way."],"e":"The best approach is to The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Structured output = reliable VALUE extraction.","k":["structured output","parsing"]},{"id":"ccar-f-147","d":"context-reliability","x":"Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns.\n\nWhich approach best addresses this issue?","o":["Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history","Shift context budget to favor RAG results while reducing conversation history allocation","Implement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns","Compress all RAG results into a consolidated summary document that updates incrementally after each retrieval"],"a":[0],"w":["The best approach is to Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Collapsing everything into one path reduces precision and usually makes the system harder to control, not easier."],"e":"The best approach is to Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"RAG crowding history = WINDOW the RAG results.","k":["sliding window","RAG results","context budget"]},{"id":"ccar-f-148","d":"claude-code","x":"Your team frequently migrates React components to Vue. You've written a step-by-step workflow for Claude Code to follow during each migration, and you want every developer on the team to invoke it by typing /migrate-component. The workflow should stay in sync as the team iterates on it.\n\nWhere should you place the skill file?","o":["As a detailed instruction block in the project's root CLAUDE.md file","In the project's .claude/settings.json using a skillOverrides entry to register and define the workflow","In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control","In ~/.claude/skills/migrate-component/SKILL.md on each developer's machine"],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","The best approach is to In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Team skill = project .claude/skills/ + COMMIT it.","k":["project skills","SKILL.md","slash command"]},{"id":"ccar-f-149","d":"prompt-output","x":"The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like \"Great product!\", Claude fabricates specific pros and cons rather than indicating this information isn't explicitly stated, and (2) for sarcastic reviews like \"Well that was... interesting\", Claude picks sentiment arbitrarily since there's no option for ambiguous cases.\n\nWhat schema modification best addresses both issues?","o":["Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum.","Allow null values for pros/cons, and add \"unclear\" to the sentiment enum.","Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold.","Make pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum."],"a":[0],"w":["The best approach is to Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"The best approach is to Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Let it say NOTHING (empty array) and 'UNCLEAR'.","k":["empty arrays","unclear enum","schema design"]},{"id":"ccar-f-150","d":"context-reliability","x":"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team's goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates.\n\nWhich approach achieves this guarantee?","o":["Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute.","Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions.","Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results.","Split the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets."],"a":[2],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","The best approach is to Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix."],"e":"The best approach is to Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Guarantee = CODE checks outcome after loop ends.","k":["orchestration layer","guaranteed escalation","max_turns"]},{"id":"ccar-f-151","d":"claude-code","x":"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed.\n\nWhat best explains this discrepancy?","o":["Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions","The CI review uses a more specific prompt tailored for catching bugs, while the developer's request was too general","The CI environment has access to the full codebase context while the local session only sees the current file","The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis"],"a":[0],"w":["The best approach is to Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Same session reviews its own work = BIASED. Use fresh eyes.","k":["self-review bias","independent review"]},{"id":"ccar-f-152","d":"tools","x":"You've configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search.\n\nWhen a user asks the agent to \"create a branch for JIRA- 123 and add documentation links to the ticket,\" how does the agent access tools across these servers?","o":["You must specify which MCP server to use for each turn, and the agent can only access one server's tools at a time.","Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent.","The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes.","The agent automatically selects the most relevant server based on the request and loads only that server's tools."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing."],"e":"The best approach is to Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"All MCP servers' tools = available SIMULTANEOUSLY.","k":["MCP servers","tool discovery"]},{"id":"ccar-f-153","d":"context-reliability","x":"An engineer submits two requests: • Request A: \"Rename the getUserData function to fetchUserProfile everywhere it's used.\" • Request B: \"Improve error handling throughout the data processing module—add try/catch blocks, meaningful error messages, and ensure failures don't silently corrupt data.\"\n\nFor which request does specifying an explicit multi-phase workflow (such as analyze propose implement with review) most improve outcome quality?","o":["Request A, the function rename task","Neither request benefits significantly","Request B, the error handling task","Both requests benefit equally"],"a":[2],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Request B is open-ended and judgment-heavy — \"improve error handling\" requires analyzing current behavior, deciding where try/catch belongs, and choosing meaningful messages, so an explicit analyze propose implement-with-review workflow materially raises quality and catches bad design before code changes. Request A is a mechanical, well-defined rename that a simple find-and-replace-style execution handles fine, so the multi-phase structure adds little.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"Request B is open-ended and judgment-heavy — \"improve error handling\" requires analyzing current behavior, deciding where try/catch belongs, and choosing meaningful messages, so an explicit analyze propose implement-with-review workflow materially raises quality and catches bad design before code changes. Request A is a mechanical, well-defined rename that a simple find-and-replace-style execution handles fine, so the multi-phase structure adds little.","t":"Judgment-heavy, open-ended task = MULTI-PHASE workflow.","k":["multi-phase workflow","open-ended tasks"]},{"id":"ccar-f-154","d":"architecture","x":"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner.\n\nWhich configuration change directly enforces both of those per-invocation caps?","o":["Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend.","Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per- call cost.","Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard.","Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set."],"a":[0],"w":["The required controls are native per-invocation limits inside Claude Code itself: one that caps the number of agentic turns and one that caps dollar spend for that run. Using those built-in runtime limits is the direct way to stop oversized reviews without depending on external job settings or indirect cost reductions.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing."],"e":"The required controls are native per-invocation limits inside Claude Code itself: one that caps the number of agentic turns and one that caps dollar spend for that run. Using those built-in runtime limits is the direct way to stop oversized reviews without depending on external job settings or indirect cost reductions.","t":"Cap turns + dollars = --max-turns + --max-budget-usd.","k":["--max-turns","--max-budget-usd","CI"]},{"id":"ccar-f-155","d":"prompt-output","x":"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data.\n\nWhat is most critical for helping Claude understand what parameter values to provide?","o":["Detailed error responses explaining why invalid parameter values were rejected","Clear parameter descriptions explaining expected format, such as \"user_id : UUID of the user to update (required)\"","Verbose parameter names encoding format hints, such as user_id_string_uuid_format","Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type"],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Clear parameter descriptions explaining expected format, such as \"user_id : UUID of the user to update (required)\". This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way."],"e":"The best approach is to Clear parameter descriptions explaining expected format, such as \"user_id : UUID of the user to update (required)\". This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Parameter DESCRIPTIONS tell Claude what to pass.","k":["parameter descriptions","tool design"]},{"id":"ccar-f-156","d":"context-reliability","x":"Your conversation history includes two types of content: persistent story elements (character backgrounds, plot structure, world rules) that must remain consistent throughout, and extensive brainstorming discussion that's mostly ephemeral. After 40+ turns, you're hitting context limits and users report the assistant \"forgets\" established character traits, breaking narrative consistency.\n\nWhich approach best ensures persistent story elements remain available to the model while reclaiming context space?","o":["Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full history to free up tokens.","Separate persistent story elements into a retained \"story bible\" section at context start, applying trimming or summarization only to brainstorming discussion.","Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier context from recent discussion flow.","Store all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks."],"a":[1],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","The best approach is to Separate persistent story elements into a retained \"story bible\" section at context start, applying trimming or summarization only to brainstorming discussion. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","That adds infrastructure or indirection, but the question is really about choosing a simpler coordination pattern that fits the current workflow."],"e":"The best approach is to Separate persistent story elements into a retained \"story bible\" section at context start, applying trimming or summarization only to brainstorming discussion. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Permanent facts in a STORY BIBLE, trim only the chatter.","k":["story bible","persistent context","summarization"]},{"id":"ccar-f-157","d":"context-reliability","x":"Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like \"Actually, let's raise the budget to $650K\" or \"I'd prefer a condo now instead of a house,\" the assistant sometimes continues referencing the original preferences in later responses—even though the updates are clearly present in the conversation history. Context usage is only at 35% capacity.\n\nWhich solution most reliably ensures the model uses the current preferences?","o":["Implement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context.","Include few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses.","Maintain a structured state object with current preferences, update it on changes, and include it in each request.","Add system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones."],"a":[2],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","The best approach is to Maintain a structured state object with current preferences, update it on changes, and include it in each request. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Maintain a structured state object with current preferences, update it on changes, and include it in each request. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Changing prefs = STATE OBJECT sent every request.","k":["state object","preference updates"]},{"id":"ccar-f-158","d":"claude-code","x":"After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestion contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues.\n\nWhich approach best enables the model to generalize its judgment to novel code patterns it hasn't seen before?","o":["Add instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider that some patterns may be intentional.\"","Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt.","Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category.","Implement post-processing that uses keyword matching to filter out findings containing terms like \"convention,\" \"context-dependent,\" or \"trade-off.\""],"a":[2],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Documentation may give useful background, but it is not a reliable way to discover every real caller or usage path in code.","The best approach is to Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"The best approach is to Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Generalize judgment = annotated FEW-SHOT contrasts.","k":["few-shot","false positives","generalization"]},{"id":"ccar-f-159","d":"claude-code","x":"You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions. However, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely stops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules.\n\nWhich change to the CLI invocation will cause Claude to read related files in the repository while still successfully applying your custom review instructions?","o":["Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools.","Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one.","Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p.","Keep --system-prompt and add --allowedTools \"Read, Glob, Grep\" so that the non-interactive mode permits file system tools that it otherwise disables."],"a":[0],"w":["The best approach is to Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"The best approach is to Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Keep default tool guidance = APPEND, don't replace.","k":["--append-system-prompt","--system-prompt","CLI"]},{"id":"ccar-f-160","d":"claude-code","x":"Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of trivial assertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly without introducing high latency or modifying the core pipeline script.\n\nWhich strategy best ensures that high-quality, meaningful tests are generated in the first place?","o":["Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.","Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions.","Add post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide.","Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Quality at source = standards in CLAUDE.md.","k":["CLAUDE.md","testing standards"]},{"id":"ccar-f-161","d":"context-reliability","x":"Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to persist reliably across all user interactions.\n\nWhere should you define these behavioral guidelines?","o":["Prepended to each user message before sending to the API","In the first assistant message, instructing Claude to follow these guidelines going forward","In the system prompt","In environmental variables that your application passes to the API client"],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to In the system prompt. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to In the system prompt. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Persistent behavior = SYSTEM PROMPT.","k":["system prompt","persona"]},{"id":"ccar-f-162","d":"tools","x":"Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing.\n\nWhich configuration approach correctly applies MCP server scopes?","o":["Add venue server to .mcp.json and playlist server to ~/.claude.json","Add both servers to your local ~/.claude.json","Add both servers to the project-level .mcp.json file","Add venue server to ~/.claude.json and playlist server to .mcp.json"],"a":[0],"w":["The best approach is to Add venue server to .mcp.json and playlist server to ~/.claude.json. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way."],"e":"The best approach is to Add venue server to .mcp.json and playlist server to ~/.claude.json. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Team = .mcp.json (project). Just me = ~/.claude.json.","k":[".mcp.json","~/.claude.json","MCP scopes"]}]},{"id":"ccar-p","code":"CCAR-P","title":"Claude Certified Architect — Professional","vendor":"Anthropic","exam":{"count":60,"minutes":90,"passPercent":80},"domains":{"general":"General"},"qs":[{"id":"ccar-p-1","d":"general","x":"You are compiling guardrail tactics for a customer-facing assistant.\nWhich two tactics belong on the guardrail list?\nEach correct answer presents a complete solution.","o":["Embed approved override phrases that let trusted users relax guardrails on demand.","Lower sampling temperature globally to reduce the chance of off-policy completions.","Rely on a single hardened system prompt that enumerates every disallowed behavior.","Layer prompt-level guardrails with runtime content checks rather than relying on either alone.","Validate the model output against a structured schema before downstream actions are taken."],"a":[3,4],"w":["Allowing users to bypass guardrails through special phrases can create a security and policy risk. Guardrails should not be easily disabled through conversational instructions, even for trusted users.","Lowering temperature can make outputs more consistent and predictable, but it is not a reliable substitute for explicit safety controls. Model randomness settings alone cannot enforce policy boundaries.","A system prompt is an important layer, but relying on one control alone is not sufficient. Complex customer-facing systems benefit from multiple independent safeguards.","Using multiple guardrail layers provides defense in depth. Prompt-level instructions establish behavioral boundaries, while runtime checks can detect or block problematic content before it reaches users or downstream systems.","Structured output validation helps ensure that the model response conforms to the expected format and required fields before it is passed to downstream systems. This reduces the risk of malformed or unexpected model output triggering unintended actions."],"e":"Using multiple guardrail layers provides defense in depth. Prompt-level instructions establish behavioral boundaries, while runtime checks can detect or block problematic content before it reaches users or downstream systems. Structured output validation helps ensure that the model response conforms to the expected format and required fields before it is passed to downstream systems. This reduces the risk of malformed or unexpected model output triggering unintended actions.","t":"Defense in depth: layers + schema validation. Never one control alone.","k":["defense in depth","runtime checks","schema validation"]},{"id":"ccar-p-2","d":"general","x":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations.\nWhich two guardrail implementations most directly enforce this constraint? (Select two.)","o":["Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.","Log all user queries to a SIEM for post-hoc compliance review.","Limit session length to reduce the volume of queries processed per user per day.","Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advicerequests.","Add an output classifier that detects and blocks responses containing regulated investment- recommendation language."],"a":[3,4],"w":["Increasing temperature makes responses more variable and less predictable. It does not enforce a safety boundary and could actually make it harder to consistently prevent prohibited investment recommendations.","Logging supports monitoring, auditing, and investigation, but it is a post-hoc control. It does not directly prevent the assistant from generating a prohibited investment recommendation before the response reaches the user.","Limiting session length may reduce overall usage, but it does not prevent the model from providing a regulated investment recommendation within an allowed session. It is therefore not a direct enforcement mechanism for this requirement.","Explicitly defining out-of-scope behavior in the system instructions establishes a clear boundary for the assistant. Fixed refusal guidance also makes the expected response more consistent when users request prohibited investment recommendations.","An output classifier provides a runtime enforcement layer that can detect prohibited content before it reaches the customer. This complements prompt-level guardrails and provides an additional control if the model attempts to generate restricted advice."],"e":"Explicitly defining out-of-scope behavior in the system instructions establishes a clear boundary for the assistant. Fixed refusal guidance also makes the expected response more consistent when users request prohibited investment recommendations. An output classifier provides a runtime enforcement layer that can detect prohibited content before it reaches the customer. This complements prompt-level guardrails and provides an additional control if the model attempts to generate restricted advice.","t":"Tell it (system prompt scope) + catch it (output classifier).","k":["out-of-scope","refusal","output classifier"]},{"id":"ccar-p-3","d":"general","x":"You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else.\nWhich scoping design best applies least privilege?","o":["Allow access to every tool in the catalog and rely on the model to decline tools it should not use.","Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer.","Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for.","Allow access to all tools with read permissions globally and restrict write permissions to the draft- queue tool, without scoping to only the specific tools required for defined tasks."],"a":[1],"w":["This does not follow the least-privilege principle because the assistant receives access to tools it does not need. Relying on the model to voluntarily avoid those tools is not an adequate security control.","This is the strongest least-privilege design. The assistant receives access to only the two tools required for its defined responsibilities. Enforcing the allow-list at the orchestration layer provides a technical permission boundary rather than relying on the model's behavior.","Although disabling all tools minimizes permissions, it also prevents the assistant from performing its required responsibilities. Least privilege means granting the minimum permissions necessary to accomplish the intended task, not removing necessary access.","This still grants unnecessary access to tools outside the assistant's responsibilities. Least privilege requires permissions to be scoped to the specific capabilities the assistant actually needs."],"e":"This is the strongest least-privilege design. The assistant receives access to only the two tools required for its defined responsibilities. Enforcing the allow-list at the orchestration layer provides a technical permission boundary rather than relying on the model's behavior.","t":"Exactly what's needed, ENFORCED outside the model.","k":["least privilege","allow-list","orchestration layer"]},{"id":"ccar-p-4","d":"general","x":"You are compiling team-setup practices for a Claude Code rollout across an engineering organization.\nWhich two practices belong on the list? (Select two.)\nEach correct answer presents a complete solution.","o":["Use project scope for personal editor preferences so the preferences apply consistently within the project.","Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.","Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work.","Use user scope for team-shared MCP servers so every engineer on the team has consistent access.","Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control."],"a":[1,4],"w":["Project scope is intended for team-shared configuration, not personal preferences. Personal editor preferences should generally remain at the user or local scope so they do not affect other engineers working on the project.","Managed configuration is appropriate for security-critical controls that need consistent enforcement across the organization. Central management prevents individual engineers from overriding important security policies.","Security-critical permission rules should not be individually adjustable when organizational consistency is required. Local configuration could allow engineers to weaken or bypass important security controls.","User scope applies to an individual engineer, not the entire project team. Team-shared MCP servers should be configured at a shared project or managed organizational level.","Project scope is appropriate for team-shared configuration. Keeping MCP server settings and permission rules under version control improves consistency, reviewability, and change tracking across the engineering organization."],"e":"Managed configuration is appropriate for security-critical controls that need consistent enforcement across the organization. Central management prevents individual engineers from overriding important security policies. Project scope is appropriate for team-shared configuration. Keeping MCP server settings and permission rules under version control improves consistency, reviewability, and change tracking across the engineering organization.","t":"Security = MANAGED. Team-shared = PROJECT. Personal = USER.","k":["managed scope","project scope","MCP"]},{"id":"ccar-p-5","d":"general","x":"You are designing a content moderation classifier that processes high volumes of user-generated comments under a tight per-message latency budget using well-defined classification labels.\nWhich model selection best aligns with the workload?","o":["Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.","Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.","Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling.","Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity."],"a":[1],"w":["Sonnet provides strong general-purpose capabilities, but this workload emphasizes high volume, low latency, and well-defined classification tasks. A lighter model is generally a better fit when deep reasoning is not required.","Haiku is well suited to fast, high-volume workloads where the task is clearly defined and does not require extensive reasoning. Its efficiency helps meet strict latency requirements while controlling resource consumption.","Extended Thinking adds deeper reasoning but can increase latency and resource consumption. Applying it to every high-volume classification request is unnecessary when the labels and task are already well defined.","Maximum reasoning capability is not required for every moderation task. Using a highly capable model for simple, high-volume classification can result in unnecessary cost and latency."],"e":"Haiku is well suited to fast, high-volume workloads where the task is clearly defined and does not require extensive reasoning. Its efficiency helps meet strict latency requirements while controlling resource consumption.","t":"Fast + cheap + simple labels = HAIKU.","k":["Haiku","latency","classification"]},{"id":"ccar-p-6","d":"general","x":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed.\nWhich resolution step is most appropriate?","o":["Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied.","Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional.","Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule.","Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in"],"a":[0],"w":["The appropriate approach is to diagnose the active permission configuration rather than bypassing the security controls. Reviewing the applicable rules across scopes helps identify the exact rule responsible for the denial and determine whether the rule is intentional or needs to be changed.","Repeated retries do not address the underlying permission configuration. The denial may be intenti
