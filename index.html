onal, so the correct approach is to inspect and understand the active rules first.","Disabling the permission system removes important security controls and violates the principle of least privilege. Only the specific rule that is incorrectly denying the required action should be considered for amendment.","Unrestricted Bash access creates an unnecessarily broad security exposure. The appropriate solution is to identify and adjust the specific permission rule if necessary, rather than granting unrestricted capabilities."],"e":"The appropriate approach is to diagnose the active permission configuration rather than bypassing the security controls. Reviewing the applicable rules across scopes helps identify the exact rule responsible for the denial and determine whether the rule is intentional or needs to be changed.","t":"Denied? DIAGNOSE the rule across scopes, don't bypass.","k":["permission rules","scopes","diagnose"]},{"id":"ccar-p-7","d":"general","x":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool- selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request.\nWhich two findings should you present to justify capability decomposition before adding the router? (Select two.)\nEach correct answer presents part of the solution.","o":["Tool descriptions overlap across multiple claim categories within the agent's tool set.","Several tools have not been invoked across the most recent 90 days of traffic.","The router pattern is well documented across publicly available agent literature.","The proposed router introduces an additional model call on every incoming request.","The 34 tools serve four distinct claim-workflow domains within the triage scope."],"a":[3,4],"w":["Overlapping tool descriptions can contribute to tool-selection confusion, but this finding alone does not directly establish that the agent should first be decomposed into separate capability domains.","Unused tools are useful evidence for tool rationalization or removal, but they do not directly demonstrate that the 34-tool set should be divided into separate capability domains.","The existence of a documented routing pattern does not establish that it is the right architectural solution for this deployment. The team should first understand the underlying capability structure and performance problem.","Adding another agent introduces additional model-call overhead, which can increase latency and complexity. Since the existing system already has a 2.3-second increase in tool-selection latency, adding another model call may worsen the problem rather than address its root cause.","This is strong evidence for capability decomposition. If the tools naturally fall into four distinct workflow domains, the system can potentially be divided into more focused agents or capability groups, reducing the number of tools each agent must reason over."],"e":"Adding another agent introduces additional model-call overhead, which can increase latency and complexity. Since the existing system already has a 2.3-second increase in tool-selection latency, adding another model call may worsen the problem rather than address its root cause. This is strong evidence for capability decomposition. If the tools naturally fall into four distinct workflow domains, the system can potentially be divided into more focused agents or capability groups, reducing the number of tools each agent must reason over.","t":"Distinct domains = SPLIT the agent. Router = extra call = more latency.","k":["capability decomposition","tool overload","router latency"]},{"id":"ccar-p-8","d":"general","x":"A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code.\nWhich factor most strongly favors implementing the capability as a Skill?","o":["The capability needs to query a live database for the most recent regulatory filings.","The capability requires direct authentication against the corporate identity provider.","The capability is procedural knowledge with no live external-system calls required.","The capability must also be callable from a developer's command-line interface."],"a":[2],"w":["A capability that needs to interact with a live external system is better suited to an MCP-based integration. MCP is designed to connect Claude with external tools, services, and data sources.","Direct authentication and integration with enterprise systems are characteristics that favor an MCP server or another external integration, rather than a Skill focused on procedural knowledge.","This is the strongest reason to choose a Skill. Skills are well suited to reusable procedures, instructions, examples, and domain-specific workflows that Claude can apply when relevant. Since this capability does not need to call live external systems, an MCP server is unnecessary.","Being usable from Claude Code does not by itself make MCP the better choice. The key distinction is whether the capability primarily provides procedural knowledge or requires external tools and system access."],"e":"This is the strongest reason to choose a Skill. Skills are well suited to reusable procedures, instructions, examples, and domain-specific workflows that Claude can apply when relevant. Since this capability does not need to call live external systems, an MCP server is unnecessary.","t":"Procedural knowledge, no live calls = SKILL. Live systems = MCP.","k":["Skill vs MCP","procedural knowledge","portable"]},{"id":"ccar-p-9","d":"general","x":"A Claude architect is auditing configuration scope assignments.\nWhich two statements correctly identify an appropriate use of user-scope configuration versus other scopes?\n(Select two.)","o":["Defining MCP server endpoints shared by all contributors to a specific repository.","Storing API authentication keys so they are not committed to version control.","Enforcing a company-wide policy that disables a feature for all engineers.","Persisting personal editor theme preferences that follow an engineer across projects.","Saving a preferred Claude response language that applies to all repositories the engineer uses."],"a":[3,4],"w":["MCP servers shared by contributors to a particular repository are better suited to project scope, because project-level configuration can be shared and maintained with the project rather than tied to one individual engineer.","Authentication keys and other secrets require secure secret-management practices. Simply placing them in user-scope configuration is not the appropriate general solution for protecting sensitive credentials.","Company-wide security or policy requirements should be enforced through managed/organizational configuration, rather than user scope. Individual engineers should not be able to override centrally required controls.","User scope is appropriate for personal preferences that should follow an individual engineer across different projects. An editor theme is a good example because it does not need to be shared with the entire team.","A preferred response language is also an individual user preference. User scope allows the preference to persist across the engineer's different repositories and projects without imposing it on other team members."],"e":"User scope is appropriate for personal preferences that should follow an individual engineer across different projects. An editor theme is a good example because it does not need to be shared with the entire team. A preferred response language is also an individual user preference. User scope allows the preference to persist across the engineer's different repositories and projects without imposing it on other team members.","t":"User scope = things that follow ME everywhere.","k":["user scope","personal preferences"]},{"id":"ccar-p-10","d":"general","x":"A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. The product team has asked whether the incident requires architectural action or whether it is an isolated case.\nWhich two Diligence-competency actions should you take? (Select two.)\nEach correct answer presents part of the solution.","o":["Disable the assistant immediately for all current users without any prior diagnostic analysis.","Review whether citation-grounding controls exist anywhere in the current generation pipeline.","Sample recent summaries to estimate the fabrication frequency across the population.","Treat the incident as an anecdotal isolated case and take no further investigative action.","Communicate to users that the assistant does not fabricate output as a matter of design."],"a":[1,2],"w":["Immediately disabling the assistant may be appropriate in an extreme safety situation, but this scenario first requires evidence-based investigation. The team needs to understand the scope and cause of the issue before deciding on an architectural response.","Reviewing the existing pipeline determines whether there are controls designed to prevent unsupported or fabricated citations. This helps identify potential architectural weaknesses and whether additional grounding or validation mechanisms are needed.","Sampling recent outputs helps determine whether the reported citation is an isolated event or part of a recurring pattern. Measuring the frequency provides evidence for deciding whether broader corrective or architectural action is warranted.","A single reported incident should not automatically be dismissed. Diligence requires investigating and assessing the broader risk before concluding that the problem is isolated.","A design intention does not prove that the system cannot produce fabricated content. Such a statement could create a false sense of reliability rather than addressing the reported incident."],"e":"Reviewing the existing pipeline determines whether there are controls designed to prevent unsupported or fabricated citations. This helps identify potential architectural weaknesses and whether additional grounding or validation mechanisms are needed. Sampling recent outputs helps determine whether the reported citation is an isolated event or part of a recurring pattern. Measuring the frequency provides evidence for deciding whether broader corrective or architectural action is warranted.","t":"Diligence = check the CONTROLS + MEASURE how often.","k":["diligence","citation grounding","sampling"]},{"id":"ccar-p-11","d":"general","x":"A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain.\nWhich Delegation-competency principle should quide your response?","o":["Delegation should be avoided entirely wherever financial transactions occur in the workflow.","Delegation should always include human review on every decision the workflow produces.","Delegation scope should reflect the type of risk involved, not the transaction size alone.","Delegation scope should be set primarily by maximizing efficiency gains across the workflow."],"a":[2],"w":["Delegation is not automatically inappropriate simply because a workflow involves financial transactions. The appropriate approach is to assess the specific risks and consequences and determine what level of human oversight is necessary.","Human review is important for higher-risk decisions, but requiring manual review for every single decision is unnecessarily rigid. Appropriate delegation depends on the risk associated with the task and its potential impact.","The risk associated with an action is more important than the dollar amount alone. Even a small refund could involve fraud, customer disputes, policy exceptions, or other consequences. Delegation should therefore consider factors such as financial, legal, customer, and reputational risk when determining the appropriate level of human oversight.","Efficiency is an important consideration, but it should not override risk management and accountability. Delegation decisions should balance productivity with the potential consequences of automated decisions."],"e":"The risk associated with an action is more important than the dollar amount alone. Even a small refund could involve fraud, customer disputes, policy exceptions, or other consequences. Delegation should therefore consider factors such as financial, legal, customer, and reputational risk when determining the appropriate level of human oversight.","t":"Risk TYPE, not dollar SIZE.","k":["delegation","risk type"]},{"id":"ccar-p-12","d":"general","x":"You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision.\nHow should you structure the recommendation document?","o":["Lead with detailed cost projections across the full multi-year horizon before the rationale section.","Lead with the technical architecture diagram and the full component list before any other section.","Present the same dense narrative throughout with no stakeholder differentiation in any section.","Lead with the architectural decision, then address each stakeholder's primary concerns directly."],"a":[3],"w":["Cost is highly relevant to the CFO, but leading exclusively with detailed financial projections may not address the legal, technical, and strategic concerns of the other stakeholders.","The technical architecture is particularly important to the CIO, but beginning with a detailed component list may overwhelm stakeholders who primarily need to understand the decision, rationale, risks, and business impact.","Different stakeholders have different responsibilities and concerns. A one-size-fits-all narrative may fail to address the specific information each decision-maker needs.","The strongest approach is to state the recommendation clearly at the beginning and then address the key concerns of each stakeholder. For example, the CFO may focus on cost and ROI, the General Counsel on legal risk and compliance, and the CIO on architecture, security, integration, and operational considerations.\nThis structure makes the recommendation decision-oriented, concise, and relevant to the entire steering committee."],"e":"The strongest approach is to state the recommendation clearly at the beginning and then address the key concerns of each stakeholder. For example, the CFO may focus on cost and ROI, the General Counsel on legal risk and compliance, and the CIO on architecture, security, integration, and operational considerations.\nThis structure makes the recommendation decision-oriented, concise, and relevant to the entire steering committee.","t":"Decision FIRST, then each stakeholder's worry.","k":["stakeholders","decision first"]},{"id":"ccar-p-13","d":"general","x":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch.\nWhich response is most appropriate?","o":["Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed.","Reinstall the operating system to clear all permission state without first confirming whether the one- time permission grant caused the failure.","Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.","Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs."],"a":[2],"w":["The fact that the MCP server succeeds on subsequent runs strongly suggests that the initial failure may be related to first-run permissions or authorization. Replacing the server without investigating would be unnecessary and could fail to address the actual cause.","Reinstalling the operating system is an extreme and unnecessary troubleshooting step. The permission dialogs provide a much more relevant clue that should be investigated first.","The appearance of system permission dialogs during the first launch is a strong indication that the initial failure was related to one-time operating-system authorization. The appropriate response is to document this expected first-run behavior and verify that the MCP server works normally afterward.","Disabling operating-system permission controls unnecessarily weakens security protections. The better approach is to understand the permission requirement, document it, and verify successful subsequent operation."],"e":"The appearance of system permission dialogs during the first launch is a strong indication that the initial failure was related to one-time operating-system authorization. The appropriate response is to document this expected first-run behavior and verify that the MCP server works normally afterward.","t":"First-run fail + permission popup = expected. Document it.","k":["first-run permission","MCP server","onboarding"]},{"id":"ccar-p-14","d":"general","x":"You are producing an architecture guide for a new deployment and must complete the planning steps before\ndrafting each section.\nWhich two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution.","o":["Translate the guide into the supported regional languages for the candidate population.","Establish the document under version control with a defined review cadence and approver list.","Identify the audience and the questions the guide must answer for that audience.","Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations.","Validate the guide with the implementation team and incorporate corrections."],"a":[2,3],"w":["Translation is a later-stage activity. Before drafting, the priority is to establish who the guide is for and what information it needs to contain.","Version control, review cadence, and approval processes are valuable for document governance, but they are not the primary content-planning steps required before drafting the sections.","Before writing, you should understand the intended audience and their information needs. This ensures that each section is written at the appropriate technical level and addresses the questions stakeholders actually need answered.","Creating an outline establishes the guide's structure and scope before detailed writing begins. It helps ensure important architecture topics are covered systematically and prevents unnecessary duplication or omissions.","Validation with the implementation team is an important review and refinement step, but it happens after the relevant content has been drafted rather than before drafting each section."],"e":"Before writing, you should understand the intended audience and their information needs. This ensures that each section is written at the appropriate technical level and addresses the questions stakeholders actually need answered. Creating an outline establishes the guide's structure and scope before detailed writing begins. It helps ensure important architecture topics are covered systematically and prevents unnecessary duplication or omissions.","t":"Before writing: WHO reads + WHAT outline.","k":["audience","outline","architecture guide"]},{"id":"ccar-p-15","d":"general","x":"You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions.\nWhich combination of controls most effectively mitigates this attack pattern?","o":["Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.","Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification.","Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging.","Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs."],"a":[0],"w":["This approach provides defense in depth. User-provided claims of authority are treated as untrusted input, runtime controls can identify suspicious override attempts, and scoped permissions prevent the user from escalating privileges simply through prompt content. Audit logging also supports monitoring, investigation, and incident response.","User-supplied text is not a reliable source of authorization. Allowing users to declare their own privileges creates a serious privilege-escalation risk.","A model should not be treated as the sole security boundary. Multiple technical and procedural controls are needed because adversarial inputs can sometimes bypass model-level instructions.","Removing safety controls does not mitigate the attack; it eliminates the protections that are intended to prevent unsafe behavior."],"e":"This approach provides defense in depth. User-provided claims of authority are treated as untrusted input, runtime controls can identify suspicious override attempts, and scoped permissions prevent the user from escalating privileges simply through prompt content. Audit logging also supports monitoring, investigation, and incident response.","t":"Claimed authority = untrusted. Layer prompt + classifier + scoped perms + audit.","k":["untrusted input","privilege escalation","layered controls"]},{"id":"ccar-p-16","d":"general","x":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response.\nWhich design pattern best addresses this issue without sacrificing capability breadth?","o":["Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task.","Use a separate model call to summarize all 60 tool definitions before each user turn."],"a":[1],"w":["Increasing context capacity does not solve the underlying efficiency problem. Loading all 60 tool definitions on every request still consumes tokens and processing time, even when most tools are irrelevant to the current task.","Progressive tool discovery reduces the amount of tool information that must be loaded initially. A relevant subset can be exposed first, and additional tools can be discovered or loaded when the task requires them. This preserves broad capability while reducing initial token usage and latency.","Although this reduces token usage, it can restrict capability and prevent Claude from accessing tools required for a particular request. The selection should be task-relevant rather than an arbitrary fixed number.","This adds another model call and therefore introduces additional latency and resource consumption. It also does not necessarily provide Claude with the precise tool definitions needed for reliable tool use."],"e":"Progressive tool discovery reduces the amount of tool information that must be loaded initially. A relevant subset can be exposed first, and additional tools can be discovered or loaded when the task requires them. This preserves broad capability while reducing initial token usage and latency.","t":"Many tools = PROGRESSIVE discovery, load on demand.","k":["progressive tool discovery","token cost"]},{"id":"ccar-p-17","d":"general","x":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision.\nWhich presentation strategy best serves both audiences?","o":["Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs.","Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it.","Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.","Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."],"a":[2],"w":["This approach focuses almost entirely on the engineering audience and fails to address the executive sponsor's need to understand business outcomes, strategic rationale, risks, and trade-offs.","Simply announcing the decision does not provide enough context. Both audiences need to understand why the decision was made, what alternatives were considered, and what trade-offs were accepted.","This structure serves both audiences effectively. Executives get the decision, business value, and key trade-offs early, while engineering leads receive the technical rationale, alternatives, and implementation details needed to execute the decision.","Different stakeholders have different information needs. Giving every section equal technical and business depth can make the presentation less focused and less useful for both audiences."],"e":"This structure serves both audiences effectively. Executives get the decision, business value, and key trade-offs early, while engineering leads receive the technical rationale, alternatives, and implementation details needed to execute the decision.","t":"Exec layer on top, engineer layer below.","k":["mixed audience","decision first"]},{"id":"ccar-p-18","d":"general","x":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. hich two test types should be prioritized to cover both safety under attack and cross-component correctness?\n(Select two.)","o":["Integration tests that verify end-to-end pipeline behavior across all components.","Smoke tests that verify core paths after each deployment.","Unit tests targeting only individual prompt-template rendering logic.","Regression tests against a stable reference set of previously known-good outputs.","Adversarial tests using prompt-injection and malformed-input cases."],"a":[0,4],"w":["Integration tests verify that the different components of the pipeline work correctly together. For a sensitive financial-data workflow, this is important because failures can occur at the boundaries between components even when individual components work correctly in isolation.","Smoke tests are useful for quickly checking whether the system's basic functionality works after deployment, but they do not provide sufficient coverage for adversarial safety or detailed cross-component correctness.","Unit tests are valuable for testing isolated logic, but testing only prompt-template rendering does not adequately cover the end-to-end pipeline or attacks such as prompt injection and malformed inputs.","Regression testing is useful for detecting unexpected changes in output behavior, but it does not directly provide targeted coverage for adversarial attacks or verify all cross-component interactions.","Adversarial testing directly evaluates how the system behaves under malicious, unexpected, or malformed inputs. For a financial-data pipeline, this helps identify safety weaknesses and potential ways attackers could manipulate the system."],"e":"Integration tests verify that the different components of the pipeline work correctly together. For a sensitive financial-data workflow, this is important because failures can occur at the boundaries between components even when individual components work correctly in isolation. Adversarial testing directly evaluates how the system behaves under malicious, unexpected, or malformed inputs. For a financial-data pipeline, this helps identify safety weaknesses and potential ways attackers could manipulate the system.","t":"Components together = INTEGRATION. Under attack = ADVERSARIAL.","k":["integration tests","adversarial tests"]},{"id":"ccar-p-19","d":"general","x":"You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets.\nWhich two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact?\n(Select two.) Each correct answer presents part of the solution.","o":["Recommend mitigations and residual-risk acceptance for the risks that remain after analysis.","Recommend mitigations and residual-risk acceptance for risks that remain.","Enumerate the threat actors and attack vectors relevant to the deployment.","Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners.","Identify the assets that the deployment touches, along with the sensitivity of each asset."],"a":[2,4],"w":["Mitigations and residual-risk acceptance are later stages of the risk-assessment process. You first need to identify the assets and relevant threats before determining appropriate controls.","This is also a post-analysis activity. Mitigation decisions depend on understanding the risks, their likelihood, their impact, and the controls already available.","Identifying relevant threat actors and attack vectors is necessary before estimating risk. Understanding who could attack the system and how they might do so helps establish the likelihood and potential impact of threats against the identified assets.","Documenting the final assessment is generally performed after the analysis has been completed. You need the risk findings and mitigation decisions before producing the final assessment record.","Asset identification is a foundational step. Knowing which assets are involved and how sensitive they are provides the basis for evaluating the potential impact if those assets are compromised."],"e":"Identifying relevant threat actors and attack vectors is necessary before estimating risk. Understanding who could attack the system and how they might do so helps establish the likelihood and potential impact of threats against the identified assets. Asset identification is a foundational step. Knowing which assets are involved and how sensitive they are provides the basis for evaluating the potential impact if those assets are compromised.","t":"Inventory first: ASSETS + THREAT actors, then likelihood.","k":["risk assessment","assets","threat actors"]},{"id":"ccar-p-20","d":"general","x":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency.\nWhich two actions most directly address stakeholder expectation alignment in this situation? (Select two.)","o":["Replace the current Claude model with a third-party model that may offer lower latency without evaluation.","Pause all development and reallocate engineering resources entirely to latency optimization.","Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.","Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints.","Communicate that latency concerns are a known LLM limitation and outside the architecture team's control."],"a":[2,3],"w":["Replacing the model without proper evaluation does not address stakeholder alignment. It could introduce new quality, security, compatibility, or performance risks. Model changes should be based on measured requirements and controlled evaluation.","This is a broad project-management decision rather than a direct stakeholder-alignment action. It may also unnecessarily disrupt other development priorities without first establishing the actual performance gap.","Providing objective performance measurements gives stakeholders a clear understanding of the current state. Comparing p50 and p95 latency with the agreed SLA helps distinguish actual performance gaps from perception and supports informed decisions.","If the original SLA is unrealistic given validated production constraints, the appropriate approach is to review and revise it collaboratively with stakeholders. This creates shared expectations rather than silently accepting an unachievable target.","This approach dismisses stakeholder concerns instead of addressing them. Architecture teams should provide measured evidence, options, and trade-offs rather than treating performance as completely outside their responsibility."],"e":"Providing objective performance measurements gives stakeholders a clear understanding of the current state. Comparing p50 and p95 latency with the agreed SLA helps distinguish actual performance gaps from perception and supports informed decisions. If the original SLA is unrealistic given validated production constraints, the appropriate approach is to review and revise it collaboratively with stakeholders. This creates shared expectations rather than silently accepting an unachievable target.","t":"Show real NUMBERS vs SLA, renegotiate if needed.","k":["p95 latency","SLA","expectations"]},{"id":"ccar-p-21","d":"general","x":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records.\nWhich two design decisions directly support HIPAA compliance requirements? (Select two.)","o":["Setting max_tokens to a low value to minimize the volume of text generated per request.","Selecting the highest-capability Claude model to maximize diagnostic accuracy.","Enforcing role-based access controls so that PH is retrievable only by authorized personnel.","Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place.","Using streaming responses to reduce perceived latency for clinical users."],"a":[2,3],"w":["Reducing the maximum number of generated tokens can help control cost and output length, but it does not directly address HIPAA requirements such as access control, protection of protected health information, or appropriate contractual safeguards.","Model capability and HIPAA compliance are separate concerns. Choosing a more capable model does not by itself provide the privacy, access-control, contractual, or data-handling protections required for compliant processing.","Role-based access control (RBAC) limits access to protected health information (PHI) based on authorized roles. Restricting PHI access to appropriate personnel supports the principle of controlled access required when handling sensitive healthcare information.","Patient information requires appropriate privacy and contractual safeguards when processed by an external service provider. Ensuring PHI is not improperly used in provider training or feedback processes, and having the appropriate Business Associate Agreement (BAA) where required, directly supports HIPAA compliance.","Streaming can improve the user experience and perceived response speed, but it does not directly establish HIPAA privacy or security compliance."],"e":"Role-based access control (RBAC) limits access to protected health information (PHI) based on authorized roles. Restricting PHI access to appropriate personnel supports the principle of controlled access required when handling sensitive healthcare information. Patient information requires appropriate privacy and contractual safeguards when processed by an external service provider. Ensuring PHI is not improperly used in provider training or feedback processes, and having the appropriate Business Associate Agreement (BAA) where required, directly supports HIPAA compliance.","t":"HIPAA = RBAC on PHI + BAA before data leaves.","k":["HIPAA","PHI","RBAC","BAA"]},{"id":"ccar-p-22","d":"general","x":"You are preparing an operational runbook for a Claude-based service.\nWhich content is essential to include in the runbook?","o":["Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.","Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.","Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.","Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."],"a":[1],"w":["Dashboards and logs are useful, but references alone do not tell the on-call engineer what the alert means, how to investigate it, who to contact, or how to recover the service.","A strong operational runbook should provide actionable guidance for incident response. It should explain common alerts, initial triage, escalation procedures, rollback or recovery steps, and where to find the relevant monitoring information.","Alert definitions and triage are important, but they are incomplete without escalation paths, recovery procedures, and monitoring references.","Rollback and escalation procedures are valuable, but the on-call engineer also needs to know how to recognize and investigate the incident before escalating or rolling back."],"e":"A strong operational runbook should provide actionable guidance for incident response. It should explain common alerts, initial triage, escalation procedures, rollback or recovery steps, and where to find the relevant monitoring information.","t":"Runbook = alerts + triage + escalation + rollback + dashboards.","k":["runbook","triage","rollback"]},{"id":"ccar-p-23","d":"general","x":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q & A system.\nWhich two items represent failure modes intrinsic to LLM-based systems rather than generic software defects?\n(Select two.)","o":["An expired TLS certificate blocks outbound API calls to Claude.","A database connection timeout causes retrieval to return an empty result set.","The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","A misconfigured load balancer routes requests to a deprecated API version.","The model generates a plausible-sounding answer unsupported by any retrieved document."],"a":[2,4],"w":["An expired TLS certificate is a general infrastructure and security configuration problem. It can affect many types of applications and is not specific to LLM behavior.","A database connection timeout is a generic integration or infrastructure failure. It is not an intrinsic failure mode of the language model itself.","This is an LLM-specific failure mode. Safety systems can sometimes produce over-refusals, where a legitimate request is incorrectly classified as unsafe because of particular words or patterns in the input.","This is a deployment and infrastructure configuration issue, not an intrinsic LLM failure mode.","This is a classic hallucination/grounding failure. An LLM can generate an answer that sounds convincing even when the available source documents do not support the claim. This is particularly important in document-grounded Q&A systems."],"e":"This is an LLM-specific failure mode. Safety systems can sometimes produce over-refusals, where a legitimate request is incorrectly classified as unsafe because of particular words or patterns in the input. This is a classic hallucination/grounding failure. An LLM can generate an answer that sounds convincing even when the available source documents do not support the claim. This is particularly important in document-grounded Q&A systems.","t":"LLM-only bugs: OVER-REFUSAL + HALLUCINATION.","k":["over-refusal","hallucination","LLM failure modes"]},{"id":"ccar-p-24","d":"general","x":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps efore instrumenting the deployment.\nWhich two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces?\n(Select two.)\nEach correct answer presents part of the solution.","o":["Define the metrics and the slices the deployment will monitor across normal and adversarial traffic.","Tune the alert thresholds based on observed normal-state distributions to reduce false positives.","Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.","Build the dashboards that surface metrics across slices at the cadence the team operates on.","Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."],"a":[0,2],"w":["Before instrumentation, you need to determine what you are going to measure. Defining the metrics and relevant slices establishes the observability requirements and ensures the deployment collects meaningful data for both normal and adversarial traffic.","Threshold tuning requires observed operational data. That data generally becomes available only after instrumentation has been implemented and the system has produced baseline measurements.","SLOs establish the target level of service performance and reliability. Defining them before instrumentation ensures the metrics and telemetry collected can be evaluated against meaningful objectives and error budgets.","Dashboards depend on the metrics and telemetry being available. While dashboard requirements can be planned early, building the operational dashboards is normally part of the implementation after the monitoring specifications have been defined.","Runbooks and operational documentation are important, but they should be developed after the monitoring requirements, instrumentation, dashboards, and alerting behavior have been established."],"e":"Before instrumentation, you need to determine what you are going to measure. Defining the metrics and relevant slices establishes the observability requirements and ensures the deployment collects meaningful data for both normal and adversarial traffic. SLOs establish the target level of service performance and reliability. Defining them before instrumentation ensures the metrics and telemetry collected can be evaluated against meaningful objectives and error budgets.","t":"Before instrumenting: define METRICS + SLOs.","k":["metrics","SLOs","error budgets"]},{"id":"ccar-p-25","d":"general","x":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query.\nThe CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy.\nWhich optimization approach should you recommend?","o":["Summarize each filing once at intake and run all subsequent queries against the summary.","Cache the filing as the prompt prefix for reuse across the 14 queries per case.","Index filings in a vector store and retrieve only the relevant passages per query.","Move the workload to a smaller Claude model to reduce the per-token cost paid."],"a":[1],"w":["Summarizing the filing once can reduce the amount of context used later, but it may discard important legal details needed for subsequent attorney questions. For legal filings, losing precise language or specific clauses can reduce response quality.","Caching the repeated filing content as a prompt prefix can reduce the cost associated with repeatedly processing the same large context. Since the same 80,000-token filing is reused across approximately 14 queries, caching is particularly valuable. The implementation can also be designed to keep the filing within Fabrikam's controlled environment and approved data-handling boundaries.","Retrieval can reduce the amount of context sent for each query, but it requires storing and indexing the filing content in a vector store. Given the explicit requirement that filing contents not be stored outside Fabrikam's tenancy, an externally hosted vector store would be unsuitable unless it is explicitly within the required tenancy and security boundary.","A smaller model may reduce cost, but it could also affect response quality, especially for complex legal-document analysis. The requirement specifically calls for preserving quality, so reducing model capability is not the most direct optimization."],"e":"Caching the repeated filing content as a prompt prefix can reduce the cost associated with repeatedly processing the same large context. Since the same 80,000-token filing is reused across approximately 14 queries, caching is particularly valuable. The implementation can also be designed to keep the filing within Fabrikam's controlled environment and approved data-handling boundaries.","t":"Same big doc, many queries = PROMPT CACHING.","k":["prompt caching","prefix","cost"]},{"id":"ccar-p-26","d":"general","x":"When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?","o":["Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager.","Implementation timeline, component interfaces, and deployment sequence for the engineering team.","Threat model, control mappings, residual-risk acceptance criteria, and audit traceability.","Decision rationale, business outcomes, and high-level risk summary for executive review."],"a":[2],"w":["This information is primarily relevant to a product manager. While delivery timelines and scope can matter to security teams, they do not directly address the reviewer's main concerns around security controls, threats, compliance, and auditability.","These details are mainly intended for the engineering implementation team. They explain how the system will be built and deployed but do not provide sufficient evidence about security risks and compliance controls.","This content directly addresses the primary concerns of security and compliance reviewers. They need to understand the threats being considered, which controls mitigate those threats, what residual risks remain, who accepts those risks, and how the decisions can be demonstrated during an audit.","These elements are more appropriate for an executive audience. Executives generally need the decision, business value, and high-level risks rather than detailed control mappings and audit evidence."],"e":"This content directly addresses the primary concerns of security and compliance reviewers. They need to understand the threats being considered, which controls mitigate those threats, what residual risks remain, who accepts those risks, and how the decisions can be demonstrated during an audit.","t":"Security audience = THREATS + CONTROLS + RESIDUAL risk + AUDIT.","k":["threat model","control mapping","audit"]},{"id":"ccar-p-27","d":"general","x":"You are integrating Claude Code into a workflow that runs against a production database.\nWhich guardrail design most directly preserves safety on data-modifying operations?","o":["Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations.","Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation.","Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications.","Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."],"a":[3],"w":["This design provides excessive privileges and removes important safety controls. A production database should not be exposed to unrestricted automated write operations because an unintended action could modify or delete critical data.","A fully privileged credential violates the principle of least privilege. Removing confirmation for write operations also eliminates an important human control over potentially irreversible changes.","Disabling logging removes valuable auditability and observability. Production database operations should generally be traceable so unexpected or unauthorized changes can be investigated.","This provides defense in depth. Read-only credentials establish a safe default, tool scoping limits what the subagent can access, and explicit human confirmation creates an additional control before potentially destructive or consequential operations are performed."],"e":"This provides defense in depth. Read-only credentials establish a safe default, tool scoping limits what the subagent can access, and explicit human confirmation creates an additional control before potentially destructive or consequential operations are performed.","t":"Read-only by default + scoped tools + human OK for writes.","k":["read-only","human confirmation","production database"]},{"id":"ccar-p-28","d":"general","x":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place.\nWhich signal most directly indicates the need for a new design cycle?","o":["A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","A minor copy edit is requested in a customer-facing string within the existing Ul, which can be handled as a localized content change without altering component responsibilities or contracts.","The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."],"a":[3],"w":["This is a documentation-level change. It does not alter the system's architecture, component responsibilities, or contracts, so a new design cycle is unnecessary.","A small alert-threshold adjustment is an operational tuning change. It can be made without revisiting the underlying architecture.","A copy change is a localized content modification and does not require architectural redesign when the existing components and contracts remain unchanged.","This is the clearest signal that the system needs to re-enter the design cycle. Changes to component responsibilities or core contracts affect fundamental architectural decisions and should be evaluated through a new design process rather than handled as routine iteration."],"e":"This is the clearest signal that the system needs to re-enter the design cycle. Changes to component responsibilities or core contracts affect fundamental architectural decisions and should be evaluated through a new design process rather than handled as routine iteration.","t":"Must change RESPONSIBILITIES or CONTRACTS = redesign.","k":["redesign trigger","core contracts"]},{"id":"ccar-p-29","d":"general","x":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted\nBash access to all projects across all developers.\nWhich response is most appropriate?","o":["Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency.","Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add nfiguration complexity, accepting the full attack surface for all engineers across all projects.","Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."],"a":[2],"w":["Expanding unrestricted access does not solve the security problem. It would increase the attack surface and give developers broader capabilities than their workflows require.","Enterprise permissions should follow the principle of least privilege. Configuration complexity is not a sufficient reason to accept unrestricted access to potentially powerful commands.","This is the safest approach. Narrowly scoped permissions ensure Claude Code can perform the required operations without unnecessary privileges. Explicit deny rules provide an additional layer of protection for sensitive commands and operations.","Disabling permissions entirely removes the security boundary and creates an unnecessarily large attack surface. Enterprise deployments require controlled and auditable access."],"e":"This is the safest approach. Narrowly scoped permissions ensure Claude Code can perform the required operations without unnecessary privileges. Explicit deny rules provide an additional layer of protection for sensitive commands and operations.","t":"Narrow ALLOW patterns + explicit DENY rules.","k":["Bash permissions","deny rules","least privilege"]},{"id":"ccar-p-30","d":"general","x":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements:\n(1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\"\n(2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\"\n(3) \"The API integration costs are running 40% over the projected per-transaction budget.\"\n(4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\"\nWhich of the following correctly identifies the primary business value pillar each stakeholder statement represents?","o":["Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4:Performance SLA","Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4:Performance SLA","Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4:Efficiency","Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4:Solution Cost"],"a":[0],"w":["Statement 1 represents Efficiency because the team is processing significantly more purchase orders per analyst, demonstrating improved operational efficiency.\nStatement 2 represents Transformation because the workflow has changed the way work is performed, eliminating a manual role and redeploying employees to a higher-value activity.\nStatement 3 represents Solution Cost because it directly concerns the actual cost of operating the API integration compared with the planned budget.\nStatement 4 represents Performance SLA because the observed 11-second latency is being compared directly against the committed 5-second SLA.","Although Statement 3 and Statement 4 are correctly classified, Statement 2 describes a broader organizational/workflow transformation, not merely an efficiency improvement. The elimination of manual data entry and redeployment of staff represents a change in how the organization operates.","Statement 1 is primarily about efficiency, since it measures purchase orders processed per analyst. Statement 2 represents transformation, while Statement 4 clearly concerns an SLA rather than general efficiency.","This option reverses the classifications for Statements 3 and 4. The 40% cost overrun is a Solution Cost issue, while the 11-second response time versus the 5-second SLA is a Performance SLA issue."],"e":"Statement 1 represents Efficiency because the team is processing significantly more purchase orders per analyst, demonstrating improved operational efficiency.\nStatement 2 represents Transformation because the workflow has changed the way work is performed, eliminating a manual role and redeploying employees to a higher-value activity.\nStatement 3 represents Solution Cost because it directly concerns the actual cost of operating the API integration compared with the planned budget.\nStatement 4 represents Performance SLA because the observed 11-second latency is being compared directly against the committed 5-second SLA.","t":"More per person = EFFICIENCY. Work redesigned = TRANSFORMATION.","k":["business value pillars","efficiency","transformation"]},{"id":"ccar-p-31","d":"general","x":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures.\nWhich two investigative steps most directly isolate the root cause? (Select two.)","o":["Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes.","Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.","Switch to a different Claude model tier to rule out provider-side changes as a contributing factor.","Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.","Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing."],"a":[1,4],"w":["There is no evidence that stale cached prefixes caused the problem. Clearing the cache before establishing a baseline could introduce unnecessary changes and make the investigation harder to isolate.","The problem started immediately after a maintenance window, so comparing the current configuration with the last known good configuration is an effective way to identify changes that may have introduced the malformed JSON behavior.","Changing the model introduces another variable into the investigation. The existing configuration should first be examined to determine whether a maintenance-related configuration change caused the issue.","Output truncation can cause malformed JSON, but there is no evidence that token limits are the cause here. Increasing max_tokens would be a configuration change before the underlying cause is established.","Replaying known premaintenance requests provides a controlled way to compare behavior. Inspecting the raw model output before downstream parsing helps determine whether Claude is producing malformed JSON or whether the problem occurs later in the pipeline."],"e":"The problem started immediately after a maintenance window, so comparing the current configuration with the last known good configuration is an effective way to identify changes that may have introduced the malformed JSON behavior. Replaying known premaintenance requests provides a controlled way to compare behavior. Inspecting the raw model output before downstream parsing helps determine whether Claude is producing malformed JSON or whether the problem occurs later in the pipeline.","t":"Broke after change? DIFF the config + REPLAY old requests.","k":["last known good","replay","malformed JSON"]},{"id":"ccar-p-32","d":"general","x":"You are compiling a diagnostic toolkit for Claude Code operational issues.\nWhich two diagnostic actions belong in the toolkit? (Select two.)\nEach correct answer presents a complete solution.","o":["Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.","File a support ticket with vendor support before any local reproduction or evidence collection.","Reproduce the issue with a minimal reproduction case that isolates one variable at a time.","Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.","List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."],"a":[2,4],"w":["Changing the sampling temperature introduces another variable and can make the system's behavior less consistent. It is not a reliable first-line diagnostic technique for isolating Claude Code operational issues.","Support escalation can be appropriate when internal investigation is insufficient, but you should first reproduce the issue and collect relevant evidence whenever possible. This gives the support team useful diagnostic information.","A minimal reproduction case is a fundamental troubleshooting technique. By reducing the workflow and changing one variable at a time, you can determine which component or configuration is responsible for the failure.","An immediate rollback changes the environment before the issue has been properly characterized. Version comparison can be useful later, but first you should collect evidence and isolate the problem.","MCP servers are important dependencies in Claude Code workflows. Checking the configured servers and their status can quickly identify connection, availability, or configuration problems that may be causing the operational issue."],"e":"A minimal reproduction case is a fundamental troubleshooting technique. By reducing the workflow and changing one variable at a time, you can determine which component or configuration is responsible for the failure. MCP servers are important dependencies in Claude Code workflows. Checking the configured servers and their status can quickly identify connection, availability, or configuration problems that may be causing the operational issue.","t":"Minimal REPRO + check MCP server STATUS.","k":["minimal reproduction","MCP status"]},{"id":"ccar-p-33","d":"general","x":"You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls.\nWhich scenario most directly indicates a data-exfiltration risk?","o":["The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request.","The user submits a routine question and receives a routine answer.","Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL.","The internal-document retrieval tool returns a document that the user is authorized to view."],"a":[2],"w":["This describes a normal, authorized tool interaction. The destination is allow-listed, and the request was initiated by the user for a legitimate purpose. There is no indication that sensitive information is being sent to an unauthorized destination.","A routine question producing a routine answer does not indicate data exfiltration. There is no evidence of unauthorized data access or transmission.","This is a direct data-exfiltration scenario. The retrieved document contains adversarial instructions attempting to manipulate the model into sending sensitive information to an attacker-controlled destination. This is a classic example of indirect prompt injection combined with an outbound tool, creating a serious security risk.","The user is authorized to access the document, so the retrieval itself does not indicate unauthorized disclosure or exfiltration."],"e":"This is a direct data-exfiltration scenario. The retrieved document contains adversarial instructions attempting to manipulate the model into sending sensitive information to an attacker-controlled destination. This is a classic example of indirect prompt injection combined with an outbound tool, creating a serious security risk.","t":"Retrieval + outbound tool + hidden instruction = EXFILTRATION.","k":["data exfiltration","indirect prompt injection"]},{"id":"ccar-p-34","d":"general","x":"After a prompt-template update, several previously passing test cases now produce unexpected outputs.\nWhich test type is specifically designed to detect this category of failure?","o":["Integration tests that validate cross-component pipeline behavior.","Adversarial tests that probe for prompt-injection vulnerabilities.","Regression tests scored against a stable reference set of known-good behavior.","Smoke tests that confirm high-level system availability after the change."],"a":[2],"w":["Integration tests focus on whether multiple components work correctly together. They are useful for detecting interface and integration problems, but this scenario specifically concerns a change causing previously passing cases to behave differently.","Adversarial tests are designed to identify security weaknesses and attack behaviors, such as prompt injection. They are not specifically intended to detect regressions caused by a prompt-template change.","Regression testing compares the current behavior against a stable set of previously validated results. If a prompt-template update causes previously passing test cases to produce unexpected outputs, regression tests can identify those unintended changes.","Smoke tests primarily verify that the system's basic functionality and availability remain intact after a change. They generally do not provide detailed comparison against previously known-good outputs."],"e":"Regression testing compares the current behavior against a stable set of previously validated results. If a prompt-template update causes previously passing test cases to produce unexpected outputs, regression tests can identify those unintended changes.","t":"Used to pass, now fails = REGRESSION test.","k":["regression tests","reference set"]},{"id":"ccar-p-35","d":"general","x":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request.\nWhich optimization most directly targets the dominant cost driver?","o":["Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","Add additional repeated content to the system prompt to give the model more guidance.","Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."],"a":[2],"w":["Increasing retrieval depth adds even more tokens to each request. Since the current cost is already dominated by large retrieved context, this would increase the primary cost driver rather than optimize it.","Adding more repeated content makes the system prompt larger and increases token usage. It directly works against the goal of reducing the dominant prompt-related cost.","This approach directly addresses both major cost drivers. Caching the repeated system prompt reduces the cost of repeatedly processing identical prefix content, while trimming retrieval to only relevant passages reduces the number of context tokens processed for each request.","Using a heavier model generally increases inference cost and resource consumption. It does not address the repeated system prompt or excessive retrieved context that are causing the current cost problem."],"e":"This approach directly addresses both major cost drivers. Caching the repeated system prompt reduces the cost of repeatedly processing identical prefix content, while trimming retrieval to only relevant passages reduces the number of context tokens processed for each request.","t":"Cache the repeated PREFIX, TRIM the retrieval.","k":["prompt caching","trim context","cost driver"]},{"id":"ccar-p-36","d":"general","x":"You are designing a feedback session for a deployment in flight.\nWhich structure best supports productive stakeholder feedback?","o":["Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.","Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.","Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real timewithout preparation before the discussion begins.","End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."],"a":[1],"w":["An unstructured meeting makes it difficult to keep the discussion focused and can lead to unclear decisions and missing follow-up actions. Relying on memory also increases the chance that important commitments will be lost.","This creates a structured and accountable feedback process. Sharing materials beforehand gives stakeholders time to prepare, while documenting decisions, owners, and deadlines ensures that feedback turns into clear, trackable actions.","Providing materials only at the start leaves stakeholders with insufficient preparation time. This can reduce the quality of discussion and make it harder to reach informed decisions efficiently.","Without written decisions and assigned owners and dates, accountability becomes unclear. Effective stakeholder feedback should produce documented, actionable outcomes."],"e":"This creates a structured and accountable feedback process. Sharing materials beforehand gives stakeholders time to prepare, while documenting decisions, owners, and deadlines ensures that feedback turns into clear, trackable actions.","t":"Agenda + pre-reads + written decisions + owners/dates.","k":["feedback session","action owners"]},{"id":"ccar-p-37","d":"general","x":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair.\nWhich two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.","o":["Approval rate parity does not by itself assess error rate parity across protected groups.","Match with human underwriters does not establish freedom from underwriter-introduced bias.","The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.","The fairness team's review process likely missed at least some of the protected groups studied.","A larger sample is needed before any meaningful fairness claim can be made about the model."],"a":[0,1],"w":["Equal or similar approval rates do not necessarily mean the system performs equally well across groups. A proper fairness assessment should also consider error patterns, such as false positives and false negatives, across protected groups.","A 94% match with human decisions only shows that the assistant agrees with the existing decision process. If human underwriters have existing biases, the model could reproduce those biases rather than eliminate them.","Agreement with human decisions measures consistency, not fairness. High agreement alone cannot establish that the decisions are unbiased or equitable.","There is no evidence that the fairness team omitted protected groups. This conclusion cannot be drawn from the information provided.","Sample size can affect statistical confidence, but the key issue here is that approval-rate parity and agreement with humans are insufficient fairness measures even when the sample is large."],"e":"Equal or similar approval rates do not necessarily mean the system performs equally well across groups. A proper fairness assessment should also consider error patterns, such as false positives and false negatives, across protected groups. A 94% match with human decisions only shows that the assistant agrees with the existing decision process. If human underwriters have existing biases, the model could reproduce those biases rather than eliminate them.","t":"Same approvals != same errors. Matching humans can copy their bias.","k":["fairness","error rate parity","human bias"]},{"id":"ccar-p-38","d":"general","x":"You are an architect supporting the iteration phase of a deployed Claude-based system.\nWhich activity most directly fits this phase?","o":["Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed.","Stop measuring production outcomes once the deployment has successfully launched, treating the go-live milestone as the end of the evaluation and iteration cycle.","Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes.","Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework."],"a":[3],"w":["Iteration does not mean rebuilding the entire system every cycle. Changes should be evidence-driven, based on production results, evaluations, and stakeholder feedback.","Deployment is not the end of evaluation. Production monitoring and ongoing evaluation are essential for identifying performance issues, quality changes, and opportunities for improvement.","The evaluation framework and reference set provide a consistent baseline for measuring whether changes improve or degrade the system. They should be maintained throughout iteration.","This directly reflects an evidence-driven iteration cycle. Production telemetry, output evaluations, and stakeholder feedback reveal where improvements are most valuable. The proposed change can then be evaluated against the existing framework to measure its impact."],"e":"This directly reflects an evidence-driven iteration cycle. Production telemetry, output evaluations, and stakeholder feedback reveal where improvements are most valuable. The proposed change can then be evaluated against the existing framework to measure its impact.","t":"Iterate on EVIDENCE: telemetry + evals + feedback.","k":["iteration","telemetry","evaluation framework"]},{"id":"ccar-p-39","d":"general","x":"You are explaining the precedence of Claude Code configuration scopes to the team.\nWhich precedence ordering, from highest to lowest, is correct?","o":["Local # managed # user # command-line arguments # project","Project # user # managed # local # command-line arguments","Managed # command-line arguments # local # project # user","User # project # local # command-line arguments # managed"],"a":[2],"w":["This ordering places local configuration above managed and command-line settings. It does not reflect the intended precedence hierarchy for Claude Code configuration.","Project configuration is not the highest-precedence scope in this ordering. This option also places command-line arguments too low.","This ordering correctly places the scopes from highest to lowest precedence:\nManaged → Command-line arguments → Local → Project → User\nThis precedence determines which configuration takes effect when settings from multiple scopes apply to the same behavior.","This reverses the hierarchy by placing user scope above managed configuration and puts managed configuration at the lowest level."],"e":"This ordering correctly places the scopes from highest to lowest precedence:\nManaged → Command-line arguments → Local → Project → User\nThis precedence determines which configuration takes effect when settings from multiple scopes apply to the same behavior.","t":"M-C-L-P-U: 'My Company Locks Personal Use'.","k":["scope precedence","managed","user"]},{"id":"ccar-p-40","d":"general","x":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents.\nWhich mitigation is most directly targeted at this failure mode?","o":["Constrain responses to source-supported content, require citations, and add a verification step.","Score each new model version against a stable adversarial evaluation set.","Replace the shared API key with per-user Auth tokens to restrict data access.","Treat retrieved data as untrusted and apply input classifiers at ingestion time."],"a":[0],"w":["This directly addresses grounding failures and hallucinated claims. Restricting the response to information supported by retrieved sources, requiring citations, and adding verification helps prevent unsupported information from reaching users.","This is an excellent model-upgrade evaluation practice, but it primarily helps detect whether a new version introduces regressions. It does not directly mitigate the immediate problem of unsupported claims in production responses.","Per-user authentication improves access control and accountability, but it does not directly prevent the model from generating claims that are unsupported by retrieved documents.","Input classification can help address malicious or adversarial content, such as prompt injection in retrieved documents. However, the specific failure described is unsupported generation after a model upgrade, so source-grounding and verification controls are more directly targeted."],"e":"This directly addresses grounding failures and hallucinated claims. Restricting the response to information supported by retrieved sources, requiring citations, and adding verification helps prevent unsupported information from reaching users.","t":"Unsupported claims = constrain to SOURCES + CITE + VERIFY.","k":["grounding","citations","verification"]},{"id":"ccar-p-41","d":"general","x":"You are distinguishing functional from non-functional requirements during discovery.\nWhich item is a non-functional requirement?","o":["The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","The system must produce a draft response that a human reviewer can edit before sending.","The system must classify inbound tickets into a defined set of categories.","The system must respond at p95 latency under 800 milliseconds at the expected request volume."],"a":[3],"w":["This describes what the system must do: extract specific invoice fields and populate another record. That is a functional requirement.","This specifies a system capability or behavior: generating an editable draft for human review. Therefore, it is a functional requirement.","Ticket classification describes what the system is required to perform, making it a f
