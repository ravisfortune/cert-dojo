.","o":["AI Summaries with Copilot - The Account Reconciliation agent","Agent management - Collections coordinator summary","The Supplier Communication agent - Analyze demand plans with Copilot","AI Summaries with Copilot - Collections coordinator summary"],"a":[3],"e":"AI Summaries with Copilot help staff spot overdue vendor invoices and balances. The Collections coordinator summary pulls together the data that speeds up review of overdue invoices and payment history.","t":"Spot overdue = AI Summaries. Faster collections review = Collections coordinator summary.","k":["AI Summaries","Collections coordinator summary","overdue invoices"]},{"id":"ab-100-55","d":"agentic-ai","x":"You are designing two Microsoft Copilot Studio agents named Agent1 and Agent2. Each agent must meet the following requirements: Each agent must use a standard model. Each agent must NOT use generative orchestration. Agent1 must support simple and short phrases for a given topic. Agent2 must integrate with Microsoft Dynamics 365 Contact Center voice channel. You need to recommend language models for the agents. What should you recommend for each agent? To answer, drag the appropriate language models to the correct agents. Each language model may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","o":["Agent1: Natural language understanding + (NLU+) - Agent2: Conversational language understanding (CLU)","Agent1: Natural language understanding (NLU) - Agent2: Natural language understanding + (NLU+)","Agent1: Conversational language understanding (CLU) - Agent2: Natural language understanding (NLU)","Agent1: Azure OpenAI - Agent2: Natural language understanding + (NLU+)"],"a":[1],"e":"Agent1 handles short, simple phrases for one topic without generative orchestration, so NLU is enough. Agent2 runs on the Dynamics 365 Contact Center voice channel, which needs the more advanced NLU+.","t":"Simple text = NLU. Voice in Contact Center = NLU PLUS.","k":["NLU","NLU+","voice channel","Contact Center"]},{"id":"ab-100-56","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company uses Microsoft 365 and Dynamics 365. You need to recommend a solution to automatically summarize email threads, generate suggested replies in Microsoft Outlook, and provide meeting preparation summaries that include relevant customer relationship management (CRM) data. Solution: You recommend a Microsoft 365 Copilot agent template. Does this meet the goal?","o":["No","Yes"],"a":[0],"e":"No. A generic Microsoft 365 Copilot agent template does not guarantee the dedicated Dynamics 365 CRM integration for meeting prep and sales support. Microsoft 365 Copilot for Sales is the right fit.","t":"Sales + CRM + Outlook needs Copilot for SALES, not a generic template.","k":["Copilot for Sales","agent template","No"]},{"id":"ab-100-57","d":"agentic-ai","x":"A manufacturing company wants to deploy an agent that will automate supplier invoice processing. You are designing a solution to evaluate the financial implications of the deployment. The company is especially concerned about budget overruns. You need to ensure that the solution considers the total cost of ownership (TCO), the expected savings from using automation, and whether to extend the existing AI capabilities. What should you include in the design?","o":["A return on AI investment (ROAI) analysis","A break-even analysis only","Training a custom model","Adopting prebuilt agents to reduce the deployment time"],"a":[0],"e":"An ROAI analysis covers total cost of ownership, expected savings from automation and whether to extend existing AI capabilities. Break-even analysis only finds the breakeven point, and the other options are technical choices, not financial evaluations.","t":"TCO + savings + reuse = full ROAI analysis.","k":["ROAI","TCO","savings"]},{"id":"ab-100-58","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company uses Microsoft 365 and Dynamics 365. You need to recommend a solution to automatically summarize email threads, generate suggested replies in Microsoft Outlook, and provide meeting preparation summaries that include relevant customer relationship management (CRM) data. Solution: You recommend a classic Microsoft Dataverse workflow. Does this meet the goal?","o":["No","Yes"],"a":[0],"e":"No. A classic Dataverse workflow is rule-based automation with no generative AI, so it cannot summarize email threads or draft replies. Microsoft 365 Copilot for Sales is the right fit.","t":"Classic workflow = no AI. No.","k":["classic workflow","Copilot for Sales","No"]},{"id":"ab-100-59","d":"agentic-ai","x":"A company uses Microsoft Dynamics 365 to manage service operations. Dispatchers coordinate service requests, and technicians perform scheduled on-site work. You need to design a solution that will use Microsoft Copilot to improve the efficiency of the service operations. The solution must meet the following requirements: Provide AI-driven assistance to help staff organize and resolve work orders. Deliver contextual AI support to frontline workers as they prepare for and complete customer appointments. Which two components should you include in the design? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["The Dynamics 365 Field Service mobile app","Copilot in Customer Service","Copilot in Outlook","Copilot Service workspace","Dynamics 365 Customer Service","Copilot in Field Service"],"a":[0,5],"e":"Copilot in Field Service helps dispatchers organize, summarize and resolve work orders. The Field Service mobile app gives frontline technicians contextual AI help as they prepare for and complete appointments.","t":"Work orders + frontline = everything FIELD Service.","k":["Copilot in Field Service","Field Service mobile app","work orders"]},{"id":"ab-100-60","d":"agentic-ai","x":"You need to design a shared prompt library that will be used across multiple business units. The solution must meet the following requirements: Ensure consistent AI responses with reusable formats. Support governance and version control. Minimize administrative effort. Minimize ongoing costs. What should you recommend for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Maintain a prompt history - Define standardized prompt templates.","Delegate department-specific prompt templates - Store prompts in a Git repository.","Define standardized prompt templates - Store prompts in a Git repository.","Define standardized prompt templates - Categorize prompts by business function."],"a":[2],"e":"Standardized prompt templates give consistent responses with reusable formats. A Git repository gives governance and version control at low admin effort and cost, compared with building a custom system.","t":"Consistency = templates. Versioning = Git.","k":["prompt templates","Git","version control"]},{"id":"ab-100-61","d":"agentic-ai","x":"A company extends Copilot in Microsoft Dynamics 365 Customer Service. You need to recommend an automated application lifecycle management (ALM) process so that the Copilot components can be safely developed, tested, and promoted to production. Which two actions should you include in the ALM process? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["Use Microsoft Power Platform pipelines.","Include the components in a solution.","Store the agent transcripts in source control.","Use an unmanaged solution in production.","Rebuild the agents in each environment."],"a":[0,1],"e":"Power Platform pipelines automate safe deployment between Dev, Test and Production. Copilot components must be packaged in a solution to move through ALM. Never use unmanaged in production or rebuild agents by hand.","t":"ALM = put it in a SOLUTION, ship with PIPELINES.","k":["Power Platform pipelines","solution","ALM"]},{"id":"ab-100-62","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a team that analyzes its customers by using a manual process. You are designing an AI-based agent to automate and improve the process. You need to recommend on which platform to build the agent. The solution must use generative AI to answer common questions, provide analytics to review AI performance, identify customer demographics, and minimize custom development. Solution: You recommend Microsoft Copilot Studio. Does this meet the goal?","o":["No","Yes"],"a":[1],"e":"Yes. Copilot Studio supports generative answers, built-in analytics for agent performance, CRM data connections for demographics, and is low-code to minimize custom development.","t":"Gen AI + analytics + low-code = Copilot Studio. Yes.","k":["Copilot Studio","analytics","low-code","Yes"]},{"id":"ab-100-63","d":"agentic-ai","x":"A company has Microsoft Power Platform development, staging, and production environments. Each environment has its own Microsoft Dataverse tables and Azure AI Search index. You are designing an application lifecycle management (ALM) process to deploy a Microsoft Copilot Studio agent named Agent1. Agent1 uses a Dataverse table named CustomerOrders and an Azure AI Search index named customer-knowledge. You need to deploy Agent1 to production while using production grounding data sources, minimizing downtime, and handling credentials and endpoints securely. What should you include in the deployment package solution, and what should you reconfigure after deployment?","o":["The data sources only - The Agent1 configuration","Agent1, the data sources, and the data source connections - The environment variables","Agent1 and references to the data sources - The environment variables","Agent1 only - The Dataverse connection only"],"a":[2],"e":"Package Agent1 with references to the data sources, not the physical production tables or indexes. After deployment, set environment variables to point at production endpoints and connections without hard-coding credentials.","t":"Ship REFERENCES, then set ENVIRONMENT VARIABLES.","k":["environment variables","references","deployment"]},{"id":"ab-100-64","d":"agentic-ai","x":"A company plans to deploy a Microsoft Foundry agent. You need to recommend an application lifecycle management (ALM) process to ensure that the agent evaluates against baseline accuracy metrics before being deployed. What should you recommend?","o":["Enable Application Insights and use Azure Monitor.","Use Observability in Foundry Control Plane with evaluation and drift monitoring.","Configure GitHub Actions for new agent versions.","Deploy each new agent version directly to production."],"a":[1],"e":"Observability in Foundry Control Plane with evaluation and drift monitoring checks the agent against baseline metrics before deployment and tracks quality drift over time. GitHub Actions is generic CI/CD, and App Insights monitors runtime.","t":"Evaluate before deploy = Foundry Observability + evaluation.","k":["Foundry Control Plane","evaluation","drift monitoring"]},{"id":"ab-100-65","d":"agentic-ai","x":"A company has an AI business solution that uses Microsoft Copilot Studio agents. You need to recommend prompt best practices to improve the effectiveness of agent interactions. Which two actions should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["Measure system resource usage during prompt processing.","Track the duration of the average user session.","Analyze the prompt length distribution.","Use clear and specific instructions in the prompts.","Regularly test and refine the prompts based on user input."],"a":[3,4],"e":"Prompts should give clear, specific instructions to reduce ambiguity. Test and refine prompts regularly based on user input in a continuous improvement loop. The other options are operational metrics, not prompt practices.","t":"Be specific + keep refining.","k":["clear instructions","iterate","prompt best practices"]},{"id":"ab-100-66","d":"agentic-ai","x":"You need to recommend a security solution for agents in a Microsoft Power Platform environment. The agents must use only approved connectors and services. The solution must prevent the agents from accessing sensitive data. What should you recommend?","o":["Configure Azure Monitor to capture connector activity logs.","Enable a Microsoft Dataverse audit.","Deploy data loss prevention (DLP) policies in Power Platform.","Enable customer-managed keys in Microsoft Dataverse."],"a":[2],"e":"Power Platform DLP policies let admins classify, allow or block connectors, so agents only use approved services and cannot reach sensitive data. Azure Monitor and audits only log, and customer-managed keys only encrypt.","t":"Approved connectors only = DLP policy.","k":["DLP","connectors","Power Platform"]},{"id":"ab-100-67","d":"agentic-ai","x":"A company has a Microsoft Foundry agent that summarizes customer feedback and recommends products to customers. The agent references data from multiple knowledge sources. Users report that the agent response time is slow, and telemetry shows that the agent frequently reaches its token usage limit. You need to reduce token usage without degrading the quality of generated responses. What should you recommend?","o":["Chunk documents during indexing.","Reduce the number of knowledge sources used by the agent.","Lower the maximum token usage limit for the responses.","Reconfigure the prompts to limit the amount of retrieved content from the knowledge sources."],"a":[3],"e":"Limiting how much content is retrieved from knowledge sources through the prompt reduces input tokens and speeds up responses while keeping needed sources. Fewer sources may hurt quality and a lower token limit makes things worse.","t":"Token limit hit? Retrieve LESS, not fewer sources.","k":["token usage","retrieved content","prompt"]},{"id":"ab-100-68","d":"agentic-ai","x":"A company has Microsoft 365 Copilot agents. You need to design a security solution for the agents. The solution must identify and mitigate potential risks related to AI use, protect AI apps and sensitive data processed or generated by the agents, and support responsible AI governance by retaining and logging interactions, detecting policy violations, and investigating incidents. Which two components should you include in the design? NOTE: Each correct selection is worth one point.","o":["Microsoft Purview","Azure AI Content Safety","Role-based access control (RBAC) in Microsoft Foundry","Microsoft Defender"],"a":[0,3],"e":"Microsoft Purview handles AI governance, sensitive data protection, retention and logging of interactions, policy violation detection and investigations. Microsoft Defender protects AI apps and detects and mitigates AI risks. Content Safety only filters harmful content.","t":"Govern + log = Purview. Protect + detect threats = Defender.","k":["Microsoft Purview","Microsoft Defender","AI governance"]},{"id":"ab-100-69","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a Microsoft Dynamics 365 Sales environment that has Microsoft Copilot enabled. You need to customize Copilot by tailoring how opportunity summaries are generated or how they are presented to users. Solution: You build Microsoft Power Automate flows to trigger customized Copilot summaries. Does this meet the goal?","o":["NO","YES"],"a":[0],"e":"No. Power Automate automates workflows like notifications or data updates, but it does not change Copilot's prompt, summary logic or presentation in Dynamics 365 Sales.","t":"Flows automate tasks, they don't reshape Copilot summaries. No.","k":["Power Automate","opportunity summary","No"]},{"id":"ab-100-70","d":"agentic-ai","x":"A company has an AI solution that uses a Microsoft Copilot Studio agent. You need to monitor the agent's performance. The solution must monitor the agent's telemetry in near-real-time (NRT), download transcripts of full conversations, and monitor the agent's usage and performance. What should you use for each requirement? You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","o":["Monitor telemetry in NRT: Application Insights; Download full conversation transcripts: Microsoft Power Apps; Monitor usage and performance: Copilot Studio","Monitor telemetry in NRT: Application Insights; Download full conversation transcripts: Copilot Studio; Monitor usage and performance: Microsoft Power Apps","Monitor telemetry in NRT: Log Analytics; Download full conversation transcripts: Microsoft Power Apps; Monitor usage and performance: Copilot Studio","Monitor telemetry in NRT: Log Analytics; Download full conversation transcripts: Copilot Studio; Monitor usage and performance: Application Insights"],"a":[0],"e":"Application Insights gives near-real-time telemetry. Power Apps (or the admin center) can export the ConversationTranscript table with full conversations. Copilot Studio Analytics shows usage and performance.","t":"Live = App Insights. Transcripts = Power Apps table. Usage = Studio.","k":["Application Insights","ConversationTranscript","Copilot Studio analytics"]},{"id":"ab-100-71","d":"agentic-ai","x":"Contoso requires the CEO to perform a quarterly assessment of AI solutions. The assessment must use Microsoft-recommended tools and verify reliability, interpretability, fairness, and compliance. What should you recommend to assist the CEO with these responsibilities?","o":["The Microsoft Service Trust Portal","Compliance Center","Microsoft Purview","The Responsible AI dashboard","Microsoft Foundry Tools"],"a":[3],"e":"The Responsible AI dashboard assesses reliability, interpretability, fairness and compliance. Service Trust Portal shows Microsoft certifications, Purview handles data governance, and Compliance Center is broad enterprise compliance.","t":"Fairness + interpretability = Responsible AI dashboard.","k":["Responsible AI dashboard","fairness","interpretability"]},{"id":"ab-100-72","d":"agentic-ai","x":"A company uses multiple Microsoft Copilot Studio agents across different channels. You need to recommend a monitoring solution that provides comprehensive telemetry data and performance insights for the agents. What should you include in the recommendation?","o":["Microsoft Purview","Application Insights","Log Analytics","Microsoft Dynamics 365 Customer Voice"],"a":[1],"e":"Copilot Studio integrates with Application Insights to capture detailed telemetry such as messages, triggered topics, errors and performance across channels. Log Analytics stores and queries logs, Customer Voice is surveys, and Purview is governance.","t":"Telemetry + performance = Application Insights.","k":["Application Insights","telemetry","multi-channel"]},{"id":"ab-100-73","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio agent that uses generative AI to assist Microsoft Dynamics 365 Customer Service representatives. The agent currently exhibits a low resolution rate and a high escalation rate. You need to identify the issue. What should you use?","o":["The Insights tab from the Search & intelligence settings of the Microsoft 365 admin center","The Agent dashboard of Dynamics 365 Customer Service historical analytics","The Analytics tab in Copilot Studio","The Copilot hub in the Power Platform admin center"],"a":[2],"e":"The Analytics tab in Copilot Studio shows resolution rate and escalation rate drivers, so you can find which topics, prompts or knowledge sources cause failures. Other dashboards do not analyze Copilot Studio conversations in depth.","t":"Studio agent problem? Check Studio ANALYTICS.","k":["Analytics tab","resolution rate","escalation rate"]},{"id":"ab-100-74","d":"agentic-ai","x":"A company has an AI agent that automates the review of customer feedback stored in a cloud database. You plan to generate monthly reports from the agent's output to provide insights into customer sentiment and guide product development and marketing. You need to ensure that the data ingested by the agent is clean and suitable for the intended use. What should you do to prepare the data?","o":["Translate the data into a single language.","Identify and address biased data.","Sort the database by customer last name.","Ensure that the size of the database does not exceed 100 GB."],"a":[1],"e":"Check customer feedback data for bias so the dataset is representative and sentiment results are trustworthy. Size limits, translation or sorting by name do not fix data quality or fairness.","t":"Clean for insights = fix BIAS (again!).","k":["biased data","data quality"]},{"id":"ab-100-75","d":"agentic-ai","x":"A company has a canvas app named App1 in a Microsoft Power Platform environment named Env1. Env1 uses a customer-managed key for data encryption. App1 connects to multiple data sources to retrieve and update customer and order information. You need to recommend a solution to add Microsoft Copilot components to App1 without modifying the current security or encryption configurations of Env1. What should you include in the recommendation?","o":["Move App1 to a new environment that uses Microsoft-managed keys.","Modify the data sources of App1 to make them compatible with Copilot.","Enable Copilot features for Env1.","Duplicate App1 and republish the app in Env1."],"a":[2],"e":"Enable Copilot features for Env1. This is the prerequisite for adding Copilot components to a canvas app and does not change the customer-managed key or security setup.","t":"Don't move, don't copy. Just ENABLE Copilot.","k":["enable Copilot","customer-managed key","canvas app"]},{"id":"ab-100-76","d":"agentic-ai","x":"Contoso has identified analysis, reporting, and troubleshooting requirements for its Copilot Studio agents. The CFO wants to identify how many interactions are abandoned on a given day compared to resolved conversations, to assess Copilot Studio credit usage. The CTO wants to track user feedback on the quality of AI agent responses; consistently poor feedback will trigger reengineering. Which Copilot Studio analytics metrics should you recommend for each executive?","o":["Use - Effectiveness","Effectiveness - Tool use","Use - Satisfaction","Satisfaction - Effectiveness"],"a":[2],"e":"The Use metrics show session volume and outcomes like abandoned versus resolved, which helps the CFO assess credit usage. Satisfaction metrics reflect user feedback on answer quality, which the CTO needs.","t":"CFO counts USE. CTO cares about SATISFACTION.","k":["Use","Satisfaction","Copilot Studio analytics"]},{"id":"ab-100-77","d":"agentic-ai","x":"You need to recommend a solution for integrating a Microsoft Copilot agent with a Microsoft Dynamics 365 Contact Center chat channel. The agent must answer customer inquiries and seamlessly transfer the conversation to a live customer service representative whenever the customer requests escalation. What should you recommend?","o":["Configure the Escalate topic","Build an agent flow","Configure the Conversation Start topic","Configure a skill","Call a Microsoft Power Automate connector"],"a":[0],"e":"The Escalate topic hands the conversation from the Copilot agent to a live representative and connects with Dynamics 365 Customer Service or Contact Center, passing the conversation context along.","t":"Customer wants a human = ESCALATE topic.","k":["Escalate topic","live agent","Contact Center"]},{"id":"ab-100-78","d":"agentic-ai","x":"You are evaluating a Microsoft Copilot Studio agent that supports Microsoft Dynamics 365 Customer Service representatives. You need a testing solution that evaluates agent effectiveness during active sessions, validates accurate and helpful responses, and provides measurable, actionable insights for continuous improvement. What should you recommend?","o":["Measure uptime and page load times.","Perform load testing to validate how the agent scales under a high chat volume.","Track resolution, deflection, and accuracy by using dashboards and use scripts to ensure consistent responses.","Review historical tickets to find agents that have the shortest resolution times."],"a":[2],"e":"Dashboards that track resolution, deflection and accuracy measure effectiveness and answer quality, and test scripts check consistent responses across scenarios. Load tests, uptime and historical ticket times measure infrastructure, not answer quality.","t":"Measure quality: resolution + deflection + accuracy.","k":["resolution","deflection","accuracy","dashboards"]},{"id":"ab-100-79","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a team that analyzes its customers by using a manual process. You are designing an AI-based agent to automate and improve the process. The solution must use generative AI to answer common questions, provide analytics to review AI performance, identify customer demographics, and minimize custom development. Solution: You recommend Microsoft Security Copilot. Does this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. Security Copilot is built for cybersecurity work like incident investigation and threat analysis. It is not a low-code platform for customer analysis agents.","t":"Security Copilot = security only. No.","k":["Security Copilot","No"]},{"id":"ab-100-80","d":"agentic-ai","x":"You are creating validation criteria for a custom generative AI model that produces business reports based on internal enterprise data. You need to assess whether the model's outputs are appropriate and meaningful for the business reports. Which metric should you use?","o":["Alignment of the output to domain-specific tasks","The number of active users interacting with the model","The average system resource usage during inference","The model training duration"],"a":[0],"e":"Alignment of outputs to domain-specific tasks tells you whether AI-generated reports are relevant, accurate and meaningful for real business work. User counts, resource use and training time are usage or infrastructure metrics.","t":"Meaningful for business = ALIGNED to domain tasks.","k":["domain alignment","output quality"]},{"id":"ab-100-81","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio agent that provides answers based on a knowledge base for customer support. Users report that, occasionally, the agent provides inaccurate answers. You need to use metrics from the Analytics tab in Copilot Studio to identify the cause of the inaccuracies. Which two options should you use?","o":["Survey results","Engagement, resolution, and escalation rates","Session information and session outcomes","Quality of generated answers","Topic usage and topics with low resolution"],"a":[3,4],"e":"Topic usage and topics with low resolution show which topics trigger but fail to resolve, pointing to where answers go wrong. Quality of generated answers directly rates answers built from the knowledge base. Surveys and overall rates do not show the cause.","t":"Find inaccuracy: WHICH topics fail + HOW GOOD answers are.","k":["quality of generated answers","topics with low resolution"]},{"id":"ab-100-82","d":"agentic-ai","x":"A company deploys a Microsoft Copilot Studio agent that integrates with a Microsoft Power Automate desktop flow. You need to recommend a testing solution that meets the following requirements: test cases must validate the most recent changes to the agent before the agent is released, and the flow must be validated as part of the agent's orchestration. What should you recommend for each requirement?","o":["Run tests against the production version of the agent. Add the flow to the agent as a tool.","Publish the agent to a channel and test the agent on live users. Use the Power Automate for desktop console.","Run tests against the latest unpublished version of the agent. Add the flow to a canvas app.","Run tests against the latest unpublished version of the agent. Add the flow to the agent as a tool"],"a":[3],"e":"Test the latest unpublished version so the newest changes are validated before release. Add the desktop flow to the agent as a tool so it is tested as part of the agent's orchestration.","t":"Test UNPUBLISHED latest + flow as a TOOL.","k":["unpublished version","flow as tool","testing"]},{"id":"ab-100-83","d":"agentic-ai","x":"A company has Microsoft Copilot Studio agents and plans to deploy custom connectors across development, test, and production environments. You need to design an application lifecycle management (ALM) process to ensure consistency and prevent direct editing in production. Which two actions should you include in the design? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["Deploy managed solutions to production.","Include agents and connectors in a solution.","Deploy unmanaged solutions to production.","Move the agents between the environments by using data export and import.","Manually rebuild the agents in each environment."],"a":[0,1],"e":"Put agents and custom connectors in one solution to manage and deploy them consistently. Deploy managed solutions to production to lock components and prevent direct edits.","t":"Solution + Managed = consistent and locked.","k":["solution","managed solution","ALM"]},{"id":"ab-100-84","d":"agentic-ai","x":"A company has multiple AI models that support generation of sales transactions. Each release of the models must be reviewed by a security and compliance team before being deployed to the production environment. The security and compliance team must have access to prior versions to properly determine potential exposures introduced. You need to recommend a solution to evaluate the impact of each deployment to production. The solution must enhance business continuity. What should you recommend?","o":["Establish a promotion process by using a quality gate.","Implement version control for all the AI system components.","Create a central model registry that uses version history.","Track model retirement schedules to prevent service disruptions."],"a":[2],"e":"A central model registry with version history keeps every model version, so the security team can compare older versions and assess new exposures before production. Quality gates, generic version control and retirement schedules do not give this.","t":"Need old model versions for review = Model REGISTRY with history.","k":["model registry","version history","business continuity"]},{"id":"ab-100-85","d":"agentic-ai","x":"A company has an AI solution named Solution1 deployed to production. Solution1 uses an Azure OpenAI model to generate marketing emails for existing customers. During an internal review, you identify that Solution1 creates different emails depending on customers' traits. You need to recommend a strategy to mitigate the bias. The strategy must adhere to Microsoft responsible AI principles. What should you recommend?","o":["Retrain the model by using a larger dataset.","Modify the system instructions of Solution1.","Modify the contents of the training dataset.","Modify Solution1 to randomly generate emails for different traits."],"a":[2],"e":"Bias usually comes from unbalanced or prejudiced training data. Fix the root cause by reviewing, cleaning and balancing the training dataset. Changing the system prompt or randomizing output only treats symptoms, and more data without better quality does not help.","t":"Bias lives in the DATA. Fix the dataset.","k":["bias","training dataset","responsible AI"]},{"id":"ab-100-86","d":"agentic-ai","x":"A company uses multiple Microsoft Copilot Studio agents across different channels. You need to recommend a monitoring solution that provides comprehensive telemetry data and performance insights for the agents. What should you include in the recommendation?","o":["Application Insights","Azure DevOps","Microsoft Dynamics 365 Customer Voice","Azure Advisor"],"a":[0],"e":"Copilot Studio integrates with Application Insights to collect detailed telemetry such as messages, triggered topics and errors, with performance analysis across channels. Azure Advisor optimizes infrastructure, DevOps handles CI/CD, and Customer Voice is surveys.","t":"Telemetry for Studio agents = Application Insights.","k":["Application Insights","telemetry"]},{"id":"ab-100-88","d":"agentic-ai","x":"CASE STUDY — This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. You must reference the information provided in the case, and you cannot return to the case study after leaving it. Overview — Contoso, Ltd. is a high-tech manufacturing company that uses Microsoft Dynamics 365 Finance, Dynamics 365 Supply Chain Management, and Dynamics 365 Commerce for its North American operations. The company designs and develops innovative products with patents and proprietary technologies that are closely guarded secrets. Contoso wants to adopt AI solutions to scale in preparation for rapid growth and has multiple legal entities and Azure subscriptions. AI Adoption — The CTO must select one Dynamics 365 Finance, Dynamics 365 Supply Chain Management or Dynamics 365 Commerce prebuilt AI agent and one custom Microsoft Copilot Studio AI agent to prioritize and deploy. The CIO must ensure that appropriate security labels are assigned to data used by the AI agents. The CFO analyzes ROI, the CISO discovers and inventories AI resources for auditing, and the CEO ensures that all solutions adhere to industry-standard responsible AI practices. All AI initiatives and agents must have a detailed business use case, a defined audience profile, and an estimated ROI. The R&D department already has a custom Model Context Protocol (MCP) server containing comprehensive product specifications and compliance data. Prebuilt AI Agent — The CTO has not selected which prebuilt AI agent to use in Dynamics 365 Supply Chain Management and wants to view available agent templates to identify which agent will add the most business value. Custom AI Agent — The custom AI agent must use data from Dynamics 365 Supply Chain Management to answer questions for the manufacturing team as a low-code solution, be accessible from Microsoft Teams, eventually connect to other agents selected by description, select topics based on a description of the query rather than a trigger phrase, answer questions about R&D product specifications using existing technologies, integrate with and be accessible from Dynamics 365 Supply Chain Management, and use Dynamics 365 Supply Chain Management business logic stored outside the application. Analysis, Reporting, and Troubleshooting — The CISO will audit all AI solutions monthly for compliance and security. The CFO will analyze estimated ROI against actual measured efficiencies and adoption quarterly using the Copilot Studio agent usage estimator. The CISO wants to identify how much sensitive data was accessed for a given AI agent run and who accessed it. The CTO wants to track user feedback on the quality of AI agent responses. The CEO wants a quarterly assessment using Microsoft-recommended tools that verify reliability, interpretability, fairness, and compliance. The CFO wants to compare abandoned interactions with resolved conversations to assess Copilot Studio credit usage. What should you include in the custom AI agent design to meet the R&D product specifications and the compliance information requirements? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["An Azure AI Bot Service channel - A REST API","The Semantic Kernel - A tool","A custom OData entity - An event trigger","A custom connector - The MCP server"],"a":[3],"e":"A custom connector bridges the low-code agent to external systems such as an MCP server. Then add the MCP server to the agent so it can reach R&D product specs and compliance data.","t":"Bridge = custom connector. Data hub = MCP server.","k":["custom connector","MCP server"]},{"id":"ab-100-89","d":"agentic-ai","x":"A company has an AI solution built by using Microsoft Copilot Studio and Power Platform. The solution is used by the company's sales, marketing, and customer service teams. You are performing a return on AI investment (ROAI) analysis to evaluate the impact of the solution. You need to identify which measurable business drivers to include in the analysis. Which two business drivers should you identify? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["Economic market predictability","Increased employee productivity","The reduced average case resolution time","Brand awareness","Market capitalization"],"a":[1,2],"e":"Reduced average case resolution time measures how Copilot speeds up customer requests. Increased employee productivity measures time saved and more work completed. Market cap, brand awareness and market predictability cannot be tied directly to the AI solution.","t":"Measurable drivers: FASTER cases + MORE productive staff.","k":["resolution time","productivity","ROAI drivers"]},{"id":"ab-100-90","d":"agentic-ai","x":"A company plans to implement an AI solution containing a Microsoft Copilot Studio agent and a Microsoft Foundry agent. The solution is stored in a source code repository. A test environment must be used before production, production must be isolated from development and testing, and deployment must be repeatable, fully automated, and require no manual intervention. Which deployment method should you recommend for each agent? NOTE: Each correct selection is worth one point.","o":["Export from the source code repository and import to the target environment. - Use an Azure DevOps pipeline.","Use a Bicep file. - Use a Microsoft Power Platform deployment pipeline.","Use a Microsoft Power Platform deployment pipeline. - Use a Bicep file","Use a Microsoft Power Platform deployment pipeline. - Use an Azure DevOps pipeline."],"a":[3],"e":"Copilot Studio belongs to Power Platform, so use a Power Platform deployment pipeline across Dev, Test and Prod. The Foundry agent fits an Azure DevOps pipeline for automated CI/CD from the source repo. Bicep and manual export/import do not fit.","t":"Studio rides Power Platform pipeline. Foundry rides Azure DevOps.","k":["Power Platform pipeline","Azure DevOps","CI/CD"]},{"id":"ab-100-91","d":"agentic-ai","x":"A company uses a fine-tuned Microsoft Foundry model that requires frequent updates as new customer feedback becomes available. You need to design an application lifecycle management (ALM) process that meets the following requirements: Data changes must be tracked and versioned. The model must be retrained consistently by using approved training data. Which two actions should you include in the design? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["Create a content filter.","Store the training data in Azure Blob Storage that has version control enabled.","Store the training data in Azure Files.","Associate the storage location to the fine-tuning job.","Upload the training data to Microsoft Foundry data files."],"a":[1,4],"e":"Uploading to Foundry data files keeps fine-tuning on approved data. Azure Blob Storage with versioning tracks changes, restores old versions and audits the data used in each fine-tune. Content filters and Azure Files do not meet these ALM needs.","t":"Versioned data = Blob versioning. Approved training = Foundry data files.","k":["Blob versioning","Foundry data files","fine-tuning"]},{"id":"ab-100-92","d":"agentic-ai","x":"A company has an AI solution that uses Azure OpenAI models. You need to recommend a governance solution that monitors and audits changes to model configurations and data usage. The solution must minimize administrative effort. What should you include in the recommendation?","o":["Azure Policy","Azure Stream Analytics","Azure API Management","Azure Monitor","Microsoft Purview"],"a":[4],"e":"Microsoft Purview gives governance, data management, data usage tracking and audits for AI resources with little admin effort. Azure Monitor tracks performance, Policy enforces config rules, API Management manages APIs, and Stream Analytics processes streams.","t":"Audit data usage + governance = PURVIEW.","k":["Microsoft Purview","audit","governance"]},{"id":"ab-100-93","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio agent that has been in production for three months. The agent has received positive feedback from users. You need to identify the number of questions unanswered by the agent and the number of abandoned sessions between the users and the agent. Which Copilot Studio insights should you use? To answer, drag the appropriate insights to the correct requirements. Each insight may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","o":["Generated answer rate and quality — Conversation outcomes","Reactions — Survey results","Conversation outcomes — Generated answer rate and quality","Survey results — Generated answer rate and quality"],"a":[0],"e":"Unanswered questions show up in Generated answer rate and quality. Abandoned sessions show up in Conversation outcomes, which classifies sessions as Resolved, Escalated or Abandoned.","t":"Unanswered = answer RATE. Abandoned = OUTCOMES.","k":["generated answer rate","conversation outcomes"]},{"id":"ab-100-94","d":"agentic-ai","x":"A company uses Azure OpenAI models that use grounding data from Microsoft Fabric for agents. The models are fine-tuned by using proprietary datasets. You need to design a governance solution that restricts access to the grounding data to assigned roles and restricts model fine-tuning to only the AI engineering team. What should you include in the design?","o":["Role-based access control (RBAC) in Microsoft Foundry - Microsoft Purview access policies","Azure Monitor alerts - Microsoft Entra Conditional Access","Azure Policy compliance rules - Azure Resource Manager (ARM) resource locks","Microsoft Purview access policies - Role-based access control (RBAC) in Microsoft Foundry"],"a":[3],"e":"Purview access policies control role-based access to grounding data in Fabric. RBAC in Microsoft Foundry limits fine-tuning to the AI engineering team. Monitor, Policy, locks and Conditional Access do other jobs.","t":"Data access = Purview. Who can fine-tune = Foundry RBAC.","k":["Purview access policies","RBAC","fine-tuning"]},{"id":"ab-100-95","d":"agentic-ai","x":"You are designing a testing solution for a Microsoft Copilot Studio agent that integrates with Microsoft Dynamics 365 Customer Service and Dynamics 365 Sales. You need to design end-to-end scenarios to test the agent's ability to coordinate tasks and data interactions across both apps, interpret user input, and provide contextually relevant outputs. Which test scenario and metric should you include in the design?","o":["Test scenario: Run task-based scenarios that involve both apps; Metric: Track the successful completion of cross-app tasks","Test scenario: Run task-based scenarios that involve both apps; Metric: Track the average click rate across both apps","Test scenario: In each app, test isolated tasks without using workflows; Metric: Measure the initial prompt response time for each app","Test scenario: Test visual consistency across both apps; Metric: Track the successful completion of cross-app tasks"],"a":[0],"e":"To test coordination across Customer Service and Sales, run task-based scenarios that involve both apps and track the successful completion of cross-app tasks. Isolated tests, click rates and visual checks do not measure this.","t":"Cross-app test = cross-app TASKS completed.","k":["end-to-end testing","cross-app tasks"]},{"id":"ab-100-96","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio prompt-and-response agent. You need to ensure that the agent provides effective and relevant responses and provides conversational outcomes. Which metric should you use for each requirement?To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Reactions - Satisfaction","Tool use - Topics by outcome","Generated answer rate and quality - Topics by outcome","Generated answer rate and quality - Tool use"],"a":[2],"e":"Generated answer rate and quality shows whether responses are effective and relevant. Topics by outcome tracks conversation results like Resolved, Escalated or Abandoned.","t":"Good answers = answer QUALITY. Results = topics by OUTCOME.","k":["generated answer quality","topics by outcome"]},{"id":"ab-100-97","d":"agentic-ai","x":"ASE STUDY This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Background - Fabrikam, Inc., is a global consumer goods company that is undergoing a digital transformation initiative to migrate its entire infrastructure to the Microsoft cloud. As a key element of this cloud migration, the company will implement Microsoft Dynamics 365 Sales, moving away from the current on-premises proprietary technologies used by its business-to-business (B2B) sales team. As part of the cloud migration, Fabrikam will adopt an AI-first approach to its business solutions and implement AI solutions, wherever possible, to streamline operations. Problem Statements - Fabrikam's infrastructure currently relies on various on-premises systems that require sales executives to use corporate computers with physical keyboards to access business information during customer interactions. Mobile phones cannot be used for these purposes, as the systems depend on keyboard input. As a result, the sales executives spend a lot of time using keyboards to search for data on several disparate systems and file servers, rather than focusing on the customers. This affects the customer experience. Fabrikam stakeholders are concerned that users will be hesitant to adopt AI. If the AI initiatives are NOT adopted, cost savings will never be realized. Additionally, funding for future AI initiatives will depend on demonstrating an increase in AI adoption month over month. As the AI agent initiative for the sales team will be the first for Fabrikam, the rapid adoption of the agent is a high priority. Planned Initiatives - General - Fabrikam management has prioritized AI-driven projects to improve efficiency, customer engagement, and responsible AI adoption. The current application infrastructure is on-premises and must be migrated to the cloud to support the adoption of these technologies. Infrastructure Migration - Fabrikam plans to migrate from its current on-premises infrastructure to a completely cloud-based topology; this will include user authentication, the security framework, and, primarily, the adoption of the services by end users. All the data from the different systems will be consolidated into a single data source - a common data model that will use a Microsoft Dataverse environment as a single source of truth (SSOT) for the sales team. Sales Cycle Enablement - To achieve the company's objectives, Fabrikam intends to implement the following strategies to enhance the sales cycle: Use low-code development to create a single AI agent that has Dataverse as its core component. Ensure that sales managers can access unanswered correspondence from prospects and intervene as appropriate. Replace the previous proprietary software with Dynamics 365 Sales to track sales cycles and customer interactions. Have the sales executives use Dynamics 365 Sales to track interactions for open opportunities and send follow-up communications to prospects. Have the sales executives use handsfree headsets to interact with an AI agent when they have questions about internal policies or customer data. Requirements - Infrastructure Migration - Fabrikam has identified the following infrastructure migration requirements: Azure must be used for all future infrastructure workloads. The company must follow Microsoft-recommended methodologies for infrastructure migration to the cloud. Any created AI agents must have their return on investment (ROI) calculated to ensure that the solution will save the company money. Sales Cycle Enablement - Fabrikam has identified the following requirements for sales cycle enablement: The final AI agent must follow Microsoft recommendations for a conversational user experience. A designated checklist must be reviewed to ensure that the AI agent follows Microsoft deployment recommendations for a compliant solution. Detailed telemetry must be logged for the first created AI agent to help troubleshoot and optimize the agent during the initial AI agent adoption process. Unexpected AI agent actions must end in an escalation to a live representative. For example, a sales executive must be rerouted to a representative if the agent cannot answer a question after two failed attempts. The return on investment (ROI) of switching from the current process to the future process is required for stakeholder sign off. The sales team must use Dynamics 365 Sales to correspond with prospects more quickly and efficiently than currently. Sales managers must report on the adoption of the AI agent to key Fabrikam stakeholders on a monthly basis. Any sensitive information, such as user IDs and names, shared via the AI agent must be tracked for future auditing. Which tool should you recommend to address the sensitive information concerns in the sales process?","o":["Monitoring in Microsoft Foundry","Model Context Protocol (MCP)","The Analytics tab in Microsoft Copilot Studio","Microsoft Foundry Tracing UI","Application Insights"],"a":[4],"e":"Application Insights gives detailed telemetry and logs for data exchanged through the agent, including user info and IDs, for querying, troubleshooting and auditing. Copilot Studio Analytics is an overview dashboard and MCP is a protocol.","t":"Track who said what for audits = Application Insights logs.","k":["Application Insights","audit","sensitive info"]},{"id":"ab-100-98","d":"agentic-ai","x":"A company has an Azure environment that supports multiple business units. The company plans to implement an AI solution that will perform sentiment analysis on customer product reviews. You need to evaluate the potential cost of the solution to support return on AI investment (ROAI) analysis. What should you use?","o":["Azure Monitor","Azure Reservations","Azure pricing calculator","Total Cost of Ownership (TCO) Calculator"],"a":[2],"e":"The Azure pricing calculator estimates the cost of planned Azure services, like Azure OpenAI or AI Language, before deployment. TCO compares on-prem with cloud, Reservations optimize cost later, and Monitor watches running systems.","t":"Potential cost before building = Pricing calculator.","k":["pricing calculator","ROAI"]},{"id":"ab-100-99","d":"agentic-ai","x":"A company has multiple Dynamics 365 and Azure resources and is implementing a custom Microsoft Copilot Studio AI agent. Which two components for the custom AI agent should you include in the application lifecycle management (ALM) process? Each correct answer presents part of the solution.","o":["An X++ model","A Cloud Scale Unit (CSU) package","A ZIP package","An Azure package","A Microsoft Power Platform solution"],"a":[2,4],"e":"A Power Platform solution packages the Copilot Studio agent and related parts for ALM across Dev, Test and Prod. The ZIP package is the exported file format used to move the solution. X++, CSU and Azure packages are for other systems.","t":"Solution inside a ZIP.","k":["Power Platform solution","ZIP package","ALM"]},{"id":"ab-100-100","d":"agentic-ai","x":"A company has an Azure environment that supports multiple business units. The company plans to implement an AI solution that will perform sentiment analysis on customer product reviews. You need to evaluate the potential cost of the solution to support return on AI investment (ROAI) analysis. What should you use?","o":["Microsoft Fabric SKU Estimator","Cost Management + Billing","Azure savings plans","Azure Monitor"],"a":[1],"e":"With many business units, Cost Management + Billing analyzes and forecasts spend, allocates costs per unit and sets budgets and alerts for ROAI. Savings plans optimize price, the Fabric estimator is Fabric-only, and Monitor is technical.","t":"Multiple business units + cost = Cost Management + Billing.","k":["Cost Management","business units","ROAI"]},{"id":"ab-100-102","d":"agentic-ai","x":"You are designing an AI business solution that contains a Microsoft Power Automate workflow, a Microsoft Copilot Studio agent, a Microsoft Dataverse database, and a Microsoft Power Apps app. As part of the application lifecycle management (ALM) process, you plan to package the components so that they can be deployed to other environments as a group. You need to recommend a solution that supports versioning, dependencies, and deployments. What should you include in the recommendation?","o":["Azure DevOps","Microsoft Power Platform solutions","GitHub Actions"],"a":[1],"e":"Power Platform solutions package Power Apps, Power Automate, Dataverse and Copilot Studio into one deployable unit with versioning and dependencies. GitHub Actions and Azure DevOps are CI/CD tools that still work on solutions.","t":"Package as a group = SOLUTION.","k":["Power Platform solutions","versioning","dependencies"]},{"id":"ab-100-103","d":"agentic-ai","x":"A company deploys agents that generate responses by using Azure OpenAI resources. The agents are deployed to both the United States and Europe. You need to recommend a governance solution that enforces deployment only to approved Azure regions and provides continuous compliance verification of the resources. What should you include in the recommendation for each requirement?","o":["Azure Policy — Microsoft Defender for Cloud","Azure Monitor — Microsoft Defender for Cloud"],"a":[0],"e":"Azure Policy's Allowed locations policy enforces deployment only to approved regions. Microsoft Defender for Cloud gives continuous compliance assessment, scores and dashboards. Azure Monitor is telemetry.","t":"Enforce = POLICY. Keep checking = DEFENDER for Cloud.","k":["Azure Policy","Defender for Cloud","allowed locations"]},{"id":"ab-100-104","d":"agentic-ai","x":"Which existing tool and data should you use to gather the required metrics for stakeholder signoff for the AI agents? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Microsoft Copilot Studio — the current time to complete the task today per instance","Azure Resource Monitor (ARM) — the current cost to complete the tasks per instance","Microsoft Foundry — the current cost to complete the tasks per instance","Dynamics 365 Sales — the current cost to complete the tasks per instance"],"a":[0],"e":"Use Copilot Studio and the current time to complete each task today. That baseline lets you compare the current process with the agent process to show savings and ROI for stakeholder signoff.","t":"Signoff needs a BASELINE: today's time per task.","k":["baseline","time per task","stakeholder signoff"]},{"id":"ab-100-105","d":"agentic-ai","x":"A company has a Microsoft Foundry generative AI model. You need to evaluate the model's output to measure the overall quality and coherence of generated responses. The evaluation must use GPT-4o as a judge and return a numeric score for each output. Which type of metric should you use?","o":["risk and safety","AI quality (NLP)","AI quality (AI assisted)","Groundedness"],"a":[2],"e":"AI quality (AI assisted) metrics use another model as the judge. Here GPT-4o rates quality and coherence and returns a score for each output. NLP metrics use traditional measures, risk and safety checks harmful content, and groundedness checks source fidelity.","t":"LLM as judge = AI-ASSISTED quality.","k":["AI-assisted metrics","LLM judge","coherence"]},{"id":"ab-100-106","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio agent that uses custom connectors to interact with enterprise APIs. You need to recommend an application lifecycle management (ALM) process to ensure that the connectors are deployed consistently across development, test, and production environments and meet governance and traceability requirements. What should you recommend?","o":["Maintain connector definitions in environment variables.","Manage the connectors as solution components and deploy the components by using ALM pipelines.","Export and import the connectors between the environments as unmanaged solutions.","Deploy the APIs as Azure Functions."],"a":[1],"e":"Manage custom connectors as Power Platform solution components and deploy them through ALM pipelines across Dev, Test and Prod for consistency, governance and traceability. Unmanaged imports do not fit Test or Prod.","t":"Connectors too: solution + pipeline.","k":["solution components","ALM pipelines","custom connector"]},{"id":"ab-100-107","d":"agentic-ai","x":"Which tool should you recommend to help secure funding for future AI agent development?","o":["Evaluations in Microsoft Foundry","the Azure Cost Optimization workbook","Direct Preference Optimization (DPO)","Azure Operator Insights","the Analytics tab in Microsoft Copilot Studio"],"a":[4],"e":"The case requires showing that AI agent adoption grows month by month to win funding. The Analytics tab in Copilot Studio gives adoption metrics and reports over time for stakeholders.","t":"Funding needs ADOPTION proof = Studio Analytics.","k":["Analytics tab","adoption","funding"]},{"id":"ab-100-108","d":"agentic-ai","x":"You are designing a Microsoft Copilot Studio agent that uses a custom Microsoft Foundry model to generate responses. You need to ensure that the agent can securely connect to and invoke the custom model during user interactions. What should you include in the design?","o":["Create a custom engine agent.","Configure the agent to use classic orchestration.","Create a connection to Microsoft Foundry in the agent.","Add the Microsoft Foundry model as a Copilot Studio skill."],"a":[2],"e":"Create a connection to Microsoft Foundry in the agent. The connection handles secure authentication and authorization so Copilot Studio can call the custom Foundry model during conversations.","t":"Securely reach Foundry model = CONNECTION.","k":["Foundry connection","custom model","authentication"]},{"id":"ab-100-109","d":"agentic-ai","x":"A company uses multiple Microsoft Copilot Studio agents across different channels. You need to recommend a monitoring solution that provides comprehensive telemetry data and performance insights for the agents. What should you include in the recommendation?","o":["the Analytics tab in Copilot Studio","Log Analytics","Microsoft Power BI","Azure Advisor"],"a":[1],"e":"Log Analytics centralizes, queries and analyzes logs from many agents using KQL, often together with Application Insights. The Analytics tab is basic per-agent reporting, Power BI visualizes, and Advisor gives infrastructure tips.","t":"No App Insights option? Pick LOG ANALYTICS.","k":["Log Analytics","KQL","telemetry"]},{"id":"ab-100-110","d":"agentic-ai","x":"A company is using Microsoft Dynamics 365 Finance and Operations apps. The company wants to leverage Microsoft Copilot in-app help and guidance to generate responses for its internal business processes. You need to add an additional knowledge source for these business processes. The solution must allow Copilot to access the required information without creating any new topics in the Copilot agent for Finance and Operations. Which knowledge source should you add?","o":["A file upload","Microsoft Dataverse","A public website","Azure AI Search"],"a":[0],"e":"Upload internal process documents (PDF or Word) as a file so Copilot's generative answers can use them without creating new topics.","t":"No new topics + internal docs = just UPLOAD the file.","k":["file upload","generative answers","knowledge source"]},{"id":"ab-100-111","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a team that analyzes its customers by using a manual process. You are designing an AI-based agent to automate and improve the process. The solution must use generative AI to answer common questions, provide analytics to review AI performance, identify customer demographics, and minimize custom development. Solution: You recommend GitHub Copilot. Does this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. GitHub Copilot is a coding assistant in the IDE, not a platform for customer-facing agents with analytics. Copilot Studio is the right fit.","t":"GitHub Copilot writes code, not customer agents. No.","k":["GitHub Copilot","No"]},{"id":"ab-100-113","d":"agentic-ai","x":"A company has Microsoft Foundry agents that generate responses by using Azure OpenAI resources. The agents are deployed to both the United States and Europe. A company mandate states that the agents and their grounding data must adhere to data residency and movement regulations. You need to recommend a governance solution for the agents. What should you include in the recommendation?","o":["Azure Monitor","Microsoft Defender for Cloud","Microsoft Purview","Azure Policy"],"a":[2],"e":"Microsoft Purview provides data governance and compliance: classification, lifecycle tracking, and auditing of how sensitive data, including AI grounding data, is used or moved. Defender is security posture, Policy is resource rules, Monitor is telemetry. function splitQ(text){
  const s = text.trim();
  if(s.length < 1300) return {ctx:null, q:s};
  const tail = s.slice(-1100);
  const re = /(You need to|You plan to|Which |What should|How should|What is |Does this|Solution:)/g;
  let m, first=-1; while((m=re.exec(tail))){ if(first<0) first=m.index; }
  let cut;
  if(first>=0){ cut = s.length-1100+first; const before = s.lastIndexOf(". ", cut); const nl = s.lastIndexOf("\n", cut); const b = Math.max(before, nl); if(b > cut-260 && b>0) cut = b+1; }
  else { cut = s.length-520; const b = s.indexOf(". ", cut); if(b>0) cut=b+2; }
  return {ctx:s.slice(0,cut).trim(), q:s.slice(cut).trim()};
}
const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
function stats(id){
  const e=EX[id], st=exS(id); let seen=0, c=0, w=0;
  for(const q of e.qs){ const a=st.att[q.id]; if(a){ seen++; c+=a[0]; w+=a[1]; } }
  const mis = Object.keys(st.mis).filter(k=>e.byId[k]).length;
  const flag = Object.keys(st.flag).filter(k=>e.byId[k]).length;
  return {seen, total:e.qs.length, acc: (c+w) ? Math.round(100*c/(c+w)) : null, mis, flag};
}
function ring(pct, label, size=58){
  const r=(size-8)/2, C=2*Math.PI*r, off=C*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px" aria-hidden="true"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central">${label}</text></svg>`;
}
function animateRings(root=document){ requestAnimationFrame(()=>requestAnimationFrame(()=>$$("circle[data-off]",root).forEach(c=>c.style.strokeDashoffset=c.dataset.off))); }

/* ---------- confetti ---------- */
const fx=$("#fx"), fctx=fx.getContext("2d"); let parts=[], fxRun=false;
function burst(x,y,n=46){
  if(reduced) return;
  const dpr=devicePixelRatio||1; fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; fctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement); const cols=[cs.getPropertyValue("--accent"),cs.getPropertyValue("--ok"),cs.getPropertyValue("--note-line"),cs.getPropertyValue("--ink-2")];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=3+Math.random()*6; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:Math.random()*360,vr:(Math.random()-.5)*16,s:4+Math.random()*5,c:cols[i%cols.length].trim(),l:1}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){ p.vy+=.22; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.l-=.012;
    fctx.save(); fctx.globalAlpha=Math.max(0,p.l); fctx.translate(p.x,p.y); fctx.rotate(p.r*Math.PI/180); fctx.fillStyle=p.c; fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fctx.restore(); }
  if(parts.length) requestAnimationFrame(fxLoop); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---------- hero blueprint animation ---------- */
let heroStop = null;
function blueprint(cv){
  const ctx=cv.getContext("2d"); let W=0,H=0,raf=0,alive=true; const G=28;
  const LBL=["agent","tool","MCP","RAG","index","cache","hook","prompt","eval","queue","API","subagent","schema","memory","guardrail","router"];
  let boxes=[], links=[], col={};
  const readCol=()=>{ const cs=getComputedStyle(document.documentElement); col={ink:cs.getPropertyValue("--ink-3").trim(), acc:cs.getPropertyValue("--accent").trim(), grid:cs.getPropertyValue("--grid-strong").trim(), surf:cs.getPropertyValue("--surface").trim()}; };
  const size=()=>{ const dpr=devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  const spawn=()=>{ const w=(3+Math.random()*3|0)*G, h=(1+Math.random()*2|0)*G; const minX = W>760 ? W*0.52 : 0;
    const x=Math.round((minX+Math.random()*Math.max(G,W-minX-w))/G)*G, y=Math.round(Math.random()*Math.max(G,H-h)/G)*G;
    if(boxes.some(b=>x<b.x+b.w+G&&x+w+G>b.x&&y<b.y+b.h+G&&y+h+G>b.y)) return;
    const b={x,y,w,h,t:0,life:420+Math.random()*420,lbl:LBL[Math.random()*LBL.length|0],hot:Math.random()<.25};
    boxes.push(b); const o=boxes.filter(z=>z!==b); if(o.length){ const z=o[Math.random()*o.length|0]; links.push({a:b,b:z,t:0}); } };
  const rr=(x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
  let frame=0;
  const draw=()=>{
    if(!alive) return; frame++; if(frame%90===1) readCol();
    ctx.clearRect(0,0,W,H);
    if(boxes.length<(W>760?9:5) && Math.random()<.04) spawn();
    for(const l of links){ l.t++; const A=l.a,B=l.b; const fa=Math.min(A.t,A.life-A.t,60)/60, fb=Math.min(B.t,B.life-B.t,60)/60; const f=Math.max(0,Math.min(fa,fb));
      if(f<=0) continue; const ax=A.x+A.w/2, ay=A.y+A.h/2, bx=B.x+B.w/2, by=B.y+B.h/2;
      ctx.globalAlpha=f*.8; ctx.strokeStyle=col.ink; ctx.lineWidth=1.2; ctx.setLineDash([5,6]); ctx.lineDashOffset=-l.t*.6;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.setLineDash([]);
      const p=(l.t%160)/160, len=Math.abs(bx-ax)+Math.abs(by-ay), d=p*len; let px,py; const dx=Math.abs(bx-ax);
      if(d<dx){ px=ax+Math.sign(bx-ax)*d; py=ay; } else { px=bx; py=ay+Math.sign(by-ay)*(d-dx); }
      ctx.fillStyle=col.acc; ctx.beginPath(); ctx.arc(px,py,2.6,0,7); ctx.fill(); }
    for(const b of boxes){ b.t++; const f=Math.max(0,Math.min(b.t,b.life-b.t,60)/60); const draw=Math.min(1,b.t/70);
      ctx.globalAlpha=f; ctx.fillStyle=col.surf; rr(b.x+.5,b.y+.5,b.w,b.h,6); ctx.globalAlpha=f*.85; ctx.fill(); ctx.globalAlpha=f;
      ctx.strokeStyle=b.hot?col.acc:col.ink; ctx.lineWidth=b.hot?1.6:1.2; const per=2*(b.w+b.h); ctx.setLineDash([per*draw,per]); rr(b.x+.5,b.y+.5,b.w,b.h,6); ctx.stroke(); ctx.setLineDash([]);
      if(draw>.6){ ctx.globalAlpha=f*(draw-.6)/.4; ctx.fillStyle=b.hot?col.acc:col.ink; ctx.font="600 11px JetBrains Mono, monospace"; ctx.fillText(b.lbl, b.x+10, b.y+Math.min(b.h,G)/2+4); } }
    ctx.globalAlpha=1;
    boxes=boxes.filter(b=>b.t<b.life); links=links.filter(l=>boxes.includes(l.a)&&boxes.includes(l.b));
    raf=requestAnimationFrame(draw);
  };
  readCol(); size(); for(let i=0;i<6;i++) spawn(); boxes.forEach(b=>b.t=80+Math.random()*120);
  const ro=new ResizeObserver(size); ro.observe(cv);
  if(reduced){ for(let i=0;i<120;i++){ /* settle */ } draw(); cancelAnimationFrame(raf); }
  else raf=requestAnimationFrame(draw);
  const vis=()=>{ if(document.hidden){ cancelAnimationFrame(raf); } else if(alive && !reduced){ cancelAnimationFrame(raf); raf=requestAnimationFrame(draw); } };
  document.addEventListener("visibilitychange",vis);
  return ()=>{ alive=false; cancelAnimationFrame(raf); ro.disconnect(); document.removeEventListener("visibilitychange",vis); };
}

function modeBtn(m, title, desc, disabled=false, hot=false){ return `<button class="mode ${hot?"hot":""}" data-mode="${m}" ${disabled?"disabled":""}><span class="ic">${MODE_IC[m]}</span><b>${esc(title)}</b><span>${esc(desc)}</span></button>`; }
function modeName(m){ return {study:t("mStudy"),practice:t("mPractice"),mock:t("mMock"),mis:t("mMis"),flag:t("mFlag"),cards:t("mCards"),retry:t("mMis")}[m]||m; }

/* ---------- sessions ---------- */
function startMode(id, mode, list){
  const e=EX[id], st=exS(id); let qs;
  if(list) qs=list;
  else if(mode==="study") qs=filtered(id);
  else if(mode==="practice"){ const pool=filtered(id); let ord = S.newFirst ? [...shuffle(pool.filter(q=>!st.att[q.id])), ...shuffle(pool.filter(q=>st.att[q.id]))] : shuffle(pool); qs = S.size ? ord.slice(0,S.size) : ord; }
  else if(mode==="mock") qs=shuffle(e.qs).slice(0,Math.min(e.exam.count,e.qs.length));
  else if(mode==="mis") qs=shuffle(e.qs.filter(q=>q.id in st.mis));
  else if(mode==="flag") qs=e.qs.filter(q=>st.flag[q.id]);
  else if(mode==="cards") qs=shuffle(filtered(id));
  if(!qs.length) return;
  const perm={}; for(const q of qs){ perm[q.id] = (S.shuffle && !/\b(both|all of the|none of the|[A-F] and [A-F])\b/i.test(q.o.join(" "))) ? shuffle(q.o.map((_,i)=>i)) : q.o.map((_,i)=>i); }
  SESSION={id, mode, qs, i:0, ans:{}, checked:{}, perm, done:false, dir:1, results:{}, cards:{g:0,a:0}};
  if(mode==="mock"){ SESSION.deadline=Date.now()+e.exam.minutes*60000; }
  if(mode==="cards"){ VIEW={name:"cards"}; window.scrollTo({top:0}); renderCards(); return; }
  VIEW={name:"run"}; window.scrollTo({top:0}); renderRun();
  if(mode==="mock") startTimer();
}
let timerI=null;
function startTimer(){ stopTimer(); timerI=setInterval(()=>{ const el=$("#timer"); if(!SESSION||!SESSION.deadline){ stopTimer(); return; } const ms=SESSION.deadline-Date.now(); if(ms<=0){ stopTimer(); finishSession(); return; } if(el){ const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; el.classList.toggle("low", ms<5*60000); } },500); }
function stopTimer(){ clearInterval(timerI); timerI=null; }

function record(id, q, ok){
  const st=exS(id); const a=st.att[q.id] ||= [0,0]; a[ok?0:1]++;
  let note=null;
  if(!ok){ st.mis[q.id]=0; }
  else if(q.id in st.mis){ st.mis[q.id]++; if(st.mis[q.id]>=2){ delete st.mis[q.id]; note="cleared"; } else note="streak"; }
  return note;
}

function renderRun(){
  const se=SESSION, e=EX[se.id], q=se.qs[se.i], st=exS(se.id);
  const isMock = se.mode==="mock", checked = !!se.checked[q.id];
  const sel = se.ans[q.id]||[], need=q.a.length;
  const {ctx, q:qt} = splitQ(q.x);
  const order = se.perm[q.id];
  const answeredN = se.qs.filter(x=>se.ans[x.id]?.length).length;
  const pct = isMock ? 100*answeredN/se.qs.length : 100*(se.i+(checked?1:0))/se.qs.length;
  const exp = q.e;
  const trk = q.t;
  let optsHTML = order.map((oi,pos)=>{
    const isSel = sel.includes(oi), isRight=q.a.includes(oi);
    let cls = "opt"+(need>1?" multi":""); let tag="";
    if(checked){ if(isRight){ cls+=" right"; tag="✓"; } else if(isSel){ cls+=" wrong"; tag="✕"; } else cls+=" dim"; }
    else if(isSel) cls+=" sel";
    const why = checked && q.w && q.w[oi] ? `<div class="why">${esc(q.w[oi])}</div>` : "";
    return `<button class="${cls}" data-oi="${oi}" ${checked?"disabled":""} aria-pressed="${isSel}"><span class="lt">${LET[pos]}</span><span class="ot">${esc(q.o[oi])}</span>${tag?`<span class="tag">${tag}</span>`:""}${why}</button>`;

      ${exp?`<div class="exp"><h5>${esc(t("why"))}</h5><p>${esc(exp)}</p></div>`:""}
      ${trk?`<div class="trick"><h5>${esc(t("trick"))}</h5><p>${esc(trk)}</p>${q.k&&q.k.length?`<div class="kw">${q.k.map(k=>`<span>#${esc(k)}</span>`).join("")}</div>`:""}</div>`:""}

  <div class="runbar"><div class="wrap">

    ${isMock?`<span class="timer tab" id="timer">--:--</span>`:""}
    <button class="btn sm ghost" id="navBtn">${esc(t("navOpen"))}</button>
    <button class="btn sm ghost" id="exitBtn">${esc(t("exit"))}</button>

  </div></div>
  <div class="wrap stage">
    <article class="qcard enter ${se.dir<0?"rev":""}" id="qc">
      <div class="qmeta"><span class="qnum">${esc(t("question"))} ${se.i+1}</span><span class="pill">${esc(e.domains[q.d]||q.d)}</span>${need>1?`<span class="pill acc">${esc(t("selectN",{n:need}))}</span>`:""}
        <button class="flag" id="flagBtn" aria-pressed="${flagged}">${MODE_IC.flag.replace('<svg','<svg width="14" height="14"')} ${esc(flagged?t("flagged"):t("flag"))}</button></div>
      ${ctx?`<details class="case"><summary>${esc(t("caseStudy"))}</summary><div class="ctext">${esc(ctx)}</div></details>`:""}
      <p class="qtext">${esc(qt)}</p>
      ${need>1&&!checked?`<div class="need tab">${esc(t("selected",{a:sel.length,n:need}))}</div>`:""}
      <div class="olist">${optsHTML}</div>
      ${fb}
    </article>
  </div>
  <div class="foot"><div class="wrap">
    <button class="btn" id="prevBtn" ${se.i===0||(!isMock&&se.mode!=="study")?"hidden":""}>${esc(t("prev"))}</button>
    <span class="hint grow">${esc(t("kb"))}</span>

  </div></div>`;
  if(isMock) startTimerTick();

}
function startTimerTick(){ const el=$("#timer"); if(el && SESSION.deadline){ const ms=Math.max(0,SESSION.deadline-Date.now()); el.textContent=`${String(Math.floor(ms/60000)).padStart(2,"0")}:${String(Math.floor(ms%60000/1000)).padStart(2,"0")}`; el.classList.toggle("low",ms<5*60000); } }
function actionBtn(){
  const se=SESSION, q=se.qs[se.i], last=se.i===se.qs.length-1, sel=se.ans[q.id]||[];

function bindRun(){
  const se=SESSION, q=se.qs[se.i];

    const oi=+b.dataset.oi; let sel=[...(se.ans[q.id]||[])];

    else sel=[oi];

    if(!reduced){ const r=b.getBoundingClientRect(); const d=Math.max(r.width,r.height)*2.2; const sp=document.createElement("span"); sp.className="rip"; sp.style.cssText=`width:${d}px;height:${d}px;left:${(ev.clientX||r.left+r.width/2)-r.left-d/2}px;top:${(ev.clientY||r.top+r.height/2)-r.top-d/2}px`; b.appendChild(sp); setTimeout(()=>sp.remove(),600); }

    const nd=$(".need"); if(nd) nd.textContent=t("selected",{a:sel.length,n:q.a.length});
