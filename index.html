The tools used for the assessments must be Microsoft-recommended and must verify reliability, interpretability, fairness, and compliance. The CFO wants to identify how many interactions with the AI agents are abandoned on a given day as compared to resolved conversations. Too many abandoned sessions might indicate that Copilot Studio credits are being used inefficiently by end users. Which two components in the custom AI agent design should the CFO evaluate in the quarterly agent analysis? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["The average characters in a chat message","The average session time per agent","The GPT models used for the agent","The agent orchestration method"],"a":[1,3],"e":"The CFO cares about cost and business value. The orchestration method decides how the agent picks knowledge, tools and topics, so it drives Copilot credit use. Average session time shows how long an interaction takes and supports ROI tracking. GPT model choice and message length are not operational ROI metrics.","t":"CFO = money. Money leaks through HOW it orchestrates and HOW LONG sessions run.","k":["orchestration","session time","credits","ROI"]},{"id":"ab-100-2","d":"agentic-ai","x":"CASE STUDY This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Background - Fabrikam, Inc., is a global consumer goods company that is undergoing a digital transformation initiative to migrate its entire infrastructure to the Microsoft cloud. As a key element of this cloud migration, the company will implement Microsoft Dynamics 365 Sales, moving away from the current on-premises proprietary technologies used by its business-to-business (B2B) sales team. As part of the cloud migration, Fabrikam will adopt an AI-first approach to its business solutions and implement AI solutions, wherever possible, to streamline operations. Problem Statements - Fabrikam's infrastructure currently relies on various on-premises systems that require sales executives to use corporate computers with physical keyboards to access business information during customer interactions. Mobile phones cannot be used for these purposes, as the systems depend on keyboard input. As a result, the sales executives spend a lot of time using keyboards to search for data on several disparate systems and file servers, rather than focusing on the customers. This affects the customer experience. Fabrikam stakeholders are concerned that users will be hesitant to adopt AI. If the AI initiatives are NOT adopted, cost savings will never be realized. Additionally, funding for future AI initiatives will depend on demonstrating an increase in AI adoption month over month. As the AI agent initiative for the sales team will be the first for Fabrikam, the rapid adoption of the agent is a high priority. Planned Initiatives - General - Fabrikam management has prioritized AI-driven projects to improve efficiency, customer engagement, and responsible AI adoption. The current application infrastructure is on-premises and must be migrated to the cloud to support the adoption of these technologies. Infrastructure Migration - Fabrikam plans to migrate from its current on-premises infrastructure to a completely cloud-based topology; this will include user authentication, the security framework, and, primarily, the adoption of the services by end users. All the data from the different systems will be consolidated into a single data source - a common data model that will use a Microsoft Dataverse environment as a single source of truth (SSOT) for the sales team. Sales Cycle Enablement - To achieve the company's objectives, Fabrikam intends to implement the following strategies to enhance the sales cycle: Use low-code development to create a single AI agent that has Dataverse as its core component. Ensure that sales managers can access unanswered correspondence from prospects and intervene as appropriate. Replace the previous proprietary software with Dynamics 365 Sales to track sales cycles and customer interactions. Have the sales executives use Dynamics 365 Sales to track interactions for open opportunities and send follow-up communications to prospects. Have the sales executives use handsfree headsets to interact with an AI agent when they have questions about internal policies or customer data. Requirements - Infrastructure Migration - Fabrikam has identified the following infrastructure migration requirements: Azure must be used for all future infrastructure workloads. The company must follow Microsoft-recommended methodologies for infrastructure migration to the cloud. Any created AI agents must have their return on investment (ROI) calculated to ensure that the solution will save the company money. Sales Cycle Enablement - Fabrikam has identified the following requirements for sales cycle enablement: The final AI agent must follow Microsoft recommendations for a conversational user experience. A designated checklist must be reviewed to ensure that the AI agent follows Microsoft deployment recommendations for a compliant solution. Detailed telemetry must be logged for the first created AI agent to help troubleshoot and optimize the agent during the initial AI agent adoption process. Unexpected AI agent actions must end in an escalation to a live representative. For example, a sales executive must be rerouted to a representative if the agent cannot answer a question after two failed attempts. The return on investment (ROI) of switching from the current process to the future process is required for stakeholder sign off. The sales team must use Dynamics 365 Sales to correspond with prospects more quickly and efficiently than currently. Sales managers must report on the adoption of the AI agent to key Fabrikam stakeholders on a monthly basis. Any sensitive information, such as user IDs and names, shared via the AI agent must be tracked for future auditing. Which template should you use for the AI agent to meet the requirements for the sales executives?","o":["AI agents in Microsoft Foundry","Voice in Microsoft Copilot Studio","AI chat in Microsoft Foundry","IT Helpdesk in Microsoft Copilot Studio"],"a":[1],"e":"Sales executives need hands-free voice interaction through headsets with a low-code approach. The Voice template in Copilot Studio is built for speech-enabled agents. Foundry templates are pro-code and IT Helpdesk is the wrong scenario.","t":"Headset + hands-free = Voice template in Copilot Studio.","k":["Voice template","hands-free","low-code","Copilot Studio"]},{"id":"ab-100-3","d":"agentic-ai","x":"A company plans to deploy a Microsoft Copilot Studio agent that will analyze historical business data to predict customer behavior. The data is currently stored in an Azure SQL database, flat files, APIs, and logs. You need to organize the data into a format that can be used as a knowledge source in Copilot Studio. What should you include in the solution?","o":["Azure Translator in Foundry Tools","Azure AI Search","Azure Cosmos DB","Azure Data Lake Storage"],"a":[1],"e":"The data is scattered across SQL, flat files, APIs and logs. Azure AI Search connects to many sources, indexes them, and supports keyword and vector search, giving Copilot Studio one RAG-ready knowledge source. Data Lake only stores raw data, Cosmos DB is a NoSQL database, and Translator translates text.","t":"Scattered data + knowledge source = INDEX it = Azure AI Search.","k":["Azure AI Search","indexing","RAG","multiple sources"]},{"id":"ab-100-4","d":"agentic-ai","x":"You need to design a Microsoft Copilot Studio agent for customer support. The agent must securely retrieve product warranty data from a REST API. The solution must minimize development effort. What should you include in the design?","o":["Create a custom connector in Copilot Studio and use the connector to call the API.","Use a Microsoft Power Automate desktop flow to screen scrape the warranty data.","Export the agent as a managed solution and customize the agent in Power Apps.","Add the warranty data to the Fallback topic."],"a":[0],"e":"A custom connector wraps a REST API as a configurable action in Copilot Studio, supports OAuth 2.0 or API keys, and needs little development. Screen scraping is fragile, managed solution export does not call APIs, and the Fallback topic only handles unrecognized intent.","t":"REST API + Copilot Studio + low effort = Custom Connector.","k":["custom connector","REST API","OAuth","low effort"]},{"id":"ab-100-5","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a Microsoft Dynamics 365 Sales environment that has Microsoft Copilot enabled. You need to customize Copilot by tailoring how opportunity summaries are generated or how they are presented to users. Solution: You configure AI Builder lead scoring models to influence opportunity summaries. Does this meet the goal?","o":["No","Yes"],"a":[0],"e":"No. AI Builder lead scoring predicts and ranks lead conversion. It does not change how Copilot generates or shows opportunity summaries. That is done by configuring the summary fields and form settings in Dynamics 365 Sales.","t":"Lead scoring scores LEADS, not SUMMARIES.","k":["lead scoring","opportunity summary","No"]},{"id":"ab-100-6","d":"agentic-ai","x":"You are designing an AI strategy for Microsoft Dynamics 365 finance and operations apps. You are evaluating the use of Microsoft Copilot Studio to provide in-app help and guidance based on generative AI general knowledge. You need to recommend which knowledge sources to include in the generative help and guidance agent. The solution must minimize the risk of generating inaccurate responses. What should you recommend?","o":["Are not supported - Must be enabled for the agent","Must be excluded from the agent - Is not supported","Must be uploaded to the agent - Is not supported","Must be uploaded to the agent - Must be disabled for the agent"],"a":[3],"e":"To reduce inaccurate answers, upload trusted custom knowledge (official docs, company data) to the agent and disable generative AI general knowledge, which may bring in outside or outdated information.","t":"Own docs IN, general knowledge OFF.","k":["custom knowledge","disable general knowledge","accuracy"]},{"id":"ab-100-7","d":"agentic-ai","x":"A company is designing a Microsoft Power Platform solution to reduce the manual steps of a business process by deploying an existing AI model. You need to calculate the return on AI investment (ROAI) by identifying the metadata and telemetry of the solution. What should you use?","o":["Microsoft Power Platform admin center","The Business value toolkit","Microsoft Cloud Adoption Framework for Azure","Success by Design"],"a":[1],"e":"The Business value toolkit identifies the metadata, telemetry and value metrics needed to quantify and track ROAI for a Power Platform solution. The admin center manages environments, Success by Design guides implementations, and CAF is for Azure cloud adoption.","t":"ROAI + Power Platform telemetry = Business VALUE toolkit.","k":["Business value toolkit","ROAI","telemetry"]},{"id":"ab-100-8","d":"agentic-ai","x":"A company uses Microsoft Dynamics 365 Supply Chain Management. You are designing an AI supply chain process that meets the following requirements: provide managers with AI-driven insights that surface key information from customer orders; help planners use AI to anticipate future product needs more accurately. You need to recommend which Microsoft Copilot features to include in the design. What should you recommend for each requirement?","o":["Workload insights with Copilot - The Supplier Communications Agent","AI Summaries with Copilot - Generative insights for Demand planning","AI Summaries with Copilot - Product information management","Workload insights with Copilot - Generative insights for Demand planning"],"a":[1],"e":"AI Summaries with Copilot highlight key information from customer orders for managers. Generative insights for Demand planning help planners forecast future product demand.","t":"Managers SUMMARIZE, planners FORECAST demand.","k":["AI Summaries","Demand planning","Supply Chain"]},{"id":"ab-100-9","d":"agentic-ai","x":"A company has a Microsoft 365 E5 subscription and uses Microsoft Copilot Studio. The company has a Microsoft SharePoint Online library that contains 10,000 policy PDFs from various departments. The library contains a populated column named Department for each PDF. You need to design a Copilot Studio agent that will use the SharePoint library as a knowledge source. The solution must meet the following requirements: Enable the agent to answer user questions about company policies. Ensure that the agent can identify which departments and policies are connected. What should you include in the design for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Import the PDFs into Microsoft Dataverse. - From Copilot Studio, configure the SharePoint tool.","From Copilot Studio, add SharePoint as a knowledge source. - From Copilot Studio, configure the SharePoint tool.","Use AI Builder to process and feed SharePoint content. - Upgrade to SharePoint Premium.","From Copilot Studio, add SharePoint as a knowledge source. - Create a Microsoft Dataverse table for the departments."],"a":[1],"e":"Add the SharePoint library directly as a knowledge source so the agent can answer policy questions. Configure the SharePoint tool so the agent can use the existing Department column metadata to link departments and policies. No Dataverse import or SharePoint Premium is needed.","t":"Answer = knowledge source. Relationships via metadata = SharePoint tool.","k":["SharePoint knowledge source","SharePoint tool","metadata"]},{"id":"ab-100-10","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a Microsoft Dynamics 365 Sales environment that has Microsoft Copilot enabled. You need to customize Copilot by tailoring how opportunity summaries are generated or how they are presented to users. Solution: You add fields to the opportunity summary. Does this meet the goal?","o":["No","Yes"],"a":[1],"e":"Yes. Copilot opportunity summaries in Dynamics 365 Sales are driven by form configuration. Adding fields to the opportunity summary directly changes what is extracted and shown.","t":"Want a different summary? Change its FIELDS. Yes.","k":["opportunity summary","add fields","Yes"]},{"id":"ab-100-11","d":"agentic-ai","x":"A company has a Microsoft Foundry project that uses a single agent and a single prompt to complete a series of tasks. The agent encounters the following issues: It frequently produces incomplete results. It struggles with domain-specific reasoning. Agent response times are remarkably slow. You need to recommend a solution to improve the overall performance and accuracy of the agent. What should you include in the recommendation? To answer, drag the appropriate actions to the correct requirements. Each action may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","o":["Move to a multi-agent architecture. - Add a prebuilt connector.","Move to a multi-agent architecture. - Add a grounding data source.","Upgrade to a larger generative AI model. - Add a prebuilt connector.","Upgrade to a larger generative AI model. - Add a grounding data source."],"a":[1],"e":"For performance, a multi-agent architecture splits a long chain of tasks across specialized agents, so prompts are lighter and responses faster. For accuracy, a grounding data source adds RAG with trusted domain knowledge. A bigger model is usually slower, and a prebuilt connector only adds connectivity.","t":"Slow = split the work (multi-agent). Wrong = ground it (RAG).","k":["multi-agent","grounding","RAG","performance vs accuracy"]},{"id":"ab-100-12","d":"agentic-ai","x":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have an Azure subscription named Subscription1. Subscription1 contains a resource group named RG1. RG1 contains resources that were deployed by using templates. You need to view the date and time when the resources were created in RG1. Solution: From the RG1 blade, you click Deployments. Does this meet the goal?","o":["No","Yes"],"a":[1],"e":"Yes. Resources deployed by templates (ARM or Bicep) are recorded in the resource group's Deployments history, which shows start time and timestamp. For manually created resources, the Activity Log is the better place.","t":"Template-deployed? Check DEPLOYMENTS for the timestamp.","k":["Deployments","ARM template","resource group","Yes"]},{"id":"ab-100-13","d":"agentic-ai","x":"A company has an ecommerce support portal that uses Microsoft Dataverse. You are designing a Microsoft Copilot Studio agent for the portal. The agent must respond with a default help message when the user input is unclear and initiate external processes, such as retrieving the order status, when users make specific requests. Generative orchestration will be enabled for the solution. What should you recommend?","o":["The Fallback topic - The Escalate topic","A trigger phrase - A skill","A tool (connector) - A trigger phrase","The Fallback topic - A tool (connector)"],"a":[3],"e":"The Fallback topic runs when the agent cannot match the user's request, so it returns a default help message. With generative orchestration, the agent picks a tool or connector on its own to call APIs or flows, such as getting order status.","t":"Unclear = Fallback. Do something = Tool.","k":["Fallback topic","tool","connector","generative orchestration"]},{"id":"ab-100-14","d":"agentic-ai","x":"A company has a Microsoft Copilot Studio agent for customer support. You are reviewing and validating the following prompts: A prompt that has instructions to \"help the customer as best you can\". A prompt that helps retrieve product information from a knowledge base. You need to ensure that the agent delivers consistent and accurate responses. What should you do for each prompt? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["(1) Add filler words to make the prompt sound more natural - (2) Remove the knowledge source so that the model responds freely with general product information.","(1) Rewrite the prompt with clear and task-specific instructions - (2) Use responses with only reference sources and limit the response scope.","(1) Rewrite the prompt to limit the response length to 50 words - (2) Enable automatic multi-language translation for the knowledge base.","(1) Keep the prompt vague to enable model flexibility - (2) Add several open-ended questions to give the model broader context."],"a":[1],"e":"The prompt 'help the customer as best you can' is vague, so rewrite it with clear, task-specific instructions. For knowledge base retrieval, answer only from reference sources and limit scope to improve accuracy and reduce hallucination.","t":"Vague prompt? Make it specific. Knowledge prompt? Sources only.","k":["specific instructions","reference sources","hallucination"]},{"id":"ab-100-15","d":"agentic-ai","x":"A company has a customer order system that creates sales orders manually. You need to design an AI solution to automate the following tasks as part of the system: Save the order details to a database. Update the order status in the database. Extract the order details from an order file. Prepare and send a confirmation email to customers. The solution must minimize development effort and support intelligent automation and solution integration. What should you include in the design?","o":["A multi-agent solution that uses the Semantic Kernel SDK","A multi-agent solution that uses Microsoft Foundry Agent Service","A workflow in Azure Logic Apps","A Microsoft Copilot Studio agent that uses Microsoft Power Automate workflows"],"a":[3],"e":"Copilot Studio with Power Automate is low-code. Power Automate connectors extract file data, save and update the database, and send emails, while Copilot Studio adds intelligent orchestration. Semantic Kernel and Foundry Agent Service are pro-code, and Logic Apps lacks the low-code agent experience.","t":"Minimize dev effort + intelligent automation = Copilot Studio + Power Automate.","k":["Copilot Studio","Power Automate","low-code"]},{"id":"ab-100-16","d":"agentic-ai","x":"A company has an AI business solution. You need to extend the solution so that Microsoft 365 Copilot can invoke external logic hosted in Azure services. What should you include in the solution?","o":["Microsoft Power Platform connectors","Microsoft Copilot Studio skills","Custom engine agents"],"a":[1],"e":"Microsoft 365 Copilot calls external logic like Azure Functions, Logic Apps or REST APIs through Copilot Studio skills or actions. A skill describes the capability so Copilot can choose and invoke it. Connectors are used inside actions, and custom engine agents are a separate agent, not an extension.","t":"Extend M365 Copilot with Azure logic = SKILL.","k":["Copilot Studio skills","M365 Copilot","Azure logic"]},{"id":"ab-100-17","d":"agentic-ai","x":"A company has a Microsoft Power Platform solution that contains the following components: Microsoft Dataverse tables, a Microsoft Power BI workspace named WS1, a canvas app named App1 that uses Dataverse, and a Power BI semantic model that connects to Dataverse by using DirectQuery. You plan to use generative AI to provide answers to queries based on a subset of corporate data. You need to ensure that the data is available as a grounding data source for AI systems. What should you do?","o":["Share WS1.","Endorse the semantic model.","Export the semantic model.","Populate a Dataverse table."],"a":[3],"e":"To make a subset of corporate data a grounding source, store it where AI features can query it directly. Dataverse is deeply integrated with Power Platform and Copilot. Sharing, endorsing or exporting a Power BI model serves reporting, not grounding.","t":"Grounding for Power Platform AI = put it in DATAVERSE.","k":["Dataverse","grounding","Power BI"]},{"id":"ab-100-18","d":"agentic-ai","x":"A retail company plans to deploy Microsoft Copilot Studio agents to support: Microsoft Dynamics 365 Commerce scenarios. A Microsoft Power Apps inventory management solution. You need to recommend a solution to organize product catalog data as a consistent source for multiple AI systems. What should you recommend?","o":["Centralize the product catalog data in Microsoft Dataverse and expose the data to both agents.","Let each agent scrape product details from Microsoft SharePoint Online libraries.","Configure prompts to pull product details from the PDFs of external vendors.","Store the product catalog data in a separate custom table for each agent."],"a":[0],"e":"Centralizing the product catalog in Dataverse gives one consistent source that both the Commerce agent and the Power Apps solution can use. Scraping SharePoint or vendor PDFs is unstructured, and separate tables per agent duplicate data.","t":"Many AIs, one truth = central Dataverse.","k":["single source of truth","Dataverse","consistency"]},{"id":"ab-100-19","d":"agentic-ai","x":"You need to design a Microsoft Copilot Studio agent that meets the following requirements: Supports interactive speech responses and optimizes decision-making and the accuracy of responses. What should you include in the design for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.","o":["Azure Language in Foundry Tools — Speech Synthesis Markup Language (SSML)","Copilot Studio voice features — A deep reasoning model","Speech Synthesis Markup Language (SSML) — A deep reasoning model","A deep reasoning model — Speech Synthesis Markup Language (SSML)"],"a":[1],"e":"Copilot Studio voice features provide built-in interactive speech. A deep reasoning model improves decision-making and accuracy for complex requests. SSML only formats pronunciation and tone.","t":"Talk = Voice features. Think = Deep reasoning.","k":["voice features","deep reasoning model","SSML"]},{"id":"ab-100-20","d":"agentic-ai","x":"You are designing end-to-end test scenarios for a business solution that uses Microsoft Dynamics 365 Sales and Dynamics 365 Finance. You need to ensure that the business solution properly exchanges data between the Dynamics 365 apps and aligns with defined user workflows and business processes. Which testing types should you use?","o":["Drift - User acceptance","Integration - Performance","Integration - User acceptance","Exploratory - Performance"],"a":[2],"e":"Integration testing checks data exchange between Dynamics 365 Sales and Finance. User acceptance testing checks that the solution fits real user workflows and business processes.","t":"Apps talking = Integration. Users happy = UAT.","k":["integration testing","UAT"]},{"id":"ab-100-21","d":"agentic-ai","x":"A company plans to implement an AI business solution for a consumer goods company. You need to orchestrate sales order fulfillment and shipping, and analyze historical data and trends to replenish stock. Which agent types should you use?","o":["Task - Prompt-and-response","Autonomous - Prompt-and-response","Autonomous - Task","Prompt-and-response - Autonomous"],"a":[1],"e":"An autonomous agent fits order fulfillment and shipping, which is a multi-step process that runs independently. A prompt-and-response agent fits analysis of historical data, where a manager asks and gets results.","t":"Runs by itself = Autonomous. Ask and answer = Prompt-and-response.","k":["autonomous agent","prompt-and-response","orchestration"]},{"id":"ab-100-22","d":"agentic-ai","x":"A company has two Microsoft Power Platform environments named Dev1 and Prod1. A Microsoft Copilot Studio agent named Agent1 is built into a solution in the Dev1 environment. You plan to deploy Agent1 to Prod1. You need to make Agent1 available to the users in Prod1. The solution must minimize administrative effort. What should you do?","o":["Export the solution as an unmanaged solution and import the solution into Prod1.","Share Agent1 with the users in Prod1.","Create a new Copilot Studio agent in Prod1 by replicating the configuration of Agent1.","Export the solution as a managed solution and import the solution into Prod1."],"a":[3],"e":"In Power Platform ALM, managed solutions move components from Dev to Test or Prod. Exporting as managed and importing into Prod1 keeps deployment consistent with little admin effort and prevents unintended edits. Unmanaged is for Dev.","t":"Going to PROD? Go MANAGED.","k":["managed solution","ALM","Dev to Prod"]},{"id":"ab-100-23","d":"agentic-ai","x":"CASE STUDY — This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Background - Fabrikam, Inc., is a global consumer goods company that is undergoing a digital transformation initiative to migrate its entire infrastructure to the Microsoft cloud. As a key element of this cloud migration, the company will implement Microsoft Dynamics 365 Sales, moving away from the current on-premises proprietary technologies used by its business-to-business (B2B) sales team. As part of the cloud migration, Fabrikam will adopt an AI-first approach to its business solutions and implement AI solutions, wherever possible, to streamline operations. Problem Statements - Fabrikam's infrastructure currently relies on various on-premises systems that require sales executives to use corporate computers with physical keyboards to access business information during customer interactions. Mobile phones cannot be used for these purposes, as the systems depend on keyboard input. As a result, the sales executives spend a lot of time using keyboards to search for data on several disparate systems and file servers, rather than focusing on the customers. This affects the customer experience. Fabrikam stakeholders are concerned that users will be hesitant to adopt AI. If the AI initiatives are NOT adopted, cost savings will never be realized. Additionally, funding for future AI initiatives will depend on demonstrating an increase in AI adoption month over month. As the AI agent initiative for the sales team will be the first for Fabrikam, the rapid adoption of the agent is a high priority. Planned Initiatives - General - Fabrikam management has prioritized AI-driven projects to improve efficiency, customer engagement, and responsible AI adoption. The current application infrastructure is on-premises and must be migrated to the cloud to support the adoption of these technologies. Infrastructure Migration - Fabrikam plans to migrate from its current on-premises infrastructure to a completely cloud-based topology; this will include user authentication, the security framework, and, primarily, the adoption of the services by end users. All the data from the different systems will be consolidated into a single data source - a common data model that will use a Microsoft Dataverse environment as a single source of truth (SSOT) for the sales team. Sales Cycle Enablement - To achieve the company's objectives, Fabrikam intends to implement the following strategies to enhance the sales cycle: Use low-code development to create a single AI agent that has Dataverse as its core component. Ensure that sales managers can access unanswered correspondence from prospects and intervene as appropriate. Replace the previous proprietary software with Dynamics 365 Sales to track sales cycles and customer interactions. Have the sales executives use Dynamics 365 Sales to track interactions for open opportunities and send follow-up communications to prospects. Have the sales executives use handsfree headsets to interact with an AI agent when they have questions about internal policies or customer data. Requirements - Infrastructure Migration - Fabrikam has identified the following infrastructure migration requirements: Azure must be used for all future infrastructure workloads. The company must follow Microsoft-recommended methodologies for infrastructure migration to the cloud. Any created AI agents must have their return on investment (ROI) calculated to ensure that the solution will save the company money. Sales Cycle Enablement - Fabrikam has identified the following requirements for sales cycle enablement: The final AI agent must follow Microsoft recommendations for a conversational user experience. A designated checklist must be reviewed to ensure that the AI agent follows Microsoft deployment recommendations for a compliant solution. Detailed telemetry must be logged for the first created AI agent to help troubleshoot and optimize the agent during the initial AI agent adoption process. Unexpected AI agent actions must end in an escalation to a live representative. For example, a sales executive must be rerouted to a representative if the agent cannot answer a question after two failed attempts. The return on investment (ROI) of switching from the current process to the future process is required for stakeholder sign off. The sales team must use Dynamics 365 Sales to correspond with prospects more quickly and efficiently than currently. Sales managers must report on the adoption of the AI agent to key Fabrikam stakeholders on a monthly basis. Any sensitive information, such as user IDs and names, shared via the AI agent must be tracked for future auditing. Which framework should you use for the infrastructure migration?","o":["Microsoft Power Platform Project Setup Wizard","Microsoft Power Platform Center of Excellence (CoE)","Success by Design","Microsoft Cloud Adoption Framework for Azure"],"a":[3],"e":"The requirement is to move all infrastructure to Azure using Microsoft's recommended method. The Cloud Adoption Framework for Azure is that official guidance. Success by Design is for Dynamics 365 projects, CoE is Power Platform governance, and Project Setup Wizard sets up one project.","t":"Infrastructure to Azure = CAF (Cloud Adoption Framework).","k":["Cloud Adoption Framework","migration","Azure"]},{"id":"ab-100-24","d":"agentic-ai","x":"A company has a Microsoft Power Platform environment that contains Microsoft Dataverse data. You create a Microsoft Copilot Studio agent named Agent1 that processes the Dataverse data. You discover that Agent1 fails to return relevant or accurate results. You need to improve the quality and reliability of data grounding. What should you do?","o":["Verify and cleanse the Dataverse data.","Retrain Agent1.","Add example user inputs to the training data of Agent1.","Use an adaptive card in Agent1."],"a":[0],"e":"Grounding quality depends on source data. If Dataverse data is wrong, missing or duplicated, the agent returns poor results, so verify and cleanse it. Retraining or adding examples mainly helps intent understanding, and adaptive cards are UI.","t":"Garbage in, garbage out. Clean the data.","k":["data quality","cleanse data","grounding"]},{"id":"ab-100-25","d":"agentic-ai","x":"Case study - This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided i ataverse. A Fallback topic handles cases the agent cannot answer and can hand the conversation to a live representative.","t":"Low-code agent = Studio. Can't answer = Fallback.","k":["Copilot Studio","Fallback topic","escalation"]},{"id":"ab-100-26","d":"agentic-ai","x":"A company uses a Microsoft Copilot Studio agent to automate tasks in a web app. During testing, you discover that the automation sometimes fails because of frequent changes to the app's user interface. You need to recommend a solution to ensure that the agent successfully automates the tasks. The solution must minimize changes to the agent. What should you include in the recommendation?","o":["Custom models in Azure AI Studio","Conversation topics in Copilot Studio","An agent flow in Copilot Studio","Computer Use in Copilot Studio"],"a":[3],"e":"When the web UI changes often, fixed locators break. Computer Use in Copilot Studio works from what is visible on screen, so automation adapts to UI changes without much change to the agent.","t":"UI keeps changing? Let it SEE the screen = Computer Use.","k":["Computer Use","UI changes","automation"]},{"id":"ab-100-27","d":"agentic-ai","x":"A company uses Microsoft Foundry agents. You need to ensure that an agent can dynamically use external tools at runtime without updating the agent. What should you include in the solution?","o":["A Model Context Protocol (MCP) server","Microsoft Copilot Studio","Azure AI Search","A Microsoft Foundry hub"],"a":[0],"e":"An MCP server lets an agent discover and use external tools, APIs or data dynamically at runtime without updating the agent. A Foundry hub manages resources, AI Search handles retrieval, and Copilot Studio is a build platform.","t":"Dynamic tools at runtime = MCP (USB-C for tools).","k":["MCP","runtime tools","dynamic discovery"]},{"id":"ab-100-28","d":"agentic-ai","x":"CASE STUDY — This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you woul  the previous proprietary software with Dynamics 365 Sales to track sales cycles and customer interactions. Have the sales executives use Dynamics 365 Sales to track interactions for open opportunities and send follow-up communications to prospects. Have the sales executives use handsfree headsets to interact with an AI agent when they have questions about internal policies or customer data. Requirements - Infrastructure Migration - Fabrikam has identified the following infrastructure migration requirements: Azure must be used for all future infrastructure workloads. The company must follow Microsoft-recommended methodologies for infrastructure migration to the cloud. Any created AI agents must have their return on investment (ROI) calculated to ensure that the solution will save the company money. Sales Cycle Enablement - Fabrikam has identified the following requirements for sales cycle enablement: The final AI agent must follow Microsoft recommendations for a conversational user experience. A designated checklist must be reviewed to ensure that the AI agent follows Microsoft deployment recommendations for a compliant solution. Detailed telemetry must be logged for the first created AI agent to help troubleshoot and optimize the agent during the initial AI agent adoption process. Unexpected AI agent actions must end in an escalation to a live representative. For example, a sales executive must be rerouted to a representative if the agent cannot answer a question after two failed attempts. The return on investment (ROI) of switching from the current process to the future process is required for stakeholder sign off. The sales team must use Dynamics 365 Sales to correspond with prospects more quickly and efficiently than currently. Sales managers must report on the adoption of the AI agent to key Fabrikam stakeholders on a monthly basis. Any sensitive information, such as user IDs and names, shared via the AI agent must be tracked for future auditing. Which framework should you use to meet the AI agent requirements for the sales cycle enablement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Success by Design — Success by Design","Microsoft Power Platform Well-Architected framework — Success by Design","The ALM Accelerator for Microsoft Power Platform — Microsoft Power Platform Well-Architected framework","Success by Design — Microsoft Cloud Adoption Framework for Azure"],"a":[0],"e":"Success by Design fits both Copilot Studio practices and the conversational experience because it gives phased guidance, checklists and checkpoints for Dynamics 365 and Power Platform solutions. CAF is for Azure migration, ALM Accelerator is for deployment, Well-Architected is for architecture quality.","t":"D365 or Power Platform project guidance = Success by Design (both boxes).","k":["Success by Design","Dynamics 365","implementation"]},{"id":"ab-100-29","d":"agentic-ai","x":"A company uses Microsoft Dynamics 365 Finance to manage accounts payable. You are designing an AI invoice processing solution. You need to recommend the prerequisites to configure a prebuilt copilot for accounts payable. What should you recommend?","o":["Build an AI tool in Microsoft Foundry.","From Microsoft Copilot Studio, create an accounts payable agent.","Extend Microsoft 365 Copilot for Sales to an accounts payable agent.","From the Power Platform admin center, assign the Finance and Operations AI security role to users."],"a":[3],"e":"The accounts payable copilot is prebuilt in Dynamics 365 Finance. The prerequisite is assigning the Finance and Operations AI security role to users in the Power Platform admin center. Building custom agents is not needed.","t":"Prebuilt copilot? Don't build. Just assign the ROLE.","k":["prebuilt copilot","security role","accounts payable"]},{"id":"ab-100-30","d":"agentic-ai","x":"You need to recommend a Microsoft Power Platform solution for customer support. The solution must include AI capabilities in Microsoft Power Automate and must meet the following requirements: Use a centralized workspace for AI models. Generate short overviews from large amounts of unstructured text, such as case notes or transcripts, without requiring additional training or coding. What should you include in the recommendation for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","o":["Microsoft Dataverse - An AI Builder prebuilt prompt","Azure OpenAI Foundry - An AI Builder prebuilt model","Microsoft Copilot Studio - Azure OpenAI","Azure OpenAI Foundry - GitHub Copilot"],"a":[1],"e":"Azure OpenAI Foundry is the centralized workspace to manage and test AI models. To summarize case notes or transcripts in Power Automate with no training or code, use an AI Builder prebuilt model.","t":"Central model workspace = Foundry. No-code summary = AI Builder prebuilt.","k":["Foundry","AI Builder prebuilt","summarization"]},{"id":"ab-100-31","d":"agentic-ai","x":"You have an Azure subscription named Subscription1. In Subscription1, you create an Azure file share named share1. You create a shared access signature (SAS) named SAS1 as shown in the following exhibit.","o":["Scenario 1: Will be prompted for credentials / Scenario 2: Will have no access.","Scenario 1: Will have read, write, and list access / Scenario 2: Will have read, write, and list access.","Scenario 1: Will have no access / Scenario 2: Will have no access.","Scenario 1: Will have no access / Scenario 2: Will have read-only access."],"a":[3],"e":"Both scenarios get no access. Scenario 1 uses an IP outside the allowed range. Scenario 2 uses an allowed IP, but net use connects over SMB while the SAS allows HTTPS only, so it fails.","t":"SAS checks IP AND protocol. net use = SMB, not HTTPS.","k":["SAS","IP range","HTTPS only","SMB"]},{"id":"ab-100-32","d":"agentic-ai","x":"A financial services company uses Microsoft Dynamics 365 Finance. Currently, the company's support staff manually reviews customer transaction histories to detect potential fraud cases before escalating the cases. You need to recommend an automation solution for the review process. The solution must ensure that escalations reach a human analyst for final decision making. What should you recommend?","o":["Export the data to a data lake for analysis in Microsoft Power BI.","Configure a task agent to generate fraud risk scores for the human analyst to review.","Use Microsoft 365 Copilot in Word to automatically finalize fraud detection policies.","Deploy an autonomous agent that closes non-fraud cases automatically."],"a":[1],"e":"A task agent can analyze transaction history and generate fraud risk scores, then hand results to a human analyst for the final decision. That is human-in-the-loop. An autonomous agent closing cases removes human approval.","t":"Human must decide = Task agent scores, human approves.","k":["task agent","human-in-the-loop","fraud"]},{"id":"ab-100-33","d":"agentic-ai","x":"A company has an Azure environment that supports multiple business units. The company plans to implement an AI solution that will perform sentiment analysis on customer product reviews. You need to evaluate the potential cost of the solution to support return on AI investment (ROAI) analysis. What should you use?","o":["Cost Management + Billing","Total Cost of Ownership (TCO) Calculator","Azure Reservations","Microsoft Fabric SKU Estimator"],"a":[0],"e":"Cost Management + Billing tracks, allocates and forecasts Azure costs across business units, which supports ROAI cost evaluation. The Fabric estimator is Fabric-only, TCO compares on-prem with Azure, and Reservations are a discount mechanism.","t":"Running Azure costs across units = Cost Management + Billing.","k":["Cost Management","ROAI","business units"]},{"id":"ab-100-34","d":"agentic-ai","x":"Case study This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Overview - Contoso, Ltd. is a high-tech manufacturing company that uses Microsoft Dynamics 365 Finance. Dynamics 365 Supply Chain Management, and Dynamics 365 Commerce for its North American operations. The company designs and develops innovative products that have many patents and proprietary technologies. The patents and engineering designs are closely guarded secrets. Contoso executives want to integrate and adopt AI solutions to help scale the company in preparation for an anticipated period of rapid growth. The company has multiple legal entities and Azure subscriptions that will be used in the adopted AI solutions. Requirements - AI Adoption - The following executives will have specific responsibilities in the overall AI adoption: Chief Technology Officer (CTO): Select one Dynamics 365 Finance, Dynamics 365 Supply Chain Management or Dynamics 365 Commerce prebuilt AI agent and one custom Microsoft Copilot Studio AI agent to prioritize and deploy during the initial AI adoption phase. Chief Information Officer (CIO): Ensure that appropriate security labels are assigned to the data used by the AI agents. Chief Financial Officer (CFO): Analyze the return on investment (ROI) for the AI agents being deployed. Chief Information Security Officer (CISO): Discover and inventory AI resources for auditing. Chief Executive Officer (CEO): Ensure that all solutions adhere to industry-standard responsible AI practices. All AI initiatives and agents will have a detailed business use case, a defined audience profile, and an estimated ROI that will compare the cost savings of the current process against the estimated costs of using the new AI solutions. The company's research and development (R&D) department already has a custom Model Context Protocol (MCP) server that contains comprehensive product specifications and compliance data. Prebuilt AI Agent - The CTO has NOT yet selected which prebuilt AI agent to use in Dynamics 365 Supply Chain Management. The CTO wants to view available agent templates to identify which agent will add the most business value. Depending on which high-priority AI agents are identified, its agent capabilities must be previewed in a discovery meeting with the relevant business operation stakeholders. Custom AI Agent - Contoso has identified the following custom AI agent requirements: The custom AI agent will use data from Dynamics 365 Supply Chain Management to answer questions for the manufacturing team as a low-code solution. The custom AI agent will be accessible from within Microsoft Teams. The custom AI agent must be designed to eventually connect to other agents that can be selected based on their description. The topics used in the custom AI agent will be selected based NOT on a trigger phrase, but on a description of the purpose of the query, to make the interactions more conversational. The custom AI agent must be able to answer questions about product specifications by using existing technologies. The product specifications are maintained by the R&D department. The custom AI agent must be integrated with and accessible from Dynamics 365 Supply Chain Management. The custom AI agent must be able to use Dynamics 365 Supply Chain Management business logic that is stored outside of the application. Analysis, Reporting, and Troubleshooting Contoso has identified the following analysis, reporting, and troubleshooting requirements: The CISO will audit all the AI solutions monthly for compliance and security. The CFO will analyze all the AI solutions quarterly to compare the estimated ROI against actual measured efficiencies and adoption. The CFO will use the Copilot Studio agent usage estimator to perform this analysis. The CISO wants to identify how much sensitive data was accessed for a given AI agent run and who accessed the data. Too much sensitive data accessed by a single user might indicate a high security risk. The CTO wants to track user feedback on the quality of the AI agent responses during user interactions with the agents. Consistently poor feedback will trigger an escalated reengineering discussion. The CEO wants a quarterly assessment of all the required metrics for their specific responsibilities. The tools used for the assessments must be Microsoft-recommended and must verify reliability, interpretability, fairness, and compliance. The CFO wants to identify how many interactions with the AI agents are abandoned on a given day as compared to resolved conversations. Too many abandoned sessions might indicate that Copilot Studio credits are being used inefficiently by end users. What should you recommend to assist the CTO with the prebuilt agent selection process?","o":["Immersive Home","Agent management","Lifecycle Services (LCS)","Copilot Studio"],"a":[1],"e":"Agent management is the hub in Dynamics 365 finance and operations apps to discover, manage and preview prebuilt AI agents, which matches the CTO's task. Copilot Studio builds custom agents and LCS manages deployment lifecycle.","t":"Pick a PREBUILT agent = Agent management.","k":["Agent management","prebuilt agents","CTO"]},{"id":"ab-100-35","d":"agentic-ai","x":"You need to design a multi-agent solution that includes a custom agent. The solution must define the rules and constraints that the agent must follow and automate a backend process involving data movement between services that runs independently of the agent's reasoning steps. What should you include for each requirement?","o":["Conversation topics - Microsoft Power Automate cloud flow","Agent flows - Microsoft Power Pages","Microsoft Power Automate cloud flow - Microsoft Power Pages","Agent flows - Microsoft Power Automate cloud flow"],"a":[3],"e":"Agent flows define the rules, constraints and sequence the agent must follow. A Power Automate cloud flow automates backend data movement between services, independent of the agent's reasoning.","t":"Agent's rules = Agent flows. Backend plumbing = Cloud flow.","k":["agent flows","cloud flow","backend automation"]},{"id":"ab-100-36","d":"agentic-ai","x":"A company plans to deploy an AI-based customer service app that will autonomously manage interactions, escalate complex cases, and learn from historical ticket data. You need to perform a return on AI investment (ROAI) analysis of the app deployment. The solution must ensure that the analysis is accurate. What should you do first?","o":["Conduct an AI market benchmarking study.","Identify and quantify all the development, deployment, and operating costs.","Establish the AI performance metrics.","Model the customer experience."],"a":[1],"e":"An accurate ROAI analysis starts by identifying and quantifying all development, deployment and operating costs. Those costs are the baseline for comparing benefits. Metrics and customer experience come after.","t":"ROI first step = count the COSTS.","k":["ROAI","costs first"]},{"id":"ab-100-37","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company uses Microsoft 365 and Dynamics 365. You need to recommend a solution to automatically summarize email threads, generate suggested replies in Microsoft Outlook, and provide meeting preparation summaries that include relevant customer relationship management (CRM) data. Solution: You recommend Microsoft 365 Copilot for Sales. Does this meet the goal?","o":["Yes","No"],"a":[0],"e":"Yes. Microsoft 365 Copilot for Sales works in Outlook and Teams with a CRM like Dynamics 365. It summarizes email threads, suggests replies and gives CRM context for meeting prep.","t":"Outlook + CRM + Sales = Copilot for Sales. Yes.","k":["Copilot for Sales","Outlook","CRM","Yes"]},{"id":"ab-100-38","d":"agentic-ai","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem. After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. A company has a Microsoft Dynamics 365 Sales environment that has Microsoft Copilot enabled. You need to customize Copilot by tailoring how opportunity summaries are generated or how they are presented to users. Solution: You add the opportunity summary widget to the Opportunity form. Does this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. Adding the opportunity summary widget only shows an existing UI component. It does not change how Copilot generates the summary or what it contains.","t":"Widget = display only. Doesn't customize. No.","k":["widget","opportunity summary","No"]},{"id":"ab-100-39","d":"agentic-ai","x":"A company plans to deploy a Microsoft Copilot Studio agent to enhance customer support. The company stores customer data across ServiceNow, Microsoft Dynamics 365 Finance, Dynamics 365 Supply Chain Management, and Excel files in SharePoint Online. You need to recommend a solution to ensure that the agent can deliver accurate and timely responses. What should you recommend?","o":["Enable incremental indexing in Azure AI Search.","Create custom prompts.","Implement Microsoft Power Platform connectors.","Implement a model router for query handling."],"a":[2],"e":"Power Platform connectors give ready-made, secure API connections so Copilot Studio can reach ServiceNow, Dynamics 365 and SharePoint Excel files in real time. A model router only routes between models, custom prompts give no data access, and AI Search is not the most direct option here.","t":"Many business systems + live data = CONNECTORS.","k":["Power Platform connectors","ServiceNow","real-time data"]},{"id":"ab-100-40","d":"agentic-ai","x":"A company processes invoices stored across multiple systems in multiple formats. You need to implement an AI solution to automate the invoice processing. The solution must meet the following requirements: Automate multi-step invoice processing tasks, including document analysis, data validation, and approval routing. Enable users to interact directly via Microsoft Teams to review and approve invoices. Minimize development efforts to define and customize approval workflows. What should you include in the solution?","o":["Azure OpenAI and Azure Functions","Microsoft Copilot Studio and AI Builder","Azure Document Intelligence in Foundry Tools and Azure Logic Apps","A SharePoint agent"],"a":[1],"e":"AI Builder has a prebuilt invoice processing model to extract and analyze invoice data. Copilot Studio lets users review and approve in Teams and builds low-code workflows. Logic Apps, Functions and Azure OpenAI need more pro-code work.","t":"Invoice + Teams + low-code = Copilot Studio + AI Builder.","k":["AI Builder","invoice processing","Teams","low-code"]},{"id":"ab-100-41","d":"agentic-ai","x":"A company uses Microsoft Dynamics 365 Sales to manage leads that are stored in a Microsoft Dataverse table named Lead and use non-standard terminology and custom columns. You need to configure business terms in the Lead table so that Microsoft Copilot controls can summarize the leads efficiently. The solution must minimize administrative effort. How should you configure the business terms?","o":["Map the field display names as business terms.","Add the schema names as business terms.","Create new business terms for each field.","Combine all the fields into one custom field."],"a":[0],"e":"Copilot uses Dataverse metadata to understand data. Display names are the friendly business-language labels, so mapping them as business terms helps Copilot understand custom columns with minimal admin effort.","t":"Business terms = DISPLAY names (human words), not schema names.","k":["business terms","display names","Dataverse metadata"]},{"id":"ab-100-42","d":"agentic-ai","x":"A company has a portfolio of AI initiatives at different stages of development. You need to recommend a structured approach to evaluating the return on AI investment (ROAI) across all the initiatives. The solution must balance immediate results with long-term values and strategic innovations. What should you include in the recommendation?","o":["The internal rate of return (IRR) function","A simple cost and benefit analysis","A horizon-based framework","A prioritization grid"],"a":[2],"e":"A horizon-based framework groups initiatives by time horizon: H1 optimizes current results, H2 builds new opportunities, H3 explores strategic innovation. It balances short-term and long-term value. IRR or cost-benefit only look at finance, and a grid only ranks.","t":"Now + later + future innovation = HORIZONS (H1, H2, H3).","k":["horizon-based framework","ROAI","portfolio"]},{"id":"ab-100-43","d":"agentic-ai","x":"You are designing a low-code AI business solution by using Microsoft Copilot Studio. The solution must include an agent that automates tasks by simulating user interactions across third-party apps and websites, such as clicking buttons, entering text, and extracting information from screens. You need to recommend what to include in the agent. What should you recommend?","o":["Copilot skills","Model Context Protocol (MCP)","A natural language understanding + (NLU+) model in Copilot Studio","Computer Use in Copilot Studio"],"a":[3],"e":"Computer Use lets the agent mimic a user on third-party apps and websites: clicking buttons, typing text and reading screens. MCP connects tools and data, NLU+ understands language, and skills call configured flows or APIs.","t":"Click + type + read screen = Computer Use.","k":["Computer Use","UI automation","third-party apps"]},{"id":"ab-100-44","d":"agentic-ai","x":"CASE STUDY This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Background - Fabrikam, Inc., is a global consumer goods company that is undergoing a digital transformation initiative to migrate its entire infrastructure to the Microsoft cloud. As a key element of this cloud migration, the company will implement Microsoft Dynamics 365 Sales, moving away from the current on-premises proprietary technologies used by its business-to-business (B2B) sales team. As part of the cloud migration, Fabrikam will adopt an AI-first approach to its business solutions and implement AI solutions, wherever possible, to streamline operations. Problem Statements - Fabrikam's infrastructure currently relies on various on-premises systems that require sales executives to use corporate computers with physical keyboards to access business information during customer interactions. Mobile phones cannot be used for these purposes, as the systems depend on keyboard input. As a result, the sales executives spend a lot of time using keyboards to search for data on several disparate systems and file servers, rather than focusing on the customers. This affects the customer experience. Fabrikam stakeholders are concerned that users will be hesitant to adopt AI. If the AI initiatives are NOT adopted, cost savings will never be realized. Additionally, funding for future AI initiatives will depend on demonstrating an increase in AI adoption month over month. As the AI agent initiative for the sales team will be the first for Fabrikam, the rapid adoption of the agent is a high priority. Planned Initiatives - General - Fabrikam management has prioritized AI-driven projects to improve efficiency, customer engagement, and responsible AI adoption. The current application infrastructure is on-premises and must be migrated to the cloud to support the adoption of these technologies. Infrastructure Migration - Fabrikam plans to migrate from its current on-premises infrastructure to a completely cloud-based topology; this will include user authentication, the security framework, and, primarily, the adoption of the services by end users. All the data from the different systems will be consolidated into a single data source - a common data model that will use a Microsoft Dataverse environment as a single source of truth (SSOT) for the sales team. Sales Cycle Enablement - To achieve the company's objectives, Fabrikam intends to implement the following strategies to enhance the sales cycle: Use low-code development to create a single AI agent that has Dataverse as its core component. Ensure that sales managers can access unanswered correspondence from prospects and intervene as appropriate. Replace the previous proprietary software with Dynamics 365 Sales to track sales cycles and customer interactions. Have the sales executives use Dynamics 365 Sales to track interactions for open opportunities and send follow-up communications to prospects. Have the sales executives use handsfree headsets to interact with an AI agent when they have questions about internal policies or customer data. Requirements - Infrastructure Migration - Fabrikam has identified the following infrastructure migration requirements: Azure must be used for all future infrastructure workloads. The company must follow Microsoft-recommended methodologies for infrastructure migration to the cloud. Any created AI agents must have their return on investment (ROI) calculated to ensure that the solution will save the company money. Sales Cycle Enablement - Fabrikam has identified the following requirements for sales cycle enablement: The final AI agent must follow Microsoft recommendations for a conversational user experience. A designated checklist must be reviewed to ensure that the AI agent follows Microsoft deployment recommendations for a compliant solution. Detailed telemetry must be logged for the first created AI agent to help troubleshoot and optimize the agent during the initial AI agent adoption process. Unexpected AI agent actions must end in an escalation to a live representative. For example, a sales executive must be rerouted to a representative if the agent cannot answer a question after two failed attempts. The return on investment (ROI) of switching from the current process to the future process is required for stakeholder sign off. The sales team must use Dynamics 365 Sales to correspond with prospects more quickly and efficiently than currently. Sales managers must report on the adoption of the AI agent to key Fabrikam stakeholders on a monthly basis. Any sensitive information, such as user IDs and names, shared via the AI agent must be tracked for future auditing. Which tool should you use for the prospect communication requirements in Dynamics 365 Sales?","o":["Copilot email assist","Deep Research in Microsoft Foundry Agent Service","Azure AI Search","The Voice template in Microsoft Copilot Studio"],"a":[0],"e":"Copilot email assist in Dynamics 365 Sales helps sellers draft, summarize and reply to prospect emails faster. AI Search is for search, the Voice template is for speech, and Deep Research is not a daily email tool.","t":"Talk to prospects faster in Sales = EMAIL assist.","k":["Copilot email assist","Dynamics 365 Sales","prospects"]},{"id":"ab-100-45","d":"agentic-ai","x":"A company plans to deploy a Microsoft Dynamics 365 Contact Center agent. You need to ensure that the agent can transfer the conversation to a live customer service representative. Which two components should you include in the solution? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","o":["An Azure AI Bot Service skill","Customer engagement hub","Microsoft Copilot Studio","Microsoft 365 Agents Toolkit","Microsoft Foundry"],"a":[1,2],"e":"Copilot Studio builds and configures the agent, including escalation to a human. The Customer engagement hub receives the transferred conversation, queues it and routes it to the right customer service representative.","t":"Build the bot (Studio) + hand-off desk (Customer engagement hub).","k":["Copilot Studio","Customer engagement hub","live agent transfer"]},{"id":"ab-100-46","d":"agentic-ai","x":"You plan to use a Data Science Virtual Machine (DSVM) with the open source deep learning frameworks Caffe2 and PyTorch. You need to select a pre-configured DSVM to support the frameworks. What should you create?","o":["Data Science Virtual Machine for Windows 2012","Data Science Virtual Machine for Windows 2016","Data Science Virtual Machine for Linux (CentOS)","Data Science Virtual Machine for Linux (Ubuntu)","Geo AI Data Science Virtual Machine with ArcGIS"],"a":[3],"e":"The Ubuntu Linux DSVM comes preconfigured with open source deep learning frameworks like Caffe2 and PyTorch plus the needed drivers. Windows, CentOS and Geo AI DSVMs serve other purposes.","t":"Deep learning open source = Ubuntu DSVM.","k":["DSVM","Ubuntu","PyTorch","Caffe2"]},{"id":"ab-100-47","d":"agentic-ai","x":"A company has a Microsoft Power Platform environment. You need to build two agents named Agent1 and Agent2. Agent1 must be extendable by using the Semantic Kernel and must connect to multiple business apps and APIs. Agent2 must connect directly to data stored in Microsoft Dataverse and must be embeddable in a Microsoft Power Apps canvas app. What should you use to build each agent?","o":["Microsoft Foundry - Azure Logic Apps","Microsoft Copilot Studio - Copilot in Power Apps","Microsoft Copilot Studio - Azure Logic Apps","Copilot in Power Apps - Microsoft Copilot Studio"],"a":[1],"e":"Agent1 needs Semantic Kernel extensibility and many app and API connections, which Copilot Studio supports. Agent2 must work with Dataverse and be embedded in a canvas app, which is what Copilot in Power Apps does.","t":"Extend + many APIs = Studio. Inside a canvas app = Copilot in Power Apps.","k":["Copilot Studio","Copilot in Power Apps","Semantic Kernel","canvas app"]},{"id":"ab-100-48","d":"agentic-ai","x":"A company has an AI agent that automates the review of customer feedback stored in a cloud database. You plan to generate monthly reports from the agent's output to provide insights into customer sentiment and guide product development and marketing. You need to ensure that the data ingested by the agent is clean and suitable for the intended use. What should you do to prepare the data?","o":["Create a workflow in Microsoft Power Automate.","Identify and address biased data.","Sort the database by customer last name.","Create an agent flow in Microsoft Copilot Studio."],"a":[1],"e":"Customer feedback data can be biased, for example only very happy or very angry customers respond. Identify and fix bias so sentiment reports are reliable. Automation flows or sorting by last name do not improve data quality.","t":"Clean data for insights = remove BIAS.","k":["biased data","data preparation","sentiment"]},{"id":"ab-100-49","d":"agentic-ai","x":"You need to design a Microsoft 365 Copilot solution to optimize employee productivity. The solution must meet the following requirements: Ensure that the employees can query content stored in a subset of Microsoft SharePoint Online sites and in Teams by using natural language-based prompt actions. Ensure that employees receive contextually relevant responses in Microsoft 365 Copilot. What should you include in the design?","o":["Build a Microsoft Power Automate desktop flow to read the SharePoint content and post the responses to Teams.","Create a custom REST API that crawls the SharePoint content.","Modify SharePoint settings.","Configure Microsoft Graph access."],"a":[3],"e":"Microsoft Graph is the main access layer that lets Microsoft 365 Copilot query SharePoint and Teams content in context while respecting user permissions. No custom crawler or desktop flow is needed.","t":"M365 content for Copilot = Microsoft GRAPH.","k":["Microsoft Graph","M365 Copilot","SharePoint","Teams"]},{"id":"ab-100-50","d":"agentic-ai","x":"You are designing a testing solution for Microsoft Copilot Studio agents. You need to validate prompt engineering best practices to ensure that the agents generate accurate and contextually relevant responses. Which prompt validation techniques and metrics should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point","o":["Use prompts that have varied phrasing - Response relevance and accuracy.","Exclude domain-specific terminology from the prompts - The response generation time.","Keep the prompt vague to enable model flexibility - The number of active user sessions.","Use only simple, one-word prompts - The number of words generated per response."],"a":[0],"e":"Test with prompts that use varied phrasing to check that the agent understands the same intent in real situations. Measure response relevance and accuracy. Word count, generation time and session counts do not measure content quality.","t":"Test many phrasings, score relevance + accuracy.","k":["varied phrasing","relevance","accuracy","prompt testing"]},{"id":"ab-100-51","d":"agentic-ai","x":"A company has a Microsoft 365 tenant in Canada and multiple Microsoft Power Platform environments in Canada and the United States. The company plans to deploy a Microsoft Copilot Studio agent to the Canadian environment that will use: Microsoft Dataverse data stored in Canada. A connector that connects to an Azure OpenAI instance in the United States. You need to ensure that the agent adheres to data residency and data movement policies before being deployed. What should you do?","o":["Migrate the tenant to the United States.","Ensure that the data processed by Azure OpenAI is stored in the United States.","From the Microsoft Purview portal, validate the Data loss prevention settings.","Ensure that cross-region data movement is enabled for the Canadian environment and connector dependencies."],"a":[3],"e":"The Canadian agent calls Azure OpenAI in the US, so data crosses regions. Enable cross-region data movement for the Canadian environment and the connector dependencies before deployment. Moving the tenant or only checking DLP does not solve this.","t":"Data crossing borders? Allow CROSS-REGION movement.","k":["cross-region data movement","data residency","connector"]},{"id":"ab-100-52","d":"agentic-ai","x":"You need to recommend a Microsoft Power Platform business solution that consolidates data from multiple internal and external data sources. The solution must meet the following requirements: Provide the data as a centralized source for multiple AI systems, including Microsoft Copilot Studio agents, Dynamics 365 applications, and external AI models. Support built-in data classification and protection policies. Provide data for grounding and analytics. What should you include in the recommendation?","o":["Azure Data Lake Storage","Azure Cosmos DB","Microsoft Dataverse","A Microsoft Power BI semantic model"],"a":[2],"e":"Dataverse is the central data platform for Power Platform and Dynamics 365. It serves Copilot Studio, Dynamics apps and other AI systems, and has built-in security, classification and protection. Data Lake and Cosmos DB are general Azure services, and Power BI models are for analytics.","t":"Central data for Power Platform + D365 + protection = DATAVERSE.","k":["Dataverse","centralized source","data protection"]},{"id":"ab-100-53","d":"agentic-ai","x":"A company has an Azure environment that supports multiple business units. The company plans to implement an AI solution that will perform sentiment analysis on customer product reviews. You need to evaluate the potential cost of the solution to support return on AI investment (ROAI) analysis. What should you use?","o":["Azure pricing calculator","Anomaly Detection in Azure Cost Management","Azure Reservations","Microsoft Fabric SKU Estimator"],"a":[0],"e":"The Azure pricing calculator estimates expected costs of Azure services before deployment, such as Azure OpenAI or AI Language for sentiment analysis, which feeds the ROAI analysis. Reservations are discounts, and Anomaly Detection tracks costs already incurred.","t":"POTENTIAL (future) cost = Pricing calculator.","k":["Azure pricing calculator","ROAI","cost estimate"]},{"id":"ab-100-54","d":"agentic-ai","x":"A company uses Microsoft Dynamics 365 Finance for accounts payable and customer debt recovery. You are designing an AI finance process that meets the following requirements: Provides AI-driven details to help staff identify overdue vendor invoices and outstanding balances. Helps staff reduce how long it takes to review overdue invoices and payment history. You need to recommend which Microsoft Copilot features to include in the design. What should you recommend for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point
