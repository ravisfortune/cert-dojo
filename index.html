eating a workflow in YAML.\nYou need to ensure that the workflow pauses for human approval and continues with the refund step only after approval is granted.\nHow should you complete the workflow definition? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["configuration 1: basic_chat; configuration 2: approval == \"approved\"","configuration 1: ask_question; configuration 2: approval == \"approved\"","configuration 1: ask_question; configuration 2: propose_refund.output != null","configuration 1: data_transformation; configuration 2: true"],"a":[1],"e":"The ask_question step pauses the workflow and collects a human approval. The refund step should run only when approval == \"approved\". Checking that a proposal exists does not prove approval, and true skips the gate.","t":"Pause for a human = ASK_QUESTION. Gate = approval == approved.","k":["ask_question","human approval","workflow YAML"]},{"id":"ai-103-12","d":"models","x":"You have an Azure Speech in Foundry Tools resource that hosts a custom speech to text model deployed to a custom endpoint. An agent uses the endpoint to perform real-time speech recognition.\nYou are approaching the expiration date of the custom speech to text model.\nWhat is the expected behavior when the model expires?","o":["Speech recognition requests will continue to use the expired custom model until the model is removed manually.","Speech recognition requests will fall back to the most recent base model for the same locale.","Speech recognition requests will return a 4xx error until a new custom model is deployed.","The custom model will be deleted automatically when the model expires."],"a":[1],"e":"When a deployed custom speech-to-text model expires, requests to the custom endpoint fall back to the latest base model for the same locale. It does not keep serving the expired model, does not return 4xx just for that, and is not deleted automatically.","t":"Expired custom model = FALLS BACK to base model.","k":["model expiration","fallback","base model"]},{"id":"ai-103-13","d":"models","x":"You have a Microsoft Foundry project that contains a model deployment.\nYou have an application that calls the deployment by using the Azure OpenAI v1 API and DefaultAzureCredential.\nThe developers at your company receive HTTP 403 errors when they send inference requests, even after running az login.\nYou need to ensure that the developers can perform model inference. The solution must follow the principle of least privilege.\nWhich role-based access control (RBAC) role should you assign to the developers?","o":["Cognitive Services Data Reader","Cognitive Services User","Cognitive Services OpenAI User","Contributor"],"a":[2],"e":"Cognitive Services OpenAI User grants permission to call Azure OpenAI inference APIs with Entra ID auth, fixing the 403 with least privilege. Cognitive Services User is not the Azure OpenAI data-plane role, Contributor is too broad, and Data Reader does not allow inference.","t":"403 on OpenAI inference = OpenAI USER role.","k":["Cognitive Services OpenAI User","RBAC","least privilege","403"]},{"id":"ai-103-14","d":"models","x":"You have a Microsoft Foundry project that contains an agent. The agent has a Model Context Protocol (MCP) tool that queries a knowledge base stored in Azure AI Search.\nSome agent runs return answers from the base model without invoking the knowledge base, which results in responses without grounded citations.\nYou are provided with the following code snippet that runs the agent.\n\nYou need to add the correct tool_choice parameter to the code to deterministically force the agent to invoke the MCP tool on each run.\nWhat should you add?","o":["tool_choice={\"type\": \"mcp\"}","tool_choice={\"auto\"}","tool_choice={\"required\"}","tool_choice={\"type\": \"knowledge_base\"}"],"a":[2],"e":"Setting tool_choice to required forces the agent to call at least one available tool every run, so it cannot answer from the base model alone. auto lets the model skip tools, and mcp or knowledge_base are not valid tool_choice values for this.","t":"Must call a tool every time = REQUIRED.","k":["tool_choice","required","grounded citations"]},{"id":"ai-103-15","d":"models","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains a customer support agent grounded in internal documentation.\nAfter a recent update, users report the following issues:\nSome answers are unsupported by retrieved documents.\nA small number of responses are flagged for policy violations.\nYou need to evaluate each issue.\nWhich observability signals should you use for each issue? To answer, drag the appropriate observability signals to the correct issues. Each observability signal may be used once, more than once, or not at all. You may need to drag the spit bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.\n\nSelect the correct issue/observability-signal combination.","o":["Unsupported answers: Latency breakdown; Policy violations: Token usage","Unsupported answers: Token usage; Policy violations: Groundedness evaluator","Unsupported answers: Groundedness evaluator; Policy violations: Safety evaluation signal","Unsupported answers: Safety evaluation signal; Policy violations: Trace timing"],"a":[2],"e":"The groundedness evaluator compares responses with retrieved documents and flags unsupported claims. The safety evaluation signal measures risk and policy violations. Token usage, latency and trace timing explain cost and performance, not grounding or safety.","t":"Made-up claims = GROUNDEDNESS. Rule breaks = SAFETY.","k":["groundedness evaluator","safety evaluation"]},{"id":"ai-103-16","d":"models","x":"You have a Microsoft Foundry project named Project1 that contains an agent. The agent uses an OpenAPI 3.0 specification to call an external weather service.\nThe weather service requires a key to be passed in an HTTP header. The key value is stored as a connection in Project1.\nYou need to ensure that the key value from the connection is included automatically whenever the OpenAPI tool is invoked.\nWhat should you configure in the OpenAPI specification?","o":["an API key security scheme","a header parameter defined for each operation","a Bearer token security scheme","an Azure Key Vault connection"],"a":[0],"e":"Define an API key security scheme in the OpenAPI spec with the key located in the required HTTP header. When the tool uses the project connection, Foundry automatically applies the stored key. A manual header parameter does not link to the secret, and Bearer is for tokens.","t":"Key from connection in header = API KEY security scheme.","k":["OpenAPI","API key security scheme","connection"]},{"id":"ai-103-17","d":"models","x":"You have a Microsoft Foundry project that serves a high-volume chat app.\nMost requests are simple FAQs, but some require advanced reasoning.\nYou need to reduce costs and latency for common queries, without degrading the quality of the responses to complex questions.\nWhat should you do?","o":["Use a model cascade that routes the requests to different models.","Route all the requests to a smaller model.","Route all the requests to the most capable model.","Increase the value of the max_tokens parameter for all the requests."],"a":[0],"e":"A model cascade sends simple FAQs to a smaller, faster, cheaper model and routes complex requests to a stronger model. This cuts cost and latency without hurting quality on hard questions.","t":"Easy to small, hard to big = CASCADE.","k":["model cascade","model router","cost","latency"]},{"id":"ai-103-18","d":"models","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an internal Q&A agent.\nUsers report the following issues when they ask the agent questions:\nAn increase in the following response: “No relevant information found”\nPeriodic HTTP 429 rate limit exceeded errors during peak hours\nYou need to identify whether each issue is caused by model unavailability, resource limits, or inference failures.\nWhat should you do? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["Metrics: Time To Response and Total Tokens; Diagnostic log: trace","Metrics: Only Tokens Cache Match Rate; Diagnostic log: AllMetrics","Metrics: Only Total Requests filtered to status code 200; Diagnostic log: audit","Metrics: Model Availability Rate and Provisioned Utilization; Diagnostic log: RequestResponse"],"a":[3],"e":"Model Availability Rate shows whether the model is available, and Provisioned Utilization shows whether capacity limits cause the 429s. The RequestResponse diagnostic log records request and response details, including errors, to investigate inference failures.","t":"Availability + Utilization metrics, RequestResponse log.","k":["Model Availability Rate","Provisioned Utilization","RequestResponse log","429"]},{"id":"ai-103-19","d":"models","x":"You have a Microsoft Foundry project that contains a high-traffic agent.\nAfter a recent update, operational costs increase significantly.\nMonitoring confirms that the volume of user traffic to the agent remains unchanged.\nYou suspect that changes to the request or response characteristics are causing the increase. You need to identify whether the additional costs are driven by the model input size, the model output size, or expanded tool usage.\nWhich observability capability should you use?","o":["token usage","evaluation metrics","run success rate","latency"],"a":[0],"e":"Token usage shows input and output token consumption, so you can see bigger prompts, longer responses or tool-related context driving cost while traffic is flat. Latency, evaluation metrics and success rate do not reveal token-based cost sources.","t":"Cost up, traffic flat = check TOKENS.","k":["token usage","cost","input vs output"]},{"id":"ai-103-20","d":"models","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an agent.\nThe agent uses tools to retrieve internal content and call external APIs. The agent is configured to let the model decide when to call the tools.\nYou need to publish the agent for a compliance workflow. The solution must meet the following requirements:\nEach workflow run must include a retrieval step before generating a response.\nTool calls must authenticate by using the published agent’s own identity.\nTool access must use an identity isolated from other project resources.\nTool access must use support audit tracing.\nWhat should you do? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["tool_choice: required; authentication: Using a distinct agent identity bound to the client application","tool_choice: none; authentication: Storing API keys in prompts","tool_choice: required; authentication: Using the shared project agent identity","tool_choice: auto; authentication: Using the shared project agent identity"],"a":[0],"e":"tool_choice required forces a tool call every run, so retrieval always happens first. A distinct agent identity bound to the client application isolates tool access from other project resources, supports keyless auth as the published agent, and is traceable for audits.","t":"Always retrieve = REQUIRED. Isolated identity = DISTINCT agent identity.","k":["tool_choice required","agent identity","audit"]},{"id":"ai-103-21","d":"models","x":"You have a Microsoft Foundry project named Project1 that contains the following:\nAn OpenAPI tool that calls an external API\nA project connection named Connection1 that stores the API key of the external API\nWhen an agent calls the OpenAPI tool, the API returns a 401 unauthorized error, and traces show that the API key header is NOT being sent.\nYou need to ensure that the OpenAPI tool automatically includes the API key from Connection1 on all requests.\nWhat should you do?","o":["Enable identity passthrough so that the tool uses the Microsoft Entra token of the caller.","Connect the tool to Connection1.","Configure the tool to use the default connection of Project1.","Add the API key header manually to the OpenAPI specification."],"a":[1],"e":"Connecting the OpenAPI tool to Connection1 links it to the stored API key credential so Foundry attaches the key header automatically. Identity passthrough sends an Entra token, and adding the header manually does not fill in the secret safely.","t":"401 + missing key header = CONNECT the tool to the connection.","k":["OpenAPI tool","connection","401","API key"]},{"id":"ai-103-22","d":"models","x":"You have a Microsoft Foundry project that contains a customer support agent. The agent calls an internal knowledge API tool before generating responses.\nUsers report the following issues:\nSome requests take more than 15 seconds to complete.\nSome responses are incorrect, even when the knowledge API returns the expected data.\nYou need to inspect individual agent runs to view the ordered sequence of large language model (LLM) calls, tool invocations, and timing information.\nWhich observability capability should you use?","o":["safety metrics","monitoring","token usage","tracing"],"a":[3],"e":"Tracing gives an ordered per-run view of LLM calls, tool invocations, inputs, outputs and timing spans, so you can find both slow steps and reasoning problems after the tool returns. Token usage, monitoring and safety metrics are aggregates.","t":"Step-by-step story of one run = TRACING.","k":["tracing","spans","tool invocations","latency"]},{"id":"ai-103-23","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure a prompt shield for user prompts.\nDoes this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. A prompt shield for user prompts protects against injection in text the user types directly. It does not moderate unsafe images or inspect text extracted from images for hidden instructions.","t":"User-prompt shield misses image text. No.","k":["prompt shield","user prompt","No"]},{"id":"ai-103-24","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure image moderation to block unsafe content before processing the images.\nDoes this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. Image moderation blocks unsafe images before processing, but it cannot detect hidden injection instructions inside a safe-looking image.","t":"Moderation catches ugly images, not hidden commands. No.","k":["image moderation","indirect prompt injection","No"]},{"id":"ai-103-25","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure a prompt shield for documents.\nDoes this meet the goal?","o":["No","Yes"],"a":[1],"e":"Yes. A prompt shield for documents detects indirect prompt injection in user-provided content, including instructions in text extracted from images before the model responds.","t":"Hidden instructions in content = DOCUMENT prompt shield. Yes.","k":["document prompt shield","indirect injection","Yes"]},{"id":"ai-103-26","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure protected material detection.\nDoes this meet the goal?","o":["No","Yes"],"a":[0],"e":"No. Protected material detection finds copyrighted text and code. It does not moderate unsafe images or block hidden manipulation instructions.","t":"Protected material = copyright, not safety. No.","k":["protected material detection","copyright","No"]},{"id":"ai-103-27","d":"models","x":"Question: 27\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend a solution to assess the responses generated by Agent1 when the agent uses the product information stored in storage1. The solution must meet the technical requirements.\nWhat should you include in the recommendation?","o":["a custom guardrail","a groundedness evaluator","a Retrieval Augmented Generation (RAG) evaluator","model fine-tuning"],"a":[2],"e":"A RAG evaluator assesses the whole retrieval-augmented flow: retrieval quality plus response relevance, completeness and groundedness. A groundedness evaluator is narrower, guardrails control runtime behavior, and fine-tuning is not evaluation.","t":"Judge the whole retrieve+answer chain = RAG evaluator.","k":["RAG evaluator","retrieval quality","evaluation"]},{"id":"ai-103-28","d":"models","x":"Question: 28\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure Agent1 to answer customer questions about only the Contoso products. The solution must meet the business requirements.\nWhat should you do?","o":["Add few-shot examples.","Increase the value of the temperature parameter.","Apply top-p sampling.","Modify the system message instructions."],"a":[3],"e":"System message instructions set the agent's fixed behavior and scope, so they can tell Agent1 to answer only about Contoso products and refuse other topics. Few-shot examples are softer, and temperature or top-p only control randomness.","t":"Scope rules live in the SYSTEM message.","k":["system message","scope","instructions"]},{"id":"ai-103-29","d":"models","x":"You have a Microsoft Foundry project.\nYou plan to build a customer support solution that contains an agent. The solution must meet the following requirements:\nProvide accurate, context-aware responses grounded in internal product documentation stored in Azure AI Search.\nRequire deep, multi-step reasoning across long contexts.\nGenerate detailed natural language responses.\nWhich type of model should you use to power the agent?","o":["a key phrase extraction model","a multimodal model","a small language model (SLM)","a large language model (LLM)"],"a":[3],"e":"An LLM can synthesize Azure AI Search results into detailed natural-language answers and reason across long contexts. Multimodal is for images or audio, SLMs suit simpler tasks, and key phrase extraction is a narrow NLP task.","t":"Deep + long + detailed = LARGE language model.","k":["LLM","long context","reasoning"]},{"id":"ai-103-30","d":"models","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains a deployed ticket-triage agent.\nYou discover that sometimes the agent responds without calling any tools, even when a tool is required.\nYou need to ensure that the agent calls a tool during execution.\nHow should you complete the Python code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.","o":["\"tool_choice\": \"required\"","\"type\": \"tools\"","\"tool_choice\": \"auto\"","\"response_format\": \"required\""],"a":[0],"e":"Set \"tool_choice\": \"required\" in the run payload so the agent must call at least one tool. auto lets the model decide, and response_format controls output shape, not tool calls.","t":"Force a tool call = tool_choice REQUIRED.","k":["tool_choice","required"]},{"id":"ai-103-31","d":"models","x":"You are building a web app named App1 that generates responses by using a model deployed to a Microsoft Foundry project named Project1.\nBefore sending the prompts to the model, App1 must retrieve documents by using Azure AI Search.\nYou need to integrate Project1 and App1. The solution must meet the following requirements:\nMultiple client applications must use the same search configuration.\nA security policy must prevent key-based authentication.\nAdministrative effort must be minimized.\nWhat should you do?","o":["Enable a managed identity for each application and call Azure AI Search directly.","Configure an Azure AI Search connection in Project1 and reference the connection in each application.","Create a custom HTTP connection in Foundry and manually configure Azure AI Search endpoints per application.","Call Azure AI Search directly from each application by using Microsoft Entra authentication."],"a":[1],"e":"An Azure AI Search connection in Project1 centralizes the endpoint and auth so many apps reference one configuration. It supports keyless Entra auth and only needs managing once. Per-app direct calls repeat the setup.","t":"Many apps, one config, no keys = project CONNECTION.","k":["Azure AI Search connection","keyless","shared config"]},{"id":"ai-103-32","d":"models","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains an agent used by the financial analysts at your company.\nYou need to optimize the agent workflow by providing additional data access and processing capabilities. The solution must meet the following requirements:\nEnsure that the agent can perform calculations during conversations.\nEnsure that the agent can access up-to-date information from public websites.\nEnsure that the agent can retrieve information from documents uploaded directly to the agent.\nWhat should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.\n\nTools:\nCode interpreter\nComputer use\nFile search\nGrounding with Bing Search\nMicrosoft Fabric\n\nSelect the correct public-web-information/calculations/uploaded-documents combination.","o":["Public websites: File search; Calculations: Grounding with Bing Search; Uploaded documents: Code interpreter","Public websites: Grounding with Bing Search; Calculations: Code interpreter; Uploaded documents: File search","Public websites: Computer use; Calculations: Microsoft Fabric; Uploaded documents: Grounding with Bing Search","Public websites: Microsoft Fabric; Calculations: File search; Uploaded documents: Computer use"],"a":[1],"e":"Grounding with Bing Search gets current public web info. Code interpreter does calculations. File search retrieves content from documents uploaded to the agent. Computer use and Fabric serve other needs.","t":"Web = Bing. Math = Code interpreter. Uploads = File search.","k":["Bing grounding","code interpreter","file search"]},{"id":"ai-103-33","d":"models","x":"You have a Microsoft Foundry project that contains a prompt agent used by a customer support web app.\nThe agent is invoked from a Python service that does NOT run in the Foundry portal.\nYou need to implement end-to-end tracing to capture latency breakdowns and exceptions across agent runs.\nWhich two components can you use? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","o":["Application Insights","the Azure Monitor Agent","Microsoft Sentinel","a Log Analytics workspace","OpenTelemetry"],"a":[0,4],"e":"Application Insights collects distributed telemetry like request durations, dependencies, exceptions and end-to-end traces. OpenTelemetry is the vendor-neutral standard to create and propagate spans across the service and agent runs. Log Analytics only stores logs, Azure Monitor Agent is for machines, Sentinel is SIEM.","t":"Trace code outside the portal = OpenTelemetry + App Insights.","k":["OpenTelemetry","Application Insights","tracing"]},{"id":"ai-103-34","d":"models","x":"You have a customer support agent that uses the Microsoft Foundry Agent Service.\nSometimes, customers return to a session days later to continue the same support case, and the agent must resume with the full historical context. The agent must provide the following:\nMulti-turn continuity within the session\nCross-session continuity for the same case\nAccess to the full interaction history, including user messages, agent messages, tool calls, and tool outputs\nYou need to ensure that the agent automatically reloads the complete history on each new turn.\nWhat should you do?","o":["Enable memory summarization on the agent definition to persist the context automatically.","Persist only the final model response stored in the client application and prepend the response to future prompts.","Create and reuse a conversation by storing the conversation’s ID and supplying the ID on subsequent requests."],"a":[2],"e":"Store the conversation ID for the support case and pass it on later requests. Agent Service then reloads the whole conversation state, including user and agent messages, tool calls and tool outputs. Saving only the final reply loses history, and summarization loses detail.","t":"Full history every turn = reuse the CONVERSATION ID.","k":["conversation ID","history","multi-turn"]},{"id":"ai-103-35","d":"models","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains a deployed chat model.\nYou have a Python service that sends API requests to the model. The service is integrated with an automated validation system that compares generated outputs against approved response patterns.\nStakeholders report that small wording differences are causing validation mismatches.\nYou need to update the request parameters to improve output stability. The solution must maximize reasoning quality.\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["temperature: 1; effort: \"medium\"","temperature: 0; effort: \"low\"","temperature: 0; effort: \"high\"","temperature: 2; effort: \"high\""],"a":[2],"e":"Temperature 0 minimizes sampling randomness so wording stays consistent for automated validation. Effort high maximizes reasoning quality.","t":"Stable + smart = temperature 0, effort HIGH.","k":["temperature 0","reasoning effort high"]},{"id":"ai-103-36","d":"models","x":"You have a chat app in a Microsoft Foundry project and an Azure AI Search vectorized index.\nYou need to connect to the index to meet the following requirements:\nComplex questions must retrieve information from multiple chunks.\nMulti-turn conversations must influence retrieval planning.\nRetrievals must run in parallel to reduce latency.\nWhich retrieval approach should you use?","o":["iterative retrieval","agentic Retrieval Augmented Generation (RAG)","chain of thought","classic Retrieval Augmented Generation (RAG)"],"a":[1],"e":"Agentic RAG lets an agent plan retrieval: it splits complex questions into several retrieval actions, uses multi-turn context in planning, and runs retrievals in parallel to cut latency. Iterative retrieval is sequential and classic RAG is a single simple pass.","t":"Plan + parallel + multi-turn = AGENTIC RAG.","k":["agentic RAG","parallel retrieval","query planning"]},{"id":"ai-103-37","d":"agents","x":"HOTSPOT -\n\nYou need to recommend a plan to create a customer support agent by using the Microsoft Foundry Agent Service. The agent must meet the following requirements:\nRetain user preferences across multiple conversations.\nEnable users to provide contextual grounding by directly uploading documents during a chat.\nWhich Foundry capability should you recommend for each requirement? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["Agent memory that uses persistent storage; Azure AI Search tool","Conversation history; Azure AI Search tool","Agent memory that uses persistent storage; File search tool","Orchestration-managed session context; Code interpreter tool"],"a":[2],"e":"Agent memory with persistent storage keeps user preferences across separate conversations. The File search tool lets users upload documents during chat and use them as grounding context. AI Search is for an existing index and Code interpreter runs code.","t":"Remember across chats = MEMORY. Uploaded docs = FILE SEARCH.","k":["agent memory","persistent storage","file search"]},{"id":"ai-103-38","d":"evaluation","x":"You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nYou need to improve response completeness. The solution must be implemented in the logic of the application code before responses are returned.\nWhat should you do?","o":["Switch to Retrieval Augmented Generation (RAG).","Add a retry evaluation before the responses are returned.","Replace the model with a smaller deployment.","Decrease the value of the max_tokens parameter."],"a":[1],"e":"A retry evaluation in the app logic checks completeness before the response is returned and can regenerate if it falls short. Lower max_tokens truncates, switching to RAG adds no check, and a smaller model does not help.","t":"Check before you send = RETRY evaluation.","k":["retry evaluation","completeness","app logic"]},{"id":"ai-103-39","d":"operations","x":"You have a customer support agent built by using the Microsoft Foundry Agent Service. The agent calls an Azure OpenAI model deployment.\nDuring load testing, calls intermittently fail and return an HTTP 429 rate limit exceeded error.\nYou need to handle throttling to reduce call failures and improve reliability under load. The solution must remain within the service and model limits.\nWhat should you do?","o":["Implement a retry policy that uses exponential backoff and jitter.","Create a new thread and retry the calls immediately.","Spit uploaded content into smaller files.","Reduce the number of registered tools."],"a":[0],"e":"HTTP 429 means throttling. Retrying with exponential backoff and random jitter spaces out retries so they do not collide, improving reliability within limits. Immediate retries make throttling worse.","t":"429? BACK OFF exponentially + add JITTER.","k":["429","exponential backoff","jitter","throttling"]},{"id":"ai-103-40","d":"evaluation","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an agent.\nYou use a GitHub Actions workflow for CI/CD.\nYou need to configure the workflow to automatically evaluate the agent when a pull request (PR) is created and prevent branches from merging if the evaluation results do NOT meet the defined thresholds.\nHow should you configure the workflow? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["An Azure Login action that uses OpenID Connect (OIDC); Send an alert","A personal access token (PAT); Lock the target branch","An Azure Login action that uses OpenID Connect (OIDC); Fail","A user-assigned managed identity; Send an alert"],"a":[2],"e":"Use the Azure Login action with OpenID Connect to get short-lived Azure credentials without storing long-lived secrets. When evaluation misses thresholds, the job must Fail so the required PR check fails and branch protection blocks the merge. An alert cannot block a merge.","t":"OIDC to log in, FAIL to block the merge.","k":["OIDC","GitHub Actions","fail check","branch protection"]},{"id":"ai-103-41","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You increase the value of the max_tokens parameter.\nDoes this meet the goal?","o":["Yes","No"],"a":[0],"e":"Yes. If clauses that are in the retrieved content are missing, a low output token limit may be cutting the summary short. Raising max_tokens gives the model room to include them.","t":"Content is there but answer is cut = raise MAX_TOKENS. Yes.","k":["max_tokens","truncation","Yes"]},{"id":"ai-103-42","d":"evaluation","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You add a reflection pass that regenerates the response if the required clauses are missing.\nDoes this meet the goal?","o":["No","Yes"],"a":[1],"e":"Yes. A reflection pass checks the summary against the required clauses before returning it and regenerates or fixes the answer if something is missing. That directly improves completeness.","t":"Self-check and redo = REFLECTION. Yes.","k":["reflection pass","completeness","Yes"]},{"id":"ai-103-43","d":"models","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You increase the value of the temperature parameter.\nDoes this meet the goal?","o":["Yes","No"],"a":[1],"e":"No. Higher temperature adds randomness and variation; it does not make required clauses appear and can make coverage less predictable.","t":"Temperature = randomness, not completeness. No.","k":["temperature","No"]},{"id":"ai-103-44","d":"evaluation","x":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You run an evaluation flow that scores responses for completeness and blocks responses that fall below a defined threshold.\nDoes this meet the goal?","o":["Yes","No"],"a":[0],"e":"Yes. An evaluation flow scores each response for completeness and blocks those below the threshold, so incomplete summaries never reach users. It can also trigger a retry.","t":"Score it, block the weak ones. Yes.","k":["evaluation flow","threshold","Yes"]},{"id":"ai-103-45","d":"multimodal","x":"You are creating an image-editing workflow in a Microsoft Foundry project.\nThe workflow must meet the following requirements:\nEnsure that background objects can be removed by applying a mask-based inpainting edit.\nPreserve the original lighting and style of the edited images.\nUse the built-in image editing controls, NOT a custom model.\nYou need to ensure that image edits apply exclusively inside the masked area.\nHow should you configure the workflow?","o":["Set generation mode to image_variation and provide the original image as a reference.","Enable image_to_image mode and a high-strength value to regenerate the full image based on the prompt.","Enable text_to_image mode and a prompt describing the desired background removal.","Enable mask_inpainting and supply both the input image and a mask indicating which part of the image to modify."],"a":[3],"e":"Mask inpainting edits only the area marked by the mask, keeping lighting, style and all pixels outside it. Variation, text-to-image and high-strength image-to-image change much more of the image.","t":"Edit only one spot = MASK inpainting.","k":["mask inpainting","image editing"]},{"id":"ai-103-46","d":"multimodal","x":"You have a Microsoft Foundry project that generates product marketing images from text prompts.\nAfter publishing several images, the legal team at your company identifies a competitor’s logo on a sign in the background of an image.\nYou need to remove only the logo, while preserving the rest of the image.\nWhat should you do?","o":["Apply a mask-based inpainting edit to the part of the image that contains the logo.","Rerun the prompt by using a different random seed.","Increase the prompt guidance strength.","Modify the original prompt to exclude brand names."],"a":[0],"e":"Mask-based inpainting limits regeneration to the selected logo area, so the logo is removed while the rest of the image stays the same. New seeds, stronger guidance or prompt edits make a new image.","t":"Remove one thing, keep the rest = MASK inpainting.","k":["mask inpainting","logo removal"]},{"id":"ai-103-47","d":"content-understanding","x":"You have a Microsoft Foundry project that contains an agent.\nThe agent ingests scanned PDF vendor invoices that contain tables and embedded QR codes.\nThe agent must preserve the PDF layout in the extracted output to ensure that downstream processing can reference sections and tables.\nYou plan to call Azure Content Understanding in Foundry Tools.\nYou need to extract content and layout elements and detect QR codes without requiring a language model deployment.\nWhich built-in analyzer should you use?","o":["prebuilt-layout","prebuilt-documentFieldSchema","prebuilt-documentSearch","prebuilt-read"],"a":[0],"e":"The prebuilt-layout analyzer extracts content plus layout elements like sections and tables and detects barcodes and QR codes, with no LLM deployment needed. prebuilt-read only extracts text.","t":"Tables + layout + QR = prebuilt-LAYOUT.","k":["prebuilt-layout","QR code","Content Understanding"]},{"id":"ai-103-48","d":"multimodal","x":"You have a Microsoft Foundry project that contains an agent and an image generation model deployment.\nThe agent generates original images from user-supplied product photos.\nYou need to ensure that the generated images maintain the product identity and visual characteristics of the provided photo.\nWhat should you do?","o":["Apply a groundedness detection filter.","Include a prompt and input image in the request.","Set the input_fidelity parameter to high.","Decrease the value of the temperature parameter."],"a":[2],"e":"Setting input_fidelity to high tells the model to preserve the identity and visual details of the supplied product photo. Sending an image is required but does not set how closely to match it. Groundedness and temperature are unrelated.","t":"Keep the product looking the same = input_FIDELITY high.","k":["input_fidelity","image generation"]},{"id":"ai-103-49","d":"safety","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an agent.\nThe agent accepts user-uploaded screenshots and uses a multimodal chat model.\nSome screenshots contain potentially malicious embedded text.\nYou need to prevent a prompt injection attack and ensure that third-party content is treated as lower trust.\nHow should you configure prompt shields for document attacks? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["Set action to annotate; Create a custom blocklist.","Set action to block; Use optical character recognition (OCR) to extract the text from the images first.","Set action to block; Enable Spotlighting.","Disable the shield; Use optical character recognition (OCR) to extract the text from the images first."],"a":[2],"e":"Set the document prompt shield action to block so detected document attacks cannot affect the agent run. Enable Spotlighting to mark third-party content as untrusted, so embedded text is not treated as instructions. Annotate does not stop attacks and OCR adds no trust boundary.","t":"BLOCK attacks + SPOTLIGHT untrusted content.","k":["prompt shields","block","Spotlighting"]},{"id":"ai-103-50","d":"safety","x":"You are deploying a support agent that enables users to upload photos.\nYou need to automatically classify uploaded images for harmful content. The solution must block content based on severity levels.\nWhat should you do?","o":["Apply keyword scanning to optical character recognition (OCR) output by using Azure Vision in Foundry Tools.","Implement image moderation.","Use blocklists.","Enable prompt shields."],"a":[1],"e":"Image moderation classifies images by harm category and returns severity levels for automatic blocking. OCR keyword scans only see text, prompt shields target injection, and blocklists match terms.","t":"Harmful pictures by severity = IMAGE moderation.","k":["image moderation","severity levels"]},{"id":"ai-103-51","d":"safety","x":"You have an app named App1 that uses a Microsoft Foundry multimodal model deployment.\nApp1 runs optical character recognition (OCR) on uploaded images and appends the OCR output to the prompt as additional context.\nSome uploaded images contain embedded text.\nYou need to prevent potentially malicious instructions from being processed by the model.\nWhat should you use?","o":["prompt shields for documents","image moderation","protected material text","prompt shields for user prompts"],"a":[0],"e":"OCR output from uploads is third-party document content that may contain indirect prompt injection. Prompt shields for documents detect such instructions before the model processes them. Image moderation checks visuals and user-prompt shields cover typed input.","t":"Text pulled from files = DOCUMENT shield.","k":["prompt shields for documents","OCR","indirect injection"]},{"id":"ai-103-52","d":"content-understanding","x":"You have a Microsoft Foundry project that contains an agent.\nYou need to process mixed-format documents that contain scanned text, tables, and multicolumn layouts. The extracted content must preserve the document structure and be converted into the Markdown format for downstream reasoning.\nWhat should you configure first?","o":["an Azure Content Understanding in Foundry Tools analyzer","a generative chat completion request","an Azure OpenAI Responses API call that uses a multimodal model","an Azure Language in Foundry Tools text analysis model deployment"],"a":[0],"e":"Configure an Azure Content Understanding analyzer first to extract scanned text and layout, including tables and multi-column content, and produce structured Markdown for later reasoning. Language text analysis does not preserve layout, and chat calls are not a reliable first extraction step.","t":"Messy docs to Markdown = CONTENT UNDERSTANDING first.","k":["Content Understanding","Markdown","layout"]},{"id":"ai-103-53","d":"content-understanding","x":"You have an application that processes scanned PDF invoices. The invoices have varied layouts and include multipage tables.\nYou have a pipeline that uses optical character recognition (OCR) and extracts totals and invoice numbers. The results are often incorrect because the document structure is ignored.\nYou need to implement a solution that provides OCR, layout analysis, and template-generalizing field extraction. The solution must NOT require training a custom model. The solution must minimize administrative effort.\nWhat should you include in the solution?","o":["an Azure Machine Learning model","Azure Language in Foundry Tools","Azure Content Understanding in Foundry Tools"],"a":[2],"e":"Azure Content Understanding provides OCR, layout analysis and field extraction that generalizes across templates, with no custom model training and low admin effort. Language is for text analytics and Azure ML needs building and training.","t":"OCR + layout + fields, no training = CONTENT UNDERSTANDING.","k":["Content Understanding","field extraction","no training"]},{"id":"ai-103-54","d":"rag","x":"You have a Microsoft Foundry project that contains an agent.\nThe agent uses a knowledge source built from documents stored in Azure Blob Storage. The documents include digitally scanned PDFs that contain multipage tables.\nYou have an ingestion job that extracts only plain text, causing loss of table structure, headings, and page-number metadata.\nUsers frequently ask questions that require the retrieval of specific table rows across the pages.\nYou need to configure an ingestion job for a Retrieval Augmented Generation (RAG) pipeline that performs optical character recognition (OCR) on scanned PDFs, preserves tables and headings as structure-aware chunks, and stores page-number metadata with each chunk.\nHow should you configure the ingestion job?","o":["Use OCR and page-level chunking.","Use page-level OCR extraction and store each page as a single chunk.","Use advanced data parsing to reingest the documents.","Use basic parsing and fixed-size chunking."],"a":[2],"e":"Advanced data parsing re-ingests documents with structure-aware processing: OCR for scanned PDFs, preserved headings and tables, and page-level metadata on chunks. Page-level or fixed-size chunking loses table structure.","t":"Structure-aware chunks = ADVANCED parsing.","k":["advanced data parsing","structure-aware chunking","page metadata"]},{"id":"ai-103-55","d":"rag","x":"You have a Microsoft Foundry project that contains an agent.\nThe agent uses Azure AI Search as the retriever.\nYou plan to ingest PDF into an Azure AI Search index to ensure that the agent can ground responses in texts in both documents and embedded images.\nUsers require citations that link to the source files.\nYou need to ensure that during indexing, the images are extracted into a structure that can be used as input for the built-in optical character recognition (OCR) skill.\nWhich indexing approach should you use?","o":["an indexer to extract image data into a normalized_images collection","the outputFieldMappings parameter to write image data to a searchable field","a skillset to run the OCR skill directly against the content field of the index","a Shaper skill to restructure the OCR input"],"a":[0],"e":"Configure the indexer to extract embedded images into the normalized_images collection. The built-in OCR skill then processes each normalized image during enrichment, and source file metadata is kept for citations.","t":"OCR on images needs NORMALIZED_IMAGES from the indexer.","k":["normalized_images","OCR skill","indexer"]},{"id":"ai-103-56","d":"content-understanding","x":"Question: 56\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend an invoice review solution that resolves the issue reported by the finance department.\nWhat should you include in the recommendation?","o":["chat completions","Azure Document Intelligence in Foundry Tools","Azure Content Understanding in Foundry Tools","Image Analysis"],"a":[2],"e":"Azure Content Understanding analyzes both visual layout and text of complex invoices with tables, logos and changing layouts, extracting structured data to compare against vendor contract terms. Chat completions or Image Analysis alone are not a document pipeline.","t":"Multimodal invoice review = CONTENT UNDERSTANDING.","k":["Content Understanding","invoices","multimodal"]},{"id":"ai-103-57","d":"content-understanding","x":"You have a Microsoft Foundry project that contains an agent.\nThe knowledge source for the agent is a set of scanned PDF troubleshooting guides stored in Azure Blob Storage. The guide pages contain two-column layouts and tables.\nYou use Azure Content Understanding in Foundry Tools to process the PDFs.\nYou plan to ingest the processed content into an index for Retrieval Augmented Generation (RAG) and store extracted fields for downstream automation.\nStakeholders must be able to verify where each extracted field value came from in the original PDF and route low-reliability extractions for manual review.\nYou need to ensure that the Content Understanding document analyzer output includes a per-field confidence score and source grounding to locations within the source document.\nWhat should you do?","o":["Configure the analyzer to use generative extraction for all fields.","Set enableSegment to true.","Enable estimateFieldSourceAndConfidence.","Provide labeled samples."],"a":[2],"e":"Enable estimateFieldSourceAndConfidence so each extracted field includes an estimated confidence score and grounding to its location in the source document. Low-confidence results can then go to manual review.","t":"Field SOURCE + CONFIDENCE = estimateFieldSourceAndConfidence.","k":["estimateFieldSourceAndConfidence","confidence score","grounding"]},{"id":"ai-103-58","d":"speech","x":"You are building a speech processing solution in Microsoft Foundry for a customer support platform.\nThe platform will transcribe live phone calls, so that supervisors at your company can view call transcripts and detect issues while the calls are in progress. The call audio will arrive as a continuous stream from the telephony system.\nYou need to ensure that the call transcripts appear within only a few seconds of the audio stream.\nWhat should you do?","o":["Use real-time speech to text to process streaming audio input.","Use speech translation to generate the transcripts into multiple languages.","Use text to speech by using a custom neural voice.","Run a batch transcription job on recorded audio files."],"a":[0],"e":"Real-time speech to text handles continuous audio streams and returns interim and final results with low latency, so supervisors see transcripts within seconds. Batch transcription works on finished recordings.","t":"Live stream = REAL-TIME STT, not batch.","k":["real-time speech to text","streaming"]},{"id":"ai-103-59","d":"speech","x":"You are creating an agent workflow in a Microsoft Foundry project to support natural voice interactions.\nThe agent must receive continuous audio input, convert the input into text for reasoning, and then return spoken responses to a user. The workflow must meet the following requirements:\nSupport turn-taking dynamics, where the agent begins to generate the speech output before the user finishes speaking.\nOperate with low latency to maintain conversational experience.\nYou need to enable both speech to text and text to speech in a real-time agent interaction.\nWhat should you do?","o":["Use batch transcription to convert the audio input and return text responses from the agent.","Use speech translation to convert the audio into another language and return the translated text.","Use an embeddings model to encode the audio, and then decode the audio into text and speech.","Use real-time speech to text for incoming audio and text to speech for agent responses."],"a":[3],"e":"Real-time speech to text processes continuous input with low latency, and text to speech turns the agent's replies into audio. Together they support a fast voice conversation with turn-taking.","t":"Ears = real-time STT. Mouth = TTS.","k":["speech to text","text to speech","voice agent"]},{"id":"ai-103-60","d":"speech","x":"You have an application named App1 that uses Azure Speech in Foundry Tools to transcribe live calls.\nTranscript segments often contain both English and Spanish. App1 sends each segment to Azure Translator in Foundry Tools to translate to another language.\nSometimes, mixed-language segments result in incomplete or incorrect translations.\nYou need to reduce translation errors. The solution must ensure that the entire transcript is translated successfully.\nWhat should you do before sending the segments to Translator?","o":["Split the mixed-language segments into single-language segments and translate each segment separately.","Use document translation to translate the entire transcript as a single document.","Specify English as the source language in the translation request for all the segments.","Enable automatic language detection for the translation request."],"a":[0],"e":"Split mixed-language segments into single-language pieces before translating, so each request has one consistent source language. Auto-detect picks a dominant language, forcing English mistranslates Spanish, and document translation does not suit live segments.","t":"Mixed languages? SPLIT first, then translate.","k":["split segments","Translator","mixed language"]},{"id":"ai-103-61","d":"rag","x":"Question: 61\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exa
