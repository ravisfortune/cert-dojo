<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cert Dojo</title>
<meta name="description" content="Certification practice lab: 1,000+ questions across Claude, GitHub Copilot and Microsoft AI exams. Test in parts, fix your mistakes, track progress.">
<meta name="theme-color" content="#060913" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDF0F8" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css?v=4">
<script>
  // apply saved theme before first paint to avoid a flash
  try{var s=JSON.parse(localStorage.getItem("certdojo.v1")||"{}");if(s.theme&&s.theme!=="auto")document.documentElement.setAttribute("data-theme",s.theme)}catch(e){}
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<aside class="side glass" id="side" aria-label="Main navigation">
  <div class="side-head">
    <button class="brand" id="homeBtn" aria-label="Cert Dojo home">
      <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
        <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#7C6CFF"/></linearGradient></defs>
        <rect x="1" y="1" width="34" height="34" rx="11" fill="url(#bm)"/>
        <path d="M10.5 24.5 17 11.5l3.6 7M15.4 21.3h6.4" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="25.5" cy="24.5" r="2.8" fill="#fff"/>
      </svg>
      <span class="brand-txt"><span class="brand-name">Cert Dojo</span><span class="brand-sub">practice lab</span></span>
    </button>
    <button class="railbtn" id="railBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </button>
  </div>
  <div class="side-scroll" id="sideNav"></div>
  <div class="side-foot">
    <div class="theme-seg" id="themeSeg" role="group" aria-label="Theme"></div>
    <div class="live" id="liveSide" hidden><i></i><span></span></div>
    <div class="saved" title="Progress is saved in this browser"><i></i><span>Progress saved on this device</span></div>
  </div>
</aside>
<div class="side-scrim" id="sideScrim"></div>

<div class="main">
  <header class="topbar glass">
    <button class="iconbtn burger" id="burger" aria-label="Open menu" aria-controls="side" aria-expanded="false"><span><span></span><span></span><span></span></span></button>
    <span class="brand-name">Cert Dojo</span>
    <span class="live live-top" id="liveTop" hidden><i></i><span></span></span>
  </header>
  <main id="app"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="assets/data.js?v=4"></script>
<script src="assets/app.js?v=4"></script>
</body>
</html>
