<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cert Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: blueprint drafting table. Sticky console bar, a canvas hero that draws system diagrams,
   exam "sheets" as cards, and a focused one-question runner. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#E4EBF5; --ink:#0F1E3A; --ink-2:#4B5C7B; --ink-3:#7A89A4;
  --line:#D0DAE8; --grid:rgba(28,72,150,.075); --grid-strong:rgba(28,72,150,.16);
  --accent:#E2561B; --accent-ink:#B5410E; --accent-soft:#FFE6D8; --on-accent:#FFFFFF;
  --ok:#11845A; --ok-soft:#DCF3E8; --bad:#C3303B; --bad-soft:#FBE2E4;
  --note:#FFF3BF; --note-ink:#5B4500; --note-line:#E9D27A;
  --shadow:0 1px 2px rgba(15,30,58,.06),0 8px 24px -12px rgba(15,30,58,.18);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1428; --surface:#101D38; --surface-2:#172A4E; --ink:#E7EDF9; --ink-2:#9EAECB; --ink-3:#6E80A3;
  --line:#22375F; --grid:rgba(120,170,255,.07); --grid-strong:rgba(120,170,255,.15);
  --accent:#FF7A3D; --accent-ink:#FF9C6B; --accent-soft:#3B2117; --on-accent:#1A0A03;
  --ok:#3CCF8E; --ok-soft:#0F3428; --bad:#FF6C76; --bad-soft:#3C171C;
  --note:#2D2913; --note-ink:#F2DD8C; --note-line:#5A4F22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1428; --surface:#101D38; --surface-2:#172A4E; --ink:#E7EDF9; --ink-2:#9EAECB; --ink-3:#6E80A3;
  --line:#22375F; --grid:rgba(120,170,255,.07); --grid-strong:rgba(120,170,255,.15);
  --accent:#FF7A3D; --accent-ink:#FF9C6B; --accent-soft:#3B2117; --on-accent:#1A0A03;
  --ok:#3CCF8E; --ok-soft:#0F3428; --bad:#FF6C76; --bad-soft:#3C171C;
  --note:#2D2913; --note-ink:#F2DD8C; --note-line:#5A4F22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:58px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:18px;height:18px}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
@media (max-width:560px){.sync span{display:none}.brand-name{font-size:14px}}

/* ---------- hero ---------- */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .wrap{position:relative;padding-block:46px 40px;display:grid;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6.4vw,68px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance;max-width:14ch}
.hero h1 .w{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.hero h1 .w:nth-child(2){animation-delay:.12s}.hero h1 .w:nth-child(3){animation-delay:.24s}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{margin:0;max-width:56ch;color:var(--ink-2);font-size:16.5px}
@keyframes rise{from{opacity:.0001;transform:translateY(18px)}to{opacity:1;transform:none}}
.statstrip{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-2)}
.stat.hot b{color:var(--bad)}

/* ---------- exam grid ---------- */
.section{padding-block:34px 60px}
.section h2{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.section .sub{color:var(--ink-2);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.sheet{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;
  box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s;overflow:hidden;animation:rise .6s both}
.sheet:hover{transform:translateY(-3px);border-color:var(--accent)}
.sheet::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border:1px dashed var(--grid-strong);border-radius:50%}
.sheet .code{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:3px 8px;justify-self:start}
.sheet h3{margin:0;font-size:16.5px;line-height:1.3;font-weight:700;text-wrap:balance;min-height:2.6em}
.sheet .vendor{font-size:12.5px;color:var(--ink-2)}
.sheet .row{display:flex;align-items:center;gap:14px}
.sheet .meta{display:grid;gap:2px;font-size:12.5px;color:var(--ink-2)}
.sheet .meta b{color:var(--ink);font-weight:600}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--f-mono);font-size:13px;font-weight:600;fill:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- exam view ---------- */
.ehead{padding-block:28px 6px;display:grid;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-2);font-weight:600;padding:0;justify-self:start}
.ehead h1{font-family:var(--f-display);font-size:clamp(24px,4vw,38px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ehead .facts{display:flex;flex-wrap:wrap;gap:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin-top:18px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;grid-template-columns:auto 1fr;align-items:start;column-gap:12px;transition:transform .2s,border-color .2s,box-shadow .2s}
.mode:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.mode:disabled{opacity:.55;cursor:not-allowed}
.mode .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.mode .ic svg{width:22px;height:22px}
.mode b{font-size:15.5px}
.mode span{font-size:13px;color:var(--ink-2)}
.mode.hot{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.mode.hot .ic{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.panel h4{margin:0 0 10px;font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink-2);transition:all .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:4px;font-family:var(--f-mono)}
.opts{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.opts label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.opts select{font:inherit;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.toggle{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);transition:transform .2s,background .2s}
.toggle:checked{background:var(--accent)}.toggle:checked::after{transform:translateX(16px);background:var(--on-accent)}
.hist{display:grid;gap:6px}
.hist div{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:13px;color:var(--ink-2);padding:6px 0;border-bottom:1px dashed var(--line)}
.hist div:last-child{border-bottom:0}
.hist b{color:var(--ink)}
.empty{color:var(--ink-3);font-size:13.5px}

/* ---------- runner ---------- */
.runbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.runbar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.runbar .lbl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-right:auto;min-width:0}
.runbar .lbl b{color:var(--ink)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:14px;padding:5px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.prog{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.stage{padding-block:22px 120px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);display:grid;gap:16px;min-width:0}
.qcard.enter{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
.qcard.enter.rev{animation-name:slideInR}
@keyframes slideIn{from{opacity:.0001;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideInR{from{opacity:.0001;transform:translateX(-26px)}to{opacity:1;transform:none}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qnum{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--ink-3)}
.flag{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.flag[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.case{border:1px dashed var(--grid-strong);border-radius:12px;background:var(--surface-2)}
.case summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
.case summary::-webkit-details-marker{display:none}
.case summary::before{content:"+";font-family:var(--f-mono);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--surface);font-size:13px}
.case[open] summary::before{content:"\2212"}
.case .ctext{padding:0 14px 14px;white-space:pre-line;font-size:14px;color:var(--ink-2);max-height:46vh;overflow:auto}
.qtext{font-size:clamp(15.5px,1.7vw,17.5px);line-height:1.6;white-space:pre-line;margin:0;font-weight:500;overflow-wrap:anywhere}
.need{font-family:var(--f-mono);font-size:12px;color:var(--accent-ink)}
.olist{display:grid;gap:10px}
.opt{position:relative;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,background .2s,transform .12s;overflow:hidden;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt .lt{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--surface-2);color:var(--ink-2);transition:all .2s}
.opt.multi .lt{border-radius:50%}
.opt .ot{font-size:15px;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.opt.sel .lt{background:var(--accent);color:var(--on-accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lt{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.62}
.opt .why{grid-column:2;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;animation:fade .4s both}
.opt .tag{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;font-family:var(--f-mono);letter-spacing:.04em}
.opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.opt .rip{position:absolute;border-radius:50%;background:var(--accent);opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fade{from{opacity:.0001;transform:translateY(6px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:700;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict small{display:block;font-weight:500;color:var(--ink-2);font-size:13px}
@keyframes pop{from{opacity:.0001;transform:scale(.9)}to{opacity:1;transform:none}}
.explain{display:grid;gap:12px;animation:fade .5s .08s both}
.exp{background:var(--surface-2);border-radius:12px;padding:14px 16px}
.exp h5,.trick h5{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.exp p{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.trick{position:relative;background:var(--note);color:var(--note-ink);border-radius:4px 14px 14px 14px;padding:14px 16px 14px 18px;border:1px solid var(--note-line);transform:rotate(-.4deg);box-shadow:0 6px 18px -10px rgba(90,70,0,.45)}
.trick::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px;border-radius:4px 0 0 4px;background:repeating-linear-gradient(var(--accent) 0 6px,transparent 6px 10px)}
.trick h5{color:var(--note-ink);opacity:.8}
.trick p{margin:0;font-weight:700;font-size:15px}
.trick .kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trick .kw span{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--note-line);border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--note) 60%,var(--surface))}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:16;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{display:flex;gap:10px;align-items:center;padding-block:12px}
.foot .grow{flex:1}
.foot .hint{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
@media (max-width:560px){.foot .hint{display:none}}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:2px}
.navgrid button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12.5px;position:relative}
.navgrid button.ans{background:var(--surface-2);color:var(--ink)}
.navgrid button.cur{border-color:var(--accent);border-width:2px}
.navgrid button.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.navgrid button.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.navgrid button.fl::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,25,.45);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow);display:grid;gap:14px;max-height:85vh;overflow:auto}
.modal h3{margin:0;font-family:var(--f-display);font-size:18px}
.modal p{margin:0;color:var(--ink-2)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- results ---------- */
.res{padding-block:30px 80px;display:grid;gap:18px}
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
@media (max-width:560px){.score{grid-template-columns:1fr;justify-items:start}}
.bigring{width:150px;height:150px}
.bigring circle{fill:none;stroke-width:11}
.bigring .bg{stroke:var(--surface-2)}
.bigring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.bigring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.score h2{font-family:var(--f-display);margin:0 0 6px;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em}
.score p{margin:0;color:var(--ink-2)}
.score .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.dbars{display:grid;gap:10px}
.dbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13.5px}
.dbar .tr{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.dbar .tr i{display:block;height:100%;border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rev+.rev{margin-top:8px}
.rev summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;align-items:start}
.rev summary::-webkit-details-marker{display:none}
.rev summary .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--bad-soft);color:var(--bad)}
.rev summary span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rev .body{padding:0 14px 14px;display:grid;gap:10px;font-size:14px}
.rev .ans{display:grid;gap:4px}
.rev .ans div{padding:6px 10px;border-radius:8px}
.rev .ans .y{background:var(--bad-soft)}.rev .ans .c{background:var(--ok-soft)}

/* ---------- flashcards ---------- */
.fc{perspective:1400px}
.fc-inner{position:relative;min-height:340px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-face .tapnote{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.fc-ans{display:grid;gap:6px}
.fc-ans div{background:var(--ok-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600}

/* toast + confetti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;animation:toast 2.6s both;max-width:calc(100% - 32px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
footer.credit{padding-block:24px 40px;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

<script>
const DATA = {"exams":[{"id":"ccar-f","code":"CCAR-F","title":"Claude Certified Architect — Foundations","vendor":"Anthropic","exam":{"count":60,"minutes":90,"passPercent":80},"domains":{"architecture":"Architecture","claude-code":"Claude Code","context-reliability":"Context Reliability","tools":"Tools","prompt-output":"Prompt Output"},"qs":[{"id":"ccar-f-1","d":"architecture","x":"A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers.\n\nWhat task decomposition approach would be most effective?","o":["Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading.","Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path.","Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code.","Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges."],"a":[3],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Debugging is adaptive by nature — each file you read changes the most useful next step. Let the agent follow the evidence."],"e":"Debugging is adaptive by nature — each file you read changes the most useful next step. Let the agent follow the evidence.","t":"Unknown bug path = ADAPTIVE investigation, follow the evidence.","k":["dynamic decomposition","debugging","adaptive"]},{"id":"ccar-f-2","d":"claude-code","x":"Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns.\n\nWhat's the most reliable way to complete this insertion?","o":["Use Bash to append the function definition to the end of the file using heredoc syntax","Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text","Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness","Use Read to load the file, add the function at the appropriate location, then Write the updated file"],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","When old_string cannot find unique text because the file has many repeating patterns, the most reliable way is to read the entire file (Read), edit"],"e":"When old_string cannot find unique text because the file has many repeating patterns, the most reliable way is to read the entire file (Read), edit","t":"Edit can't find unique anchor = READ + WRITE whole file.","k":["Read","Write","Edit fallback"]},{"id":"ccar-f-3","d":"architecture","x":"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She's worked on three other codebases since then and knows the session was named \"auth-deep-dive\".\n\nHow should she resume?","o":["Use --resume auth-deep-dive to load that specific session by name","Use --session-id with the UUID from yesterday's session transcript file","Use --continue to pick up where the most recent conversation left off","Start fresh and re-read the same files"],"a":[0],"w":["--resume allows resuming a specific session by name. --continue only continues the most recent session (not the session 2 days ago), and --session-id needs a specific UUID, not a name.","Dumping the full transcript adds noise and makes it harder for the next actor to find the key facts quickly.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem."],"e":"--resume allows resuming a specific session by name. --continue only continues the most recent session (not the session 2 days ago), and --session-id needs a specific UUID, not a name.","t":"By NAME = --resume. Most recent = --continue.","k":["--resume","named session","--continue"]},{"id":"ccar-f-4","d":"architecture","x":"An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration.\n\nWhat's the most effective approach?","o":["Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid.","Launch a fresh subagent and include the prior transcript in the initial prompt for context.","Launch a fresh subagent with a summary of prior findings.","Resume the subagent from its previous transcript and inform it about the renamed functions."],"a":[3],"w":["Resuming without explicitly incorporating the new changes risks carrying stale assumptions forward into the next step.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Continuing from the old transcript with updated information about renamed functions is optimal: keep the accumulated 30 minutes of architectural context intact, while notifying agents about specific changes to avoid re-analyzing from scratch."],"e":"Continuing from the old transcript with updated information about renamed functions is optimal: keep the accumulated 30 minutes of architectural context intact, while notifying agents about specific changes to avoid re-analyzing from scratch.","t":"Resume + tell it WHAT CHANGED.","k":["resume","renamed functions","context"]},{"id":"ccar-f-5","d":"context-reliability","x":"Your agent has spent 25 minutes exploring a game engine's rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference \"typical rendering patterns\" rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier.\n\nWhat's the most effective approach?","o":["Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md.","Continue in the current context with more targeted prompts referencing the specific classes by name.","Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation.","Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context."],"a":[3],"w":["Resetting context can throw away useful information and does not by itself create a better investigation strategy.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The generic \"typical rendering patterns\" responses signal context degradation from a long, bloated session, so the fix is to compact the valuable rendering knowledge into a summary and hand it to a sub-agent with a fresh context for the physics task. This follows Anthropic's context-management best practice of summarization plus sub-agents with clean contexts, preserving the specific VulkanPipeline/FrameGraph findings that the integration task depends on, unlike A (loses knowledge), B (sub-agent lacks needed rendering context and synthesis happens in the degraded context), or D (continues in a degraded context)."],"e":"The generic \"typical rendering patterns\" responses signal context degradation from a long, bloated session, so the fix is to compact the valuable rendering knowledge into a summary and hand it to a sub-agent with a fresh context for the physics task. This follows Anthropic's context-management best practice of summarization plus sub-agents with clean contexts, preserving the specific VulkanPipeline/FrameGraph findings that the integration task depends on, unlike A (loses knowledge), B (sub-agent lacks needed rendering context and synthesis happens in the degraded context), or D (continues in a degraded context).","t":"Generic answers = bloated context. SUMMARIZE + fresh SUBAGENT.","k":["context degradation","summary","subagent"]},{"id":"ccar-f-6","d":"context-reliability","x":"An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module).\n\nWhat exploration strategy will most reliably identify all callers?","o":["Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points.","Use Grep to search for the function's original name across the codebase.","Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase.","Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function."],"a":[2],"w":["Documentation may give useful background, but it is not a reliable way to discover every real caller or usage path in code.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Because the function is exposed through many wrapper modules with different names, it is necessary to determine ALL names (original + aliases in wrappers), then Grep each name. Only Grep the original name (B) will miss callers using wrappers.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"Because the function is exposed through many wrapper modules with different names, it is necessary to determine ALL names (original + aliases in wrappers), then Grep each name. Only Grep the original name (B) will miss callers using wrappers.","t":"Find ALL aliases first, then grep each.","k":["Grep","aliases","wrapper modules"]},{"id":"ccar-f-7","d":"context-reliability","x":"During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they've already explored.\n\nWhat's the most effective approach to address this?","o":["Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data.","Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions.","Create summaries of all source files before exploration begins, loading only these compressed representations into context.","Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context."],"a":[1],"w":["Changing model size affects capacity or cost, but it does not directly fix the workflow mistake described in the question.","Context window is limited and after 30+ minutes, old information is pushed out. Maintain a scratchpad file to record key findings so the agent can refer back to them without depending on memory in the context.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Clearing context blindly removes useful information and treats the symptom rather than designing a better way to preserve what matters."],"e":"Context window is limited and after 30+ minutes, old information is pushed out. Maintain a scratchpad file to record key findings so the agent can refer back to them without depending on memory in the context.","t":"Long session forgetting? Keep a SCRATCHPAD file.","k":["scratchpad","context window","long sessions"]},{"id":"ccar-f-8","d":"tools","x":"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like \"extract_function: extracts a function from code.\"\n\nWhat's the most effective way to improve adoption of the MCP refactoring tools?","o":["Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs.","Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications.","Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.","Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools."],"a":[0],"w":["Tool selection is driven by the descriptions Claude sees. When the MCP tools say 'extracts a function from code' and Write/sed come with rich documentation, Claude picks Write/sed. Beef up the descriptions.","Forcing tool use by removing alternatives may change behavior, but it does not solve the real issue of helping the agent understand when the specialized tool is appropriate.","This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","Treating the behavior as acceptable leaves the adoption problem unsolved instead of improving the agent’s decision-making."],"e":"Tool selection is driven by the descriptions Claude sees. When the MCP tools say 'extracts a function from code' and Write/sed come with rich documentation, Claude picks Write/sed. Beef up the descriptions.","t":"Tools ignored? Improve their DESCRIPTIONS.","k":["tool descriptions","MCP","tool selection"]},{"id":"ccar-f-9","d":"context-reliability","x":"An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent's responses are becoming noticeably less accurate—it's forgetting previously discovered code patterns and hasn't yet located all test files or traced the complete data flow.\n\nWhat's the most effective approach to complete this investigation?","o":["Close the current context with /clear and start fresh, re-reading only the most critical files.","Spawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context.","Use Grep to search for specific function names across remaining files, reducing the content loaded into context.","Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference."],"a":[1],"w":["Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem.","When the agent is losing context after reading too many files, spawning a new subagent with a summary of the current findings is the optimal way to continue the investigation. The main agent coordinates while the subagent explores with clean context.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem."],"e":"When the agent is losing context after reading too many files, spawning a new subagent with a summary of the current findings is the optimal way to continue the investigation. The main agent coordinates while the subagent explores with clean context.","t":"Context full mid-task = SUBAGENT with a summary.","k":["subagent","summary","context limits"]},{"id":"ccar-f-10","d":"prompt-output","x":"An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement.\n\nWhat's the most effective way to structure this exploration?","o":["Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork.","Resume yesterday's session and explore both approaches sequentially within the same conversation thread.","Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context.","Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context."],"a":[0],"w":["fork_session allows creating two branches from the same analysis point, each branch exploring a different approach without affecting each other, while keeping the entire context from the previous session intact.","Resuming without explicitly incorporating the new changes risks carrying stale assumptions forward into the next step.","Fresh sessions lose the advantage of the accumulated context you already have and create unnecessary rework.","Resuming without explicitly incorporating the new changes risks carrying stale assumptions forward into the next step."],"e":"fork_session allows creating two branches from the same analysis point, each branch exploring a different approach without affecting each other, while keeping the entire context from the previous session intact.","t":"Two paths from one point = FORK the session.","k":["fork_session","branching","parallel exploration"]},{"id":"ccar-f-11","d":"context-reliability","x":"Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs.\n\nHow should you manage the sessions?","o":["Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.","Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy.","Export the analysis session's key findings to a file, then create two new sessions that reference this file.","Start two fresh sessions, having each re-read the relevant source files before beginning."],"a":[1],"w":["Handling both paths sequentially misses the point of keeping the branches separate and makes comparison or independent exploration harder.","fork_session allows creating two branches from the same analysis point, each branch develops an independent testing strategy without affecting each other, while keeping the entire context from the analysis session intact.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem."],"e":"fork_session allows creating two branches from the same analysis point, each branch develops an independent testing strategy without affecting each other, while keeping the entire context from the analysis session intact.","t":"Compare two strategies independently = FORK.","k":["fork_session","testing strategies"]},{"id":"ccar-f-12","d":"context-reliability","x":"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge.\n\nWhat approach best balances efficiency and accuracy?","o":["Resume the session without informing the agent about the changed files","Resume the session and inform the agent which specific files changed for targeted re-analysis","Start a fresh session to ensure the agent works with current codebase state without stale assumptions","Resume the session and immediately have the agent re-read all 12 previously analyzed files"],"a":[1],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Resume session + notification of changed files is the most balanced way: keep the context of the 9 files unchanged (avoid costly re-reads), and update the agent about new changes to ensure accuracy.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem."],"e":"Resume session + notification of changed files is the most balanced way: keep the context of the 9 files unchanged (avoid costly re-reads), and update the agent about new changes to ensure accuracy.","t":"Resume + name the CHANGED files only.","k":["resume","changed files","targeted re-analysis"]},{"id":"ccar-f-13","d":"prompt-output","x":"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total).\n\nWhat's the most effective next step for building understanding while managing context constraints?","o":["Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation.","Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations.","Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps.","Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line ranges with minimal surrounding context."],"a":[1],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Starting from the class hierarchy to find the base cache class, reading the interface, then trace implementations is the most effective way. Avoid reading all 15 files (too much context) or just searching for patterns (lacking architectural context).","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"Starting from the class hierarchy to find the base cache class, reading the interface, then trace implementations is the most effective way. Avoid reading all 15 files (too much context) or just searching for patterns (lacking architectural context).","t":"Start from the BASE class, then trace down.","k":["class hierarchy","base class","context management"]},{"id":"ccar-f-14","d":"tools","x":"An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services.\n\nWhat exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?","o":["Read all files containing \"auth\", \"login\", \"permission\", or \"token\" in their content or filename.","Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system.","Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview.","Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally."],"a":[3],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","With a codebase of 800+ files, incremental exploration from entry points and by imports is the most effective way to build structured understanding without being overwhelmed by context. Reading all related files (B) would consume too much context."],"e":"With a codebase of 800+ files, incremental exploration from entry points and by imports is the most effective way to build structured understanding without being overwhelmed by context. Reading all related files (B) would consume too much context.","t":"Big codebase = ENTRY POINT + follow imports.","k":["entry points","incremental exploration","Grep"]},{"id":"ccar-f-15","d":"tools","x":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about \"code dependencies\". Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports.\n\nWhat's the most effective approach to improve the agent's selection of MCP tools?","o":["Expand MCP tool descriptions and outputs–e.g., \"Builds dependency graph with list_imports, direct_circular_deps\"–to clearly distinguish dependencies and cycle analysis from Grep.","Remove Grep from the available tools to eliminate functional overlap.","Split analyze_dependencies into granular tools: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep.","Add routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."],"a":[0],"w":["Agents do not use MCP tools because the tool descriptions are not detailed enough to distinguish when to use them versus Grep. Expand descriptions with specific output examples to help agents understand and choose the right tool.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"Agents do not use MCP tools because the tool descriptions are not detailed enough to distinguish when to use them versus Grep. Expand descriptions with specific output examples to help agents understand and choose the right tool.","t":"Agent ignores MCP tool? Make its DESCRIPTION clearer than Grep's.","k":["tool descriptions","MCP","Grep overlap"]},{"id":"ccar-f-16","d":"prompt-output","x":"Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies \"30-day payment terms\" while Amendment 1 changes this to \"45 days\"), the model inconsistently extracts one value or the other with no indication of which applies.\n\nWhat's the most effective approach to improve extraction accuracy for documents with amendments?","o":["Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms.","Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review.","Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step.","Redesign the schema so amended fields capture multiple values, each with source location and effective date."],"a":[3],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","This defers the problem rather than solving the system behavior that caused it.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","When a document has both original terms and amendments, the schema should capture both values ​​along with effective date and source location. This preserves complete information and allows downstream systems to decide for themselves which values ​​to apply."],"e":"When a document has both original terms and amendments, the schema should capture both values ​​along with effective date and source location. This preserves complete information and allows downstream systems to decide for themselves which values ​​to apply.","t":"Conflicting versions = capture ALL with DATE + SOURCE.","k":["schema design","amendments","effective date"]},{"id":"ccar-f-17","d":"prompt-output","x":"After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like \"30 minutes\" incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions.\n\nWhich approach most effectively allocates reviewer attention?","o":["Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types.","Prioritize review of all extractions where required fields are empty or explicitly marked as not found.","Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns.","Have the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set."],"a":[3],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","Semantic errors are difficult to detect through schema validation. To optimize 20% reviewer capacity, model output field-level confidence scores and then use labeled validation set to find the optimal threshold, focusing review on extractions with low confidence."],"e":"Semantic errors are difficult to detect through schema validation. To optimize 20% reviewer capacity, model output field-level confidence scores and then use labeled validation set to find the optimal threshold, focusing review on extractions with low confidence.","t":"Limited reviewers = FIELD CONFIDENCE + calibrated threshold.","k":["confidence scores","calibration","human review"]},{"id":"ccar-f-18","d":"prompt-output","x":"Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don't sum to the extracted grand total—the downstream accounting system has been detecting mismatches.\n\nWhat's the most effective improvement?","o":["Add a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ.","Implement post-processing that automatically adjusts line item amounts when the extracted total doesn't match the sum.","Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior.","Extract line items and totals independently, then use a separate validation model to reconcile discrepancies."],"a":[0],"w":["Add the calculated_total field so the model can self-validate by calculating the total from line items and comparing with the grand total, combined with a boolean flag to flag cases that need review. This method detects mismatches right in the extraction step.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Add the calculated_total field so the model can self-validate by calculating the total from line items and comparing with the grand total, combined with a boolean flag to flag cases that need review. This method detects mismatches right in the extraction step.","t":"Self-check math: CALCULATED_TOTAL + consistency flag.","k":["calculated_total","self-validation","consistency flag"]},{"id":"ccar-f-19","d":"prompt-output","x":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers.\n\nWhat's the most reliable way to ensure metadata extraction always happens first?","o":["Set tool_choice to \"auto\" and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools.","Set tool_choice to \"auto\" in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls.","Set tool_choice to type \"any\" so Claude must use a tool, combined with system prompt instructions to call extract_metadata first.","Set tool_choice to type \"tool\", name \"extract_metadata\" and process the enrichment requests in subsequent turns after receiving the extracted metadata."],"a":[3],"w":["This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Using tool_choice with type \"tool\" and name \"extract_metadata\" forces Claude to call the correct tool first. After receiving metadata, enrichment requests are processed in subsequent turns. This is the only way that is 100% guaranteed."],"e":"Using tool_choice with type \"tool\" and name \"extract_metadata\" forces Claude to call the correct tool first. After receiving metadata, enrichment requests are processed in subsequent turns. This is the only way that is 100% guaranteed.","t":"Force ONE specific tool = tool_choice {type: tool, name}.","k":["tool_choice","forced tool","extract_metadata"]},{"id":"ccar-f-20","d":"prompt-output","x":"After your daily batch of 10,000 documents completes, 300 documents (3%) failed with \"context_length_exceeded\" errors. The results file identifies each failure by custom_id.\n\nWhat's the most cost-effective approach to process these failures?","o":["Resubmit the entire 10,000 document batch using a model tier with a larger context window","Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions","Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts","Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"],"a":[1],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","context_length_exceeded is an error because the input is too long, not the output. Just resubmit 300 failed documents after chunking them into smaller pieces. No need to reprocess all 10,000 documents or increase max_tokens.","This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"context_length_exceeded is an error because the input is too long, not the output. Just resubmit 300 failed documents after chunking them into smaller pieces. No need to reprocess all 10,000 documents or increase max_tokens.","t":"Input too long = CHUNK and retry only the failures.","k":["context_length_exceeded","chunking","custom_id"]},{"id":"ccar-f-21","d":"prompt-output","x":"Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field–sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source.\n\nWhat's the most effective way to improve extraction consistency?","o":["Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability","Make the \"materials\" field required instead of optional in the schema to force the model to always extract a value","Set temperature to 0 to eliminate randomness and ensure deterministic outputs","Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"],"a":[3],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","Inconsistency in extraction is often due to the lack of specific examples of standard formats. Few-shot examples with standardized material descriptions teach the model to format output properly, more effectively than setting temperature=0 or making field required."],"e":"Inconsistency in extraction is often due to the lack of specific examples of standard formats. Few-shot examples with standardized material descriptions teach the model to format output properly, more effectively than setting temperature=0 or making field required.","t":"Inconsistent FORMAT = FEW-SHOT examples.","k":["few-shot","format consistency"]},{"id":"ccar-f-22","d":"prompt-output","x":"Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article–for example, outputting \"500\" for attendee_count when the source contains no attendance information.\n\nWhat's the most effective way to reduce these false extractions?","o":["Add a post-processing step using a second LLM call to verify each extracted value exists in the source document.","Add prompt instructions to return null for any field where information is not directly stated in the source.","Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.","Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."],"a":[1],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","Model hallucinating probable values ​​for fields are not present in the source due to lack of clear 'no information' instructions. Adding explicit instruction 'return null if the information is not directly in the source' directly solves the problem.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"Model hallucinating probable values ​​for fields are not present in the source due to lack of clear 'no information' instructions. Adding explicit instruction 'return null if the information is not directly in the source' directly solves the problem.","t":"Not in source? Say NULL, don't guess.","k":["null","hallucination","nullable fields"]},{"id":"ccar-f-23","d":"prompt-output","x":"After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions.\n\nWhat's the most effective way to address these failures?","o":["Implement retry logic that re-sends requests when validation detects empty required fields.","Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.","Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation.","Add few-shot examples demonstrating extractions from documents with varied structures–showing how to identify citations in different formats and locate methodology details across section types."],"a":[3],"w":["This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Manual review can be useful as a fallback, but it does not solve the system behavior that the question is asking you to improve.","Since the same information appears in many different formats (inline vs bibliography, section vs embedded), these few-shot examples showing how to identify and extract from these formats are the most effective way to improve extraction."],"e":"Since the same information appears in many different formats (inline vs bibliography, section vs embedded), these few-shot examples showing how to identify and extract from these formats are the most effective way to improve extraction.","t":"Same info, many layouts = FEW-SHOT on varied docs.","k":["few-shot","varied structures","citations"]},{"id":"ccar-f-24","d":"prompt-output","x":"Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts\n\nFor which failure pattern would additional retries be LEAST effective?","o":["The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the input","The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings","The model extracts citation counts as locale-formatted strings (\"1,234\") when the schema requires integers","The model extracts dates as ISO 8601 datetime strings (\"2023-03-15T00:00:00Z\") when the schema requires only the date portion (YYYY-MM-DD)"],"a":[0],"w":["No amount of retrying teaches the model information that isn't in the input. Retry-with-error-feedback only fixes mistakes the model could have gotten right from the source.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"No amount of retrying teaches the model information that isn't in the input. Retry-with-error-feedback only fixes mistakes the model could have gotten right from the source.","t":"Retries can't create MISSING info.","k":["retry with feedback","missing information"]},{"id":"ccar-f-25","d":"prompt-output","x":"Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as \"$12\" vs \"12.00\", dietary info as icons vs text.\n\nWhat's the most reliable approach?","o":["Request multiple extraction attempts per document and select the most common format.","Define a strict output schema and include format normalization rules in your prompt.","Use separate extraction calls for each field to ensure consistent handling of each type.","Extract data as-is and normalize formats in post-processing code after Claude returns."],"a":[1],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","For menus with inconsistent formatting, combining strict output schema (structure) with normalization rules right in the prompt (for example: 'prices as float without currency symbol') normalize right in the extraction step, is the most effective and simple.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"For menus with inconsistent formatting, combining strict output schema (structure) with normalization rules right in the prompt (for example: 'prices as float without currency symbol') normalize right in the extraction step, is the most effective and simple.","t":"Strict SCHEMA + NORMALIZATION rules in the prompt.","k":["output schema","normalization","menus"]},{"id":"ccar-f-26","d":"prompt-output","x":"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"–and new types continue appearing regularly.\n\nWhat's the most effective long-term solution?","o":["Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected.","Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value.","Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.","Change property_type from an enum to a free-form string and implement a normalization step in post-processing."],"a":[0],"w":["Because new property types constantly appear, hard enums will always be outdated. Adding 'other' value with its own property_type_detail field allows handling all current and future edge cases without constantly updating the enum.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"Because new property types constantly appear, hard enums will always be outdated. Adding 'other' value with its own property_type_detail field allows handling all current and future edge cases without constantly updating the enum.","t":"Open-ended enum = add OTHER + detail field.","k":["enum","other","schema evolution"]},{"id":"ccar-f-27","d":"prompt-output","x":"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions\n\nBefore deploying, what validation step is most critical?","o":["Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports.","Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate.","Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors.","Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Aggregate accuracy hides segment failures — one document type could be 70% while others are 99%. Auto-routing by overall number alone risks systemic errors in the weak segments.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Aggregate accuracy hides segment failures — one document type could be 70% while others are 99%. Auto-routing by overall number alone risks systemic errors in the weak segments.","t":"Aggregate hides weak SEGMENTS. Slice by type and field.","k":["segment analysis","aggregate accuracy","automation"]},{"id":"ccar-f-28","d":"prompt-output","x":"Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability.\n\nWhich batching strategy is most appropriate?","o":["Submit batches every 6 hours containing documents from that window","Submit a single batch at end of day containing all documents from that day","Submit batches every 4 hours containing documents from that window","Use the real-time API for all documents instead of batch processing"],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Submitting batches every 4 hours ensures that in the worst case, documents wait a maximum of 4 hours + 24 hours of processing = 28 hours < 30 hours SLA. Submitting every 6 hours may violate the SLA (6 + 24 = 30 hours without a safety buffer).","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Submitting batches every 4 hours ensures that in the worst case, documents wait a maximum of 4 hours + 24 hours of processing = 28 hours < 30 hours SLA. Submitting every 6 hours may violate the SLA (6 + 24 = 30 hours without a safety buffer).","t":"Wait + 24h must be < SLA. 4h + 24h = 28h.","k":["Message Batches API","SLA","batch window"]},{"id":"ccar-f-29","d":"prompt-output","x":"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says \"Extract all skills mentioned.\"\n\nWhat's the most effective improvement?","o":["Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity.","Add constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\"","Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries.","Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata."],"a":[0],"w":["The three problems (compound phrases, implied skills, len
