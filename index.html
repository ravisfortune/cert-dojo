irements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend a solution to support the planned changes and technical requirements for Agent1 to use the product information stored in storage1.\nWhat should you include in the recommendation?","o":["Azure AI Search","Grounding with Bing Search","Azure Translator in Foundry Tools","Azure Document intelligence in Foundry Tools"],"a":[0],"e":"Azure AI Search provides the semantic and vector index needed to retrieve product sheet content from storage1 and ground Agent1's answers. Translator does not retrieve, Bing is public web, and Document Intelligence only extracts.","t":"Private docs retrieval = AZURE AI SEARCH.","k":["Azure AI Search","vector search","grounding"]},{"id":"ai-103-63","d":"content-understanding","x":"You have a Microsoft Foundry project named Project1.\nProject1 contains an application that processes PDF vendor invoices.\nYou need to configure Azure Document Intelligence in Foundry Tools to generate a Markdown output that preserves the sections and table structure of the PDFs. The solution must minimize development effort.\nWhat should you do?","o":["Configure content=markdown when you analyze the document.","Configure output=figures when you analyze the PDF.","Increase the confidence threshold.","Set the output_content_format=ContentFormat.MARKDOWN value."],"a":[3],"e":"Set output_content_format to ContentFormat.MARKDOWN when analyzing. The built-in Markdown output keeps sections and tables with no extra post-processing.","t":"Markdown out = output_content_format MARKDOWN.","k":["Document Intelligence","Markdown output"]},{"id":"ai-103-64","d":"content-understanding","x":"You have a Microsoft Foundry project that ingests scanned PDF invoices stored in Azure Blob Storage. Each invoice contains printed fine items and has a table-based layout.\nExtracted results are stored as structured JSON and used as grounding data for an agent in a Retrieval Augmented Generation (RAG) solution.\nYou need to create a single analyzer that meets the following requirements:\nExtracts the invoice number, invoice date, vendor name, and total amount across varying templates\nReturns confidence scores so that results with confidence below 0.80 can be routed for supervisor review\nWhat should you use?","o":["the Azure Content Understanding in Foundry Tools prebuilt-layout analyzer","a custom Azure Content Understanding in Foundry Tools analyzer that defines the required fields as the extracted fields and the returned confidence scores for routing","the Azure Content Understanding in Foundry Tools prebuilt-documentSearch analyzer and search.score from the Azure AI Search results for routing","a Foundry agent that has groundedness guardrails enabled to extract invoice fields and confidence scores"],"a":[1],"e":"A custom Content Understanding analyzer lets you define the invoice fields to extract across templates and returns per-field confidence so values below 0.80 can be routed for review. Prebuilt-layout has no business fields and search scores are retrieval relevance.","t":"Your own fields + confidence = CUSTOM analyzer.","k":["custom analyzer","field confidence","invoices"]},{"id":"ai-103-65","d":"evaluation","x":"You have a Microsoft Foundry project that uses Azure AI Search to ground an agent in internal documentation.\nAfter a recent content update, users report that the agent’s answers have become less accurate.\nYou need to identify whether the retrieved content is negatively influencing the model’s generated responses.\nWhich observability signal should you review?","o":["latency breakdown traces","prediction drift metrics","indexer status and failure history","groundedness evaluation metrics"],"a":[3],"e":"Groundedness evaluation metrics show whether answers are supported by the retrieved context, revealing whether updated content leads to unsupported answers. Indexer status, latency traces and prediction drift measure other things.","t":"Is the answer backed by retrieved text? GROUNDEDNESS.","k":["groundedness","retrieved content"]},{"id":"ai-103-66","d":"video","x":"Question: 66\nHOTSPOT - Case Study\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to ensure that the marketing department can generate videos by using the model deployed to Project2.\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["retrieve; create","download_content; list","create; retrieve","list; download_content"],"a":[2],"e":"Call client.videos.create to submit the async video job, then poll client.videos.retrieve(video.id) until the status is completed, failed or cancelled. list returns a collection and download_content is used after completion.","t":"Create, then retrieve (poll).","k":["videos.create","videos.retrieve","async"]},{"id":"ai-103-67","d":"agents","x":"Question: 67\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario d ntract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure personalized user interactions for Agent1. The solution must meet the business requirements.\nWhat should you include in the solution?","o":["knowledge","tools","guardrails","memory"],"a":[3],"e":"Memory lets Agent1 keep conversation context and recall relevant details from earlier interactions, giving a personalized experience. Knowledge adds indexed info, guardrails restrict behavior, and tools take actions.","t":"Personalized + recall past = MEMORY.","k":["memory","personalization"]},{"id":"ai-103-68","d":"security","x":"Question: 68\nHOTSPOT - Case Study\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will app nels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to ensure that Agent1Dev Team can access Agent1. The solution must meet the security and compliance requirements.\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["AzureKeyCredential(); get","None; get_version","DefaultAzureCredential(); get","DefaultAzureCredential(); create_version"],"a":[2],"e":"DefaultAzureCredential uses Microsoft Entra auth, meeting the no-API-key rule once the dev group has the right RBAC role. Use project_client.agents.get(agent_name=...) to fetch the existing agent. create_version makes a new version and get_version targets a specific one.","t":"Entra login + GET existing agent.","k":["DefaultAzureCredential","agents.get","RBAC"]},{"id":"ai-103-69","d":"evaluation","x":"You have a Microsoft Foundry project that contains a Retrieval Augmented Generation (RAG) chat solution used by customer support agents.\nYou are adding an automated pre-production evaluation step to a CI/CD pipeline named Pipeline1. The evaluation will run against a labeled test dataset that contains support questions and the expected grounding context.\nYou need to ensure that Pipeline1 fails if unsupported content or a retrieval mismatch exceeds a defined threshold:\n•responses include claims not supported by the retrieved source content\n•retrieved source content does not align with the labeled expected context\nWhich two built-in evaluators should you use in Pipeline1? Each correct answer presents pat of the solution.\nNOTE: Each correct selection is worth one point.","o":["Fluency","Coherence","Groundedness","Retrieval","Response Completeness"],"a":[2,3],"e":"The Groundedness evaluator flags claims not supported by retrieved sources. The Retrieval evaluator checks whether retrieved context matches the labeled expected context. Fluency, coherence and completeness measure other aspects.","t":"Claims backed = GROUNDEDNESS. Right docs fetched = RETRIEVAL.","k":["groundedness","retrieval evaluator"]},{"id":"ai-103-70","d":"agents","x":"You have a Microsoft Foundry project that contains a support-ticket triage agent built by using the Foundry Agent Service.\nThe agent uses tool to classify the ticket type and sot the ticket priority.\nSometimes, the same support case continues across multiple sessions over several days.\nYou need to persist state by using a durable ID to ensure that the agent can automatically reuse the full interaction history. The solution must preserve previous user messages, tool calls and tool outputs across turns and sessions.\nWhich runtime component should you use?","o":["response","conversation","agent","output item"],"a":[1],"e":"A conversation has a durable ID and stores the full history, including user messages, agent responses, tool calls and outputs. Reuse its ID across turns and sessions. An agent is the configured worker, a response is one execution, and an output item is part of it.","t":"Durable history container = CONVERSATION.","k":["conversation","durable ID","history"]},{"id":"ai-103-71","d":"evaluation","x":"HOTSPOT -\n\nYou have a Microsoft Founcy project that contains a Retrieval Augmented Generation (RAG) solution.\nYou need to run a pre-production evaluation by using labeled CSV dataset that contains the query, context, response and ground truth. The evaluation must measure the following:\n•Whether responses address the user query\n•Whether responses are supported by the provided context\n•Whether responses contain sensitive or proprietary information\nWhich AI quality evaluation metrics should you use? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["GPT similarity and F1 score; Indirect attack","Groundedness and ROUGE score; Violent content","Coherence and Fluency; Hateful and unfair content","Groundedness and Relevance; Protected material"],"a":[3],"e":"Relevance checks whether the response answers the query, groundedness checks support by context, and the protected material evaluator detects proprietary content. The other pairs measure style, similarity or other risks.","t":"Answers it? RELEVANCE. Backed? GROUNDEDNESS. Secret stuff? PROTECTED material.","k":["groundedness","relevance","protected material"]},{"id":"ai-103-72","d":"evaluation","x":"You plan to configure an evaluation in Microsoft Foundry for a Retrieval Augmented Generation (RAG) chat app.\nYou need to provide scores for groundedness, relevance, and harmful content categories.\nWhich two evaluation categories can you use? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","o":["AI quality (NLP) metrics","AI quality (AI assisted) metrics","risk and safety metrics","similarity evaluators","fluency evaluator"],"a":[1,2],"e":"Risk and safety metrics score harmful content categories. AI quality (AI assisted) metrics include model-judged groundedness and relevance for RAG responses. NLP metrics, similarity and fluency do not cover these.","t":"Harm = RISK & SAFETY. RAG quality = AI-ASSISTED.","k":["risk and safety","AI-assisted metrics"]},{"id":"ai-103-73","d":"agents","x":"You have a Microsoft Foundry project that contains an agent. The agent uses two tools to perform the following actions:\n•Use Azure AI Search to retrieve answers from a private product documentation index.\n•Use the web search tool to retrieve public information on the internet.\nYou need to ensure that for a specific run, the agent deterministically retrieves information only from the internet.\nTo what should you set tool_choice?","o":["“auto”","{“type”: “bing_grouding”}","“required”","{“type”: “azure_ai-search”}"],"a":[1],"e":"Name the Bing grounding (web search) tool in tool_choice to force that tool for the run. auto lets the model pick, required forces some tool but not which one, and the AI Search type forces private docs.","t":"Force ONE specific tool = name its TYPE.","k":["tool_choice","bing_grounding","specific tool"]},{"id":"ai-103-74","d":"models","x":"You have a Microsoft Foundry project that contains a customer support agent built on a deployed chat model.\nThe agent responses are validated by using an automated testing system that compares generated answers to stored expected outputs. Identical prompts must return consistent response to prevent automated test failures.\nYou need to reduce response variability, without modifying the prompt or reducing factual accuracy.\nWhat should you do for the model?","o":["Decrease the temperature parameter.","Remove stop sequences from the requests.","Increase the temperature parameter.","Increase the max_tokens parameter."],"a":[0],"e":"Lowering temperature reduces sampling randomness, so identical prompts give more consistent output while using the same facts. max_tokens and stop sequences control length, and raising temperature adds randomness.","t":"Consistent output = LOWER temperature.","k":["temperature","consistency"]},{"id":"ai-103-75","d":"prompt-engineering","x":"You are developing prompts for a Micosoft Foundry project that classifies incoming support tickets by category.\nYou need to improve accuracy by showing the model how correct classifications look, without retaining the model or storing knowledge permanently.\nWhich prompt engineering approach should you use?","o":["few-shot learning","Retrieval Augmented Generation (RAG)","chain of thought","zero-shot learning"],"a":[0],"e":"Few-shot prompting puts correctly classified examples in the prompt to show the desired pattern, without fine-tuning or permanently storing anything. Zero-shot gives no examples, chain of thought guides reasoning, and RAG retrieves outside info.","t":"Show examples in the prompt = FEW-SHOT.","k":["few-shot","prompt engineering","classification"]},{"id":"ai-103-76","d":"agents","x":"You have a Microsoft Foundry project that contains an agent for a customer support chat app. The agent uses a memory store and a memory search tool.\nYou need to ensure that the conversation history does NOT persist across separate sessions.\nTo what should you set the scope of the memory tool?","o":["{{$conversationId}}","{{$userId}}","session","global"],"a":[2],"e":"Setting the memory tool scope to session isolates history to the current session so it is not reused later. conversationId or userId scopes persist across interactions, and global shares memory broadly.","t":"No carry-over between sessions = scope SESSION.","k":["memory scope","session"]},{"id":"ai-103-77","d":"agents","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains an agent.\nYou need to enable long-term memory to ensure that the agent can recall user preferences across separate conversations. Stored memories must be isolated per authenticated user without the client application manually generating user IDs.\nHow should you complete the Python code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all.\nNOTE: Each correct selection is worth one point.","o":["scope: \"{{$userId}}\"; tools: [memory_tool]","scope: \"session\"; tools: [memory_tool]","scope: \"{{$conversationId}}\"; tools: [mem_store_name]","scope: \"{{$userId}}\"; tools: [mem_store_name]"],"a":[0],"e":"Use {{$userId}} as the memory scope so Foundry uses the authenticated user's identity to isolate their memories across conversations without the client creating IDs. Add the memory_tool object to tools; mem_store_name is just a string.","t":"Per-user memory = {{$userId}} + memory_tool object.","k":["memory scope","$userId","memory_tool"]},{"id":"ai-103-78","d":"observability","x":"You have a web app named App1 that processes user prompts by integrating with a Microsoft Foundry project named Project1. App1 performs the following actions:\n•Sends prompts directly to a model by using the Azure OpenAI Responses API\n•Invokes the Azure AI Content Safety tool by using a Foundry connection within the same request\nYou need to configure end-to-end visibility into each step of the request workflow.\nWhat should you do?","o":["Enable logging by using Foundry Local.","Enable application tracing in Project1.","Route requests through the Azure OpenAI endpoint.","Enable logging by using the client SDK for Content Safety."],"a":[1],"e":"Application tracing in the Foundry project captures the whole request workflow, including the Responses API model call and the Content Safety tool call through the connection, as correlated steps. SDK logging covers only one part and Foundry Local is for local dev.","t":"End-to-end visibility = APPLICATION TRACING.","k":["application tracing","end-to-end","Foundry"]},{"id":"ai-103-79","d":"agents","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains two agents named PolicyWriter and RskReviewer.\nPolicyWriter generates daft updates for customer polices, and RiskReviewer reviews the drafts.\nIn the visual builder, you need to create a workflow that meets the following requirements:\n•Finalizes low-risk updates without manual intervention\n•Ensures predictable execution across the agents\n•Requires user approval for highs updates\nWhat should you configure? To answer, select the appropriate options in the answer area.\nNOTE: Each comet selection is worth one point.","o":["The sequential template that passes outputs node-by-node; Add a Conditional statement.","The sequential template that passes outputs node-by-node; Add a Basic chat node.","The group chat template to dynamically route control between the agents; Add an Ask a question node.","The human-in-the-loop template that pauses execution of the workflow for input; Add a Basic chat node."],"a":[0],"e":"The sequential template passes output from PolicyWriter to RiskReviewer in a fixed, predictable order. A Conditional statement after review sends low-risk drafts to auto-finalize and high-risk drafts to approval. Group chat is dynamic and human-in-the-loop would pause everything.","t":"Predictable = SEQUENTIAL. Risk split = CONDITIONAL.","k":["sequential template","conditional","workflow"]},{"id":"ai-103-80","d":"observability","x":"You have a Microsoft Foundry project that contains an agent named Agent1.\nAgent runs successful, but Foundry Control Plane does NOT display values for error rates, runs, and token usage, and the Traces tab is empty.\nYou need to ensure that Found Control Plane displays the appropriate values for Agent1.\nWhat should you do?","o":["Assign to a Log Analytics workspace to Agent1.","Update Agent1 to a new version.","Restart Agent from Foundry Control Plan","Enable Application Insights for Agent1."],"a":[3],"e":"Enable Application Insights for Agent1 so runs, error rates, token usage and traces are collected and shown in Foundry Control Plane. A new version or restart does not configure telemetry, and linking a Log Analytics workspace alone does not turn on trace collection.","t":"Empty dashboards and traces = turn on APP INSIGHTS.","k":["Application Insights","Foundry Control Plane","traces"]},{"id":"ai-103-81","d":"content-understanding","x":"You have a Microsoft Foundry project that contains an agent.\nThe agent uses Azure Content Understanding in Foundry Too to process vendor onboarding packets. The packs include digital PDFs that contain tables and hyperlinks.\nThe extracted content is indexed for search and provided to a downstream agent in the Markdown format.\nYou need to generate a Markdown output that has a layout and a semantic structure optimized for Retrieval Augmented Generation (RAG) workflows.\nWhich built-in analyzer should you use?","o":["prebuilt-layout","prebuilt-documentFieldSchema","prebuilt-read","prebuilt-documentSearch"],"a":[3],"e":"prebuilt-documentSearch produces Markdown designed for search and RAG, keeping layout and adding semantic structure for retrieval and grounding. prebuilt-layout focuses on structural elements, prebuilt-read on text, and documentFieldSchema on fields.","t":"Markdown for RAG/search = prebuilt-DOCUMENTSEARCH.","k":["prebuilt-documentSearch","RAG","Markdown"]},{"id":"ai-103-82","d":"rag","x":"You have a Microsoft Foundry project that contains an agent.\nThe agent uses Azure AI Search for Retrieval Augmented Generation (RAG).\nYou plan to ingest and index PDF product manuals.\nYou need to build a solution that supports semantic similarity matching. The solution must ensure that the agent retrieves relevant data when user questions use different wording than the product manuals.\nWhich indexing approach should you use?","o":["suggesters","semantic ranking","vector search","analyzers"],"a":[2],"e":"Vector search uses embeddings to represent manual content and questions by meaning, so retrieval works even when wording differs. Semantic ranking reorders keyword results, suggesters do type-ahead, and analyzers tokenize text.","t":"Different words, same meaning = VECTORS.","k":["vector search","embeddings","semantic similarity"]},{"id":"ai-103-83","d":"rag","x":"You have a Microsoft Foundry agent that grounds responses from an Azure Search index that contains the following:\n•Searchable text fields for product names and product codes\n•A vector field that stores embeddings for product descriptions\nYou need to ensure that users can query the index by using the following:\n•Exact product names or codes\n•Natural language descriptions of the products\nWhat should you configure?","o":["hybrid search","keyword search only","vector search only","semantic search only"],"a":[0],"e":"Hybrid search combines keyword search, good for exact names and codes, with vector search, good for natural-language descriptions. Vector-only struggles with exact IDs and keyword-only misses meaning.","t":"Exact codes + natural language = HYBRID.","k":["hybrid search","keyword","vector"]},{"id":"ai-103-84","d":"rag","x":"You have an Azure AI Search indexer that ingests PDF policy manuals.\nClient applications must display page-level citations that have bounding polygons for both text and images.\nYou need to add a single built-in multimodal content extraction skill to the Azure AI Search skillset. The solution must meet the following requirements:\n•Provide text and image location metadata.\n•Extract tables that span multiple pages.\nWhat should you add?","o":["Azure Content Understanding in Foundry Tools","Document Layout","Document Extraction","GenAI Prompt"],"a":[1],"e":"The Document Layout skill is the built-in multimodal extraction skill that keeps document structure, gives text and image locations with bounding polygons, and handles tables spanning pages. Document Extraction lacks layout-aware output and GenAI Prompt is for enrichment.","t":"Polygons + page-spanning tables = DOCUMENT LAYOUT skill.","k":["Document Layout skill","bounding polygons","skillset"]},{"id":"ai-103-85","d":"rag","x":"You are building an Azure AI Search indexing pipeline named Pipeline1 that ingests invoices stored in Azure Blob Storage. The invoices are stored as scanned images.\nYou need to enable users to search invoice data across the invoice fields.\nWhich built-in skill should you add to the skillset of Pipeline1?","o":["Text Split","Image Analysis","Text Translation","optical character recognition (OCR)"],"a":[3],"e":"Add the OCR skill to pull searchable text, including invoice field values, from scanned images. Text Split needs text first, Translation changes language, and Image Analysis gives visual insights, not text.","t":"Scanned images to searchable text = OCR.","k":["OCR skill","scanned invoices","skillset"]},{"id":"ai-103-86","d":"content-understanding","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that uses Azure Content Understanding in Foundry Tools to analyze marketing videos.\nVideo segmentation is enabled.\nYou need to configure an analyzer to output a generated JSON field that describes the color scheme of each video segment.\nHow should you configure the analyzer? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.","o":["Field value type: string; Field method: classify","Field value type: string; Field method: generate","Field value type: group; Field method: generate","Field value type: table; Field method: classify"],"a":[1],"e":"A color-scheme description is free-form generated text, so use field type string with method generate. classify picks from fixed categories, table is tabular and group is a structure.","t":"Describe in your own words = STRING + GENERATE.","k":["field method generate","string","video analyzer"]},{"id":"ai-103-87","d":"content-understanding","x":"You have an invoice-processing application named App1 that uses Azure Constant Understanding in Foundry Tools.\nYou are building a new Content Understanding pipeline named Pipeline1 that must meet the following requirements:\n•Compare an invoice to its related purchase order\n•Validate the voice against static vendor contact documents\n•Return a single structured output that includes discrepancy findings\nYou need to configure Pipeline1 and expose the pipeline as a single analyzer endpoint. What should you configure?","o":["a single-file task in standard mode that uses confidence scores enabled for the extracted fields.","a multiple-file task in pro mode that uses the vendor contract files as reference data","a single-file task in standard mode that uses the vendor contract provided as an additional document during analysis.","a multi-file task in standard mode that uses the invoice and purchase order as input to the analyzer"],"a":[1],"e":"Use a multiple-file task in pro mode with vendor contract files as reference data. Pro mode supports multi-step, cross-document reasoning to compare the invoice with the purchase order and check against the vendor documents in one structured output.","t":"Cross-check many docs + reference = MULTI-FILE PRO mode.","k":["pro mode","multi-file","reference data"]},{"id":"ai-103-88","d":"video","x":"You have a Microsoft Foundry project that generates short promotional product videos.\nAfter several clips are approved, reviewers notice a small watermark in the top-right corner of some videos.\nYou need to remove the watermark without regenerating the videos.\nWhat should you do?","o":["Modify the original prompt to exclude watermarks.","Increase the guidance scale.","Crop the video by using the size parameter.","Apply a mask-based inpainting edit to the affected part of the video."],"a":[3],"e":"A mask-based inpainting edit targets only the marked watermark area of the existing video, removing it without regenerating the clip. Prompt or guidance changes need a new generation, and cropping changes the frame.","t":"Remove one spot without redo = MASK inpainting (again).","k":["mask inpainting","video edit","watermark"]},{"id":"ai-103-89","d":"multimodal","x":"You have a web app named App1 that sends requests to a multimodal chat model deployment in a Microsoft Foundry project.\nUser messages can contain both text and images.\nCurrently, App1 includes image URL: as plain text inside the message content so the model cannot recognize them as images.\nTraces show that the requests contain a single text message instead of a multimodal content array.\nYou need to send the message as a structured array that includes both the text portion and the image reference to ensure that the model can process the image correctly.\nWhat should you do?","o":["Add the image URL to the request metadata section, so the model can resolve the processing issue automatically.","Place the image URL inside the System Message and set type to image_url so the model loads the image at initialization.","Set the user message content array to include items that have type: text and type: image_url.","Encode the image to base64 and include the encoded data inside the content string of the user message."],"a":[2],"e":"Send user content as a structured array with a type text item and a type image_url item, so the model sees the image as image input. URLs or base64 inside a text string stay text, metadata is not model input, and system messages hold instructions.","t":"Multimodal = array with TEXT + IMAGE_URL items.","k":["multimodal","content array","image_url"]},{"id":"ai-103-90","d":"speech","x":"You are building a customer support web app named App1 in Microsoft Foundry that uses a GPT realtime model.\nApp1 must support:\n•Live, low-latency voice conversations that use Azure OpenAI\n•Streaming audio input from users and playback audio responses\nYou need to configure a connection method that supports real-time audio streaming in client application and targets approximately 100 ms latency.\nWhich connection method should you use?","o":["SIP","RTMP","WebRTC","WebSocket"],"a":[2],"e":"WebRTC is built for real-time, two-way media streaming in browsers and clients with very low latency, around 100 ms. RTMP is for broadcasting, SIP is telephony signaling, and WebSocket streams events but is not a media transport.","t":"~100 ms live voice in the client = WebRTC.","k":["WebRTC","realtime","low latency"]},{"id":"ai-103-91","d":"evaluation","x":"You have a Microsoft Foundry project that contains an agent and uses a GitHub repository. The repository contains a YAM file named File1 that defines the evaluation settings of the agent.\nYou need to create a GitHub Actions workflow that runs the evaluation defined in File1 when a pull request (PR) is opened. How should you configure the workflow?","o":["Set tenant-id to the Microsoft Entra tenant ID","Set model-deployment-name to the deployed model.","Set project-endpoint to the endpoint of the project.","Set evaluation-config to the path of the YAML file."],"a":[3],"e":"Set evaluation-config to the path of File1 so the GitHub Actions evaluation step loads and runs the YAML settings on pull requests. Endpoint, deployment name and tenant ID are environment or auth settings.","t":"Which evaluation to run = EVALUATION-CONFIG path.","k":["evaluation-config","GitHub Actions","YAML"]},{"id":"ai-103-92","d":"security","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains an agent.\nThe agent uses a stored access key to retrieve secrets from an Azure key vault, which violates a keyless-credentials requirement.\nYou need to ensure that the agent can retrieve the secrets. The solution must follow the principle of least privilege.\nWhat should you configure? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["Enable a system-assigned managed identity at the Foundry level; Add a Key Vault access policy for the secrets.","Enable a system-assigned managed identity at the project level; Add an API key to application settings.","Enable a system-assigned managed identity at the project level; Assign the Key Vault Secrets User role to the managed identity.","Create a service principal and store the principal’s client secret; Assign the Key Vault Secrets User role to the managed identity."],"a":[2],"e":"Enable a system-assigned managed identity at the project level to give the agent a keyless identity scoped to the project, then assign only the Key Vault Secrets User role to read secrets. Foundry-level identity is broader, and client secrets or API keys are stored credentials.","t":"Keyless + least privilege = project MI + Secrets USER.","k":["managed identity","Key Vault Secrets User","least privilege"]},{"id":"ai-103-93","d":"evaluation","x":"HOTSPOT -\n\nYou have a Microsoft Foundry project that contains a customer support application.\nYou create an evaluation named Run1 that has the following configurations:\n•Includes risk and safety metrics\n•Includes the protected material evaluation\n•Includes harmful content metrics that use a medium severity threshold\nYou create an evaluation named Run2 that has the following configurations:\n•Includes risk and safety metrics\n•Includes the protected material evaluation\n•Includes harmful content metrics that use a high severity threshold\nYou run both evaluations against a dataset named DB1 and receive the following results:\n•Content harm defect rate of Run1: 12%\n•Content harm defect rate of Run2: 4%\n•Protected material evaluation of Run1: 6%\n•Protected material evaluation of Run1: 6%\nYou start a fine-tuning job by using DB1. The job fails during automatic RAI checks for multiple content harm types.\nYou discover that the content filtering configuration is set to high severity.\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","o":["1: Yes; 2: No; 3: No","1: No; 2: No; 3: Yes","1: No; 2: Yes; 3: Yes","1: Yes; 2: Yes; 3: No"],"a":[2],"e":"1 No: lowering filter severity does not fix a fine-tuning job that failed RAI checks; the training data must be fixed. 2 Yes: a medium threshold flags a wider range of harm than high, so Run1's higher defect rate fits. 3 Yes: protected material is evaluated separately from harm severity, so the equal 6% shows those thresholds do not affect it.","t":"Fix the DATA, not the filter. Medium catches more. Protected material is separate.","k":["RAI checks","severity threshold","protected material"]},{"id":"ai-103-94","d":"observability","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains a multi-agent solution. The agents use tool calling to query internal systems.\nYou need to implement responsible AI auditing to meet the following requirements:\n•Capture all the nested operations across the entire agent run.\n•Record tool invocation arguments and retuned results as metadata.\nWhat should you use for each requirement? To answer, drag the appropriate options to the correct targets Each option may be used once, more than once, or not at all. You may need o dag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.","o":["Hierarchical spans; Tool call attributes","Hierarchical spans; A KQL query filter","Sampling; Tool call attributes","A KQL query filter; Trace sampling policy"],"a":[0],"e":"Hierarchical spans form a parent-child trace that captures nested agent, model and tool operations across the run. Tool call attributes store tool arguments and returned results. Sampling and KQL filters decide what is kept or queried.","t":"Nested = HIERARCHICAL spans. Tool details = ATTRIBUTES.","k":["hierarchical spans","tool call attributes","tracing"]},{"id":"ai-103-95","d":"operations","x":"DRAG DROP -\n\nYou have a Microsoft Foundry project that contains an agent. The agent uses threads and file uploads and calls an Azure OpenAI model deployment.\nDuring load testing, calls intermittently fall and return an HTTP 429 rate limit exceeded error. Some user uploads fail and generate an HTTP 400 file size exceeded error.\nYou need to mitigate the errors and reduce call failures. The solution must remain within the service and model limits.\nWhat should you do to resolve each error? To answer, drag the appropriate actions to the correct errors. Each action may be used once, more than once or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each comet selection is worth one point.","o":["HTTP 429: Split content into smaller files before uploading the files; HTTP 400: Increase tenant-wide quotas.","HTTP 429: Implement exponential backoff and jitter in the retry logic; HTTP 400: Split content into smaller files before uploading the files.","HTTP 429: Use additional agent tools to reduce the message size; HTTP 400: Implement exponential backoff and jitter in the retry logic.","HTTP 429: Increase tenant-wide quotas; HTTP 400: Move large content to files and use file search."],"a":[1],"e":"HTTP 429 is throttling, so retry with exponential backoff and jitter. HTTP 400 file size exceeded breaks a size limit, so split content into smaller files before upload. Raising tenant quotas does not fit within current limits.","t":"429 = WAIT smartly. 400 too big = SPLIT files.","k":["429","400","backoff","file size"]},{"id":"ai-103-96","d":"models","x":"You have a Microsoft Foundry project.\nYou need to deploy a model from the model catalog to support a search solution for internal policy documents. The model must generate vector representations of the text in the documents and of user queries.\nWhich type of model should you use?","o":["a small language model (SLM)","an image generation model","a large language model (LLM)","an embedding model"],"a":[3],"e":"An embedding model turns document text and queries into numeric vectors for semantic similarity search. LLMs and SLMs generate text and image models make images.","t":"Text to vectors = EMBEDDING model.","k":["embedding model","vector search"]},{"id":"ai-103-97","d":"models","x":"You have a Microsoft Foundry project.\nYou need to deploy a model from the model catalog to support real-time inference. The solution must meet the following requirements:\n•Use key-based authentication.\n•Support real-time REST API access.\n•NOT consume the vCPU quota of the virtual machines in the Azure subscription.\nWhich type of deployment should you use?","o":["batch","standard","self-hosted container","serverless API"],"a":[3],"e":"A serverless API deployment gives real-time REST inference with key auth while Microsoft manages compute, so it does not use your subscription's VM vCPU quota. Batch is async and self-hosted containers use your compute.","t":"No vCPU quota used = SERVERLESS API.","k":["serverless API","vCPU quota","real-time"]},{"id":"ai-103-98","d":"security","x":"HOTSPOT -\n\nYou plan to create a Microsoft Foundry project named Project1 that will contain an agent and use an Azure key vault named KV1.\nYou need to configure a connection from Project1 to KV1.\nHow should you complete the Bicep code? To answer, select the appropriate options in the answer area?\nNOTE: Each correct selection is worth one point.","o":["category: 'AzureAIService'; authType: 'AccountKey'","category: 'AzureKeyVault'; authType: 'ApiKey'","category: 'AzureKeyVault'; authType: 'AccountManagedIdentity'","category: 'AzureOpenAI'; authType: 'ApiKey'"],"a":[2],"e":"The target is Key Vault, so category is AzureKeyVault. authType AccountManagedIdentity lets the Foundry account use its managed identity for keyless access. AccountKey and ApiKey are key-based.","t":"Key Vault + keyless = AzureKeyVault + AccountManagedIdentity.","k":["Bicep","AzureKeyVault","managed identity"]},{"id":"ai-103-99","d":"agents","x":"HOTSPOT -\nYou have a Microsoft Foundry project.\nYou need to create a customer support agent that meets the following requirements:\n•Grounds responses only in company policy documents stored in curated repositories\n•Retains customer preferences across separate chat sessions\nHow should you configure the agent? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["Knowledge grounding: Embed the policy documents directly into the agent instructions. Memory: Retain user preferences in the state of the client application.","Knowledge grounding: Configure retrieval from approved data sources. Memory: Enable agent memory that uses persistent storage.","Knowledge grounding: Configure retrieval from approved data sources. Memory: Use orchestration-managed session context.","Knowledge grounding: Upload the policy documents directly to the agent. Memory: Use orchestration-managed session context."],"a":[1],"e":"Retrieval from approved data sources limits grounding to curated policy repositories. Agent memory with persistent storage keeps preferences across sessions. Session context does not persist, client state is not agent memory, and embedding docs in instructions does not scale.","t":"Curated retrieval + PERSISTENT memory.","k":["approved data sources","persistent memory"]},{"id":"ai-103-100","d":"development","x":"You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nYou need to improve response completeness. The solution must be implemented in the logic of the application code before responses are returned.\nWhat should you do?","o":["Add a retry evaluation before the responses are returned.","Increase the value of the presence_penalty parameter","Decrease the value of the temperature parameter.","Replace the model with a smaller deployment."],"a":[0],"e":"Add an evaluation or reflection step in the app to check that the summary covers the required information, and retry if it does not, before returning. Temperature and presence_penalty change generation style, and a smaller model does not help.","t":"Completeness in app code = RETRY evaluation.","k":["retry evaluation","completeness"]},{"id":"ai-103-101","d":"tools-data","x":"HOTSPOT\n-\nYou develop a test method to verify the results retrieved from a call to the Azure Vision in Foundry Tools API. The call is used to analyze the existence of company logos in images. The call returns a collection of brands named brands.\nYou have the following code segment:\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","o":["Statement 1: No. Statement 2: Yes. Statement 3: Yes.","Statement 1: Yes. Statement 2: Yes. Statement 3: No.","Statement 1: No. Statement 2: No. Statement 3: No.","Statement 1: Yes. Statement 2: No. Statement 3: Yes."],"a":[1],"e":"1 Yes: confidence >= 0.75 shows brands at 75% or more. 2 Yes: rectangle.x and y are the top-left corner. 3 No: w and h are width and height, not the bottom-right corner; that is x+w and y+h.","t":"x,y = top-left. w,h = size, not a corner.","k":["bounding box","confidence","Vision"]},{"id":"ai-103-102","d":"models","x":"You have an Azure subscription.\nYou plan to build an app that will use the Azure AI DALL-E model.\nYou need to deploy the model.\nWhat should you use?","o":["the Azure SDK for Python and PowerShell cmdlets.","the Azure portal and Microsoft Graph API","the Azure SDK for JavaScript and Azure Machine Learning Studio.","Microsoft Foundry and the Azure Command Line Interface (CLI)"],"a":[3],"e":"Deploy the DALL-E model through Microsoft Foundry, or automate it with the Azure CLI. Graph API and Azure ML Studio are not deployment surfaces for this.","t":"Deploy models = FOUNDRY (or CLI).","k":["DALL-E","Foundry","Azure CLI"]},{"id":"ai-103-103","d":"security","x":"HOTSPOT\n-\nYou have an Azure subscription.\nYou need to create a new resource that will generate fictional stores in response to user prompts. The solution must ensure that the resource uses a customer-managed key to protect data.\nHow should you complete the script? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["--kind LanguageAuthoring; --assign-identity","--kind AIServices; --api-properties","--kind OpenAI; --api-properties","--kind OpenAI; --encryption"],"a":[3],"e":"Generating stories needs an Azure OpenAI resource, so use --kind OpenAI. The customer-managed key settings (keySource Microsoft.KeyVault) are passed with --encryption. --api-properties does not set encryption.","t":"Generate text = OpenAI kind. CMK = --ENCRYPTION.","k":["--kind OpenAI","--encryption","customer-managed key"]},{"id":"ai-103-104","d":"security","x":"HOTSPOT\n-\nYou have a Python application collects customer comments before posting them to a public forum.\nYou need to send a text comment to Azure AI Content Safety and return the self-harm severity from the response.\nHow should you complete the code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["request = AnalyzeTextOptions(text=comment); response = client.analyze_image(request)","request = TextCategory.SELF_HARM(comment); response = client.moderate_text(request)","request = AnalyzeTextOptions(text=comment); response = client.analyze_text(request)","request = AnalyzeTextOptions(categories=comment); response = client.analyze_text(request)"],"a":[2],"e":"AnalyzeTextOptions takes the comment through the text argument, and client.analyze_text sends it to Content Safety. Then read the self-harm severity from categories_analysis. analyze_image is for images.","t":"Text in, analyze_TEXT out.","k":["Content Safety","analyze_text","self-harm"]},{"id":"ai-103-105","d":"tools-data","x":"You have a custom named entity recognition (NER) project in Azure Language in Foundry Tools for support tickets. The schema for the project contains an entity type named ContactInfo.\nIn tagged training files, ContactInfo is used for phone numbers, email addresses, and social media handles.\nModel evaluation shows low precision for ContactInfo, including false positives in which nearby text is extracted as ContactInfo.\nYou need to improve the precision of the project.\nWhat should you do before retraining the model?","o":["Trigger an auto-labeling job.","Add more support tickets as training data and label more ContactInfo entities.","Replace ContactInfo by using Phone, Email, and SocialMedia entities. Relabel every matching span.","Lower the confidence threshold for ContactInfo."],"a":[2],"e":"ContactInfo mixes phone numbers, emails and social handles with different patterns. Splitting it into Phone, Email and SocialMedia entities and relabeling gives clearer training signals and fewer false positives. Lower thresholds raise recall, not precision.","t":"Low precision from a broad label? SPLIT the entity.","k":["entity schema","precision","relabel"]},{"id":"ai-103-106","d":"tools-data","x":"You are building a text-to-speech solution that uses Azure Speech in Foundry Tools to read instructions from the script in a text file.\nYou discover that the solution often pronounces technical terms incorrectly.\nYou need to prevent the incorrect pronunciations. The solution must minimize development effort.\nWhat should you do?","o":["Use Speech Synthesis Markup Language (SSML) to specify phonemes.","Use Speech Synthesis Markup Language (SSML) to apply say as rules.","Use Speech Synthesis Markup Language (SSML) to adjust the prosody of the voice.","From Speech Studio, train a custom neural voice","From Azure OpenAI use the Whisper model."],"a":[0],"e":"SSML phonemes specify exactly how a word or technical term should be pronounced, fixing mispronunciation with little effort. say-as changes how text like dates is read, prosody changes speed and pitch, custom voice is heavy, and Whisper is speech to text.","t":"Wrong pronunciation = SSML PHONEME.","k":["SSML","phoneme","pronunciation"]},{"id":"ai-103-107","d":"security","x":"HOTSPOT\n-\nYou have a Python application that redacts sensitive information before sending prompt text to a language model. The application has the following code:\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","o":["Statement 1: Yes. Statement 2: Yes. Statement 3: No.","Statement 1: Yes. Statement 2: No. Statement 3: No.","Statement 1: No. Statement 2: Yes. Statement 3: Yes.","Statement 1: No. Statement 2: No. Statement 3: Yes."],"a":[2],"e":"1 No: the PII categories are only Person and PhoneNumber, so there are no records for contact email or SSN. 2 Yes: email is not a configured category, so the address stays in text_for_model. 3 Yes: phone numbers are detected and masked by entity type.","t":"Only listed PII categories get redacted.","k":["PII redaction","categories","entityMask"]},{"id":"ai-103-108","d":"tools-data","x":"DRAG DROP\n-\nYou are developing an application that will detect faulty components produced on a factory production line. The components are specific to your business.\nYou need to use the Azure Custom Vision API to help detect common faults.\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","o":["1. Create a project. 2. Train the object detection model. 3. Upload and tag images.","1. Create a project. 2. Upload and tag images. 3. Train the classifier model.","1. Initialize the training dataset. 2. Upload and tag images. 3. Train the object detection model.","1. Upload and tag images. 2. Create a project. 3. Train the classifier model."],"a":[1],"e":"In Custom Vision, create the project, upload and tag images of components, then train the classifier. Training comes after tagging, and a classifier fits detecting common faults.","t":"Create, Tag, Train (in that order).","k":["Custom Vision","classifier","tag images"]},{"id":"ai-103-109","d":"security","x":"You are developing a new sales system that will process user-generated video and text from a public-facing website.\nYou plan to notify users that their data has been processed by the sales system.\nWhich responsible AI principle does this help meet?","o":["inclusiveness","transparency","reliability and safety","fairness"],"a":[1],"e":"Telling users their data was processed by the AI system shows them how it handles their data, which is transparency.","t":"Telling users = TRANSPARENCY.","k":["transparency","responsible AI"]},{"id":"ai-103-110","d":"tools-data","x":"You are designing a content management system.\nYou need to ensure that the reading experience is optimized for users who have reduced comprehension and learning differences, such as dyslexia. The solution must minimize development effort.\nWhich Azure service should you include in the solution?","o":["Azure Document Intelligence in Foundry Tools","Azure AI Immersive Reader","Azure Language in Foundry Tools","Azure Translator in Foundry Tools"],"a":[1],"e":"Azure AI Immersive Reader has built-in reading aids like text formatting, read aloud and line focus for readers with learning differences such as dyslexia, with minimal development.","t":"Reading help for dyslexia = IMMERSIVE READER.","k":["Immersive Reader","accessibility","dyslexia"]},{"id":"ai-103-111","d":"security","x":"You have an Azure subscription that contains an Azure App Service app named App1.\nYou provision a Microsoft Foundry Service resource named CSAccount1.\nYou need to configure App1 to access CSAccount1. The solution must minimize administrative effort.\nWhat should you use to configure App1?","o":["the endpoint URI and a shared access signature (SAS) token","the endpoint URI and subscription key","the endpoint URI and an OAuth token","a system assigned managed identity and an X.509 certificate"],"a":[1],"e":"The simplest setup is the endpoint URI and a subscription key. OAuth adds token setup, SAS tokens are for Storage, and managed identity does not need an X.509 certificate.","t":"Minimal effort = ENDPOINT + KEY.","k":["endpoint","subscription key"]},{"id":"ai-103-112","d":"security","x":"DRAG DROP\n-\nYou have a web app that uses Azure AI Search.\nWhen reviewing activity you see greater than expected search query volumes. You suspect that the query key is compromised.\nYou need to prevent unauthorized access to the search endpoint and ensure that users only have read only access to the documents collection. The solution must minimize app downtime.\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","o":["1. Delete the compromised key. 2. Add a new query key. 3. Change the app to use the new key.","1. Regenerate the primary admin key. 2. Change the app to use the secondary admin key. 3. Delete the compromised key.","1. Add a new query key. 2. Change the app to use the new key. 3. Delete the compromised key.","1. Change the app to use the secondary admin key. 2. Regenerate the secondary admin key. 3. Add a new query key."],"a":[2],"e":"Add a new query key, switch the app to it, then delete the compromised key. This keeps the app running and gives read-only access. Admin keys are too powerful, and deleting first causes downtime.","t":"ADD new, SWITCH app, DELETE old.","k":["query key","key rotation","read-only"]},{"id":"ai-103-113","d":"tools-data","x":"HOTSPOT\n-\nYou need to create a new resource that will be used to perform sentiment analysis and optical character recognition (OCR). The solution must meet the following requirements:\n•Use a single key and endpoint to access multiple services.\n•Consolidate billing for future services that you might use.\n•Support the use of Azure Vision in Foundry Tools in the future.\nHow should you complete the HTTP request to create the new resource? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["POST; TextAnalytics","PATCH; ComputerVision","PUT; CognitiveServices","PUT; TextAnalytics"],"a":[2],"e":"Use PUT to create a named ARM resource, with kind CognitiveServices for a multi-service resource that has one key and endpoint and consolidated billing, including future Vision use. TextAnalytics and ComputerVision are single-service kinds.","t":"One key for many = PUT + COGNITIVESERVICES.","k":["PUT","CognitiveServices","multi-service"]},{"id":"ai-103-114","d":"tools-data","x":"HOTSPOT\n-\nYou are building a model to detect objects in images.\nThe performance of the model based on training data is shown in the following exhibit.\n\nUse the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic.\nNOTE: Each correct selection is worth one point.","o":["The percentage of false positives is: 25. The value for the number of true positives divided by the total number of true positives and false negatives is: 100.","The percentage of false positives is: 100. The value for the number of true positives divided by the total number of true positives and false negatives is: 25.","The percentage of false positives is: 0. The value for the number of true positives divided by the total number of true positives and false negatives is: 25.","The percentage of false positives is: 0. The value for the number of true positives divided by the total number of true positives and false negatives is: 77.2."],"a":[2],"e":"Precision is 100%, and precision = TP/(TP+FP), so false positives are 0%. TP/(TP+FN) is recall, shown as 25%. 77.2% is mAP.","t":"Precision 100 = 0 FP. TP/(TP+FN) = RECALL.","k":["precision","recall","mAP"]},{"id":"ai-103-115","d":"security","x":"You are developing an application that will use Azure AI Search for internal documents.\nYou need to implement document-level filtering for Azure AI Search.\nWhich three actions should you include in the solution? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.","o":["Retrieve the group memberships of the user","Create one index per group.","Send access tokens from Microsoft Entra ID, with the search request.","Retrieve all the groups.","Supply the groups as a filter for the search requests","Add allowed groups to each index entry"],"a":[0,4,5],"e":"For security trimming, store allowed group IDs on each document, get the current user's group memberships, and pass those groups as an OData filter on the query. One index per group does not scale, and a token alone does not filter documents.","t":"Tag docs with groups, get user groups, FILTER by them.","k":["security trimming","group filter","document-level security"]},{"id":"ai-103-116","d":"tools-data","x":"You have an Azure AI Search indexer that ingest PDF policy manuals.\nClient applications must display page-level citations that have bounding polygons for both text and images.\nYou need to add a single built-in multimodal content extraction skill to the Azure AI Search skillset. The solution must meet the following requirements:\n•Provide text and image location metadata.\n•Extract tables that span multiple pages.\nWhat should you add?","o":["Azure Content Understanding","GenAI Prompt","Document Layout","Document Extraction"],"a":[2],"e":"Document Layout is the built-in Azure AI Search multimodal skill that gives text and image location metadata with bounding polygons and extracts tables across pages. Content Understanding is a separate Foundry capability.","t":"Location + spanning tables = DOCUMENT LAYOUT skill.","k":["Document Layout skill","bounding polygons"]},{"id":"ai-103-117","d":"tools-data","x":"HOTSPOT\n-\nYou are creating an enrichment pipeline that will use Azure AI Search. The knowledge store contains unstructured JSON data and the text from scanned PDF documents.\nWhich projection type should you use for each data type? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","o":["JSON data: Table projection. Extracted text data: Object projection.","JSON data: Table projection. Extracted text data: File projection.","JSON data: File projection. Extracted text data: Table projection.","JSON data: Object projection. Extracted text data: Object projection."],"a":[3],"e":"Object projections store enriched content as JSON objects in Azure Storage, which fits unstructured JSON and extracted text. Table projections are for relational data and file projections for binaries like images.","t":"JSON or text = OBJECT. Rows = TABLE. Images = FILE.","k":["knowledge store","object projection"]}]},{"id":"ab-100","code":"AB-100","title":"Agentic AI Business Solutions Architect","vendor":"Microsoft","exam":{"count":54,"minutes":90,"passPercent":80},"domains":{"agentic-ai":"Agentic AI"},"qs":[{"id":"ab-100-1","d":"agentic-ai","x":"CASE STUDY This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study. To answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study. A Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it. To start the case study - To display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question. Overview - Contoso, Ltd. is a high-tech manufacturing company that uses Microsoft Dynamics 365 Finance. Dynamics 365 Supply Chain Management, and Dynamics 365 Commerce for its North American operations. The company designs and develops innovative products that have many patents and proprietary technologies. The patents and engineering designs are closely guarded secrets. Contoso executives want to integrate and adopt AI solutions to help scale the company in preparation for an anticipated period of rapid growth. The company has multiple legal entities and Azure subscriptions that will be used in the adopted AI solutions. Requirements - AI Adoption - The following executives will have specific responsibilities in the overall AI adoption: Chief Technology Officer (CTO): Select one Dynamics 365 Finance, Dynamics 365 Supply Chain Management or Dynamics 365 Commerce prebuilt AI agent and one custom Microsoft Copilot Studio AI agent to prioritize and deploy during the initial AI adoption phase. Chief Information Officer (CIO): Ensure that appropriate security labels are assigned to the data used by the AI agents. Chief Financial Officer (CFO): Analyze the return on investment (ROI) for the AI agents being deployed. Chief Information Security Officer (CISO): Discover and inventory AI resources for auditing. Chief Executive Officer (CEO): Ensure that all solutions adhere to industry-standard responsible AI practices. All AI initiatives and agents will have a detailed business use case, a defined audience profile, and an estimated ROI that will compare the cost savings of the current process against the estimated costs of using the new AI solutions.The company's research and development (R&D) department already has a custom Model Context Protocol (MCP) server that contains comprehensive product specifications and compliance data. Prebuilt AI Agent - The CTO has NOT yet selected which prebuilt AI agent to use in Dynamics 365 Supply Chain Management. The CTO wants to view available agent templates to identify which agent will add the most business value. Depending on which high-priority AI agents are identified, its agent capabilities must be previewed in a discovery meeting with the relevant business operation stakeholders. Custom AI Agent - Contoso has identified the following custom AI agent requirements: The custom AI agent will use data from Dynamics 365 Supply Chain Management to answer questions for the manufacturing team as a low-code solution. The custom AI agent will be accessible from within Microsoft Teams. The custom AI agent must be designed to eventually connect to other agents that can be selected based on their description. The topics used in the custom AI agent will be selected based NOT on a trigger phrase, but on a description of the purpose of the query, to make the interactions more conversational. The custom AI agent must be able to answer questions about product specifications by using existing technologies. The product specifications are maintained by the R&D department. The custom AI agent must be integrated with and accessible from Dynamics 365 Supply Chain Management. The custom AI agent must be able to use Dynamics 365 Supply Chain Management business logic that is stored outside of the application. Analysis, Reporting, and Troubleshooting Contoso has identified the following analysis, reporting, and troubleshooting requirements: The CISO will audit all the AI solutions monthly for compliance and security. The CFO will analyze all the AI solutions quarterly to compare the estimated ROI against actual measured efficiencies and adoption. The CFO will use the Copilot Studio agent usage estimator to perform this analysis. The CISO wants to identify how much sensitive data was accessed for a given AI agent run and who accessed the data. Too much sensitive data accessed by a single user might indicate a high security risk. The CTO wants to track user feedback on the quality of the AI agent responses during user interactions with the agents. Consistently poor feedback will trigger an escalated reengineering discussion. The CEO wants a quarterly assessment of all the required metrics for their specific responsibilities.
