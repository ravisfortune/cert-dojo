gth inconsistency) all stem from the lack of specific examples of expected behavior. Few-shot examples demonstrating compound phrase handling, explicit mention criteria, and granularity address all three issues directly.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"The three problems (compound phrases, implied skills, length inconsistency) all stem from the lack of specific examples of expected behavior. Few-shot examples demonstrating compound phrase handling, explicit mention criteria, and granularity address all three issues directly.","t":"Fuzzy rules in many places = FEW-SHOT shows the pattern.","k":["few-shot","granularity","skills extraction"]},{"id":"ccar-f-30","d":"prompt-output","x":"Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements.\n\nHow should you architect the processing pipeline?","o":["Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API.","Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return.","Submit all documents to the real-time Messages API to ensure consistent processing latency across document types.","Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."],"a":[0],"w":["Standard reports (archived) conforms to the Batch API to save 50% on costs. Urgent exception reports need to trigger alerts within 30 minutes so must use the real-time Messages API. This is the optimal architecture for both cost and latency","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"Standard reports (archived) conforms to the Batch API to save 50% on costs. Urgent exception reports need to trigger alerts within 30 minutes so must use the real-time Messages API. This is the optimal architecture for both cost and latency","t":"Can wait = BATCH. Urgent = REAL-TIME.","k":["Batch API","Messages API","latency vs cost"]},{"id":"ccar-f-31","d":"architecture","x":"The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions.\n\nWhat's the most effective way to improve reliability?","o":["Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.","Split the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each with defined input/output contracts.","Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes.","Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."],"a":[1],"w":["Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","Generic analyze_document with free-text instructions leads to ambiguous and inconsistent outputs. Splitting into specialized tools with defined input/output contracts completely eliminates ambiguity, ensuring the agent always receives the correct output format.","Collapsing everything into one path reduces precision and usually makes the system harder to control, not easier.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"Generic analyze_document with free-text instructions leads to ambiguous and inconsistent outputs. Splitting into specialized tools with defined input/output contracts completely eliminates ambiguity, ensuring the agent always receives the correct output format.","t":"Generic tool confusing? SPLIT into purpose-specific tools.","k":["purpose-specific tools","contracts","tool design"]},{"id":"ccar-f-32","d":"architecture","x":"The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes \"I'll ask the web search agent to find sources\" without actually invoking it.\n\nWhat is the most likely cause?","o":["The coordinator's allowed Tools configuration doesn't include \"Task\", so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents.","Subagent context limit descriptions from the coordinator don't provide enough context; you need to configure explicit context content between coordinator and tool descriptions.","The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified.","The AgentFunctions are configured correctly, but the coordinator's system prompt includes a statement that prevents it from knowing the available subagent types."],"a":[0],"w":["The coordinator can describe delegation (generating text), but cannot actually invoke subagents because the 'Task' tool is not in the allowed tools configuration. This is a common configuration error in multi-agent setup.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The coordinator can describe delegation (generating text), but cannot actually invoke subagents because the 'Task' tool is not in the allowed tools configuration. This is a common configuration error in multi-agent setup.","t":"Talks about delegating but can't = 'Task' missing from allowedTools.","k":["Task tool","allowedTools","subagents"]},{"id":"ccar-f-33","d":"architecture","x":"When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time.\n\nWhat change would best enable the synthesis agent to correctly interpret such temporal differences?","o":["Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix.","Require subagents to include publication or data collection dates in their structured outputs.","Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric.","Configure the web search agent to only return results from the past 6 months."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The synthesis agent misreads the data because it never sees the dates. Making each data point carry its own timestamp in the structured output lets synthesis reason about trends instead of contradictions.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The synthesis agent misreads the data because it never sees the dates. Making each data point carry its own timestamp in the structured output lets synthesis reason about trends instead of contradictions.","t":"Numbers need DATES to show trends.","k":["timestamps","structured output","temporal data"]},{"id":"ccar-f-34","d":"architecture","x":"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification.\nYou need to resume processing without repeating work or losing fidelity of prior findings.\n\nWhat state management approach best balances information fidelity with context efficiency when restoring agent state?","o":["Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.","Have each agent maintain its own persistent state file and reload it independently at the start of each session.","Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming.","Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts."],"a":[3],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Structured reports persist to known locations allowing the coordinator to load and inject state into agent prompts when resuming. This is more efficient than raw conversation logs (too verbose) or vector stores (more complicated than necessary)."],"e":"Structured reports persist to known locations allowing the coordinator to load and inject state into agent prompts when resuming. This is more efficient than raw conversation logs (too verbose) or vector stores (more complicated than necessary).","t":"Crash recovery = STRUCTURED reports + coordinator injects.","k":["state persistence","structured reports","resume"]},{"id":"ccar-f-35","d":"context-reliability","x":"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology.\n\nWhich system-level improvement best addresses this inconsistency?","o":["Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence.","Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent.","Instruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations.","Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources."],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The report structure clearly separates confirmed findings from those that are controversial, while preserving the original context – this is a way to ensure balance and accuracy without being too hedged in any case.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The report structure clearly separates confirmed findings from those that are controversial, while preserving the original context – this is a way to ensure balance and accuracy without being too hedged in any case.","t":"Separate CONFIRMED from CONTESTED.","k":["uncertainty","confirmed vs contested","report structure"]},{"id":"ccar-f-36","d":"architecture","x":"The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations.\n\nWhat's the most effective way to improve subagent adaptability?","o":["Specify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution.","Implement a task classification step where the coordinator categorizes requests as \"analytical\" vs \"exploratory\" and uses different instruction sets for each category.","Add explicit fallback directives to the detailed instructions: \"if specified searches fail, attempt alternative queries before reporting failure.\"","Remove procedural detail entirely, delegating with simple goals like \"research it thoroughly\" and relying on the subagent's general capabilities."],"a":[0],"w":["Step-by-step instructions are too rigid, making the subagent unable to adapt when encountering unexpected situations. Specifying goals and quality criteria instead allows the subagent to use judgment to handle unforeseen situations.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"Step-by-step instructions are too rigid, making the subagent unable to adapt when encountering unexpected situations. Specifying goals and quality criteria instead allows the subagent to use judgment to handle unforeseen situations.","t":"Give GOALS + criteria, not step-by-step scripts.","k":["goal-based delegation","adaptability","quality criteria"]},{"id":"ccar-f-37","d":"architecture","x":"A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow.\n\nWhat change would most improve briefing quality?","o":["Standardize all subagent outputs to prose summaries with inline citations.","Update the synthesis agent to render each content type appropriately–financial data as tables, news as prose.","Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence.","Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation."],"a":[1],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","The problem is that the synthesis agent converts everything to bullet points. The most direct solution is to update the synthesis agent to render each content type properly: financial data → tables, news → prose. No need to add layers or standardize outputs.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"The problem is that the synthesis agent converts everything to bullet points. The most direct solution is to update the synthesis agent to render each content type properly: financial data → tables, news → prose. No need to add layers or standardize outputs.","t":"Render each type in its natural FORMAT.","k":["content rendering","tables","prose"]},{"id":"ccar-f-38","d":"architecture","x":"The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources.\n\nHow does information typically flow between these two specialized subagents?","o":["The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent.","The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.","Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them.","The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."],"a":[0],"w":["In multi-agent architecture with coordinator, information flows through the coordinator: the web search agent returns output to the coordinator, the coordinator includes relevant findings in the prompt when invoking the document analysis agent. Subagents do not directly communicate with each other.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","This adds infrastructure but does not directly solve the failure mode described in the question.","That adds infrastructure or indirection, but the question is really about choosing a simpler coordination pattern that fits the current workflow."],"e":"In multi-agent architecture with coordinator, information flows through the coordinator: the web search agent returns output to the coordinator, the coordinator includes relevant findings in the prompt when invoking the document analysis agent. Subagents do not directly communicate with each other.","t":"Subagents talk through the COORDINATOR.","k":["coordinator","hub and spoke","context passing"]},{"id":"ccar-f-39","d":"architecture","x":"After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided.\n\nWhat is the most likely cause of this issue?","o":["The subagents need to share a single API connection to enable automatic context sharing between invocations.","The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt.","The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories.","The synthesis agent's context window is not large enough to hold the combined outputs from both previous agents."],"a":[1],"w":["It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Subagents do not automatically share context. The coordinator must proactively include outputs from previous agents into the prompt when invoking the synthesis agent. This is the most common error in multi-agent orchestration.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"Subagents do not automatically share context. The coordinator must proactively include outputs from previous agents into the prompt when invoking the synthesis agent. This is the most common error in multi-agent orchestration.","t":"No shared memory: coordinator must PASS outputs explicitly.","k":["context passing","coordinator","subagent isolation"]},{"id":"ccar-f-40","d":"architecture","x":"In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings.\n\nWhat's the most effective architectural change?","o":["Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents.","Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.","Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources.","Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Dumping the full transcript adds noise and makes it harder for the next actor to find the key facts quickly.","The failure is information loss at the synthesis stage, so the fix is to carry attribution as structured data end-to-end: subagents emit explicit claim-source mappings and the synthesis agent is required to preserve and merge them. This matches Anthropic's multi-agent best practice of structured outputs over fragile text-prefix conventions (A), costly post-hoc log analysis (B), or unreliable semantic-similarity reconstruction (D).","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way."],"e":"The failure is information loss at the synthesis stage, so the fix is to carry attribution as structured data end-to-end: subagents emit explicit claim-source mappings and the synthesis agent is required to preserve and merge them. This matches Anthropic's multi-agent best practice of structured outputs over fragile text-prefix conventions (A), costly post-hoc log analysis (B), or unreliable semantic-similarity reconstruction (D).","t":"Keep CLAIM-SOURCE pairs as structured data end to end.","k":["claim-source mapping","attribution","structured data"]},{"id":"ccar-f-41","d":"architecture","x":"Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research.\n\nWhat's the most effective way to improve response time for these follow-up summaries?","o":["Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand.","Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.","Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis.","Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."],"a":[2],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","The coordinator already has findings in context from the orchestration process. Spawn synthesis subagent just to summarize is overkill (80K+ token transfer overhead). It is simply the most efficient way for the coordinator to handle summary requests themselves.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The coordinator already has findings in context from the orchestration process. Spawn synthesis subagent just to summarize is overkill (80K+ token transfer overhead). It is simply the most efficient way for the coordinator to handle summary requests themselves.","t":"Already have the context? Answer DIRECTLY, skip the subagent.","k":["coordinator","latency","unnecessary subagent"]},{"id":"ccar-f-42","d":"architecture","x":"After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations.\n\nWhat context-passing strategy provides the best balance of completeness and efficiency?","o":["Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only.","Pass the full accumulated context from all prior agents.","Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.","Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts."],"a":[3],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Pass synthesis draft (3K tokens) + source index mapping claims to URLs/excerpts provides enough information for the report generator without transferring the entire 150K+ tokens raw content. Source index ensures accurate citations."],"e":"Pass synthesis draft (3K tokens) + source index mapping claims to URLs/excerpts provides enough information for the report generator without transferring the entire 150K+ tokens raw content. Source index ensures accurate citations.","t":"Draft + SOURCE INDEX, not the whole pile.","k":["source index","context efficiency","citations"]},{"id":"ccar-f-43","d":"architecture","x":"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely.\n\nWhat's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?","o":["Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis.","Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations.","Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity.","Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents."],"a":[0],"w":["Anthropic's recommended multi-agent design is the orchestrator-worker pattern with a flat hierarchy: the coordinator itself spawns parallel subagents and aggregates their results, which cuts latency through parallelism while keeping all spawning, monitoring, and debugging centralized in one place. Options B and C create nested/recursive agent hierarchies that severely degrade observability and debuggability, and D introduces asynchronous queue infrastructure that decouples work from the coordinator's direct visibility.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"Anthropic's recommended multi-agent design is the orchestrator-worker pattern with a flat hierarchy: the coordinator itself spawns parallel subagents and aggregates their results, which cuts latency through parallelism while keeping all spawning, monitoring, and debugging centralized in one place. Options B and C create nested/recursive agent hierarchies that severely degrade observability and debuggability, and D introduces asynchronous queue infrastructure that decouples work from the coordinator's direct visibility.","t":"Parallel workers spawned by the COORDINATOR (flat).","k":["parallel subagents","orchestrator-worker","flat hierarchy"]},{"id":"ccar-f-44","d":"architecture","x":"In production, you're distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications.\n\nWhat's the most effective approach to optimize for query complexity?","o":["Create a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline.","Train a query complexity classifier based on labeled historical data to predict optimal subagent combination.","Have the coordinator analyze each query dynamically and selectively route subagents based on the query's complexity and routing characteristics.","Implement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination."],"a":[0],"w":["For distribution queries that are mostly factual/simple, create fast-track path bypass subagents for simple factual questions, only route analytical queries through the full pipeline. This method reduces latency and cost for the majority of queries.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"For distribution queries that are mostly factual/simple, create fast-track path bypass subagents for simple factual questions, only route analytical queries through the full pipeline. This method reduces latency and cost for the majority of queries.","t":"Simple questions skip the pipeline = FAST TRACK.","k":["fast-track","routing","latency"]},{"id":"ccar-f-45","d":"architecture","x":"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps.\n\nWhat's the most effective approach to ensure proper source attribution in the final reports?","o":["Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format.","Have the report generator query the web search agent to re-locate sources for claims in the final report.","Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator.","Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers)."],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Instead of fixing attribution after loss, each agent needs to output structured data with separate content summaries and source metadata (URLs, document names, page numbers). This ensures metadata is not lost through summarization steps."],"e":"Instead of fixing attribution after loss, each agent needs to output structured data with separate content summaries and source metadata (URLs, document names, page numbers). This ensures metadata is not lost through summarization steps.","t":"Separate CONTENT from SOURCE METADATA.","k":["source metadata","structured output","attribution"]},{"id":"ccar-f-46","d":"tools","x":"When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or temporary database failures).\n\nWhat is the correct pattern for communicating these errors back to the agent?","o":["Return a success response with a \"status\" field indicating the error type","Throw an exception from the tool handler so the agent framework can catch and log it","Log the error server-side and return an empty result to avoid confusing the model","Return the error message in the tool result content with the isError flag set to true"],"a":[3],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","MCP's designed pattern: put the error text in the content field and mark isError=true. Claude sees both the failure flag and a readable message to reason about."],"e":"MCP's designed pattern: put the error text in the content field and mark isError=true. Claude sees both the failure flag and a readable message to reason about.","t":"Tool error = content message + isError TRUE.","k":["isError","MCP errors","tool result"]},{"id":"ccar-f-47","d":"context-reliability","x":"After investigating a billing dispute over 25+ turns, you've identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won't have access to your conversation transcript.\n\nWhat context should you pass to enable effective resolution?","o":["A structured summary: customer ID, root cause, refund amount, and recommended action.","The complete conversation transcript with all tool results.","The customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions.","Your diagnosis and the refund amount only."],"a":[0],"w":["Human agents need enough information to resolve quickly, but do not need the entire transcript. Structured summary with customer ID, root cause, refund amount and recommended action provides exactly what is needed in a concise and actionable way.","Dumping the full transcript adds noise and makes it harder for the next actor to find the key facts quickly.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"Human agents need enough information to resolve quickly, but do not need the entire transcript. Structured summary with customer ID, root cause, refund amount and recommended action provides exactly what is needed in a concise and actionable way.","t":"Handoff = ID + ROOT CAUSE + AMOUNT + ACTION.","k":["structured handoff","escalation","summary"]},{"id":"ccar-f-48","d":"context-reliability","x":"Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation's context. The customer mentions two more orders they want to discuss.\n\nWhat's the most effective approach before making additional lookups?","o":["Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues","Proceed with additional lookups without modifying the existing tool output context","Have the model generate a natural language summary of each order's key details, replacing structured responses with prose descriptions","Extract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"],"a":[3],"w":["That adds infrastructure or indirection, but the question is really about choosing a simpler coordination pattern that fits the current workflow.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","When tool outputs take up most of the context, you need to trim down to only keep the return-relevant fields (items, purchase date, return window, status) before adding lookups. Frees the context window without losing important information."],"e":"When tool outputs take up most of the context, you need to trim down to only keep the return-relevant fields (items, purchase date, return window, status) before adding lookups. Frees the context window without losing important information.","t":"Context full of tool output? KEEP only relevant fields.","k":["trim tool output","context management"]},{"id":"ccar-f-49","d":"context-reliability","x":"A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account.\n\nWhat should the agent do?","o":["Immediately call escalate_to_human with the conversation history.","First call get_customer and lookup_order to gather account context, then escalate to a human agent.","Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating.","Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."],"a":[2],"w":["Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","The customer says 'twice' but you don't have context yet. An empathetic question, intended to give you the opportunity to resolve it the first time without incurring frustration or delaying a potential handoff.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The customer says 'twice' but you don't have context yet. An empathetic question, intended to give you the opportunity to resolve it the first time without incurring frustration or delaying a potential handoff.","t":"Empathize + ONE targeted question, then decide.","k":["empathy","clarifying question","escalation"]},{"id":"ccar-f-50","d":"context-reliability","x":"You're implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation.\n\nWhich approach will most reliably identify cases that genuinely require human intervention?","o":["Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold.","Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress.","Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human.","Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Defining clear escalation conditions (customer requests human, policy exceptions needed, no meaningful progress) is the most comprehensive and flexible approach. Rules engine (D) is too rigid, sentiment analysis (C) is not reliable enough, fixed retry count (A) is too mechanical.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Defining clear escalation conditions (customer requests human, policy exceptions needed, no meaningful progress) is the most comprehensive and flexible approach. Rules engine (D) is too rigid, sentiment analysis (C) is not reliable enough, fixed retry count (A) is too mechanical.","t":"Escalate on: ASKED for human, policy EXCEPTION, NO progress.","k":["escalation criteria","policy exception"]},{"id":"ccar-f-51","d":"context-reliability","x":"Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent's authorization level.\n\nHow should the workflow handle this mid-process escalation?","o":["Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.","Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID.","Call escalate_to_human passing only the customer's original message.","Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human."],"a":[3],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Mid-process escalation needs to provide enough context for the human agent. Compile structured handoff with customer details, order information and identified issue ensures the human agent has enough information to resolve without needing to re-investigate from the beginning."],"e":"Mid-process escalation needs to provide enough context for the human agent. Compile structured handoff with customer details, order information and identified issue ensures the human agent has enough information to resolve without needing to re-investigate from the beginning.","t":"Mid-process escalation = STRUCTURED handoff.","k":["structured handoff","authorization limit"]},{"id":"ccar-f-52","d":"context-reliability","x":"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure.\n\nWhat approach best balances first-contact resolution with appropriate error handling?","o":["Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed","Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later","Escalate immediately to a human agent since the refund action cannot be completed","Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"],"a":[1],"w":["This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","Deliver the partial value you can (explanation + eligibility), be honest about the failure, and let the customer choose between human escalation or a retry. Classic graceful degradation.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing."],"e":"Deliver the partial value you can (explanation + eligibility), be honest about the failure, and let the customer choose between human escalation or a retry. Classic graceful degradation.","t":"Graceful degradation: give what you can + be HONEST + offer options.","k":["graceful degradation","timeout","honesty"]},{"id":"ccar-f-53","d":"tools","x":"Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude.\n\nWhat's the most effective improvement?","o":["Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it.","Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use.","Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent.","Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text."],"a":[1],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","When the tool returns only plain text, the agent cannot distinguish transient vs permanent errors. Structured error response with retryable: false for business errors allows agents to know immediately that there is no need to retry, saving turns and improving customer experience.","Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient."],"e":"When the tool returns only plain text, the agent cannot distinguish transient vs permanent errors. Structured error response with retryable: false for business errors allows agents to know immediately that there is no need to retry, saving turns and improving customer experience.","t":"Structured errors: RETRYABLE flag + friendly message.","k":["structured errors","retryable","business errors"]},{"id":"ccar-f-54","d":"architecture","x":"When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?","o":["The order details are added to the conversation and the model reasons about which action to take.","The orchestration layer automatically routes to the next tool based on the order's status field.","The agent executes the remaining steps in a tool sequence planned at the start of the request.","The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."],"a":[0],"w":["In Claude's agentic loop, after the tool returns results, order details are added to the conversation context and the model reasons about the next action based on that information. There is no hardcoded decision tree or orchestration layer to automatically route.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"In Claude's agentic loop, after the tool returns results, order details are added to the conversation context and the model reasons about the next action based on that information. There is no hardcoded decision tree or orchestration layer to automatically route.","t":"Tool result -> context -> MODEL decides next step.","k":["agentic loop","model reasoning","tool results"]},{"id":"ccar-f-55","d":"context-reliability","x":"A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing.\n\nWhat should the agent do?","o":["Process the refund via process_refund to resolve the underlying issue, then inform them it's complete","Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically","Call escalate_to_human immediately to honor the customer's request","Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Return eligible and can be processed immediately, but customer is frustrated. Agents should not decide to escalate (A) or process without asking (C). The best approach is to acknowledge frustration, inform that the issue can be resolved immediately, and let the customer choose."],"e":"Return eligible and can be processed immediately, but customer is frustrated. Agents should not decide to escalate (A) or process without asking (C). The best approach is to acknowledge frustration, inform that the issue can be resolved immediately, and let the customer choose.","t":"Frustrated but solvable: ACKNOWLEDGE + say it's fixable now + let them CHOOSE.","k":["customer choice","empathy","resolution"]},{"id":"ccar-f-56","d":"context-reliability","x":"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate).\n\nHow should you achieve guaranteed compliance?","o":["Modify the refund tool to return an error with message \"Amount exceeds policy limit–please escalate\" when threshold is exceeded.","Strengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\"","Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.","Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."],"a":[2],"w":["Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","When compliance is mandatory and cannot be left to model discretion, programmatic protection needs to be implemented at the infrastructure level. Hook intercept tool calls and block refund >$500 are guaranteed compliance, regardless of model behavior or prompt interpretation.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure."],"e":"When compliance is mandatory and cannot be left to model discretion, programmatic protection needs to be implemented at the infrastructure level. Hook intercept tool calls and block refund >$500 are guaranteed compliance, regardless of model behavior or prompt interpretation.","t":"MUST-never-fail rule = HOOK in code, not prompt.","k":["hooks","deterministic enforcement","compliance"]},{"id":"ccar-f-57","d":"context-reliability","x":"A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my refund?\" The conversation is approaching context limits.\n\nWhat strategy best maintains the agent's ability to address all issues throughout the session?","o":["Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues.","Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer.","Implement sliding window context that retains the most recent 30 turns.","Summarize earlier turns into a narrative description, preserving full message history only for the active issue."],"a":[3],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Progressive summarization compresses already resolved topics while keeping the thread active verbatim – this is the classic pattern for long multi-issue conversations approaching the context limit."],"e":"Progressive summarization compresses already resolved topics while keeping the thread active verbatim – this is the classic pattern for long multi-issue conversations approaching the context limit.","t":"Old resolved = SUMMARY. Active issue = FULL text.","k":["progressive summarization","multi-issue","context limits"]},{"id":"ccar-f-58","d":"context-reliability","x":"The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened.\n\nWhat's the most likely cause of this behavior?","o":["The conversation history isn't being passed in subsequent API requests.","The verification tool is clearing the agent's internal state after each successful validation step.","The prompt lacks instructions telling Claude to remember information across multiple exchanges.","Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."],"a":[0],"w":["Claude has no inherent memory between API calls. If the agent asks again for the information provided, the most common reason is that the conversation history was not passed during subsequent API requests. Prompt instructions (A) or tool behavior (C) are not the main cause.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Claude has no inherent memory between API calls. If the agent asks again for the information provided, the most common reason is that the conversation history was not passed during subsequent API requests. Prompt instructions (A) or tool behavior (C) are not the main cause.","t":"Claude forgets? You didn't SEND the history.","k":["stateless API","conversation history","messages array"]},{"id":"ccar-f-59","d":"context-reliability","x":"Your process_refund tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection timeout\") that are transient (5% of calls), and business errors (\"Order exceeds 30-day return window\", \"Item already refunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude.\n\nWhat's the most effective way to reduce wasted retries while improving customer-facing response quality?","o":["Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations.","Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries.","Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use.","Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text."],"a":[2],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Leaving the choice on auto still keeps the critical decision in the same place that is already failing.","Adding retryable: false flag to business errors allows Claude to know immediately without retry, and customer-friendly explanation to communicate with customers. Separating retry (technical) vs no-retry (business) logic at the tool level is the cleanest solution.","This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient."],"e":"Adding retryable: false flag to business errors allows Claude to know immediately without retry, and customer-friendly explanation to communicate with customers. Separating retry (technical) vs no-retry (business) logic at the tool level is the cleanest solution.","t":"Permanent error = RETRYABLE false + explanation.","k":["retryable false","business errors","structured errors"]},{"id":"ccar-f-60","d":"context-reliability","x":"A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing \"Status: Pending Refund\" and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully.\n\nWhat approach most reliably handles returning customers?","o":["Resume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund.","Create a new session with a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed.","Start a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed.","Resume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness."],"a":[2],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","After 4 hours, cached data can become stale. Starting a new session with a structured summary of the previous interaction (issue type, steps taken, current status) provides the necessary context, while fresh tool calls ensure data accuracy.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem."],"e":"After 4 hours, cached data can become stale. Starting a new session with a structured summary of the previous interaction (issue type, steps taken, current status) provides the necessary context, while fresh tool calls ensure data accuracy.","t":"Returning later = NEW session + SUMMARY + FRESH tool calls.","k":["returning customer","stale data","structured summary"]},{"id":"ccar-f-61","d":"prompt-output","x":"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals.\n\nWhat's the most effective approach to improve extraction reliability?","o":["Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn't match the stated total.","Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions.","Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct.","Add a \"calculated_total\" field where the model sums extracted line items alongside a \"stated_total\" field. Flag records for human review when values differ."],"a":[3],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Capturing both calculated_total and stated_total turns discrepancy into a first-class signal – uniformly detects both OCR errors and extraction mistakes, and routes only 18% mismatched records to human review. Auto-adjust and reconciliation model both silently fabricate/hide incorrect data for the accounting system."],"e":"Capturing both calculated_total and stated_total turns discrepancy into a first-class signal – uniformly detects both OCR errors and extraction mistakes, and routes only 18% mismatched records to human review. Auto-adjust and reconciliation model both silently fabricate/hide incorrect data for the accounting system.","t":"Calculated vs STATED total. Mismatch = flag.","k":["calculated_total","stated_total","human review"]},{"id":"ccar-f-62","d":"context-reliability","x":"An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate — it's forgetting previously discussed code patterns and hasn't yet located all test files or traced critical payment flows.\n\nWhat's the most effective approach to complete this investigation?","o":["Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation.","Spawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding.","Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets.","Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."],"a":[1],"w":["A summary can help, but turning it into the only source of truth strips away detail that may still be needed for accurate follow-up work.","The strongest approach is to delegate well-scoped investigations to subagents with fresh context while the main agent keeps the architectural overview. This lets the system continue deep exploration without overloading a single context window, and it preserves both detailed findings and high-level coordination.","Starting over throws away useful context that the scenario is trying to preserve, so it adds cost without solving the underlying problem.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"The strongest approach is to delegate well-scoped investigations to subagents with fresh context while the main agent keeps the architectural overview. This lets the system continue deep exploration without overloading a single context window, and it preserves both detailed findings and high-level coordination.","t":"Context overflowing = delegate scoped questions to SUBAGENTS.","k":["subagents","delegation","context"]},{"id":"ccar-f-63","d":"architecture","x":"The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like \"I'll ask the web search agent to find sources on this topic\" — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors.\n\nWhat is the most likely cause?","o":["The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.","The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked.","Subagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions.","The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."],"a":[0],"w":["Without the Task tool in allowedTools, the coordinator can talk about delegating but has no way of actually calling the subagent – ​​true to the 'reasons about it, no execution, no errors' symptom.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"Without the Task tool in allowedTools, the coordinator can talk about delegating but has no way of actually calling the subagent – ​​true to the 'reasons about it, no execution, no errors' symptom.","t":"Delegation talk, no execution, no error = 'Task' not allowed.","k":["Task tool","allowedTools","coordinator"]},{"id":"ccar-f-64","d":"architecture","x":"In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications.\n\nWhat's the most effective approach to optimize for varying query complexity?","o":["Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.","Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.","Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements.","Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."],"a":[2],"w":["It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","Let the LLM coordinator independently reason about each query and select only the subagents that are truly necessary – this approach adapts naturally to diverse and evolving query distributions.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"Let the LLM coordinator independently reason about each query and select only the subagents that are truly necessary – this approach adapts naturally to diverse and evolving query distributions.","t":"Evolving query mix = coordinator decides DYNAMICALLY.","k":["dynamic routing","coordinator","query complexity"]},{"id":"ccar-f-65","d":"tools","x":"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types.\n\nWhat's the most effective improvement?","o":["Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure.","Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.","Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.","Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."],"a":[0],"w":["Provide agents with the necessary information to make the right decision: category, retryability and human-readable cause.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure."],"e":"Provide agents with the necessary information to make the right decision: category, retryability and human-readable cause.","t":"Error needs CATEGORY + RETRYABLE + CAUSE.","k":["errorCategory","isRetryable","structured errors"]},{"id":"ccar-f-66","d":"architecture","x":"Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting \"the retrieved sources discuss API authentication but lack details on token refresh patterns\"—but under the current strict pipeline, this insight isn't actionable since search has already completed.\n\nWhat's the most effective architectural change?","o":["Have the coordinator review analysis output for gap indicators and re-invoke search with gapinformed queries when gaps are detected.","Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient.","Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review.","Add a research planning agent before the search phase that decomposes topics into specific sub- questions."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The core problem is a rigid one-way pipeline where gap insights arrive after search is finished. The best fix is a closed feedback loop: the analysis agent reports specific gaps as structured output, the coordinator launches targeted follow-up searches, and analysis runs again until coverage is sufficient. That makes the missing-information signal actionable instead of leaving it as a passive observation.","This defers the problem rather than solving the system behavior that caused it.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The core problem is a rigid one-way pipeline where gap insights arrive after search is finished. The best fix is a closed feedback loop: the analysis agent reports specific gaps as structured output, the coordinator launches targeted follow-up searches, and analysis runs again until coverage is sufficient. That makes the missing-information signal actionable instead of leaving it as a passive observation.","t":"Gaps found? LOOP back: analysis -> coordinator -> targeted search.","k":["feedback loop","gap analysis","iterative research"]},{"id":"ccar-f-67","d":"context-reliability","x":"This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly.\n\nWhat's the most effective approach?","o":["Use the Bash tool with curl to call Jira's REST API, including authentication headers and parsing JSON responses inline.","Build a custom MCP server wrapping Jira's API with tools designed specifically for this team's code review workflow.","Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool.","Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces."],"a":[3],"w":["This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","For standard third-party service data like Jira tickets, Anthropic's recommended practice is to integrate an existing MCP server, which provides discoverable, typed tool interfaces with managed authentication. Building a custom MCP server (B) is unnecessary effort for standard ticket data, markdown exports (A) go stale and require manual syncing, and ad-hoc curl calls (D) are brittle and expose credentials inline."],"e":"For standard third-party service data like Jira tickets, Anthropic's recommended practice is to integrate an existing MCP server, which provides discoverable, typed tool interfaces with managed authentication. Building a custom MCP server (B) is unnecessary effort for standard ticket data, markdown exports (A) go stale and require manual syncing, and ad-hoc curl calls (D) are brittle and expose credentials inline.","t":"Standard service = use an EXISTING MCP server.","k":["existing MCP server","Jira","integration"]},{"id":"ccar-f-68","d":"context-reliability","x":"A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven't worked with this module before.\n\nWhat's the most effective approach?","o":["Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause.","Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing.","Enter plan mode to explore the module's architecture and dependencies before attempting any fix.","Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically."],"a":[0],"w":["Debugging is adaptive — each file you read changes the most useful next step, so let the agent follow the evidence. The stack trace already points straight at the failure, so direct execution (read the trace read the relevant code fix once the root cause is identified) is the fastest, most reliable path.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"Debugging is adaptive — each file you read changes the most useful next step, so let the agent follow the evidence. The stack trace already points straight at the failure, so direct execution (read the trace read the relevant code fix once the root cause is identified) is the fastest, most reliable path.","t":"Clear stack trace = DIRECT execution, not plan mode.","k":["direct execution","stack trace","debugging"]},{"id":"ccar-f-69","d":"context-reliability","x":"After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to \"only report high- confidence issues you are certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team.\n\nWhat is the most effective approach?","o":["Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels.","Expand the context window by including related test files, recent git history, and the module's dependency graph alongside the diff, giving Claude richer signals to assess issue severity.","Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives.","Split the review into a finding stage where Claude's goal is coverage — flagging every potential issue with confidence and severity metadata — and a separate stage that thresholds those findings."],"a":[3],"w":["Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","The best approach is to separate coverage from filtering. Let the review stage report every plausible finding together wi
