th confidence and severity metadata, then apply thresholding in a later stage. This improves recall substantially without forcing the team to accept raw unfiltered output as the final review result."],"e":"The best approach is to separate coverage from filtering. Let the review stage report every plausible finding together with confidence and severity metadata, then apply thresholding in a later stage. This improves recall substantially without forcing the team to accept raw unfiltered output as the final review result.","t":"Separate FIND (coverage) from FILTER (precision).","k":["two-stage review","recall","severity metadata"]},{"id":"ccar-f-70","d":"tools","x":"Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms.\n\nWhat is the most reliable approach?","o":["Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds.","Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action.","Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools.","Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure."],"e":"The best approach is to Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Force preview = PREVIEW tool issues TOKEN, EXECUTE requires it.","k":["confirmation token","two-step tool","preview"]},{"id":"ccar-f-71","d":"prompt-output","x":"Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line Item amounts don't extracted total, or vendor IDs don't match valid formats. These failures currently route to manual review.\n\nWhat's the most effective approach to reduce manual review volume while maintaining accuracy?","o":["Implement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don't match.","When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction.","Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation.","Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially."],"a":[1],"w":["This still leaves the critical decision to model discretion, which is exactly what the scenario says is failing.","The best approach is to When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"The best approach is to When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Semantic fail = send ERRORS back for self-correction.","k":["validation feedback","self-correction","retry with errors"]},{"id":"ccar-f-72","d":"prompt-output","x":"Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON.\n\nWhat approach provides the most reliable schema compliance?","o":["Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to re-prompt when JSON parsing fails.","Define a tool with your target schema as input parameters and have Claude call it with the extracted data.","Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON.","Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response."],"a":[1],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","The best approach is to Define a tool with your target schema as input parameters and have Claude call it with the extracted data. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way."],"e":"The best approach is to Define a tool with your target schema as input parameters and have Claude call it with the extracted data. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Guaranteed JSON shape = TOOL with schema as input.","k":["tool use","JSON schema","structured output"]},{"id":"ccar-f-73","d":"prompt-output","x":"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model's context window is 200K tokens.\n\nWhat is the most likely cause?","o":["Very long documents exceed the model's effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions.","Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing.","The model distributes attention proportionally across input length, causing fields mentioned only once near the document's end to receive insufficient processing focus.","Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length."],"a":[1],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","The best approach is to Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure."],"e":"The best approach is to Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Tools + prompt + doc all count toward the LIMIT.","k":["context budget","tool definitions","token limit"]},{"id":"ccar-f-74","d":"prompt-output","x":"The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You've defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: \"auto\", Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance.\n\nWhat's the most effective approach?","o":["Keep tool_choice: \"auto\" with system prompt instructions requiring tool use.","Add a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool.","Consolidate all document types into a single unified-schema extraction tool and force that tool.","Set tool_choice: \"any\" with all extraction tools defined."],"a":[3],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","Collapsing everything into one path reduces precision and usually makes the system harder to control, not easier.","When you need guaranteed structured output but do not know the document type upfront, the most reliable approach is a two-step flow: classify first, then force tool_choice to the correct extractor. Leaving selection on auto still allows conversational responses, while collapsing everything into one giant schema usually hurts precision."],"e":"When you need guaranteed structured output but do not know the document type upfront, the most reliable approach is a two-step flow: classify first, then force tool_choice to the correct extractor. Leaving selection on auto still allows conversational responses, while collapsing everything into one giant schema usually hurts precision.","t":"Must call SOME tool, model picks which = 'ANY'.","k":["tool_choice any","structured output"]},{"id":"ccar-f-75","d":"prompt-output","x":"Monitoring shows 12% of extractions fall Pydantic validation with specific errors like \"expected float for quantity, got '2 to 3\". Retrying these requests without modification produces failures.\n\nWhat's the most effective approach to recover from these validation failures?","o":["Set temperature to 0 to eliminate output variability and ensure consistent formatting","Pre-process source documents to standardize problematic formats before sending them for extraction","Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation","Send a follow-up request including the validation error, asking the model to correct its output"],"a":[3],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","Changing model size may affect cost or quality, but it does not directly address the root cause in this scenario.","The best approach is to Send a follow-up request including the validation error, asking the model to correct its output. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early."],"e":"The best approach is to Send a follow-up request including the validation error, asking the model to correct its output. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Same retry = same fail. Send the ERROR back.","k":["Pydantic","validation error","feedback loop"]},{"id":"ccar-f-76","d":"context-reliability","x":"After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask \"What did we conclude about the theme of isolation?\", the assistant provides generic literary analysis rather than referencing the group's specific insights from earlier sessions. Discussions often build on previous meetings' conclusions, so maintaining narrative context is important.\n\nWhat's the most effective approach?","o":["Implement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim.","Implement rolling window truncation to keep only the most recent 25,000 tokens.","Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments.","Add structured XML tags to mark significant discussion conclusions throughout the conversation history."],"a":[0],"w":["When a conversation grows long but still depends on earlier conclusions, progressive summarization is the most balanced approach. It compresses older discussion into reusable takeaways while preserving recent exchanges verbatim.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Dumping the full transcript adds noise and makes it harder for the next actor to find the key facts quickly.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem."],"e":"When a conversation grows long but still depends on earlier conclusions, progressive summarization is the most balanced approach. It compresses older discussion into reusable takeaways while preserving recent exchanges verbatim.","t":"Old blocks -> summaries of CONCLUSIONS. Recent stays verbatim.","k":["progressive summarization","conclusions","long history"]},{"id":"ccar-f-77","d":"context-reliability","x":"You're Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude's responses don't reflect what us earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy.\n\nWhat is the most likely cause?","o":["Claude requires a vector database connection to maintain conversation memory","Your application isn't including prior messages in the messages array","The model's context window has been exceeded by the conversation length","The Claude API requires a session_id parameter that you haven't configured"],"a":[1],"w":["This adds infrastructure but does not directly solve the failure mode described in the question.","If Claude immediately forgets what was said a few turns ago in the same conversation, it's usually because the application doesn't retransmit the full message history in each API call. Claude does not maintain state across requests if the application does not provide context again.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"If Claude immediately forgets what was said a few turns ago in the same conversation, it's usually because the application doesn't retransmit the full message history in each API call. Claude does not maintain state across requests if the application does not provide context again.","t":"Forgets within chat = messages array missing history.","k":["messages array","stateless","conversation history"]},{"id":"ccar-f-78","d":"prompt-output","x":"Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation totals only 2,500 tokens.\n\nWhat is the most likely cause?","o":["System prompts only establish initial behavior and don't persist across all turns.","The assistant's accumulated responses are diluting the system prompt's influence.","The system prompt is only sent with the first API request.","The model's attention on system prompt instructions naturally weakens as turns accumulate."],"a":[1],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","In t ript adds noise and makes it harder for the next actor to find the key facts quickly.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","The best approach is to Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall."],"e":"The best approach is to Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Sliding window forgets = HYBRID summary + recent verbatim.","k":["hybrid context","summarization","sliding window"]},{"id":"ccar-f-80","d":"prompt-output","x":"During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10- 15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available).\n\nWhat's the most effective approach to maintain consistent behavior throughout extended conversations?","o":["Implement post-response validation that regenerates each response until it conforms to the specified guidelines.","Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity.","Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests.","Move behavioral guidelines from the system prompt into the first user message."],"a":[2],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","The best approach is to Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Mid-chat drift = REINFORCE guidelines at breakpoints.","k":["guideline reinforcement","drift","long conversations"]},{"id":"ccar-f-81","d":"context-reliability","x":"During a conversation about order tracking, your external system receives a webhook indicating the user's package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response.\n\nWhat's the most effective approach?","o":["Add the current shipping status to the system prompt before the next API call.","Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response.","Append the status update as a prefix to the next user message before calling the API.","Configure the assistant to call a get_order_status tool at the start of every response."],"a":[0],"w":["Th HOT examples per level.","k":["few-shot","proficiency levels","adherence"]},{"id":"ccar-f-85","d":"context-reliability","x":"The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (>85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time.\n\nWhat approach is most effective?","o":["Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review.","Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score.","Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection.","Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results."],"a":[2],"w":["Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","The best approach is to Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"The specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Provide a test case with example input containing null values and the expected output, then ask Claude to fix it. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Bug fix = give a TEST CASE with expected output.","k":["test case","expected output","iteration"]},{"id":"ccar-f-106","d":"architecture","x":"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output.\n\nWhat is the most effective way to run these subagents concurrently?","o":["Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message.","Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator.","Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time.","Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution at the same time."],"a":[0],"w":["The best approach is to Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message. This fits the coordination problem described and makes responsibilities, delegation, or handoff behavior more reliable.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","This adds coordination overhead and is not justified unless the work is clearly separable into independent subtasks.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message. This fits the coordination problem described and makes responsibilities, delegation, or handoff behavior more reliable.","t":"Parallel subagents = multiple Task calls in ONE response.","k":["parallel Task calls","coordinator","latency"]},{"id":"ccar-f-107","d":"claude-code","x":"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail.\n\nWhat is the most effective way to handle this?","o":["Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each.","Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays.","Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings.","Switch from tool_use to prompting Claude to return findings as a markdown list."],"a":[1],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","The best approach is to Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays. This is the most reliable way to keep the output aligned with the required structure and reduce downstream parsing or validation failures.","t":"Output too big = SPLIT the input into batches, merge results.","k":["max_tokens","truncation","chunking"]},{"id":"ccar-f-108","d":"context-reliability","x":"An engineer sees an unfamiliar error message \"SYNC_CONFLICT: entity version mismatch detected\" in production logs but doesn't know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code.\n\nWhat exploration approach will most efficiently find the responsible code?","o":["Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file.","Read the project's README and service configuration files to understand the architecture, then systematically Read source files in service directory.","Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context.","Use Grep to find all files that import the project's error handling module, then Read those files to locate custom error definitions."],"a":[2],"w":["It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","The best approach is to Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides."],"e":"The best approach is to Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Distinctive error text = GREP it directly.","k":["Grep","error message","locate source"]},{"id":"ccar-f-109","d":"context-reliability","x":"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't specified which modules to prioritize.\n\nHow should the agent decompose this open-ended task?","o":["Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically.","Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance.","Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered.","Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning."],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Anthropic's agent best practices favor efficient context gathering with search tools (Glob/Grep) over exhaustively reading every file, which would waste context and time. Prioritizing high-impact, heavily-coupled modules and iteratively revising the plan as dependencies surface is the correct way to decompose an open-ended task; A is wasteful, B ignores impact/complexity, and C is arbitrary and unplanned.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"Anthropic's agent best practices favor efficient context gathering with search tools (Glob/Grep) over exhaustively reading every file, which would waste context and time. Prioritizing high-impact, heavily-coupled modules and iteratively revising the plan as dependencies surface is the correct way to decompose an open-ended task; A is wasteful, B ignores impact/complexity, and C is arbitrary and unplanned.","t":"Open-ended = MAP, PRIORITIZE high-impact, REVISE.","k":["prioritized plan","Glob","Grep"]},{"id":"ccar-f-110","d":"tools","x":"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like \"What database tables are affected by the authentication refactor in PROJ-1234?\", monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations.\n\nWhat architectural change best leverages MCP capabilities to address these issues?","o":["Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries","Add an orchestrator that routes questions to a single server based on keywords","Consolidate all three servers into a unified MCP server with cross-referencing capabilities","Expose each server's content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas"],"a":[3],"w":["That approach is too brittle for a case where the output has to stay consistently aligned with a required structure.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","Collapsing everything into one path reduces precision and usually makes the system harder to control, not easier.","MCP resources are the protocol primitive designed for exactly this problem: servers expose browsable, application-controlled context (issue summaries, doc hierarchies, database schemas) that the agent can discover and read without exploratory tool-call round trips, directly fixing the visibility gap and context exhaustion. A rebuilds a monolith against MCP's composable design, C just adds more tools without leveraging MCP capabilities, and D's single-server keyword routing breaks inherently cross-system questions."],"e":"MCP resources are the protocol primitive designed for exactly this problem: servers expose browsable, application-controlled context (issue summaries, doc hierarchies, database schemas) that the agent can discover and read without exploratory tool-call round trips, directly fixing the visibility gap and context exhaustion. A rebuilds a monolith against MCP's composable design, C just adds more tools without leveraging MCP capabilities, and D's single-server keyword routing breaks inherently cross-system questions.","t":"Agent doesn't know what's there = expose MCP RESOURCES.","k":["MCP resources","content catalog","discovery"]},{"id":"ccar-f-111","d":"architecture","x":"The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn't find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage.\n\nWhat change would most effectively improve research completeness?","o":["Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before Invoking synthesis again.","Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information.","Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator.","Have the report generation agent note which research questions couldn't be answered, so users understand the limitations of the final output."],"a":[0],"w":["The best approach is to Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before Invoking synthesis again. This fits the coordination problem described and makes responsibilities, delegation, or handoff behavior more reliable.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient.","It does not make the coordination boundary clearer, so the workflow would still be fragile or inefficient."],"e":"The best approach is to Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before Invoking synthesis again. This fits the coordination problem described and makes responsibilities, delegation, or handoff behavior more reliable.","t":"Gaps found = coordinator RE-DELEGATES targeted queries.","k":["gap filling","coordinator","iterative research"]},{"id":"ccar-f-112","d":"context-reliability","x":"Your documents (query) tool returns results as \"Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review\". You want the agent to document (4, multi) and doc (24, multi).\n\n What return format would best enable these multi-step workflows?","o":["A JSON array of document titles extracted from the search results.","More detailed human-readable descriptions including the size and authors.","Structured data containing document IDs and metadata for each result.","URLs that users can click to open the document in their browser."],"a":[2],"w":["This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","Escalation is too early here because the scenario is asking for a better system behavior, not a handoff as the primary fix.","The best approach is to Structured data containing document IDs and metadata for each result. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to Structured data containing document IDs and metadata for each result. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Next steps need IDs = return STRUCTURED IDs + metadata.","k":["document IDs","structured output","multi-step"]},{"id":"ccar-f-113","d":"tools","x":"Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results.\n\nHow should you design the tool composition pattern to address both issues?","o":["Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests.","Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow.","Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector.","Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered."],"a":[3],"w":["It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","The best approach is to Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task."],"e":"The best approach is to Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","t":"Tools appear only after SEARCH = dynamic tool loading.","k":["dynamic tools","search then use","tool selection"]},{"id":"ccar-f-114","d":"prompt-output","x":"Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed.\n\nHow should you partition error-handling responsibility between the tool implementation and the agent?","o":["Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted.","Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple.","Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action.","Implement a universal error handler that catches all exceptions and returns a generic \"tool unavailable- try again later\" message, shielding the agent from error complexity."],"a":[2],"w":["Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","The best approach is to Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action."],"e":"The best approach is to Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Transient = tool retries. Permanent = tell the agent.","k":["transient vs permanent","error partitioning"]},{"id":"ccar-f-115","d":"context-reliability","x":"Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with \"slot no longer available\" because another user booked the slot between the availability check and the booking call.\n\nHow should you refactor these tools?","o":["Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives.","Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time.","Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking.","Keep both tools but add retry logic to the agent's system prompt, instructing it to call get_available_slots again and select a different time if booking fails."],"a":[0],"w":["The best approach is to Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","This is incorrect because retrying by itself does not resolve the underlying cause unless the failure is clearly transient.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Race condition = make it ATOMIC (one tool).","k":["atomic operation","race condition","tool design"]},{"id":"ccar-f-116","d":"context-reliability","x":"Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to \"try again later\" for timeouts.\n\nHow should you modify the tool's error handling?","o":["Return all errors with a retryable boolean flag and error type details.","Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details.","Apply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily unavailable\" message after max retries are exhausted.","Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately."],"a":[1],"w":["Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","The best approach is to Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","Retrying only helps when the problem is transient; it does not fix a design or classification problem by itself.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure."],"e":"The best approach is to Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Timeout = retry inside. Syntax = return details now.","k":["timeouts","syntax errors","retry policy"]},{"id":"ccar-f-117","d":"prompt-output","x":"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct.\n\nHow should you restructure the tool's output?","o":["Return fields organized into verified and needs_verification objects based on confidence thresholds.","Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review.","Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review.","Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability."],"a":[1],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Return SCORES + requires_review flag + REASONS.","k":["requires_review","confidence thresholds","review_reasons"]},{"id":"ccar-f-118","d":"tools","x":"Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season.\n\nWhat tool interface change would effectively prevent these errors?","o":["Add detailed examples to the tool description showing the required date format and complete list of official team names.","Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter.","Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed.","Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs."],"a":[3],"w":["Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","Surface-level searching is too narrow here because the task depends on richer structural understanding than simple text matching provides.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","The best approach is to Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early."],"e":"The best approach is to Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Ambiguous identity = use an ID + a LOOKUP tool.","k":["game_id","lookup tool","disambiguation"]},{"id":"ccar-f-119","d":"architecture","x":"You've configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents.\n\nWhat is the primary cause of this poor tool selection behavior?","o":["Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds.","The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks.","The agents' role descriptions in their system prompts conflict with having access to tools outside that role.","The tool definitions consume too much context window space, leaving insufficient room for task content."],"a":[0],"w":["The best approach is to Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It does not reduce the ambiguity that is causing the agent to pick the wrong tool in the first place."],"e":"The best approach is to Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds. This reduces tool-selection mistakes by making the decision surface clearer and better aligned with the agent's task.","t":"Too many tools = poor selection. Give 4-5.","k":["tool count","tool scoping","specialization"]},{"id":"ccar-f-120","d":"claude-code","x":"You've documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions.\n\nWhat's the most efficient first diagnostic step?","o":["Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions.","Run /memory to check which memory files are loaded and verify your CLAUDE.md is included.","Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types.","Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."],"a":[1],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","The best approach is to Run /memory to check which memory files are loaded and verify your CLAUDE.md is included. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","Examples may improve behavior at the margin, but they do not address the deeper control or architecture issue behind this failure.","Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide."],"e":"The best approach is to Run /memory to check which memory files are loaded and verify your CLAUDE.md is included. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Instructions ignored? First run /MEMORY.","k":["/memory","CLAUDE.md","diagnostics"]},{"id":"ccar-f-121","d":"claude-code","x":"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You're evaluating the Message Batches API for its 50% cost reduction.\n\nWhat factor most determines whether batch processing is appropriate for this use case?","o":["Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow.","Whether your result processing can handle reviews arriving in a different order than submitted.","Whether review feedback arriving up to 24 hours after PR creation remains actionable.","Whether you can structure each review as a single request without multi-turn refinement."],"a":[2],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The Message Batches API is asynchronous — most batches finish within 1 hour but can take up to 24 hours — so the decisive suitability factor is latency tolerance: whether review findings delivered up to 24 hours after PR creation are still actionable in a non-blocking, merge-then-fix workflow. Batching increases latency (B is backwards), results are correlated via custom_id so ordering is a non-issue (D), and single-request structuring (A) is secondary to the latency question.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The Message Batches API is asynchronous — most batches finish within 1 hour but can take up to 24 hours — so the decisive suitability factor is latency tolerance: whether review findings delivered up to 24 hours after PR creation are still actionable in a non-blocking, merge-then-fix workflow. Batching increases latency (B is backwards), results are correlated via custom_id so ordering is a non-issue (D), and single-request structuring (A) is secondary to the latency question.","t":"Batch fits only if 24h LATE results are still useful.","k":["Message Batches","latency tolerance","cost"]},{"id":"ccar-f-122","d":"context-reliability","x":"After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user's clarification that \"room temperature butter\" means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached.\n\nWhat approach best balances information preservation with token reduction?","o":["Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward.","Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant.","Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context.","Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim."],"a":[3],"w":["It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","It does not preserve the right information in the right form, so it fails to solve the real context-management problem.","Dumping the full transcript adds noise and makes it harder for the next actor to find the key facts quickly.","The best approach is to Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall."],"e":"The best approach is to Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim. This manages context more deliberately so the model keeps the most important information available without depending on brittle long-history recall.","t":"Critical facts PINNED + rest summarized + recent verbatim.","k":["pinned facts","summarization","allergy"]},{"id":"ccar-f-123","d":"tools","x":"Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask \"how much did that cost?\" or \"which project was that?\" - indicating they confirmed without understanding the request.\n\nWhat tool design change would most effectively address this?","o":["Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details","Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed","Add a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much context the agent presents in confirmations","Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response"],"a":[3],"w":["Prompt wording alone is not enough here, because the scenario needs a stronger structural mechanism than instructions by themselves can provide.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response. This preserves the link between conclusions and supporting evidence, which is the key requirement in the scenario."],"e":"The best approach is to Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response. This preserves the link between conclusions and supporting evidence, which is the key requirement in the scenario.","t":"Informed approval = show COST + PROJECT + IMPACT.","k":["structured response","informed consent","tool output"]},{"id":"ccar-f-124","d":"context-reliability","x":"Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays.\n\nHow should you redesign the pagination handling?","o":["Add a max pages parameter (default: 2) that controls how many pages are fetched internally.","Create separate search products and fetch more results tools for pagination.","Implement server-side relevance ranking and return only the top 50 most relevant items.","Return the first page with total match count and cursor for additional pages."],"a":[3],"w":["It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","The best approach is to Return the first page with total match count and cursor for additional pages. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives."],"e":"The best approach is to Return the first page with total match count and cursor for additional pages. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Pagination = first page + TOTAL + CURSOR.","k":["pagination","cursor","latency"]},{"id":"ccar-f-125","d":"tools","x":"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable.\n\nHow should each error be reported according to MCP's error handling design?","o":["Report all three as JSON-RPC protocol errors.","Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true","Report all three as tool results with isError: true","Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"],"a":[3],"w":["This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","It still leaves the failure too ambiguous, so the agent would have little basis for choosing the right recovery action.","The best approach is to Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early."],"e":"The best approach is to Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true. This gives the agent clearer signals about the failure so it can choose the right recovery action instead of retrying blindly or escalating too early.","t":"Bad CALL = protocol error. Bad OUTCOME = isError result.","k":["JSON-RPC error","isError","MCP error design"]},{"id":"ccar-f-126","d":"prompt-output","x":"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like \"a handful\" or \"a splash,\" the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections.\n\nHow should you use this feedback to improve extraction accuracy?","o":["Update your JSON schema to add a \"measurement_type\" enum field (precise/informal).","Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them.","Fine-tune the model on the 847 corrected extractions.","Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty."],"a":[1],"w":["This still relies on fragile text-generation behavior rather than enforcing the structure in a more reliable way.","The best approach is to Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on.","It sounds plausible, but it does not solve the specific failure mode or constraint the scenario is focused on."],"e":"The best approach is to Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them. This most directly addresses the failure or constraint described in the scenario and is more reliable than weaker, more ambiguous alternatives.","t":"Recurring pattern in corrections = FEW-SHOT for that pattern.","k":["few-shot","informal measurements","feedback"]},{"id":"ccar-f-127","d":"context-reliability","x":"\"You're the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to independently develop both approaches
