function bindAct(){ const b=$("#actBtn"); if(!b) return; b.onclick=()=>{ const a=b.dataset.act; if(a==="check") doCheck(); else if(a==="next") move(1); else if(a==="finish") finishSession(); else if(a==="submit") confirmSubmit(); }; }
function doCheck(){
  const se=SESSION, q=se.qs[se.i], sel=se.ans[q.id]||[]; if(sel.length!==q.a.length) return;
  const ok=sameSet(sel,q.a); se.checked[q.id]=true; const note=record(se.id,q,ok); se.results[q.id]=note; save();
  const btn=$("#actBtn"); const r=btn.getBoundingClientRect();
  renderRun();
  const card=$("#qc"); card.classList.remove("enter");
  if(ok){ burst(r.left+r.width/2, r.top, note==="cleared"?90:46); if(note==="cleared") toast(t("mastered")); }
  else { card.classList.add("shake"); }
  const v=$(".verdict"); if(v) setTimeout(()=>v.scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"}),120);
}
function move(d){ const se=SESSION; const n=se.i+d; if(n<0||n>=se.qs.length) return; se.i=n; se.dir=d; renderRun(); window.scrollTo({top:0,behavior:"auto"}); }
function openNav(){
  const se=SESSION, st=exS(se.id);
  const sc=modal(t("nav"), `<div class="navgrid">${se.qs.map((q,i)=>{ let c=""; if(se.mode!=="mock"&&se.checked[q.id]) c=sameSet(se.ans[q.id]||[],q.a)?"ok":"bad"; else if(se.ans[q.id]?.length) c="ans"; if(i===se.i) c+=" cur"; if(st.flag[q.id]) c+=" fl"; return `<button class="${c}" data-i="${i}">${i+1}</button>`; }).join("")}</div>`, [{label:t("stay"),cls:"ghost"}]);
  $$(".navgrid button",sc).forEach(b=>b.onclick=()=>{ sc.remove(); const i=+b.dataset.i; se.dir=i>=se.i?1:-1; se.i=i; renderRun(); window.scrollTo({top:0}); });
}
function confirmSubmit(){ const se=SESSION; const u=se.qs.filter(q=>!(se.ans[q.id]?.length)).length; if(!u){ finishSession(); return; } modal(t("submitQ"), `<p>${esc(t("submitD",{u}))}</p>`, [{label:t("stay"),cls:"ghost"},{label:t("submit"),cls:"primary",fn:finishSession}]); }
function finishSession(){
  const se=SESSION; if(!se||se.done) return; stopTimer(); se.done=true;
  const st=exS(se.id); let c=0; const wrong=[]; const dom={};
  const scored = se.mode==="study" ? se.qs.filter(q=>se.checked[q.id]) : se.qs;
  for(const q of scored){ const sel=se.ans[q.id]||[]; const ok=sameSet(sel,q.a);
    if(se.mode==="mock") record(se.id,q,ok);
    if(ok) c++; else wrong.push(q);
    const d=dom[q.d] ||= [0,0]; d[ok?0:1]++; }
  st.hist.unshift({m:se.mode, c, n:scored.length, at:Date.now()}); st.hist=st.hist.slice(0,25); save();
  const res={id:se.id, mode:se.mode, c, n:scored.length, wrong, dom, ans:se.ans};

/* ---------- results ---------- */

    ${Object.keys(r.dom).length>1?`<div class="panel"><h4>${esc(t("byDomain"))}</h4><div class="dbars">${Object.entries(r.dom).sort((a,b)=>(a[1][0]/(a[1][0]+a[1][1]))-(b[1][0]/(b[1][0]+b[1][1]))).map(([d,[c,w]])=>{ const p=Math.round(100*c/(c+w)); return `<div class="dbar"><span>${esc(e.domains[d]||d)}</span><b class="tab">${c}/${c+w} · ${p}%</b><div class="tr"><i style="width:0;background:${p>=e.exam.passPercent?"var(--ok)":p>=50?"var(--accent)":"var(--bad)"}" data-w="${p}"></i></div></div>`; }).join("")}</div></div>`:""}
    <div class="panel"><h4>${esc(t("review"))}</h4>
      ${r.wrong.length? r.wrong.map((q,i)=>{ const sel=r.ans[q.id]||[]; const exp=q.e; const trk=q.t; const {q:qt}=splitQ(q.x);
        return `<details class="rev"><summary><span class="x">✕</span><span>${esc(qt)}</span></summary><div class="body">
          <div class="ans"><div class="y"><b>${esc(t("yourAns"))}:</b> ${sel.length?sel.map(i=>esc(q.o[i])).join(" · "):esc(t("noAns"))}</div><div class="c"><b>${esc(t("rightAns"))}:</b> ${q.a.map(i=>esc(q.o[i])).join(" · ")}</div></div>
          ${exp?`<div class="exp"><h5>${esc(t("why"))}</h5><p>${esc(exp)}</p></div>`:""}
          ${trk?`<div class="trick"><h5>${esc(t("trick"))}</h5><p>${esc(trk)}</p>${q.k?.length?`<div class="kw">${q.k.map(k=>`<span>#${esc(k)}</span>`).join("")}</div>`:""}</div>`:""}
        </div></details>`; }).join("") : `<p class="empty">${esc(t("perfect"))}</p>`}
    </div></div>`;
  animateRings(app);
  countUp($("#pctN"), pct, 1300);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$(".dbar i").forEach(i=>i.style.width=i.dataset.w+"%")));
  if(isMock && pass) setTimeout(()=>{ const b=$(".bigring").getBoundingClientRect(); burst(b.left+b.width/2,b.top+b.height/2,120); },900);
  $("#rw")&&($("#rw").onclick=()=>startMode(r.id,"retry",shuffle(r.wrong)));
  $("#ag").onclick=()=>startMode(r.id, r.mode==="retry"||r.mode==="mis"||r.mode==="flag"?"practice":r.mode);
  $("#te").onclick=()=>go("exam",r.id);
}

/* ---------- flashcards ---------- */
function renderCards(){
  const se=SESSION, e=EX[se.id];
  if(se.i>=se.qs.length){
    se.done=true; const st=exS(se.id); st.hist.unshift({m:"cards",c:se.cards.g,n:se.qs.length,at:Date.now()}); st.hist=st.hist.slice(0,25); save();
    app.innerHTML=`<div class="wrap res"><div class="score"><div style="font-size:64px;line-height:1">🃏</div><div><h2>${esc(t("cardsDone"))}</h2><p class="tab">${esc(t("cardsLine",{g:se.cards.g,a:se.cards.a}))}</p><div class="acts">${se.cards.a?`<button class="btn primary" id="cm">${esc(t("mMis"))}</button>`:""}<button class="btn" id="ca">${esc(t("again"))}</button><button class="btn ghost" id="ce">${esc(t("toExam"))}</button></div></div></div></div>`;
    $("#cm")&&($("#cm").onclick=()=>startMode(se.id,"mis")); $("#ca").onclick=()=>startMode(se.id,"cards"); $("#ce").onclick=()=>go("exam",se.id);
    burst(innerWidth/2, innerHeight/3, 70); return;
  }
  const q=se.qs[se.i]; const {q:qt}=splitQ(q.x);
  const exp=q.e; const trk=q.t;
  const front = qt.length>520 ? "…"+qt.slice(-520) : qt;
  app.innerHTML=`
  <div class="runbar"><div class="wrap"><div class="lbl"><b>${esc(e.code)}</b><span>${esc(t("mCards"))}</span><span class="tab">${se.i+1}/${se.qs.length}</span></div>
    <button class="btn sm ghost" id="exitBtn">${esc(t("exit"))}</button><div class="prog"><i style="width:${100*se.i/se.qs.length}%"></i></div></div></div>
  <div class="wrap stage">
    <div class="fc" id="fc"><div class="fc-inner" id="fci">
      <div class="fc-face" role="button" tabindex="0" id="fcf"><span class="pill" style="align-self:flex-start">${esc(e.domains[q.d]||q.d)}</span><p class="qtext" style="font-size:16px">${esc(front)}</p>
        <div class="kw" style="display:flex;flex-wrap:wrap;gap:6px">${(q.k||[]).slice(0,1).map(k=>`<span class="pill acc mono">hint: #${esc(k)}</span>`).join("")}</div><span class="tapnote">${esc(t("cardFront"))}</span></div>
      <div class="fc-face fc-back"><h5 class="mono" style="margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)">${esc(t("cardBack"))}</h5>
        <div class="fc-ans">${q.a.map(i=>`<div>${esc(q.o[i])}</div>`).join("")}</div>
        ${trk?`<div class="trick"><h5>${esc(t("trick"))}</h5><p>${esc(trk)}</p>${q.k?.length?`<div class="kw">${q.k.map(k=>`<span>#${esc(k)}</span>`).join("")}</div>`:""}</div>`:""}
        ${exp?`<div class="exp"><h5>${esc(t("why"))}</h5><p>${esc(exp)}</p></div>`:""}
      </div></div></div>
  </div>
  <div class="foot"><div class="wrap"><span class="hint grow">Space: flip · ← ${esc(t("againBtn"))} · → ${esc(t("gotIt"))}</span>
    <button class="btn danger" id="cAgain">${esc(t("againBtn"))}</button><button class="btn primary" id="cGot">${esc(t("gotIt"))}</button></div></div>`;
  const fc=$("#fc"), fci=$("#fci");
  const fit=()=>{ const f=$$(".fc-face",fc); fci.style.minHeight=Math.max(340,...f.map(x=>x.scrollHeight))+"px"; };
  fit();
  const flip=()=>fc.classList.toggle("flip");
  $("#fcf").onclick=flip; $(".fc-back").onclick=flip; $("#fcf").onkeydown=e2=>{ if(e2.key==="Enter") flip(); };
  $("#exitBtn").onclick=()=>leaveGuard(()=>go("exam",se.id));
  $("#cGot").onclick=()=>cardNext(true); $("#cAgain").onclick=()=>cardNext(false);
}
function cardNext(ok){ const se=SESSION, q=se.qs[se.i]; const st=exS(se.id);
  if(ok){ se.cards.g++; if(q.id in st.mis){ record(se.id,q,true); } }
  else { se.cards.a++; st.mis[q.id]=0; }
  save(); se.i++; renderCards(); window.scrollTo({top:0}); }

/* ---------- keyboard ---------- */
document.addEventListener("keydown",ev=>{
  if($(".scrim")){ if(ev.key==="Escape") $(".scrim").remove(); return; }
  if(ev.target.matches("input,select,textarea")) return;
  if(VIEW.name==="cards" && SESSION && !SESSION.done){ if(ev.key===" "){ ev.preventDefault(); $("#fc")?.classList.toggle("flip"); } else if(ev.key==="ArrowRight") cardNext(true); else if(ev.key==="ArrowLeft") cardNext(false); return; }
  if(VIEW.name!=="run" || !SESSION) return;
  const k=ev.key.toLowerCase();
  const idx = "123456".indexOf(k)>=0 ? "123456".indexOf(k) : "abcdef".indexOf(k);
  if(idx>=0 && !ev.metaKey && !ev.ctrlKey){ const b=$$(".opt")[idx]; if(b && !b.disabled){ b.click(); } return; }
  if(k==="enter"){ const b=$("#actBtn"); if(b && !b.disabled){ ev.preventDefault(); b.click(); } }
  else if(k==="f"){ $("#flagBtn")?.click(); }
  else if(k==="arrowright" && SESSION.mode==="mock") move(1);
  else if(k==="arrowleft" && (SESSION.mode==="mock"||SESSION.mode==="study")) move(-1);
});

/* ---------- boot ---------- */
applyTheme();
route();
</script>

</body></html>
